  var co = (DIEM[ma] || []).filter(function(e){ return CA_LOP.indexOf(e.ten) >= 0; })
    .slice().sort(function(a, b){
      if (a.diem !== b.diem) return b.diem - a.diem;
      return a.giay - b.giay;
    });
  var daCo = {};
  co.forEach(function(e){ daCo[e.ten] = 1; });
  var chua = CA_LOP.filter(function(t){ return !daCo[t]; })
    .map(function(t){ return { ten:t, chua:true }; });
  return co.concat(chua);
}

/* Bốn mức màu tên (thầy chốt đợt 4):
   `hc` huy chương = full điểm và nằm trong 3 hạng đầu · `du` = full điểm mà
   ngoài top 3 · `co` = có điểm nhưng chưa full · `chua` = chưa làm bài nào.
   ⭐ v1.14.0 — "full điểm" nay hỏi `CHUAN[ma]` chứ không gõ cứng 100 nữa. */
function veBang(ma){
  var ds = xepBang(ma);
  var c = CHUAN[ma];
  var moc = (c && !c.tru) ? c.dinh : 0;      /* 0 = act không đo được ⇒ nộp là full */
  return ds.map(function(e, i){
    var full = !e.chua && e.diem >= moc;
    var huy  = full && i < 3;
    var lop  = e.chua ? 'chua' : (huy ? 'hc' : (full ? 'du' : 'co'));
    var hang = e.chua ? '–' : (huy ? veHuy(i + 1) : (i + 1));
    return '<div class="lb-row ' + lop + (e.ten === TOI ? ' me' : '') + '">' +
      '<span class="lb-rank">' + hang + '</span>' +
      '<span class="lb-name">' + tenTat(e.ten) + '</span>' +
      '<span class="lb-score">' + (e.chua ? '—' : e.diem) + '</span>' +
      '<span class="lb-time">' + (e.chua ? '' : chuGiay(e.giay)) + '</span>' +
    '</div>';
  }).join('');
}

/* ---------- LÀM MỚI BẢNG ----------
   Thầy chốt: phải CẢM NHẬN ĐƯỢC là danh sách vừa được tải lại, nên dù dữ liệu
   về nhanh vẫn cố tình giữ ít nhất ~2,3 giây: tiêu đề đổi thành ANDREW CLASSES
   với từng chữ nhấc lên hạ xuống, danh sách cũ ẩn dần từ trên xuống, xong rồi
   danh sách mới hiện lại cũng lần lượt từ trên xuống. */
var CHO_TAI = 2300;

function chuNhay(chu){
  return chu.split('').map(function(c, i){
    return '<i style="animation-delay:' + (i * 0.06).toFixed(2) + 's">' +
           (c === ' ' ? '&nbsp;' : c) + '</i>';
  }).join('');
}

function lamMoiBang(sec, ma, nut){
  if (nut.classList.contains('quay')) return;      /* đang tải rồi thì thôi */
  var ds  = sec.querySelector('.lb-ds');
  var tua = sec.querySelector('.lb-head h3');
  var tenCu = tua.textContent;                     /* tên template, trả lại sau */
  nut.classList.add('quay');
  tua.classList.add('dang-tai');
  tua.innerHTML = chuNhay('ANDREW CLASSES');

  ds.querySelectorAll('.lb-row').forEach(function(d, i){
    d.style.setProperty('--tre', (i * 22) + 'ms');
    d.classList.add('di');
  });

  /* 🐛 v1.13.0 — nút làm mới nay ĐỌC LẠI THẬT từ kho AWord (ép bỏ cache 60s).
     Trước đây nó chỉ chạy hiệu ứng rồi vẽ lại từ RAM — em vừa nộp xong, thầy
     bấm làm mới mấy lần bảng vẫn trống (thầy bắt được 25/08, cú nộp đầu tiên
     của lớp B2-B). Hiệu ứng CHO_TAI và cú đọc chạy SONG SONG, xong cả hai mới
     vẽ; đọc hỏng thì giữ danh sách cũ, không vỡ trang. */
  Promise.all([
    A.diemCuaAct(ma, true).then(function(d){ DIEM[ma] = d; })['catch'](function(){}),
    new Promise(function(x){ setTimeout(x, CHO_TAI); }),
  ]).then(function(){
    ds.innerHTML = veBang(ma);
    ds.querySelectorAll('.lb-row').forEach(function(d, i){
      d.style.setProperty('--tre', (i * 34) + 'ms');
      d.classList.add('den');
    });
    doLb();
    tua.classList.remove('dang-tai');
    tua.textContent = tenCu;
    nut.classList.remove('quay');
  });
}

/* ⭐ Cỡ chữ + chiều cao dòng ĐO RỒI ĐẶT, không gõ tay: lớp 16 em thì dòng cao
   thoải mái, lớp 20 em thì phải bóp lại cho vẫn đủ trong đúng chiều cao khung
   act. Chạy lúc mở trang, lúc đổi ngưỡng màn, lúc kéo giãn cửa sổ, và sau khi
   font nạp xong (font đổi là chiều cao đổi). */
function doLb(){
  var n = CA_LOP.length;
  var g = document.documentElement.style;
  if (laHep()) {
    /* Ba cột, đổ đầy cột trái trước: 16 em → 6-6-4 (ceil(16/3) = 6). */
    g.setProperty('--lb-hang', Math.ceil(n / 3));
    g.setProperty('--lb-cao', '21px');
    g.setProperty('--lb-chu', '10.4px');
    g.setProperty('--lb-khe', '2px');
    return;
  }
  var ds = document.querySelector('.lb-ds');
  if (!ds) return;
  var cao = ds.clientHeight;
  if (!cao) return;
  var khe = 2;
  var dong = Math.floor((cao - (n - 1) * khe) / n);
  dong = Math.max(16, Math.min(30, dong));
  g.setProperty('--lb-cao', dong + 'px');
  g.setProperty('--lb-khe', khe + 'px');
  /* Cỡ chữ bám theo chiều cao dòng nhưng có trần/sàn cho khỏi bé quá hoặc to quá. */
  g.setProperty('--lb-chu', Math.max(9.5, Math.min(13, dong * 0.53)).toFixed(1) + 'px');
}

/* ⛔ BẪY: nghe `resize` rồi đo NGAY là đo trúng lúc trình duyệt chưa bày lại
   xong — khung act cao theo ĐỆM TỈ LỆ (`--ti-le`, xem `.game::before`) nên
   chiều cao về SAU cỡ chữ một nhịp, đo ra số của lần trước (đã vấp: kéo cửa sổ ra 1400px mà vẫn giữ cỡ
   chữ của dạng hẹp). Cách chắc ăn: để ResizeObserver báo khi khung ĐÃ đổi
   chiều cao thật rồi mới đo.
   Không sợ chạy vòng: đổi `--lb-cao` chỉ đổi chiều cao TỪNG DÒNG bên trong,
   còn khung `.lb-ds` cao theo khung act nên không đổi. */
function canhLb(){
  if (!window.ResizeObserver) { doLb(); return; }
  var quanSat = new ResizeObserver(function(){ doLb(); });
  document.querySelectorAll('.lb-ds').forEach(function(e){ quanSat.observe(e); });
  doLb();
}

/* ---------- BÓNG ĐÈN: tối nền, khung act bay ra giữa màn hình ----------
   Tỉ lệ: máy tính to thêm 30%; điện thoại phóng hết cỡ màn. Cả hai đều bị
   chặn lại nếu vượt quá bề ngang (96%) hoặc chiều cao (90%) màn hình, nên
   khung không bao giờ tràn ra ngoài. */
var TO_THEM = 1.3;
var nhanDen = document.createElement('div');
nhanDen.className = 'den-nhan';
document.body.appendChild(nhanDen);

function tatDen(){
  document.body.classList.remove('co-den');
  nhanDen.classList.remove('hien');
  document.querySelectorAll('.game.sang').forEach(function(e){
    e.style.transform = '';
    e.classList.remove('toan-man');
  });
  document.querySelectorAll('.game.sang,.ic-nut.sang').forEach(function(e){
    e.classList.remove('sang');
  });
}

function bayRaGiua(khung){
  khung.style.transform = '';                 /* đo ở đúng chỗ thật của nó */
  if (laDienThoai()) {                        /* điện thoại: trọn màn */
    khung.classList.add('toan-man');
    nhanDen.style.top = '10px';
    return;
  }
  khung.classList.remove('toan-man');
  var r  = khung.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  /* ⛔ Phải CHỪA CHỖ cho nhãn tên phần rồi mới tính tỉ lệ, và căn giữa cả cụm
     [nhãn + khung] chứ không riêng khung — căn mỗi khung thì nhãn đè lên nó
     (đo được: chồng 2px ở màn 1280x860). */
  var caoNhan = nhanDen.offsetHeight || 44;
  var cho = caoNhan + 14;
  var ti = Math.min(laHep() ? 99 : TO_THEM, (vw * 0.96) / r.width, (vh * 0.96 - cho) / r.height);
  ti = Math.max(1, ti);
  var caoMoi = r.height * ti;
  var trenMoi = (vh - cho - caoMoi) / 2 + cho;
  var dx = vw / 2 - (r.left + r.width / 2);
  var dy = trenMoi + caoMoi / 2 - (r.top + r.height / 2);
  khung.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) +
                          'px) scale(' + ti.toFixed(3) + ')';
  nhanDen.style.top = Math.max(6, trenMoi - caoNhan - 14) + 'px';
}

function batDen(khungGame, nutDen, k){
  tatDen();
  document.body.classList.add('co-den');
  khungGame.classList.add('sang');
  nutDen.classList.add('sang');
  /* Đặt chữ TRƯỚC rồi mới tính chỗ: có chữ mới đo được nhãn cao bao nhiêu. */
  nhanDen.innerHTML = '<b>' + k.ten + '</b><span>' + (k.yeuCau || '') + '</span>';
  bayRaGiua(khungGame);
  nhanDen.classList.add('hien');
}

/* Kéo giãn cửa sổ lúc đang bật đèn thì tính lại chỗ đứng. */
window.addEventListener('resize', function(){
  var dangSang = document.querySelector('.game.sang');
  if (dangSang) bayRaGiua(dangSang);
});
$('#nenToi').onclick = tatDen;

/* ---------- BÌA READY + NẠP ACT ----------
   Bố cục bìa CHÉP ĐÚNG màn START của AWord (xem chú thích ở khối CSS) — tên
   em dạng `CHẤN PHONG • B2B`. Bấm READY: act nạp NGẦM bên dưới, còn bìa chạy
   hiệu ứng: từng thứ bay vụt vào chữ ANDREW CLASSES → chữ to dần + trôi ra
   giữa → rung núi lửa → NỔ thành bụi 4 hướng, lộ màn START. Tối thiểu ~3,8s;
   mạng chậm thì chữ cứ rung thêm, act về xong mới nổ. */
/* ⭐ v1.14.0 — CHỮ TRÊN BÌA (thầy chốt 24/08/2026): không còn "WORD PRACTICE 1"
   nữa mà là ba thứ nhận ra bài ngay: MÃ LESSON • BỘ NGHĨA • TEMPLATE, vd
   "LSA2-S2.T1.P3-4-5 • VI2 • ANAGRAM". Thiếu phần nào thì bỏ phần đó, không có
   phần nào cả thì lùi về tên ngăn như cũ.
   ⚠️ `k.act` (bộ nghĩa) và `k.mau` (template) đến từ phép map lúc boot ở cuối
   file — thêm trường mới vào bìa thì SOI LẠI phép map đó (bẫy đã cắn ở v1.12.0,
   dòng "mã lesson • ENG1" render sẵn mà không bao giờ hiện vì `act` rơi mất). */
function chuBia(k){
  var o = [A.maLesson(BAI), k.act, k.mau].filter(function(x){
    return String(x || '').trim();
  });
  return o.length ? o.join(' • ') : (k.ten || '');
}

function veBia(k){
  return '<div class="game-cover">' +
    '<div class="bia-th">ANDREW CLASSES</div>' +
    '<div class="bia-giua">' +
      '<div class="bia-ten">' + chuAnToan(chuBia(k)) + '</div>' +
      '<div class="bia-o-nut"><button class="bia-ready" type="button">READY</button></div>' +
      '<div class="bia-em">' + TOI + ' \u2022 ' + LOP_HIEN + '</div>' +
    '</div>' +
  '</div>';
}

/* ---------- ÂM THANH HIỆU ỨNG (⭐ đợt 9) ----------
   Tự sinh bằng WebAudio, không cần file: tiếng "ping" lấp lánh khi va chạm,
   tiếng "bùm" trầm + xèo khi chữ nổ. AudioContext chỉ mở được sau một cú bấm
   của người dùng — bấm READY chính là cú bấm đó nên không vướng. */
var boAm = null;
function layAm(){
  if (!boAm) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    boAm = new AC();
  }
  if (boAm.state === 'suspended') boAm.resume();
  return boAm;
}
function tiengVa(){
  var ac = layAm(); if (!ac) return;
  var t = ac.currentTime;
  /* Hai nốt sine vút lên + lệch pha nhẹ = tiếng chuông gió lấp lánh. */
  [1180, 1560].forEach(function(hz, i){
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(hz, t);
    o.frequency.exponentialRampToValueAtTime(hz * 1.6, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.015 + i * 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.3);
  });
}
function tiengNo(){
  var ac = layAm(); if (!ac) return;
  var t = ac.currentTime;
  /* Bùm trầm: sine rơi từ 170Hz xuống 45Hz. */
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.45);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.6);
  /* Xèo: nhiễu trắng qua lọc thấp hạ dần. */
  var n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
  var d = b.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  n.buffer = b;
  var loc = ac.createBiquadFilter(), g2 = ac.createGain();
  loc.type = 'lowpass';
  loc.frequency.setValueAtTime(5200, t);
  loc.frequency.exponentialRampToValueAtTime(500, t + 0.45);
  g2.gain.setValueAtTime(0.18, t);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  n.connect(loc); loc.connect(g2); g2.connect(ac.destination);
  n.start(t);
}

/* Ngôi sao nhỏ dùng cho hạt bắn ra. */
var SAO_HAT = '<svg viewBox="0 0 24 24"><path d="M12 2.2l2.7 6.3 6.8.6-5.1 4.5 1.5 6.6L12 16.7' +
              ' 6.1 20.2l1.5-6.6L2.5 9.1l6.8-.6z"/></svg>';

/* Bắn một chùm tia + sao nhỏ màu vàng tại (x, y) trong lòng tấm bìa. */
function nemHat(bia, x, y, soTia, soSao, xa){
  var i, e, goc, r;
  for (i = 0; i < soTia; i++) {
    e = document.createElement('span');
    e.className = 'tia';
    goc = Math.random() * Math.PI * 2;
    r = xa * (0.45 + Math.random() * 0.75);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.setProperty('--dx', (Math.cos(goc) * r).toFixed(1) + 'px');
    e.style.setProperty('--dy', (Math.sin(goc) * r).toFixed(1) + 'px');
    e.style.animationDelay = (Math.random() * 60).toFixed(0) + 'ms';
    bia.appendChild(e);
    setTimeout(function(n){ return function(){ n.remove(); }; }(e), 760);
  }
  for (i = 0; i < soSao; i++) {
    e = document.createElement('span');
    e.className = 'sao-nho';
    e.innerHTML = SAO_HAT;
    goc = Math.random() * Math.PI * 2;
    r = xa * (0.5 + Math.random() * 0.8);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.setProperty('--dx', (Math.cos(goc) * r).toFixed(1) + 'px');
    e.style.setProperty('--dy', (Math.sin(goc) * r).toFixed(1) + 'px');
    e.style.animationDelay = (Math.random() * 80).toFixed(0) + 'ms';
    bia.appendChild(e);
    setTimeout(function(n){ return function(){ n.remove(); }; }(e), 940);
  }
}

/* ---------- BẤM READY: NẠP ACT + HIỆU ỨNG VA CHẠM ----------
   ⭐ ĐỢT 10 — ĐẢO NGƯỢC HẲN CHIỀU CỦA HIỆU ỨNG (thầy chốt).
   Trước: ba thứ trên bìa lần lượt bay vào chữ ANDREW CLASSES đứng giữa.
   Nay:  chữ ANDREW CLASSES đứng SẴN NGOÀI MÉP TRÊN (đã rung lắc từ trước,
         nhưng bị `.game{overflow:hidden}` cắt nên không ai thấy), bấm READY
         là nó LAO XUỐNG lần lượt húc ba thứ:
           1. tên act   → nổ sparkle, chữ GIẬT LẠI một chút
           2. nút READY → nổ sparkle, chữ GIẬT LẠI một nhịp
           3. tên em    → nổ sparkle, nhưng lần này chữ CÒN LAO TIẾP một tí
                          rồi mới quay ngược lên GIỮA khung và NỔ TUNG.
   Sau cú nổ, màn START phía sau LOANG RA TỪ GIỮA (mask tròn nở dần, mép fade
   thật mờ) thay cho kiểu phai cả tấm bìa của các đợt trước.
   ⛔ Vẫn giữ nguyên hai luật cũ: act nạp NGẦM từ giây đầu, và chữ chỉ được nổ
   khi act đã tải xong (mạng chậm thì rung chờ tiếp) — kèm chốt an toàn 12s vì
   requestAnimationFrame ngừng chạy khi tab bị ẩn (bẫy 35). */
var GIAT_LAI  = 260;    /* húc xong khựng lại bao lâu rồi mới lao tiếp */
var LAO_TIEP  = 320;    /* húc thứ cuối xong còn lao thêm bấy nhiêu */
var TOI_THIEU = 700;    /* về tới chỗ nổ rồi còn rung ít nhất bấy nhiêu mới nổ */

function moAct(khung){
  var bia = khung.querySelector('.game-cover');
  if (!bia || bia.classList.contains('dang-nap')) return;
  bia.classList.add('dang-nap');

  /* Act nạp NGẦM ngay từ giây đầu — hiệu ứng chỉ là tấm màn phủ bên trên. */
  var f = document.createElement('iframe');
  f.setAttribute('allowfullscreen', '');
  /* ⭐ WORDS v1 — THÊM `microphone`: thẻ PRONUNCIATION là act SPEAKING của
     AWord, học sinh nói vào micro cho AI chấm phát âm. Khung nhúng KHÔNG
     được khai quyền này thì trình duyệt chặn thẳng, act im re mà không báo
     lỗi gì. (Trang phải chạy https hoặc localhost mới xin được micro.) */
  f.setAttribute('allow', 'fullscreen; autoplay; clipboard-write; microphone');
  var sanSang = false;
  f.onload = function(){ sanSang = true; };
  f.src = khung.getAttribute('data-src');
  khung.insertBefore(f, bia);

  var brand = bia.querySelector('.bia-th');
  var oBia  = bia.getBoundingClientRect();
  var u     = oBia.width / 880;          /* hệ số quy đổi theo bề ngang khung */

  function tam(el){
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - oBia.left, y: r.top + r.height / 2 - oBia.top };
  }
  function nua(el){ return { x: el.offsetWidth / 2, y: el.offsetHeight / 2 }; }

  /* Chữ đang bị CSS đẩy lên NGOÀI MÉP TRÊN. `brandGoc` là chỗ nó NGỒI khi
     KHÔNG có cú đẩy, còn `dauY` chính là cú đẩy — từ đây trở đi JS ghi đè
     transform nên phải mang sẵn cú đẩy ấy vào, kẻo khung hình đầu tiên chữ
     nhảy phịch vào giữa khung.
     ⭐ ĐỢT 11 — đo bằng cách TẮT TẠM cú đẩy (đặt đúng transform trung tính
     `translate(-50%,0)`) rồi đo, xong trả lại. Không dùng `offsetLeft` nữa: từ
     đợt 11 chữ ghim `left:50%` nên offsetLeft là mép trái của mốc 50%, lệch
     đúng nửa bề ngang chữ. */
  var luuTf = brand.style.transform;
  brand.style.transform = 'translate(-50%,0)';
  var brandGoc = tam(brand);
  brand.style.transform = luuTf;
  var dauY  = tam(brand).y - brandGoc.y;
  var brNua = nua(brand);

  /* Ba cái đích, xếp từ trên xuống — cũng đúng thứ tự chữ sẽ húc phải. */
  var muc = [bia.querySelector('.bia-ten'), bia.querySelector('.bia-o-nut'),
             bia.querySelector('.bia-em')]
    .filter(Boolean)
    .map(function(el){ return { el: el, tam: tam(el), nua: nua(el) }; });

  /* ⭐ ĐỢT 13 — CHỖ NỔ là ĐÚNG CHỖ NÚT READY đang đứng (tức là chỗ nút START
     của màn AWord phía sau), chứ không phải "cao hơn tâm 11%" như đợt 12 —
     thầy thấy bay lên cao quá. Nút READY là cái đích thứ hai trong `muc`. */
  var giua = { x: oBia.width / 2,
               y: muc[1] ? muc[1].tam.y : oBia.height / 2 };

  var bx = 0, by = dauY, vx = 0, vy = 0, bs = 1;
  var pha = 'lao', iMuc = 0, mocPha = 0, veLuc = 0;
  var t0 = performance.now(), truoc = t0, lanBanSao = 0, daNo = false;

  /* ⛔ CHỐT AN TOÀN: requestAnimationFrame NGỪNG CHẠY khi tab bị ẩn (em chuyển
     tab, khoá màn hình...). Không có chốt này thì hiệu ứng đứng giữa chừng và
     act không bao giờ lộ ra. Quá 12 giây thật là cho nổ luôn — act đã nạp ngầm
     từ đầu nên vẫn chơi được ngay. */
  var chot = setTimeout(function(){
    if (!daNo) { daNo = true; noTung({ x: brandGoc.x + bx, y: brandGoc.y + by }); }
  }, 12000);

  /* Rung: biên độ lớn dần theo cỡ chữ — càng "no" càng chực nổ. Chữ rung sẵn
     từ khung hình đầu, tức là nó rơi xuống trong tư thế đang rung. */
  function viTriBrand(now){
    var A = u * (1.1 + 2.4 * (bs - 1));
    return { x: bx + A * Math.sin(now * 0.055),
             y: by + A * 0.72 * Math.sin(now * 0.083 + 1.1) };
  }

  function khungHinh(now){
    var dt = Math.min((now - truoc) / 1000, 0.05);
    truoc = now;

    if (pha === 'lao') {
      /* Lao thẳng vào cái đích đang nhắm: cú đầu nhanh nhất (rơi từ ngoài
         khung xuống), hai cú sau êm hơn cho mắt kịp theo. */
      var m  = muc[iMuc];
      var dx = (m.tam.x - brandGoc.x) - bx;
      var dy = (m.tam.y - brandGoc.y) - by;
      var xa = Math.sqrt(dx * dx + dy * dy) || 1;
      var a  = u * (iMuc === 0 ? 4200 : 2900);
      vx += (dx / xa) * a * dt;  vy += (dy / xa) * a * dt;
      bx += vx * dt;             by += vy * dt;
      /* VA CHẠM: mép dưới của chữ (nửa chiều cao × cỡ hiện tại) chạm vào thân
         cái đích. Mọi thứ đều căn giữa theo chiều ngang nên xét CHIỀU DỌC là
         đủ và chắc — không lệ thuộc chữ dài ngắn như phép ellipse cũ. */
      if (brandGoc.y + by + brNua.y * bs >= m.tam.y - m.nua.y * 0.55) huc(m, now);

    } else if (pha === 'giat' || pha === 'tiep') {
      /* Giật lại / lao tiếp: buông tay cho quán tính tự tắt dần, không lái. */
      var giam = Math.exp(-dt / (pha === 'giat' ? 0.16 : 0.20));
      vx *= giam;    vy *= giam;
      bx += vx * dt; by += vy * dt;
      if (now - mocPha > (pha === 'giat' ? GIAT_LAI : LAO_TIEP)) {
        if (pha === 'giat') pha = 'lao';
        else { pha = 've'; veLuc = now; vx = 0; vy = 0; }
      }

    } else if (pha === 've') {
      /* Bay ngược về CHỖ NỔ, tiến dần theo hàm mũ nên tới nơi thì êm.
         ⭐ ĐỢT 12 — thầy thấy "bay về giữa hơi chậm": τ hạ 0,34 → 0,13s, tức
         là vụt về gần như tức thì rồi mới rung tại chỗ. */
      var k = 1 - Math.exp(-dt / 0.13);
      bx += ((giua.x - brandGoc.x) - bx) * k;
      by += ((giua.y - brandGoc.y) - by) * k;
    }

    var b = viTriBrand(now);
    var bTam = { x: brandGoc.x + b.x, y: brandGoc.y + b.y };
    brand.style.transform = 'translate(-50%,0) translate(' + b.x.toFixed(1) + 'px,' +
      b.y.toFixed(1) + 'px) scale(' + bs.toFixed(3) + ') rotate(' +
      (0.8 * Math.sin(now * 0.07)).toFixed(2) + 'deg)';

    /* Về tới giữa: rung + bắn sao khắp xung quanh, chờ act tải xong mới nổ. */
    if (pha === 've') {
      if (now - lanBanSao > 110) {
        lanBanSao = now;
        var goc = Math.random() * Math.PI * 2;
        var r = u * (18 + Math.random() * 34) * bs;
        nemHat(bia, bTam.x + Math.cos(goc) * r, bTam.y + Math.sin(goc) * r, 2, 1, u * 46);
      }
      if (sanSang && now - veLuc > TOI_THIEU && !daNo) { daNo = true; return noTung(bTam); }
    }
    requestAnimationFrame(khungHinh);
  }

  /* Húc trúng một cái đích: nó nổ bung tại chỗ rồi biến mất, chữ nở một nấc và
     giật ngược lại. Riêng cái đích CUỐI (tên em) thì chữ còn lao tiếp một tí. */
  function huc(m, now){
    tiengVa();
    nemHat(bia, m.tam.x, m.tam.y, 13, 6, u * 78);
    m.el.style.transform = 'scale(1.45)';
    m.el.classList.add('no-phan-tu');
    /* ⛔ ĐỢT 11 — PHẢI là `visibility`, KHÔNG được `display:none`. Ba thứ này
       nằm chung một cụm flex: cái trên biến mất kiểu `display:none` là hai cái
       dưới NHẢY VỌT LÊN ngay lập tức, trong khi chữ ANDREW CLASSES vẫn đang
       lao tới toạ độ CŨ ⇒ cú húc thứ hai và thứ ba trượt chỗ. `visibility`
       giữ nguyên chỗ ngồi nên ba cú húc đều trúng đúng nơi. */
    (function(el){ setTimeout(function(){ el.style.visibility = 'hidden'; }, 160); })(m.el);
    bs += 0.3;
    mocPha = now;
    if (iMuc < muc.length - 1) {
      vx = -vx * 0.42;  vy = -vy * 0.42;   /* nảy ngược = cú giật lại */
      iMuc++;
      pha = 'giat';
    } else {
      vx *= 0.40;       vy *= 0.40;        /* chỉ hãm bớt = còn tiến thêm một tí */
      pha = 'tiep';
    }
  }

  function noTung(bTam){
    clearTimeout(chot);
    tiengNo();
    brand.classList.add('no');
    /* ⭐ ĐỢT 10 — hạt nổ nằm ở một LỚP RIÊNG NGOÀI tấm bìa: lát nữa bìa bị mask
       loang ra, thứ gì nằm TRONG bìa cũng bị xoá theo, hạt sẽ mất giữa cú nổ. */
    var lop = document.createElement('div');
    lop.className = 'no-lop';
    khung.appendChild(lop);
    nemHat(lop, bTam.x, bTam.y, 18, 12, u * 190);
    for (var i = 0; i < 26; i++) {
      var hat = document.createElement('span');
      hat.className = 'hat-bui';
      var goc = (i / 26) * Math.PI * 2 + (i % 3) * 0.31;
      var xa  = oBia.width * (0.22 + (i % 5) * 0.09);
      hat.style.left = bTam.x + 'px';
      hat.style.top  = bTam.y + 'px';
      hat.style.setProperty('--bux', (Math.cos(goc) * xa).toFixed(0) + 'px');
      hat.style.setProperty('--buy', (Math.sin(goc) * xa * 0.72).toFixed(0) + 'px');
      hat.style.animationDelay = ((i % 4) * 40) + 'ms';
      lop.appendChild(hat);
    }
    setTimeout(function(){ lop.remove(); }, 1500);
    bia.style.pointerEvents = 'none';
    /* ⭐ ĐỢT 11 — thầy chốt: nổ xong thì PHAI THẬT NHANH cho màn START hiện ra
       ngay, bỏ hẳn kiểu loang tròn từ tâm 1,15s của đợt 10 (chậm quá). Chỉ chờ
       60ms cho tia sáng kịp bung rồi phai tấm bìa trong 0,18s.
       ⛔ Vẫn kèm setTimeout gỡ hẳn tấm bìa: transition bị hãm khi tab ẩn (họ
       hàng với bẫy 35), không gỡ tay thì bìa nằm lại che mất act. */
    setTimeout(function(){ bia.classList.add('tan'); }, 60);
    setTimeout(function(){ if (bia.parentNode) bia.remove(); }, 400);
  }

  requestAnimationFrame(khungHinh);
}

/* ---------- VẼ MỘT PHẦN CỦA BÀI ---------- *//* ---------- VẼ MỘT PHẦN CỦA BÀI ---------- *//* ---------- VẼ MỘT PHẦN CỦA BÀI ---------- */
/* Thẻ act còn người chưa full điểm? (em chưa làm HOẶC điểm dưới 100) —
   quyết định hào quang đỏ của thẻ + của ô hạn trong mốc 6 tiếng. */
function conThieu(ma){
  return xepBang(ma).some(function(e){ return e.chua || e.diem < 100; });
}

function veKhoi(k, so){
  var sec = document.createElement('section');
  sec.className = 'card';
  /* v1.13.0 — thẻ act mang mã của mình, để bộ nghe tin nộp bài (AWORD:NOP)
     tìm đúng thẻ mà làm mới bảng. */
  if (k.loai === 'act' && k.ma) sec.setAttribute('data-ma', k.ma);
  if (conThieu(k.ma)) sec.classList.add('con-thieu');

  /* ⭐ WORDS đợt 2 — CẢ BA THẺ đều có từ điển RIÊNG: kho từ riêng, mở/đóng
     riêng, không cái nào ảnh hưởng cái nào (thầy chốt). Trước đợt này chỉ thẻ
     1 có. Kho tra theo MÃ ACT ⇒ sang bài khác là danh sách tự trống. */
  var coTuDien = true;

  /* ⭐ GỘP MẪU (23/08) — THẺ BÀI NGHE, bê từ mẫu DICTS sang. Dạng DICTS có một
     khối `audio` giữa hai act; hai dạng kia không có. Thẻ này KHÔNG có đèn,
     KHÔNG có nút mở tab mới, KHÔNG có bảng xếp hạng — chỉ trình phát + từ điển.
     ⛔ Từ điển của thẻ nghe lấy MÃ BÀI NGHE làm khoá kho (thẻ act lấy mã act)
     — thiếu khoá là ba thẻ dùng chung một kho, sang bài khác không trống lại. */
  if (k.loai === 'audio' || k.loai === 'nghe') {
    sec.innerHTML =
      '<div class="card-head">' +
        '<span class="step">' + so + '</span>' +
        '<div class="ch-chu"><h2>' + chuAnToan(k.ten) + '</h2>' +
          (k.yeuCau ? '<div class="ch-ma">' + chuAnToan(k.yeuCau) + '</div>' : '') +
        '</div>' +
        '<div class="card-nut co-td">' +
          '<button class="nut-tudien" title="Tra từ điển">' + IC_SACH +
            '<span class="td-chu">A-DICTIONARY</span></button>' +
        '</div>' +
      '</div>' +
      '<div class="than mot">' + veTrinhPhat(k) + '</div>' + veTuDien();
    noiTrinhPhat(sec);
    noiTuDien(sec, k.maNghe || ('nghe-' + so));
    return sec;
  }

  /* Đầu thẻ: tên act ở dòng trên, mã lesson xuống dòng dưới (đợt 5).
     ⭐ v1.12.0 (thầy chốt 24/08/2026) — khối có `act` (tên act AWord đã chọn
     trong myLesson, vd ENG1) thì dòng dưới tiêu đề đổi thành
     "LSA2-S2.T1.P3-4-5 • ENG1"; khối cũ không có `act` giữ nếp cũ (yeuCau). */
  var dongDuoi = k.act
    ? A.maLesson(BAI) + ' • ' + k.act
    : (k.yeuCau || '');
  var dau =
    '<div class="card-head">' +
      '<span class="step">' + so + '</span>' +
      '<div class="ch-chu"><h2>' + chuAnToan(k.ten) + '</h2>' +
        (dongDuoi ? '<div class="ch-ma">' + chuAnToan(dongDuoi) + '</div>' : '') +
      '</div>' +
      /* ⭐ WORDS đợt 1 — thứ tự thầy chốt: ĐÈN · MỞ TAB MỚI · A-DICTIONARY.
         Cụm mang thêm `co-td` để rộng đúng bằng cột leaderboard. */
      '<div class="card-nut' + (coTuDien ? ' co-td' : '') + '">' +
        '<button class="ic-nut den" title="Tắt bớt ánh sáng xung quanh">' + IC_DEN + '</button>' +
        '<a class="ic-nut" target="_blank" rel="noopener" href="__LINK__" ' +
          'title="Mở ở tab mới">' + IC_TAB + '</a>' +
        (coTuDien
          ? '<button class="nut-tudien" title="Tra từ điển">' + IC_SACH +
              '<span class="td-chu">A-DICTIONARY</span></button>'
          : '') +
      '</div>' +
    '</div>';

  /* Khối game AWord: chưa bấm READY thì chỉ là tấm bìa, bấm mới nạp iframe.
     ⭐ ĐỢT 5 — link nhúng thêm cờ `&nhung=1` (AWord Đợt 200): bên đó bỏ lề
     trang và ẩn dải tên act dưới khung, nên khung game khớp KHÍT ô này (cùng
     tỉ lệ 16:10,5) và không bao giờ phải cuộn.
     ⛔ Nút "mở ở tab mới" thì KHÔNG có cờ — mở tab riêng thì cứ để nguyên
     trang đầy đủ của AWord.
     ⚠️ Bản mẫu từng có trường `maThat` (nhúng một mã, tra bảng bằng mã khác) —
     bản thật BỎ HẲN, mỗi act chỉ còn đúng một mã do thầy dán trong app. */
  var link  = AWORD + '/play.html?g=' + encodeURIComponent(k.ma) +
              '&n=' + encodeURIComponent(TOI) + '&lop=' + encodeURIComponent(LOP_HIEN);
  var nhung = link + '&nhung=1';
  sec.innerHTML = dau.replace('__LINK__', link) +
    '<div class="than">' +
      '<div class="game" data-src="' + nhung + '">' + veBia(k) + '</div>' +
      /* ⭐ WORDS đợt 1 — từ điển nằm TRONG `.lb-cot` để phủ kín cả bảng (kể cả
         tên template + nút làm mới). Nút nhỏ trong đầu bảng chỉ hiện ở dạng
         hẹp, đối xứng với nút làm mới. */
      '<div class="lb-cot"><div class="lb">' +
        '<div class="lb-head">' +
          (coTuDien
            ? '<button class="nut-td-nho" title="Tra từ điển">' + IC_SACH + '</button>'
            : '') +
          '<h3>' + (k.mau || 'LEADERBOARD') + '</h3>' +
          '<button class="lam-moi" title="Làm mới">' + IC_MOI + '</button></div>' +
        '<div class="lb-ds">' + veBang(k.ma) + '</div>' +
      '</div>' + (coTuDien ? veTuDien() : '') + '</div>' +
    '</div>';

  var khung = sec.querySelector('.game');
  khung.querySelector('.game-cover').onclick = function(){ moAct(khung); };

  var nutDen = sec.querySelector('.ic-nut.den');
  nutDen.onclick = function(){
    if (khung.classList.contains('sang')) tatDen(); else batDen(khung, nutDen, k);
  };

  var nutMoi = sec.querySelector('.lam-moi');
  nutMoi.onclick = function(){ lamMoiBang(sec, k.ma, nutMoi); };

  if (coTuDien) noiTuDien(sec, k.ma);
  return sec;
}

/* ---------- TRÌNH PHÁT BÀI NGHE ----------
   LEVEL = phần TRƯỚC DẤU GẠCH ĐẦU TIÊN của mã bài: kho xếp mỗi level một thư
   mục (LSFLY · LSA2 · LSB1 · IEL) nên suy ra được, bài chỉ lưu mã.
   ⛔ Sửa chỗ này thì sửa cả `nghe.js` (app) lẫn `web/js/app.js` (trang thật). */
var TOC_DO = [0.5, 0.75, 1, 1.5, 2];

function levelCuaMa(ma){
  var m = String(ma || '').trim().match(/^([A-Za-z0-9]+)-/);
  return m ? m[1].toUpperCase() : 'KHAC';
}

function veTrinhPhat(k){
  var duong = KHO_NGHE + '/' + encodeURIComponent(levelCuaMa(k.maNghe)) +
              '/' + encodeURIComponent(k.maNghe) + '.mp3';
  /* Một hàng theo ảnh mẫu của thầy (đợt 9):
     ▶tròn · 00:00 · ◀ · thanh · ▶ · 03:45 · loa · | · 1x */
  return '<div class="nghe">' +
    '<audio preload="metadata" src="' + duong + '"></audio>' +
    '<div class="ng-bao"></div>' +
    '<button class="ng-play dung" title="Phát">' + IC_PLAY + '</button>' +
    '<span class="ng-nay">0:00</span>' +
    '<button class="ng-nhay lui" title="Lùi 5 giây">' +
      '<svg viewBox="0 0 24 24"><path d="M17.5 4.5v15L5.5 12z"/></svg></button>' +
    '<div class="ng-thanh"><div class="ng-chay"></div><div class="ng-num"></div></div>' +
    '<button class="ng-nhay toi" title="Tới 5 giây">' +
      '<svg viewBox="0 0 24 24"><path d="M6.5 4.5v15L18.5 12z"/></svg></button>' +
    '<span class="ng-tong">--:--</span>' +
    '<div class="ng-loa-boc">' +
      '<button class="ng-loa" title="Âm lượng">' + IC_LOA + '</button>' +
      '<div class="luong-pop">' +
        '<div class="ng-lthanh"><div class="ng-lchay"></div><div class="ng-lnum"></div></div>' +
      '</div>' +
    '</div>' +
    '<span class="ng-vach"></span>' +
    '<div class="ng-toc-boc">' +
      '<button class="ng-toc" title="Tốc độ đọc">1x</button>' +
      '<div class="toc-menu">' +
        TOC_DO.map(function(t){
          return '<button data-toc="' + t + '"' + (t === 1 ? ' class="dang"' : '') + '>' +
            t + 'x</button>';
        }).join('') +
      '</div>' +
    '</div>' +
  '</div>';
}

function noiTrinhPhat(sec){
  var am   = sec.querySelector('audio'),
      hop  = sec.querySelector('.nghe'),
      bao  = sec.querySelector('.ng-bao'),
      nut  = sec.querySelector('.ng-play'),
      thanh= sec.querySelector('.ng-thanh'),
      chay = sec.querySelector('.ng-chay'),
      num  = sec.querySelector('.ng-num'),
      nay  = sec.querySelector('.ng-nay'),
      tong = sec.querySelector('.ng-tong'),
      loa  = sec.querySelector('.ng-loa'),
      luongPop = sec.querySelector('.luong-pop'),
      lthanh = sec.querySelector('.ng-lthanh'),
      lchay  = sec.querySelector('.ng-lchay'),
      lnum   = sec.querySelector('.ng-lnum'),
      lui  = sec.querySelector('.ng-nhay.lui'),
      toi  = sec.querySelector('.ng-nhay.toi'),
      toc  = sec.querySelector('.ng-toc'),
      menu = sec.querySelector('.toc-menu');

  function veThanh(){
    var ti = am.duration ? (am.currentTime / am.duration) : 0;
    chay.style.width = (ti * 100) + '%';
    num.style.left = (ti * 100) + '%';
    hop.style.setProperty('--tien', tienNen(ti).toFixed(2) + '%');
    hop.style.setProperty('--phai', phaiNen(ti).toFixed(2) + '%');
    nay.textContent = chuGio(am.currentTime);
  }

  /* ⭐ ĐỢT 12 — MÉP GRADIENT ĐUỔI THEO NÚT KÉO (thầy chốt).
     Trước đây gradient chạy thẳng theo % thời gian, mà thanh thời gian lại
     KHÔNG bắt đầu từ mép trái khung (bên trái còn nút phát · đồng hồ · nút ◀)
     ⇒ suốt bài mép gradient lẽo đẽo sau nút kéo cả trăm pixel, hết bài vẫn
     chưa lấp kín khung. Nay chia ba chặng:
       · 2 giây ĐẦU  : phóng từ 0 lên ĐÚNG chỗ nút kéo đang đứng (đuổi cho kịp).
       · Khúc giữa   : bám sát nút kéo, tịnh tiến đều.
       · 2 giây CUỐI : vượt lên, lấp nốt phần đuôi cho đầy khung lúc hết bài.
     Tính theo % của CẢ KHUNG player, không phải % của riêng thanh thời gian. */
  var BU_CM    = 38;  /* chạy trước nút kéo 1cm (~38px) — xem chú thích trên */
  var TANG_TOC = 1;   /* giây: đoạn phóng nhanh ở ĐẦU bài */
  /* ⭐ ĐỢT 14 — ĐOẠN KẾT chia làm HAI GIÂY RIÊNG (thầy chốt): đợt 13 gộp cả
     hai việc vào một giây nên đoạn phai tắt lúc mép gradient còn đang chạy,
     lộ ra một đường NÉT CỨNG. Nay:
       · giây áp chót (d−2 → d−1): kéo mép gradient về hết khung, đoạn phai
         VẪN nguyên 14% nên mép vẫn mềm;
       · giây chót   (d−1 → d)   : mép đã ở 100% rồi, chỉ còn bóp đoạn phai
         14% → 0 cho màu ngấm đầy dần vào đuôi khung. */
  var KEO_HET  = 1;   /* giây: kéo mép gradient về hết khung */
  var FADE_HET = 1;   /* giây: bóp đoạn phai về 0 cho lấp đầy hẳn */

  function tienNen(ti){
    var d = am.duration || 0;
    if (!d) return 0;
    var oh = hop.getBoundingClientRect(), ot = thanh.getBoundingClientRect();
    if (!oh.width) return 0;
    var L = (ot.left  - oh.left) / oh.width * 100;   /* mép trái thanh */
    var R = (ot.right - oh.left) / oh.width * 100;   /* mép phải thanh */
    /* ⭐ ĐỢT 13 — CHẠY TRƯỚC nút kéo đúng 1cm: đoạn phai dài 14% nên mắt nhìn
       thấy màu đậm KẾT THÚC sớm hơn chỗ ghi trong `--tien`; không bù thì lúc
       nào cũng có cảm giác gradient lẽo đẽo sau nút kéo. */
    var x = L + (R - L) * ti + BU_CM / oh.width * 100;
    var T  = Math.min(TANG_TOC, d / 4);  /* bài ngắn thì các đoạn rút ngắn theo */
    var K  = Math.min(KEO_HET,  d / 4);
    var Fa = Math.min(FADE_HET, d / 4);
    var t  = ti * d;
    if (t < T) return x * (t / T);
    var batKeo = d - K - Fa;             /* mốc bắt đầu kéo về hết khung */
    if (t >= batKeo) {
      var k = Math.min(1, (t - batKeo) / K);
      return Math.min(100, x + (100 - x) * k);
    }
    return Math.min(100, x);
  }

  /* Bề rộng đoạn phai ở mép gradient: giữ nguyên 14% suốt bài, chỉ ở GIÂY CHÓT
     mới thu dần về 0 — và lúc đó mép gradient đã nằm sẵn ở 100% rồi, nên mắt
     chỉ thấy màu ngấm đầy dần chứ không thấy đường nét nào chạy qua.
     ⛔ Bóp theo đường THẲNG (đợt 13 dùng bình phương nên tắt gần hết ngay trong
     nửa giây đầu — chính là chỗ thầy thấy "hiện nét khá cứng"). */
  function phaiNen(ti){
    var d = am.duration || 0;
    if (!d) return 14;
    var Fa = Math.min(FADE_HET, d / 4);
    var t  = ti * d;
    if (t <= d - Fa) return 14;
    return 14 * (1 - (t - (d - Fa)) / Fa);
  }

  /* Lúc đang phát thì vẽ theo từng khung hình cho mép gradient trôi mượt —
     sự kiện `timeupdate` chỉ bắn ~4 lần/giây, nhìn ra từng nấc. */
  var machVe = 0;
  function batMachVe(){
    if (machVe) return;
    (function buoc(){
      machVe = requestAnimationFrame(function(){
        veThanh();
        if (am.paused || am.ended) { machVe = 0; return; }
        buoc();
      });
    })();
  }

  /* Tổng thời lượng chỉ biết được SAU khi trình duyệt đọc xong phần đầu file —
     trước đó `duration` là NaN, nên phải chờ sự kiện chứ đừng đọc ngay. */
  am.addEventListener('loadedmetadata', function(){ tong.textContent = chuGio(am.duration); });
  am.addEventListener('timeupdate', veThanh);
  am.addEventListener('play',  function(){ hop.classList.add('chay'); batMachVe(); });
  am.addEventListener('pause', function(){ hop.classList.remove('chay'); });
  am.addEventListener('ended', function(){
    hop.classList.remove('chay');
    nut.innerHTML = IC_PLAY; nut.classList.add('dung'); nut.title = 'Phát';
  });

  nut.onclick = function(){
    if (am.paused) {
      /* Chỉ cho MỘT bài nghe chạy một lúc — hai bài cùng phát thì rối tai. */
      document.querySelectorAll('.nghe audio').forEach(function(a){ if (a !== am) a.pause(); });
      am.play();
      nut.innerHTML = IC_TAM; nut.classList.remove('dung'); nut.title = 'Tạm dừng';
    } else {
      am.pause();
      nut.innerHTML = IC_PLAY; nut.classList.add('dung'); nut.title = 'Phát';
    }
  };

  /* "+ 5s / − 5s" hiện mờ giữa khung rồi tan. Gắn lại class để animation chạy
     lại được khi bấm dồn dập. */
  function baoNhay(chu){
    bao.textContent = chu;
    bao.classList.remove('hien');
    void bao.offsetWidth;
    bao.classList.add('hien');
  }
  lui.onclick = function(){
    baoNhay('− 5s');
    am.currentTime = Math.max(0, am.currentTime - 5); veThanh();
  };
  toi.onclick = function(){
    if (!am.duration) return;
    baoNhay('+ 5s');
    am.currentTime = Math.min(am.duration, am.currentTime + 5); veThanh();
  };

  /* ⭐ ĐỢT 11 — hai pop-up (âm lượng · tốc độ) dùng CHUNG một lối: bấm nút thì
     đóng sạch mọi pop-up đang mở rồi mới mở cái của mình ⇒ không bao giờ có hai
     cái cùng mở, và đụng vào bất cứ thứ gì khác cũng tự ẩn (tay đóng chung nghe
     `click` + `pointerdown` ở `document`).
     ⛔ Chính nút mở và ruột pop-up phải CHẶN `pointerdown` nổi lên: không chặn
     thì tay đóng chung chạy TRƯỚC cú `click`, nút bấm lần nào cũng thành mở
     lại (không tắt được), còn kéo thanh âm lượng thì pop-up đóng ngay khi vừa
     chạm tay vào. */
  function chan(e){ e.stopPropagation(); }
  function moRieng(pop){
    var dangMo = pop.classList.contains('mo');
    dongMoiMenuToc();
    if (!dangMo) pop.classList.add('mo');
  }
  loa.addEventListener('pointerdown', chan);
  loa.onclick = function(e){ chan(e); moRieng(luongPop); };
  luongPop.addEventListener('click', chan);
  luongPop.addEventListener('pointerdown', chan);

  /* Tốc độ: bấm ra bảng DỌC — 0,5 · 0,75 · 1 · 1,5 · 2. */
  toc.addEventListener('pointerdown', chan);
  toc.onclick = function(e){ chan(e); moRieng(menu); };
  menu.addEventListener('pointerdown', chan);
  menu.querySelectorAll('button').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var t = Number(b.getAttribute('data-toc'));
      am.playbackRate = t;
      toc.textContent = t + 'x';
      if (t !== 1) toc.classList.add('cham'); else toc.classList.remove('cham');
      menu.querySelectorAll('button').forEach(function(x){ x.classList.remove('dang'); });
      b.classList.add('dang');
      menu.classList.remove('mo');
    };
  });

  /* Kéo — chung một bộ code cho thanh THỜI GIAN lẫn ÂM LƯỢNG. Lúc đang kéo
     thanh thời gian thì gắn lớp `keo` cho dải sóng sánh chạy (đợt 9).
     ⚠ Máy chủ thử ở nhà (python http.server) KHÔNG trả `Accept-Ranges` nên
     chạy local không tua được — GitHub Pages trả 206, đừng đi sửa code. */
  /* `doc` = thanh dựng đứng (âm lượng, từ đợt 11): tính theo chiều CAO và lật
     ngược trục — trên cùng là to nhất. */
  function noiKeo(vach, dat, batSong, doc){
    var dangKeo = false;
    function theo(e){
      var o = vach.getBoundingClientRect();
      var ti = doc ? 1 - (e.clientY - o.top) / o.height
                   : (e.clientX - o.left) / o.width;
      dat(Math.min(1, Math.max(0, ti)));
    }
    vach.addEventListener('pointerdown', function(e){
      dangKeo = true;
      if (batSong) { hop.classList.add('keo'); dongMoiMenuToc(); }
      try { vach.setPointerCapture(e.pointerId); } catch (x) { /* kệ */ }
      theo(e);
    });
    vach.addEventListener('pointermove', function(e){ if (dangKeo) theo(e); });
    function tha(){ dangKeo = false; if (batSong) hop.classList.remove('keo'); }
    vach.addEventListener('pointerup', tha);
    vach.addEventListener('pointercancel', tha);
  }
  noiKeo(thanh, function(ti){
    if (!am.duration) return;
    am.currentTime = ti * am.duration;
    veThanh();
  }, true);
  /* Âm lượng mặc định MAX; kéo là đổi ngay, không cần lưu. */
  noiKeo(lthanh, function(ti){
    am.volume = ti;
    lchay.style.height = (ti * 100) + '%';
    lnum.style.bottom = (ti * 100) + '%';
  }, false, true);
}


/* ---------- TU DIEN A-DICTIONARY (dot 8, lam lai o WORDS dot 1 va 2) -------
   Tra qua dictionaryapi.dev (miễn phí, tiếng Anh): nghĩa Anh-Anh + phiên âm
   IPA + file đọc mẫu; tiếng Việt lấy thêm từ MyMemory.

   ⭐ WORDS đợt 1 — bảng từ điển PHỦ KÍN khung leaderboard, chỉ nút X mới đóng;
   nút tra là **Check**; có hàng TỪ ĐÃ TRA GẦN ĐÂY, bấm vào hiện NGAY nghĩa của
   lần tra trước (lấy trong kho, KHÔNG gọi mạng).

   ⭐ WORDS đợt 2 — thầy chốt thêm:
     · Nhớ tối đa **15 từ**; có từ thứ 16 thì từ CŨ NHẤT rụng khỏi hàng.
     · **MỖI ACT MỘT TỪ ĐIỂN RIÊNG**: kho riêng, mở/đóng riêng, không dính nhau.
       ⇒ khoá kho là `awc-td-<MÃ ACT>`.
     · **Sang bài tập mới thì từ điển trống lại**: vì khoá gắn với mã act mà bài
       mới có act mới. Kèm theo, lúc mở trang xoá luôn mọi kho của act KHÔNG
       thuộc bài này — vừa đúng ý thầy, vừa khỏi để rác đọng trong máy học sinh.
       ⚠️ Hệ quả: mở lại đúng bài cũ thì hàng từ cũng đã trống.
   ⛔ Kho lưu BẢN GỌN của kết quả (2 loại từ × 2 nghĩa + tối đa 4 phiên âm) —
   giữ nguyên cả gói JSON của API thì vài chục từ là chạm trần 5MB. */
var TD_DAU = 'awc-td-';     /* đầu khoá; khoá đủ = TD_DAU + mã act */
var TD_TOI_DA = 15;         /* thầy chốt: quá 15 thì rụng từ CŨ NHẤT */

function tdKhoa(ma){ return TD_DAU + ma; }

function tdDoc(ma){
  try {
    var k = JSON.parse(localStorage.getItem(tdKhoa(ma)));
    return (k && k.ds && k.tu) ? k : { ds:[], tu:{} };
  } catch (e) { return { ds:[], tu:{} }; }
}
function tdGhi(ma, k){
  try { localStorage.setItem(tdKhoa(ma), JSON.stringify(k)); }
  catch (e) {
    /* Hết chỗ (máy học sinh có thể đã đầy vì trang khác): bỏ nửa hàng cũ, thử
       lại ĐÚNG MỘT LẦN rồi thôi — mất kho chứ tuyệt đối không để hỏng lượt tra. */
    k.ds = k.ds.slice(0, Math.max(4, Math.floor(k.ds.length / 2)));
    k.tu = tdLoc(k);
    try { localStorage.setItem(tdKhoa(ma), JSON.stringify(k)); } catch (x) {}
  }
}
function tdLoc(k){
  var m = {};
  k.ds.forEach(function(t){ if (k.tu[t]) m[t] = k.tu[t]; });
  return m;
}
/* Bản gọn của một mục từ điển — chỉ giữ đúng phần trang có hiện. */
function tdGon(e){
  return {
    word: e.word,
    phonetic: e.phonetic || '',
    phonetics: (e.phonetics || []).filter(function(p){ return p.audio || p.text; })
      .slice(0, 4).map(function(p){ return { audio:p.audio || '', text:p.text || '' }; }),
    meanings: (e.meanings || []).slice(0, 2).map(function(m){
      return { partOfSpeech: m.partOfSpeech || '',
        definitions: (m.definitions || []).slice(0, 2)
          .map(function(d){ return { definition: d.definition }; }) };
    })
  };
}
function tdNho(ma, tu, du){
  var k = tdDoc(ma);
  k.tu[tu] = du;
  k.ds = [tu].concat(k.ds.filter(function(t){ return t !== tu; })).slice(0, TD_TOI_DA);
  k.tu = tdLoc(k);
  tdGhi(ma, k);
}
/* Dọn kho của những act KHÔNG thuộc bài đang mở ⇒ bài mới là từ điển trống. */
function tdDonKho(dsMa){
  var giu = {};
  dsMa.forEach(function(m){ giu[tdKhoa(m)] = 1; });
  var bo = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var kh = localStorage.key(i);
      if (kh && kh.indexOf(TD_DAU) === 0 && !giu[kh]) bo.push(kh);
    }
    bo.forEach(function(kh){ localStorage.removeItem(kh); });
  } catch (e) { /* trình duyệt chặn localStorage thì thôi, không sao */ }
  return bo.length;
}

function veTuDien(){
  return '<div class="td-pop">' +
    '<div class="td-dau"><h4>A-Dictionary</h4>' +
      '<button class="dong-td" title="Đóng">' +
        '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="td-than">' +
      '<div class="td-chinh">' +
        '<div class="td-nhap">' +
          '<input type="text" placeholder="Type a word..." maxlength="40">' +
          '<button>Check</button></div>' +
        '<div class="td-kq"></div>' +
      '</div>' +
      '<div class="td-gan"></div>' +
    '</div>' +
  '</div>';
}

/* `ma` = mã act của CHÍNH thẻ này ⇒ mỗi thẻ một kho, ba thẻ chạy độc lập. */
function noiTuDien(sec, ma){
  var pop = sec.querySelector('.td-pop'),
      o   = sec.querySelector('.td-nhap input'),
      tra = sec.querySelector('.td-nhap button'),
      kq  = sec.querySelector('.td-kq'),
      gan = sec.querySelector('.td-gan');
  if (!pop) return;

  /* Hai nút mở: nút chữ ở đầu thẻ (dạng rộng) và nút icon trong đầu bảng
     (dạng hẹp) — CSS quyết định cái nào đang hiện. */
  [sec.querySelector('.nut-tudien'), sec.querySelector('.nut-td-nho')]
    .forEach(function(n){
      if (!n) return;
      n.onclick = function(){
        pop.classList.add('mo');
        veGan();                 /* vẽ lại hàng từ mỗi lần mở, cho chắc */
        setTimeout(function(){ o.focus(); }, 180);
      };
    });
  /* ⛔ CHỈ nút X của CHÍNH thẻ này mới đóng (thầy chốt): không đóng khi bấm ra
     ngoài, không đóng bằng Esc, và mở thẻ khác KHÔNG đụng gì tới thẻ này. */
  sec.querySelector('.dong-td').onclick = function(){ pop.classList.remove('mo'); };

  function hienLoi(chu){ kq.innerHTML = '<div class="td-mo">' + chu + '</div>'; }

  /* fetch có THỬ LẠI MỘT LẦN: dictionaryapi.dev hay hụt CORS đúng một nhịp
     (thầy gặp: "báo mạng chập chờn trong khi mạng vẫn khoẻ") — thử lại sau
     600ms là qua. */
  function goiCoThuLai(u){
    return fetch(u).then(function(r){
      if (!r.ok) throw 'khongco';
      return r.json();
    }).catch(function(loi){
      if (loi === 'khongco') throw loi;
      return new Promise(function(xong){ setTimeout(xong, 600); })
        .then(function(){ return fetch(u); })
        .then(function(r){ if (!r.ok) throw 'khongco'; return r.json(); });
    });
  }

  /* Dịch sang tiếng Việt qua MyMemory (miễn phí, có CORS). Hỏng thì thôi —
     phần tiếng Anh vẫn hiện đủ, đừng vì thiếu tiếng Việt mà báo lỗi cả tra. */
  function dichViet(chu){
    return fetch('https://api.mymemory.translated.net/get?langpair=en|vi&q=' +
        encodeURIComponent(chu))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var ra = d && d.responseData && d.responseData.translatedText;
        return (ra && !/MYMEMORY WARNING/i.test(ra)) ? ra : '';
      })
      .catch(function(){ return ''; });
  }

  /* ĐỌC MẪU: ưu tiên file UK của từ điển; không có (hoặc không kêu) thì đọc
     bằng giọng Anh-Anh của chính trình duyệt — luôn có tiếng (đợt 9, thầy
     gặp cảnh bấm loa im re). */
  function docMau(duongDoc, tu){
    var doc = function(){
      try {
        var u = new SpeechSynthesisUtterance(tu);
        u.lang = 'en-GB'; u.rate = 0.92;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (x) { /* máy không có giọng đọc thì đành im */ }
    };
    if (!duongDoc) return doc();
    var a = new Audio(duongDoc);
    a.play().catch(doc);
    a.onerror = doc;
  }

  /* Hàng từ đã tra: vẽ lại từ kho CỦA THẺ NÀY, tô đậm từ đang xem. */
  function veGan(dangXem){
    var k = tdDoc(ma);
    gan.innerHTML = k.ds.map(function(t){
      return '<button data-tu="' + t + '"' +
        (t === dangXem ? ' class="dang-xem"' : '') + '>' + t + '</button>';
    }).join('');
    gan.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        var t = b.getAttribute('data-tu'), d = tdDoc(ma).tu[t];
        o.value = t;
        if (d) veKetQua(d.e, t, d.viet);   /* lấy trong kho, không gọi mạng */
        else traTu();
      };
    });
  }

  /* `vietSan` có giá trị khi lấy lại từ kho ⇒ hiện tiếng Việt ngay, khỏi dịch
     lại. Lần tra mới thì `vietSan` là null và phần tiếng Việt đổ vào sau. */
  function veKetQua(e, tu, vietSan){
    /* ⭐ ĐỢT 9 — chuộng bản UK: phiên âm + file đọc lấy mục `-uk.mp3` trước,
       không có mới rơi về mục bất kỳ. */
    var ds = e.phonetics || [];
    var uk = ds.filter(function(p){ return p.audio && /-uk\./.test(p.audio); })[0];
    var coDoc = uk || ds.filter(function(p){ return p.audio; })[0] || {};
    var pa = (uk && uk.text) || e.phonetic ||
             (ds.filter(function(p){ return p.text; })[0] || {}).text || '';
    var h = '<span class="td-tu">' + e.word + '</span>';
    if (pa) h += '<span class="td-phienam">' + pa + '</span>';
    h += '<button class="td-loa" title="Nghe đọc mẫu (giọng Anh)">' +
      '<svg viewBox="0 0 24 24"><path d="M11 5.5 6.5 9H3.5v6h3L11 18.5zM15 9.3a4 4 0 0 1 0 5.4M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg></button>';
    var coViet = !!(vietSan && (vietSan.nghia || vietSan.giaiThich));
    if (coViet) {
      h += '<div class="td-viet">🇻🇳 ' +
        (vietSan.nghia ? '<b>' + vietSan.nghia + '</b>' : '') +
        (vietSan.giaiThich ? (vietSan.nghia ? ' — ' : '') + vietSan.giaiThich : '') +
        '</div>';
    } else if (!vietSan) {
      h += '<div class="td-viet" data-cho="nghia">🇻🇳 Đang dịch…</div>';
    }
    var dinhNghiaDau = '';
    (e.meanings || []).slice(0, 2).forEach(function(m){
      h += '<div class="td-loai">' + (m.partOfSpeech || '') + '</div><ul class="td-nghia">';
      (m.definitions || []).slice(0, 2).forEach(function(d){
        if (!dinhNghiaDau) dinhNghiaDau = d.definition;
        h += '<li>' + d.definition + '</li>';
      });
      h += '</ul>';
    });
    kq.innerHTML = h;
    kq.scrollTop = 0;
    kq.querySelector('.td-loa').onclick = function(){ docMau(coDoc.audio, e.word); };
    /* Cất vào kho NGAY khi có phần tiếng Anh (chưa chờ bản dịch): MyMemory có
       lúc trả về chậm vài giây, mà từ vừa tra thì phải xuất hiện dưới hàng
       ngay lập tức. Dịch xong sẽ ghi đè lại cả gói. */
    if (!vietSan) tdNho(ma, tu, { e: tdGon(e), viet: null });
    veGan(tu);
    if (vietSan) return;      /* lấy từ kho: xong ở đây */

    /* Tiếng Việt: dịch TỪ + dịch lời giải thích đầu tiên, đổ vào sau — rồi mới
       cất cả gói vào kho để lần sau bấm là hiện đủ ngay. */
    var oViet = kq.querySelector('.td-viet');
    Promise.all([dichViet(tu), dinhNghiaDau ? dichViet(dinhNghiaDau) : '']).then(function(r){
      var nghia = r[0], giaiThich = r[1];
      if (!nghia && !giaiThich) { if (oViet) oViet.remove(); }
      else {
        var ch = '';
        if (nghia) ch += '<b>' + nghia + '</b>';
        if (giaiThich) ch += (nghia ? ' — ' : '') + giaiThich;
        if (oViet) oViet.innerHTML = '🇻🇳 ' + ch;
      }
      tdNho(ma, tu, { e: tdGon(e), viet: { nghia: nghia, giaiThich: giaiThich } });
      veGan(tu);
    });
  }

  function traTu(){
    var tu = (o.value || '').trim().toLowerCase().replace(/[^a-z' -]/g, '');
    if (!tu) return;
    var daCo = tdDoc(ma).tu[tu];
    if (daCo) { veKetQua(daCo.e, tu, daCo.viet); return; }
    hienLoi('Đang tra “' + tu + '”…');
    goiCoThuLai('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(tu))
      .then(function(ds){
        var e = ds && ds[0];
        if (!e) throw 'khongco';
        veKetQua(e, tu, null);
      })
      .catch(function(loi){
        /* Ghi lỗi thật ra console: đợt 9 từng báo oan "mạng chập chờn" trong
           khi thủ phạm là lỗi code bị nuốt ở đây. */
        if (loi !== 'khongco' && window.console) console.warn('tu dien:', loi);
        hienLoi(loi === 'khongco'
          ? 'Không tìm thấy từ này — em kiểm tra lại chính tả nhé.'
          : 'Mạng đang chập chờn — em bấm Check lại nhé.');
      });
  }
  tra.onclick = traTu;
  o.addEventListener('keydown', function(e){ if (e.key === 'Enter') traTu(); });
  veGan();
}

/* ⭐ ĐỢT 11 — MỘT tay đóng chung cho CẢ HAI pop-up của trình phát (âm lượng ·
   tốc độ). Thầy chốt: đang mở cái này mà đụng vào bất cứ thứ gì khác là cái
   kia phải tự ẩn. Trước đây mỗi pop-up tự lo phần mình, lại còn `stopPropagation`
   nên bấm loa không đóng được bảng tốc độ ⇒ hai cái chồng nhau. */
function dongMoiMenuToc(){
  document.querySelectorAll('.toc-menu.mo,.luong-pop.mo').forEach(function(m){
    m.classList.remove('mo');
  });
}
document.addEventListener('click', dongMoiMenuToc);
document.addEventListener('pointerdown', dongMoiMenuToc);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { dongHet(); dongMoiMenuToc(); tatDen(); }
});

/* ---------- DỰNG TRANG ---------- */
function veCacPhan(){
  /* ⭐ WORDS đợt 2 — sang BÀI TẬP MỚI thì từ điển trống lại: xoá mọi kho không
     thuộc ba act của bài đang mở (kho gắn theo mã act). */
  tdDonKho(KHOI.map(function(k){ return k.ma; }));
  /* Viết tắt phải tính lại mỗi khi danh sách lớp đổi (nút xem thử SĨ SỐ). */
  TAT = bangVietTat(CA_LOP);
  /* `lop-thieu` trên <body>: còn BẤT CỨ bảng nào có người chưa full ⇒ ô hạn
     được phép toả hào quang đỏ trong mốc 6 tiếng. */
  var thieu = KHOI.some(function(k){ return k.loai === 'act' && conThieu(k.ma); });
  document.body.classList.toggle('lop-thieu', thieu);
  var hop = $('#cacPhan');
  hop.innerHTML = '';
  KHOI.forEach(function(k, i){ hop.appendChild(veKhoi(k, i + 1)); });
  canhLb();
}

/* ⭐ v1.13.0 — NGHE TIN NỘP BÀI TỪ KHUNG ACT NHÚNG (AWord Đợt 256): học sinh
   bấm SUBMIT trong iframe là AWord bắn postMessage {type:'AWORD:NOP', code}
   về trang mẹ — bảng xếp hạng của ĐÚNG act đó tự làm mới (một lượt đọc, đi
   qua chính đường nút làm mới nên vẫn giữ nếp tiết kiệm hạn mức Firebase:
   không có vòng poll nào cả).
   ⛔ Chỉ nhận tin từ ĐÚNG trang AWord — tin từ origin khác bỏ qua. */
window.addEventListener('message', function(e){
  if (e.origin !== AWORD) return;
  var d = e.data;
  if (!d || d.type !== 'AWORD:NOP' || !d.code) return;
  var sec = document.querySelector('.card[data-ma="' + String(d.code).replace(/[^A-Za-z0-9_-]/g, '') + '"]');
  if (!sec) return;
  var nut = sec.querySelector('.lam-moi');
  if (nut) lamMoiBang(sec, String(d.code), nut);
});

/* Đo lại khi: kéo giãn cửa sổ · đổi ngưỡng màn · nạp xong font (font đổi thì
   chiều cao dòng đổi theo, đo trước khi font về là ra số sai). */
window.addEventListener('resize', doLb);
HEP.addEventListener('change', doLb);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(doLb);

/* ---------- ĐỒNG HỒ ĐẾM NGƯỢC ----------
   ⭐ v1.9.0 — đếm tới HẠN THẬT của bài (`mocHan` trong js/chung.js).
   Bài chưa có hạn thì đồng hồ để gạch ngang, KHÔNG bịa giờ. */
var HAN_MOC = null;      /* mốc hạn (ms) — null = bài chưa đặt hạn */
var conLai = 0;
var dangChay = false;

function tinhConLai(){
  if (HAN_MOC == null) { conLai = 0; return; }
  conLai = Math.max(0, Math.round((HAN_MOC - Date.now()) / 1000));
}

function veDongHo(){
  var o = $('#oHan'), d = $('#dhho');
  o.classList.remove('gap-gio','het-gio');
  d.classList.remove('xanh','cam','do','het');
  if (HAN_MOC == null) {           /* bài chưa có hạn: không cảnh báo gì cả */
    document.body.classList.remove('gio-gap','gio-vang','gio-het');
    d.textContent = '--:--:--';
    return;
  }
  /* Lớp trên <body>: `gio-gap` (dưới 6h) cho bộ cảnh báo đỏ, `gio-vang`
     (6-24h) cho hào quang vàng của thẻ chưa full (đợt 8). */
  document.body.classList.toggle('gio-gap', conLai > 0 && conLai <= 6 * 3600);
  document.body.classList.toggle('gio-vang',
    conLai > 6 * 3600 && conLai <= 24 * 3600);
  /* ⭐ ĐỢT 10 — HẾT HẠN: thẻ act nào còn người chưa full vẫn nháy hào quang đỏ
     y như mốc 6 tiếng (trước đây hết giờ là tắt sạch, nhìn như đã xong hết). */
  document.body.classList.toggle('gio-het', conLai <= 0);
  if (conLai <= 0) {
    o.classList.add('het-gio'); d.classList.add('het');
    d.textContent = 'HẾT HẠN'; return;
  }
  if (conLai <= 6 * 3600) o.classList.add('gap-gio');
  d.classList.add(conLai > 24 * 3600 ? 'xanh' : (conLai > 6 * 3600 ? 'cam' : 'do'));
  var g = Math.floor(conLai / 3600),
      p = Math.floor((conLai % 3600) / 60),
      s = conLai % 60;
  d.textContent = (g < 10 ? '0' : '') + g + ':' +
                  (p < 10 ? '0' : '') + p + ':' +
                  (s < 10 ? '0' : '') + s;
}
/* ============================================================
   KHỞI ĐỘNG (v1.9.0) — đọc dữ liệu thật rồi mới vẽ.
   Trang này mở bằng `bai.html?id=<mã bài>`; `id` do trang lớp truyền sang.
   Thiếu id / sai id / chưa đăng nhập  ->  quay về trang lớp.
   ============================================================ */
function veDauTrang(){
  var tu = TOI.trim().split(/\s+/).filter(Boolean);
  var chuTat = tu.slice(-2).map(function(t){ return t[0]; }).join('').toUpperCase();

  function datChu(el, chu){
    if (!el) return;
    Array.prototype.slice.call(el.childNodes).forEach(function(n){
      if (n.nodeType === 3) el.removeChild(n);
    });
    el.insertBefore(document.createTextNode(chu), el.firstChild);
  }
  datChu($('#nutMenu'), chuTat);
  var avSide = document.querySelector('.side-head .av');
  if (avSide) avSide.textContent = chuTat;
  var tenTren = document.querySelector('.who .ten');
  if (tenTren) tenTren.textContent = TOI;
  var tenSide = document.querySelector('.side-head .ten');
  if (tenSide) tenSide.textContent = TOI;
  var lopTren = document.querySelector('.who .lop');
  if (lopTren) lopTren.textContent = 'Lớp ' + LOP + ' · Thầy Andrew';
  var lopSide = document.querySelector('.side-head .phu2');
  if (lopSide) lopSide.textContent = 'Lớp ' + LOP;

  /* Góc phải: tên thẻ bên trang lớp + mã lesson. */
  var dbTen = document.querySelector('.dau-bai .db-ten');
  if (dbTen) dbTen.textContent = A.tenBai(BAI);
  var dbMa = document.querySelector('.dau-bai .db-ma');
  if (dbMa) dbMa.textContent = A.maLesson(BAI);

  /* Ô hạn: chữ ở dòng trên (đồng hồ do veDongHo lo). */
  var hanChu = document.querySelector('#oHan .han-dong');
  if (hanChu) {
    var chu = A.chuHan(BAI);
    datChu(hanChu, chu ? (' Hạn ' + chu) : ' Chưa đặt hạn');
  }
  document.title = A.tenBai(BAI) + ' · Lớp ' + LOP_HIEN;
}

/* Về trang lớp — giữ nguyên chế độ xem (như một em, hoặc thẳng là thầy). */
function veTrangLop(){
  var q = A.giuXemNhuQuery(EM, MA_HS, LOP_DL);
  location.href = 'lop.html' + (q ? ('?' + q) : '');
}

A.napDuLieu().then(function(dl){
  EM = A.batBuocDangNhap(dl);
  if (!EM) return;
  TOI = EM.ten; MA_HS = EM.ma; LOP_DL = EM.lop; LOP_HIEN = EM.lop;
  var l = A.lopTheoMa(dl, LOP_DL);
  LOP = (l && l.tenGoc) || EM.lop;
  CA_LOP = ((l && l.hocSinh) || []).map(function(h){ return h.ten; });
  TAT = bangVietTat(CA_LOP);

  var id = new URLSearchParams(location.search).get('id') || '';
  var ds = A.baiCuaLop(dl, LOP_DL);
  for (var i = 0; i < ds.length; i++) if (ds[i].id === id) { BAI = ds[i]; break; }
  if (!BAI) { veTrangLop(); return; }

  /* Bài dạng SP SLIDE có trang riêng — vào nhầm thì chuyển sang đó. */
  var trang = A.trangCuaBai(BAI);
  if (trang && trang !== 'bai.html') {
    var qXn = A.giuXemNhuQuery(EM, MA_HS, LOP_DL);
    location.replace(trang + '?id=' + encodeURIComponent(BAI.id) + (qXn ? ('&' + qXn) : ''));
    return;
  }

  /* ⛔ CHỈ nhận hai loại khối mà trang này biết vẽ:
       act  -> khung game AWord   ·   nghe/audio -> trình phát mp3
     Khối `video` (khung Google Drive, dùng cho bài soạn TRƯỚC 19/08/2026) và
     khối `slide` bị BỎ QUA: bộ mẫu thầy chốt không có kiểu trình bày cho hai
     thứ đó. Bài dạng SP có trang riêng `bai-sp.html`; còn khối video Drive thì
     chỉ nằm trong mấy bài cũ của lớp chưa có mã đăng nhập, không em nào mở tới.
     ⚠️ Bỏ qua âm thầm ⇒ act nào không có mã cũng bị loại luôn, khỏi hiện một
     khung game trống. */
  KHOI = (BAI.khoi || []).filter(function(k){
    if (k.loai === 'nghe' || k.loai === 'audio') return !!k.maNghe;
    return k.loai === 'act' && !!k.ma;
  }).map(function(k){
    return {
      loai: (k.loai === 'nghe' || k.loai === 'audio') ? 'audio' : 'act',
      ten: k.ten || '', ma: k.ma || '', maNghe: k.maNghe || '',
      /* 🐛 v1.12.1 — `act` (bộ nghĩa ENG1/VI1) bị RƠI ở chính phép lọc này từ
         v1.12.0: dòng "mã lesson • ENG1" render ở veKhoi (k.act) nhưng map ở
         đây không bê trường đó qua ⇒ không bao giờ hiện. Lộ ra nhờ bản XEM THỬ
         BẢN NHÁP của app v1.17.0 — đo DOM thấy .ch-ma vắng mặt. */
      act: k.act || '',
      yeuCau: k.yeuCau || '', mau: k.mau || ''
    };
  });
  if (!KHOI.length) { veTrangLop(); return; }

  HAN_MOC = A.mocHan(BAI);
  tinhConLai();
  dangChay = (HAN_MOC != null);

  veDauTrang();
  veDongHo();

  /* Đọc điểm của mọi act rồi mới vẽ — vẽ trước thì bảng nào cũng "chưa ai làm"
     rồi nhảy số một nhịp, nhìn như trang lỗi. */
  var maAct = [];
  KHOI.forEach(function(k){ if (k.loai === 'act' && k.ma && maAct.indexOf(k.ma) < 0) maAct.push(k.ma); });
  return Promise.all(maAct.map(function(ma){
    /* ⭐ v1.14.0 — đọc SONG SONG điểm + chuẩn đủ điểm. Chuẩn nằm hẳn trong
       localStorage sau lần đầu nên không thêm lượt đọc Firestore nào ở các
       lần sau (tuỳ chọn bài giao là bản chụp đóng băng). */
    return Promise.all([
      A.diemCuaAct(ma)['catch'](function(){ return []; }),
      A.chuanDiem(ma)
    ]).then(function(r){ DIEM[ma] = r[0]; CHUAN[ma] = r[1]; });
  })).then(function(){ veCacPhan(); });
})['catch'](function(){ veTrangLop(); });

setInterval(function(){ if (dangChay && conLai > 0) { conLai--; veDongHo(); } }, 1000);
</script>
