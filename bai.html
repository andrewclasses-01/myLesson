<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập · Andrew Classes</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* ============================================================
   TRANG BÀI TẬP — dùng CHUNG cho WORDS · DICTS · READING
   (bài SPEAKING SLIDE nằm ở `bai-sp.html`)

   ⚠️ ĐÂY LÀ TRANG THẬT ĐANG CHẠY trên https://andrewclasses.com — dữ liệu THẬT
   trong `data/bai.json` + `data/lop.json`, do app myLesson đẩy lên (nút ĐẨY BÀI
   LÊN WEB trong khung 👁 xem thử bản nháp). ⛔ KHÔNG còn là bản mẫu, KHÔNG có
   dữ liệu giả, KHÔNG có trò "chỉ commit không push". Kho `mau-web` nay chỉ là
   bản đối chiếu thiết kế — SỬA GIAO DIỆN THÌ SỬA THẲNG Ở ĐÂY.
   · Bản đồ cả cụm + danh sách bẫy: `BAN GIAO.md` của kho myLesson-app.
   · Nhật ký thiết kế 5 trang mẫu (54 bẫy) vẫn đáng đọc: `GHI CHU MAU.md`
     trong `mau-web` — nhớ là mọi số đo ở đó nói về BẢN CŨ.

   CẤU TẠO: mỗi bài là một dãy `khoi[]`. Khối có `act` thì nhúng game AWord
   (`&nhung=1`) kèm một LEADERBOARD riêng của đúng act đó.
   ⛔ Thêm trường mới vào `khoi[]` là phải soi CẢ phép map `KHOI` lúc boot —
   đó là chỗ RƠI TRƯỜNG trong im lặng (đã cắn với `act`, vá ở v1.12.1).

   ⛔ LUẬT CÒN HIỆU LỰC (thầy chốt — đừng phá):
   1. KHÔNG một dòng hướng dẫn nào cho học sinh; thầy muốn các em tự khám phá.
   2. Khung nhúng act phải giữ quyền `microphone` (dòng `f.setAttribute('allow'…)`)
      — thẻ PRONUNCIATION là act SPEAKING của AWord, AI chấm phát âm. Model chấm
      nặng ~240MB tải về máy em ở lần bấm READY đầu tiên: thầy biết và vẫn chọn nhúng.
   3. Khung act giữ tỉ lệ **16 : 10,5** cho khớp bên AWord (khỏi sinh thanh cuộn).
   4. Leaderboard: dạng rộng nằm bên phải act, CAO ĐÚNG BẰNG khung act, chữ tự co
      để luôn đủ cả lớp; dạng điện thoại xuống dưới act và chia 3 CỘT. Làm mới =
      đọc lại THẬT (`diemCuaAct(ma, true)`), cộng nghe `AWORD:NOP` do khung act
      nhúng bắn lên sau mỗi cú nộp. ⛔ TUYỆT ĐỐI không poll theo nhịp — hạn mức Firebase.
   5. Thứ lớp: `.top` **35** > `.td-pop` **24**; thanh đầu cố ý vẫn ĐỨNG DƯỚI
      sidebar (41) và nền tối bóng đèn (44). Bảng đầy đủ ở chú thích trên rule `.top`.
   6. Từ điển mini: MỖI ACT MỘT KHO RIÊNG (`awc-td-<mã act>`), sang bài mới là
      xoá kho của act lạ; ô nhập giữ **16px** kẻo Safari iOS tự phóng to cả trang;
      mở ra thì phủ kín khung leaderboard và CHỈ nút ✕ mới đóng.
   7. Khung ngoài (thanh đầu · 2 sidebar · token màu · font · toast) dùng CHUNG
      với `lop.html` — sửa bên đó thì nhớ sửa cả đây.
   ============================================================ */
:root{
  --ground:#F7FAF9; --surface:#FFFFFF; --ink:#16232A; --muted:#5F7370;
  --accent:#0E7C6E; --accent-ink:#FFFFFF; --accent-soft:#E3F1EE;
  --amber:#F2A93B; --amber-soft:#FCF3E2;
  --xanh-la:#1DA45C;
  --line:#E0EAE7;
  --m-do:#E0575B; --m-cam:#F0821E; --m-vang:#E0B411; --m-duong:#3E7BFA; --m-la:#18A957;
  --shadow:0 1px 3px rgba(22,35,42,.07), 0 8px 24px rgba(22,35,42,.06);
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
  --sans:'Montserrat',"Segoe UI",system-ui,sans-serif;
  --em:cubic-bezier(.22,.9,.3,1);
  /* Ba biến của leaderboard do JS ĐO rồi đặt — ⛔ đừng gõ tay thành số:
     số em mỗi lớp khác nhau, mà khung phải luôn vừa khít. */
  --lb-cao:24px;      /* chiều cao một dòng */
  --lb-chu:12px;      /* cỡ chữ trong dòng */
  --lb-khe:2px;       /* khe giữa hai dòng */
  --lb-hang:4;        /* dạng điện thoại: số dòng mỗi cột (3 cột) */
  /* ⭐ WORDS đợt 1 — bề ngang cột leaderboard. Cụm 3 nút ở đầu thẻ dùng CHUNG
     biến này để hai khối thẳng cột nhau (thầy: "cho cân đối và đẹp").
     ⛔ Đừng gõ 244px ở hai nơi — sửa một chỗ là lệch ngay. */
  --lb-rong:244px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground); color:var(--ink); font:500 15px/1.6 var(--sans)}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}

.wrap{max-width:1180px; margin:0 auto; padding:0 20px}

/* ---------- THANH ĐẦU (ĐỢT 4 — dùng chung trang chính lẫn trang bài) ----------
   Ba khối: [avatar + tên] · [◀ về lớp + Ô HẠN] · [tên bài + mã lesson].
   ⭐ Lưới `1fr auto 1fr` chứ KHÔNG phải flex: hai cột rìa luôn bằng nhau nên
   khối giữa nằm ĐÚNG TÂM dải, dù bên trái tên dài hay ngắn.
   ⭐ Thanh luôn hiện lúc cuộn (`position:sticky` + nền mờ). */
/* ⭐ WORDS đợt 3 — THANH ĐẦU ĐỨNG TRÊN MỌI THỨ TRONG RUỘT TRANG (thầy chốt).
   Trước đây `.top` và `.td-pop` CÙNG z-index 30; cùng số thì cái nào đứng sau
   trong file HTML thắng ⇒ bảng từ điển leo lên che mất avatar, ô hạn, tên bài
   mỗi khi cuộn xuống.

   ⛔ BẢNG THỨ TỰ LỚP — sửa cái nào thì nhìn cả bảng, đừng đặt số bừa:
      3  các hạt bay của hiệu ứng READY (trong khung act)
     24  bảng TỪ ĐIỂN (phủ khung leaderboard)
     35  THANH ĐẦU  ← trên mọi thứ trong ruột trang
     36  pop-up "về trang lớp?" (con của thanh đầu, so trong nội bộ thanh)
     40  tấm mờ của sidebar   · 41  sidebar
     44  nền tối bóng đèn     · 46  khung act + nút đèn đang sáng · 47  nhãn
     50  bảng xem thử (chỉ bản mẫu) · 60  toast
   ⇒ Thanh đầu **cố ý ĐỨNG DƯỚI** sidebar và nền tối bóng đèn: hai thứ đó vốn
   phải phủ kín cả màn hình mới đúng thiết kế đã duyệt. */
.top{position:sticky; top:0; z-index:35; background:rgba(247,250,249,.86);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
/* ⛔ .wrap mà tự đặt padding là mất lề ngang 20px — phải viết lại ở đây. */
.top-in{display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:12px; padding:9px 20px}
.cum-trai{display:flex; align-items:center; gap:13px; min-width:0}
.av{flex:none; display:grid; place-items:center; border-radius:50%;
  font-weight:800; color:#fff; user-select:none}
.av.me{width:52px; height:52px; font-size:19px; cursor:pointer;
  background:linear-gradient(135deg,#0E7C6E,#16A08E); box-shadow:var(--shadow);
  position:relative; transition:transform .18s var(--em), box-shadow .18s}
.av.me:hover{transform:scale(1.06); box-shadow:0 0 0 4px var(--accent-soft), var(--shadow)}
/* ⭐ ĐỢT 4 — SỐ SAO nằm ngay trên avatar, thay cho phù hiệu 3 vạch cũ. Nút sao
   riêng đã bỏ hẳn; mọi thứ của ví sao dồn vào menu mở từ avatar.
   Tối đa 3 chữ số (350) nên ô rộng cố định cho khỏi nhảy. */
/* ⭐ ĐỢT 9 — số sao về GIỮA ĐÁY quả bóng avatar, BỎ HẲN nền nút: chỉ còn số +
   ngôi sao, kèm mấy sparkle nhỏ lấp lánh liên tục xung quanh. Viền chữ trắng
   (text-shadow 4 hướng) để số vàng không chìm vào nền xanh của avatar. */
/* ⭐ ĐỢT 11 — thầy chốt: gom [số + ngôi sao] vào MỘT NÚT NỀN TRẮNG rồi đặt cả
   nút ấy vào đúng giữa đáy quả bóng. (Đợt 10 để con số căn tâm còn ngôi sao
   treo ra ngoài — cả khối lệch phải, thầy thấy khó chịu.) Có nền trắng rồi thì
   bỏ luôn viền chữ 4 hướng, chỉ cần một bóng mảnh cho nút tách khỏi nền xanh. */
.sao-hieu{position:absolute; left:50%; bottom:-2px; transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:1.5px;
  padding:0 3.5px; border-radius:99px; background:#fff;
  box-shadow:0 1px 3px rgba(22,35,42,.20);
  font-size:9.5px; font-weight:800; white-space:nowrap; line-height:1.45;
  color:#E5A20D; letter-spacing:.1px; font-variant-numeric:tabular-nums}
/* ⛔ `:not(.lap)` — ba sparkle cũng là <svg> con trực tiếp của cụm này, không
   loại chúng ra thì chúng ăn luôn cỡ của ngôi sao chính. */
.sao-hieu > svg:not(.lap){width:9.5px; height:9.5px; fill:#F3B21B; flex:none}
/* Sparkle quanh cụm số: 3 sao tí hon nhấp nháy lệch pha, chạy mãi. */
.sao-hieu .lap{position:absolute; fill:#F7CE63; animation:lap-lanh 2.2s ease-in-out infinite}
.sao-hieu .lap.l1{width:7px; height:7px; left:-10px; top:-4px; animation-delay:0s}
.sao-hieu .lap.l2{width:6px; height:6px; right:-9px; top:6px; animation-delay:.7s}
.sao-hieu .lap.l3{width:5px; height:5px; left:6px; top:-9px; animation-delay:1.4s}
@media (prefers-reduced-motion: reduce){ .sao-hieu .lap{animation:none; opacity:.7} }
.who{min-width:0}
.who .ten{font-weight:800; font-size:18px; line-height:1.25; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who .ten .nick{color:var(--muted); font-weight:600}
.who .lop{font-size:12.5px; color:var(--muted); font-weight:600}

/* ---------- KHỐI GIỮA: [◀ tam giác] + [Ô HẠN] LIỀN THÀNH MỘT KHỐI ----------
   ⭐ ĐỢT 5 — thầy chốt: nút về lớp là một TAM GIÁC LỚN gắn liền sát ô hạn,
   giống hệt mũi tên gắn vào cạnh phải của thẻ bài tập bên trang chính: một
   đầu tam giác (bên trái), đầu kia vuông bo cong (bên phải).
   ⛔ Bóng đổ phải đặt ở lớp BỌC NGOÀI (`filter:drop-shadow`), không đặt cùng
   chỗ với `clip-path` — y như cặp `.the` / `.the-in` bên v19: bóng thì bám
   theo hình đã cắt, còn viền 1px thì bị cắt mất nên bỏ hẳn, dùng bóng thay. */
.giua{position:relative; display:flex; align-items:center}
.han-boc{filter:drop-shadow(0 1px 2px rgba(22,35,42,.10))
                drop-shadow(0 6px 16px rgba(22,35,42,.10))}
.han-khoi{--mui:26px; display:flex; align-items:stretch;
  border-radius:0 13px 13px 0;
  clip-path:polygon(0 50%, var(--mui) 0, 100% 0, 100% 100%, var(--mui) 100%)}
.nut-ve{flex:none; width:calc(var(--mui) + 15px); display:grid; place-items:center;
  background:linear-gradient(135deg,#0E9E85,#22C3A4);
  transition:filter .16s}
.nut-ve:hover{filter:brightness(1.07)}
.nut-ve svg{width:15px; height:15px; fill:#fff; margin-left:12px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
/* Hỏi lại trước khi rời trang — khung nhỏ thả xuống ngay dưới nút. */
.hoi-ve{position:absolute; left:-6px; top:calc(100% + 11px); z-index:36; width:212px;
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 12px 32px rgba(22,35,42,.17); padding:12px 13px 11px;
  opacity:0; transform:translateY(-7px); pointer-events:none;
  transition:opacity .2s, transform .2s var(--em)}
.hoi-ve.mo{opacity:1; transform:none; pointer-events:auto}
.hoi-ve::before{content:""; position:absolute; left:14px; top:-6px; width:11px; height:11px;
  background:var(--surface); border-left:1px solid var(--line);
  border-top:1px solid var(--line); transform:rotate(45deg)}
.hoi-ve p{margin:0 0 10px; font-size:12.5px; font-weight:700; line-height:1.35}
.hoi-ve .hang{display:flex; gap:7px}
.hoi-ve button{flex:1; padding:7px 0; border-radius:9px; font-size:11.5px;
  font-weight:800; border:1px solid var(--line); background:var(--ground);
  color:var(--muted); transition:filter .14s}
.hoi-ve button:hover{filter:brightness(.96)}
.hoi-ve button.chinh{background:var(--accent); border-color:var(--accent); color:#fff}

/* Ô HẠN — chép ĐÚNG thiết kế ô hạn trên thẻ bài tập ở trang chính v19:
   hai tầng ngăn bằng vạch đứt, dòng trên là hạn, dòng dưới là đồng hồ chạy
   thật, màu đổi theo thời gian còn lại. */
/* Đệm trên/dưới bằng nhau để cụm chữ nằm cân giữa ô (đo: hở trên 6,5px, hở
   dưới 6,5px ở cả bốn trạng thái). */
.t-han{flex:none; display:flex; flex-direction:column; justify-content:center;
  gap:3px; width:162px; padding:6px 13px; background:var(--amber-soft)}
.t-han .han-dong{display:flex; align-items:center; justify-content:center; gap:5px;
  font-size:11.5px; font-weight:700; color:#9A6A12; white-space:nowrap}
.t-han .han-dong svg{width:12px; height:12px; stroke:currentColor; stroke-width:2.4;
  fill:none; stroke-linecap:round; stroke-linejoin:round}
.t-han .han-vach{height:0; border-top:1px dashed #EBD3A6}
/* ⭐ ĐỢT 7 — `line-height` ĐỂ BẰNG PX chứ không phải bội số: dòng HẾT HẠN có
   cỡ chữ nhỏ hơn (13,5px), nếu line-height là 1.15 thì ô hạn tụt mất 4px so
   với các trạng thái khác. Để 19,5px cố định thì hộp dòng luôn cao y nhau,
   chữ tự nằm giữa hộp ⇒ ô hạn CÙNG MỘT CỠ ở cả bốn trạng thái. */
.dhho{font-size:17px; font-weight:800; text-align:center; line-height:19.5px;
  letter-spacing:.6px; font-variant-numeric:tabular-nums; white-space:nowrap}
.dhho.xanh{color:var(--m-la)} .dhho.cam{color:#DE7A12} .dhho.do{color:#D93B40}
.dhho.het{font-size:13.5px; letter-spacing:.9px; color:#93A5A1}
.t-han.gap-gio{background:#FDECEC}
.t-han.gap-gio .han-dong{color:#B03A3E}
.t-han.gap-gio .han-vach{border-color:#F3CACA}
.t-han.het-gio{background:var(--ground)}
.t-han.het-gio .han-dong{color:#93A5A1}

/* ---------- KHỐI PHẢI: tên bài + mã lesson (căn phải) ---------- */
.dau-bai{min-width:0; text-align:right}
/* ⭐ ĐỢT 5 — cỡ chữ đúng bằng cụm tên học sinh / lớp bên trái (18px và
   12,5px) để hai đầu dải cân nhau. */
.dau-bai .db-ten{font-weight:800; font-size:18px; line-height:1.25;
  letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dau-bai .db-ma{font:600 12.5px/1.3 var(--mono); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- CỘT NỘI DUNG ---------- */
.main{padding:16px 0 34px}

/* ---------- BA PHẦN CỦA BÀI ---------- */
.cac-phan{display:flex; flex-direction:column; gap:18px; padding:18px 0 0}
/* position:relative để pop-up TỪ ĐIỂN neo được vào thẻ (đợt 8). Không đặt
   z-index ở đây kẻo thành stacking context — hỏng bóng đèn (bẫy 33). */
.card{position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:18px; box-shadow:var(--shadow); padding:16px 18px 18px}

/* Đầu thẻ (⭐ đợt 5): số · [tên act / mã lesson xuống dòng] · 2 nút icon.
   Ô số `align-self:stretch` nên cao ĐÚNG BẰNG cụm hai dòng chữ — không gõ tay
   con số nào, đổi cỡ chữ là ô số tự theo. */
.card-head{display:flex; align-items:center; gap:11px; margin-bottom:12px}
.step{flex:none; align-self:stretch; width:32px; border-radius:10px;
  background:var(--accent-soft); color:var(--accent); display:grid; place-items:center;
  font-weight:800; font-size:14px}
.ch-chu{min-width:0; flex:1}
.card-head h2{margin:0; font-weight:800; font-size:15.5px; line-height:1.3;
  letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ch-ma{font:600 12.5px/1.3 var(--mono); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card-nut{margin-left:auto; flex:none; display:flex; gap:7px}
/* ⭐ WORDS đợt 1 — thẻ có nút từ điển: cụm [đèn · tab mới · A-DICTIONARY] rộng
   ĐÚNG BẰNG cột leaderboard, nút chữ nở ra ăn hết chỗ còn lại (34+34+7+7 = 82
   ⇒ nút chữ 162px). */
.card-nut.co-td{width:var(--lb-rong)}
.card-nut.co-td .nut-tudien{flex:1; justify-content:center}
.ic-nut{width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  background:var(--ground); border:1px solid var(--line); color:var(--accent);
  transition:background .15s, border-color .15s, color .15s, transform .15s}
.ic-nut:hover{border-color:var(--accent); transform:translateY(-1px)}
.ic-nut svg{width:16px; height:16px; stroke:currentColor; stroke-width:2; fill:none;
  stroke-linecap:round; stroke-linejoin:round}

/* Ruột thẻ: dạng rộng là HAI CỘT — khung act ‖ leaderboard của chính act đó.
   `align-items:stretch` để leaderboard cao ĐÚNG BẰNG khung act (thầy chốt). */
.than{display:grid; grid-template-columns:minmax(0,1fr) var(--lb-rong); gap:16px;
  align-items:stretch}
/* Thẻ BÀI NGHE: không có bảng xếp hạng nên chỉ MỘT cột (chép từ mẫu DICTS). */
.than.mot{grid-template-columns:minmax(0,1fr)}

/* ⭐ 16:10,5 cho khớp khung act bên AWord — sai tỉ lệ là game bị thanh cuộn. */
/* ⛔ KHÔNG viền 1px thật ở đây: viền ăn vào lòng ô (box-sizing:border-box) nên
   khung game bên trong sẽ cao hơn lòng ô 0,7px — đủ để sinh thanh cuộn.
   ⭐ ĐỢT 6 — thầy cần đường bao mảnh (nền act cũng trắng, lẫn vào trang) +
   bóng nhẹ cho khung nổi lên: dùng BOX-SHADOW — vòng 1px giả viền + quầng mờ
   — vì box-shadow KHÔNG chiếm chỗ, lòng ô giữ nguyên phép tính, vẫn khớp
   tuyệt đối với khung game. */
/* ⭐ container đặt ở .game (không phải ở bìa): nhờ vậy chính ĐỆM của bìa cũng
   dùng được cqw — đặt container ngay trên bìa thì cqw của đệm đi hỏi cha
   (bẫy 30), còn chữ BÊN TRONG bìa thì hỏi .game, cùng một bề ngang. */
.game{position:relative; border-radius:14px; overflow:hidden;
  container-type:inline-size;
  /* ⭐⭐ TỈ LỆ KHUNG ACT — ĐỔI THÌ ĐỔI ĐÚNG MỘT CHỖ NÀY. 10.5/16 = 65.625%.
     ⛔⛔ VÌ SAO KHÔNG DÙNG `aspect-ratio` NỮA (sửa 26/08/2026, thầy báo từ
     iPhone 11 Pro Max): `aspect-ratio` ĐỨNG CHUNG MỘT HỘP với
     `container-type:inline-size` thì SAFARI/iOS tính ra CHIỀU CAO 0 — khung
     game và bìa READY biến mất SẠCH, chỉ còn leaderboard. Chromium không dính
     nên bàn thử trên máy nhìn vẫn đẹp (đo ở 414px: 388×255, y như thường).
     Đệm-phần-trăm là lối cũ có trước `aspect-ratio` cả chục năm, KHÔNG dính
     gì tới containment, chạy đúng ở mọi trình duyệt.
     ⛔ Đừng thêm lại `aspect-ratio` "cho chắc": hai nguồn quy định chiều cao
     là có ngày lệch nhau, mà lệch tí là game sinh thanh cuộn. */
  --ti-le:65.625%;
  background:var(--accent-soft);
  box-shadow:0 0 0 1px var(--line), 0 2px 6px rgba(22,35,42,.05),
             0 7px 20px rgba(22,35,42,.06);
  transition:transform .44s var(--em)}   /* ⛔ để ở đây, không để trong .sang —
     đặt trong .sang thì lúc tắt đèn class mất luôn, khung giật về chỗ cũ */
/* Hộp giữ chỗ theo tỉ lệ. `content` rỗng + `display:block` là đủ; nó nằm
   TRONG LUỒNG nên chính nó quyết chiều cao của `.game`. */
.game::before{content:''; display:block; padding-top:var(--ti-le)}
.game iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block}
/* ---------- BÌA READY (đợt 5 · làm lại đợt 6 · ⭐ THU NHỎ Ở ĐỢT 7) ----------
   Bố cục vẫn theo màn START của AWord (brand ghim trên cùng · cụm giữa
   `margin:auto 0` · nút đứng trong một ô cao cố định nên các dòng trên/dưới
   không nhảy chỗ), nhưng ĐỢT 7 thầy cho **thu nhỏ toàn bộ** và nút READY đổi
   từ viên thuốc sang **vuông bo góc** — bo đúng bằng góc khung act (1.6cqw ≈
   14px ở khung 882px).
   ⚠️ Vì thu nhỏ nên bìa KHÔNG còn trùng khít cỡ chữ màn START của AWord nữa
   (chỉ còn trùng THỨ TỰ và vị trí tương đối). Muốn khít lại thì phải thu nhỏ
   cả bên AWord — chưa làm, chờ thầy quyết. */
/* ⛔ SÀN CỠ CHỮ `max(<px>, <cqw>)`: khung act ở điện thoại chỉ rộng ~339px nên
   chữ tính thuần theo cqw tụt xuống 4–11px, đọc không nổi. Có sàn thì máy tính
   vẫn co giãn theo khung, còn máy nhỏ dừng ở cỡ đọc được. */
.game-cover{position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; cursor:pointer;
  background:var(--surface); text-align:center;
  padding:max(10px, 2cqw)}
/* ⭐ ĐỢT 10 — chữ ANDREW CLASSES ĐỨNG SẴN NGOÀI MÉP TRÊN: `.game` có
   overflow:hidden nên nó bị cắt gọn, mở trang KHÔNG nhìn thấy. Nó chỉ hiện ra
   lúc bấm READY — lao thẳng từ trên xuống.
   ⭐ ĐỢT 11 — cho hẳn RA KHỎI LUỒNG (`position:absolute`): trước nó vẫn chiếm
   một dòng ở đầu bìa dù không ai thấy, đẩy cụm [tên act · READY · tên em] tụt
   xuống dưới tâm khung đúng bằng chiều cao nó (đo được 19px). Nay bỏ chỗ đó đi
   thì cụm giữa nằm ĐÚNG TÂM khung act.
   ⛔ Vì ghim bằng `left:50%` nên MỌI transform về sau (kể cả JS ghi từng khung
   hình) đều phải mở đầu bằng `translate(-50%,0)`, không thì chữ lệch sang phải
   nửa bề ngang của chính nó. */
.bia-th{position:absolute; top:max(10px, 2cqw); left:50%;
  font-weight:700; font-size:max(8.5px, 1.35cqw);
  letter-spacing:.3cqw; color:#8b93a1; text-transform:uppercase; will-change:transform;
  transform:translate(-50%,0) translateY(calc(-100% - 9cqw))}
/* ⭐ ĐỢT 8 — bỏ dòng template (đã có trên đầu leaderboard) và bỏ ô nút cao cố
   định: cụm giữa chỉ còn [tên act · READY · tên em], khe ĐỀU NHAU quanh nút
   (thầy: hai dòng chữ đang sát nút quá). */
.bia-giua{margin:auto 0; display:flex; flex-direction:column; align-items:center;
  gap:max(20px, 3.4cqw); text-align:center; width:100%}
/* ⭐ ĐỢT 9 — thầy muốn hai dòng chữ CÁCH XA NÚT HƠN NỮA: cộng thêm lề riêng
   ngoài khe chung (tổng khoảng cách tới nút giờ ≈ gấp đôi đợt 8).
   ⭐ ĐỢT 10 — nới thêm một nấc nữa: tên act NHÍCH LÊN, tên em TỤT XUỐNG
   (cụm giữa căn giữa nên chỉ cần tăng đều hai lề là hai dòng dạt ra hai phía). */
.bia-ten{margin-bottom:max(26px, 4.6cqw)}
.bia-em{margin-top:max(26px, 4.6cqw)}
/* ⭐ ĐỢT 10 — tên act nhỏ bớt một chút (3.4 → 3.0cqw, sàn 17 → 15px).
   ⭐ v1.14.0 — nhỏ thêm một nấc nữa (3.0 → 2.5cqw, sàn 15 → 13px) vì chữ trên
   bìa nay là cụm ba phần "LSA2-S2.T1.P3-4-5 • VI2 • ANAGRAM" chứ không còn là
   "WORD PRACTICE 1" ngắn ngủn — xem `chuBia()`. */
.bia-ten{font-weight:800; font-size:max(13px, 2.5cqw); line-height:1.3; letter-spacing:0;
  color:var(--ink); text-transform:uppercase; max-width:90%}
.bia-o-nut{display:flex; align-items:center; justify-content:center}
.bia-ready{padding:max(9px, 1.5cqw) max(26px, 4.4cqw); border-radius:max(10px, 1.6cqw);
  background:#35B1F0; color:#fff; font-weight:800; font-size:max(13px, 2.2cqw);
  letter-spacing:.14em; box-shadow:0 .5cqw 1.5cqw rgba(53,177,240,.35);
  transition:transform .12s ease, filter .15s ease}
.game-cover:hover .bia-ready{transform:scale(1.06); filter:brightness(1.1)}
.game-cover:active .bia-ready{transform:scale(.96)}
.bia-mau{font-weight:800; font-size:max(12px, 2.15cqw); letter-spacing:.14cqw;
  color:var(--ink); text-transform:uppercase}
.bia-em{font-weight:700; font-size:max(10px, 1.6cqw); letter-spacing:.2cqw; color:#7f93a5;
  text-transform:uppercase}

/* ---------- HIỆU ỨNG NẠP ACT (đợt 6 · ⭐ LÀM LẠI ĐỢT 7: VA CHẠM VẬT LÝ) -----
   Thầy chốt ở đợt 7:
    · Bấm READY là chạy NGAY, không chờ một nhịp nào.
    · Chữ ANDREW CLASSES rung NGAY TỪ ĐẦU và bay LIỀN MỘT MẠCH ra giữa; chỉ
      khựng lại đúng lúc bị một thành phần đâm vào (giật lùi rồi bay tiếp).
    · Mỗi thành phần bay THẲNG VÀO chữ, VA CHẠM: nó nảy ngược lại một chút rồi
      mới bị nuốt; chỗ va bung ra tia sáng + sao nhỏ màu vàng.
    · Tới cỡ lớn nhất thì chữ vừa rung vừa bắn sao/tia ra khắp xung quanh, chờ
      act tải xong mới nổ.
   ⛔ Toàn bộ chuyển động do JS chạy trong MỘT vòng requestAnimationFrame —
   không dùng CSS transition cho việc bay, vì lực đẩy khi va chạm phải cộng
   vào vận tốc GIỮA CHỪNG, thứ mà transition không làm được. */
.game-cover.dang-nap{cursor:default}
.game-cover.dang-nap .bia-th,
.game-cover.dang-nap .bia-ten,
.game-cover.dang-nap .bia-o-nut,
.game-cover.dang-nap .bia-em{will-change:transform}
/* Phần tử NỔ ngay tại chỗ va (đợt 8): phồng lên + tan trong 0,15s — phải
   NHANH kẻo chữ ANDREW CLASSES bay tiếp qua mất chỗ nổ. */
.no-phan-tu{animation:no-nhanh .15s ease-out forwards !important}
@keyframes no-nhanh{
  from{opacity:1; filter:brightness(1)}
  to  {opacity:0; filter:brightness(1.6)}
}
.bia-th.no{opacity:0; transition:opacity .1s}

/* Hạt: tia sáng tròn + ngôi sao nhỏ, cùng một kiểu bay toả. */
.tia,.sao-nho{position:absolute; pointer-events:none; z-index:3}
.tia{width:1cqw; height:1cqw; margin:-.5cqw 0 0 -.5cqw; border-radius:50%;
  background:#F7C43C; box-shadow:0 0 .8cqw rgba(247,196,60,.9);
  animation:hat-toa .6s cubic-bezier(.12,.7,.35,1) forwards}
.sao-nho{width:1.7cqw; height:1.7cqw; margin:-.85cqw 0 0 -.85cqw;
  animation:sao-toa .78s cubic-bezier(.12,.7,.35,1) forwards}
.sao-nho svg{width:100%; height:100%; fill:#F3B21B;
  filter:drop-shadow(0 0 .5cqw rgba(243,178,27,.75))}
@keyframes hat-toa{
  from{transform:translate(0,0) scale(1); opacity:1}
  to  {transform:translate(var(--dx), var(--dy)) scale(.2); opacity:0}
}
@keyframes sao-toa{
  from{transform:translate(0,0) scale(.45) rotate(0deg); opacity:1}
  to  {transform:translate(var(--dx), var(--dy)) scale(1.15) rotate(150deg); opacity:0}
}

.hat-bui{position:absolute; width:.9cqw; height:.9cqw;
  border-radius:50%; background:#8b93a1; pointer-events:none;
  animation:bui-bay .75s cubic-bezier(.15,.6,.4,1) forwards}
@keyframes bui-bay{
  from{transform:translate(0,0) scale(1); opacity:1}
  to  {transform:translate(var(--bux), var(--buy)) scale(.25); opacity:0}
}
/* ⭐ ĐỢT 11 — nổ xong: PHAI CẢ TẤM BÌA thật nhanh (0,18s) cho màn START hiện ra
   ngay. (Đợt 10 loang tròn từ tâm 1,15s — thầy thấy chậm quá, đã bỏ hẳn.) */
.game-cover.tan{opacity:0; pointer-events:none; transition:opacity .18s linear}
/* ⭐ ĐỢT 10 — LỚP HẠT NỔ nằm NGOÀI tấm bìa (con của `.game`, đứng sau bìa nên
   nổi lên trên). Phải tách ra vì tấm bìa sẽ bị xoá đi ngay sau cú nổ — để hạt
   bên trong thì chúng tan biến theo, chưa kịp bung ra. */
.no-lop{position:absolute; inset:0; pointer-events:none}
@media (prefers-reduced-motion: reduce){
  .tia,.sao-nho,.hat-bui{animation-duration:.01s}
}

/* ---------- BÓNG ĐÈN: tối nền, khung act BAY RA GIỮA MÀN HÌNH ----------
   ⭐ ĐỢT 4 — bấm bóng đèn thì ngoài việc tối nền, khung act còn to thêm 30%
   và bay vào chính giữa màn hình (điện thoại thì phóng đầy màn), phía trên
   hiện tên phần + mã lesson vì lúc đó đầu thẻ đã chìm trong bóng tối.
   ⛔ Dùng `transform` chứ đừng đổi width/height: đổi kích cỡ thật là bắt cả
   khung game bên trong bày lại giữa chừng, chạy giật. Trình duyệt vẽ lại nét
   sau khi chạy xong nên chữ trong game vẫn sắc. */
.nen-toi{position:fixed; inset:0; z-index:44; background:rgba(8,18,16,.74);
  backdrop-filter:blur(14px); opacity:0; pointer-events:none; transition:opacity .3s var(--em)}
body.co-den .nen-toi{opacity:1; pointer-events:auto}
body.co-den{overflow:hidden}          /* khoá cuộn cho khung khỏi trôi */
.game.sang{z-index:46;
  box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 30px 80px rgba(0,0,0,.55)}
.ic-nut.sang{position:relative; z-index:46; background:var(--accent); color:#fff;
  border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,255,255,.35)}
/* Tên phần + mã lesson nổi trên nền tối, ngay phía trên khung act. */
.den-nhan{position:fixed; left:0; right:0; z-index:47; text-align:center;
  pointer-events:none; opacity:0; transform:translateY(6px);
  transition:opacity .3s var(--em), transform .3s var(--em)}
.den-nhan.hien{opacity:1; transform:none}
/* ⭐ ĐIỆN THOẠI — không phóng to theo tỉ lệ mà cho khung act chiếm TRỌN màn:
   act ngang 16:10,5 mà màn dọc, phóng hết bề ngang thì cao có 236px, thừa hơn
   nửa màn hình. Đổi hẳn kích cỡ khung, game bên AWord tự bày lại theo khung. */
.game.sang.toan-man{position:fixed; left:6px; right:6px; top:58px; bottom:6px;
  width:auto; height:auto; border-radius:12px;
  /* ⛔ Toàn màn thì chiều cao do `top/bottom` quyết ⇒ phải TẮT đệm tỉ lệ,
     không thì nó cộng thêm một cục vào giữa khung. `aspect-ratio:auto` cũ bỏ
     đi cùng lúc với `aspect-ratio` ở `.game` (không còn gì để huỷ). */
  --ti-le:0;
  animation:no-ra .34s var(--em)}
@keyframes no-ra{from{transform:scale(.93); opacity:.55} to{transform:none; opacity:1}}
.den-nhan b{display:block; color:#fff; font-weight:800; font-size:16px;
  letter-spacing:.06em}
.den-nhan span{display:block; margin-top:2px; font:600 12.5px/1.3 var(--mono);
  color:#9FD8CE; letter-spacing:.01em}

/* ---------- LEADERBOARD ----------
   Chiều cao = chiều cao khung act. Số em đổi theo lớp (16->20) nên chiều cao
   dòng + cỡ chữ do JS ĐO rồi đặt vào biến, KHÔNG gõ tay.
   ⭐ ĐỢT 4 — bảng HẸP lại: chỉ vừa tên viết tắt + điểm + thời gian, chừa một
   chút khoảng trống cho thoáng (trước rộng 420px, thừa gần một nửa). */
/* ⛔ BẪY (y hệt khung chat ở trang chính v19): để `.lb` làm ô lưới THẲNG thì
   chiều cao hàng lấy theo KHỐI CAO NHẤT — lớp 20 em là bảng đẩy cả hàng cao
   hơn khung act, `min-height:0` KHÔNG cứu được vì hàng lưới cỡ `auto`.
   Cách chạy được: ô lưới là `.lb-cot` (chỗ giữ chỗ, không có nội dung trong
   dòng nên không góp chiều cao), bảng nằm TUYỆT ĐỐI bên trong. */
.lb-cot{position:relative; min-height:0}
.lb{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0;
  border:1px solid var(--line); border-radius:14px; background:#FBFDFC;
  padding:9px 10px 10px}
.lb-head{position:relative; display:flex; align-items:center; justify-content:center;
  margin-bottom:7px; min-height:24px}
.lb-head h3{margin:0; font-weight:800; font-size:11px; letter-spacing:.22em;
  color:var(--muted); transition:color .25s}
/* Lúc đang tải: đổi thành ANDREW CLASSES, từng chữ nhấc lên rồi hạ xuống. */
.lb-head h3.dang-tai{color:var(--accent)}
.lb-head h3 i{display:inline-block; font-style:normal;
  animation:nhac-chu 1.5s var(--em) infinite}
@keyframes nhac-chu{0%,58%,100%{transform:translateY(0)} 29%{transform:translateY(-5px)}}
.lb-head .lam-moi{position:absolute; right:0; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border-radius:8px; background:var(--accent-soft);
  color:var(--accent); display:grid; place-items:center; transition:filter .12s}
.lb-head .lam-moi:hover{filter:brightness(.95)}
.lb-head .lam-moi.quay{animation:xoay-moi 1s linear infinite}
@keyframes xoay-moi{
  from{transform:translateY(-50%) rotate(0deg)}
  to  {transform:translateY(-50%) rotate(360deg)}
}
.lb-head .lam-moi svg{width:14px; height:14px; stroke:currentColor; stroke-width:2.2;
  fill:none; stroke-linecap:round; stroke-linejoin:round}

.lb-ds{flex:1; min-height:0; display:grid; grid-auto-flow:row; gap:var(--lb-khe)}
/* Bốn cột CỐ ĐỊNH: hạng · tên · điểm · thời gian. Điểm và thời gian căn MÉP
   PHẢI trong cột của mình nên hàng nào cũng thẳng cột với nhau. */
.lb-row{display:grid;
  grid-template-columns:calc(var(--lb-cao) - 2px) minmax(0,1fr) 3.6ch 4.8ch;
  gap:6px; align-items:center; padding:0 6px; border-radius:7px;
  height:var(--lb-cao); font-weight:700; font-size:var(--lb-chu); line-height:1}
.lb-row:nth-child(even){background:#F3F8F6}
.lb-row.me{background:var(--accent-soft)}
.lb-rank{font-weight:800; font-size:calc(var(--lb-chu) - 1.5px); color:#9AACA8;
  text-align:center; font-variant-numeric:tabular-nums}
.lb-rank .huy{display:block; width:calc(var(--lb-cao) - 5px);
  height:calc(var(--lb-cao) - 5px); margin:0 auto}
/* ⭐ Tên LUÔN in đậm, và luôn ở dạng VIẾT TẮT (cùng lối app myTeam). */
.lb-name{font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-score{font-weight:800; color:var(--accent); text-align:right;
  font-variant-numeric:tabular-nums}
.lb-time{color:#93A5A1; text-align:right; font-size:calc(var(--lb-chu) - 1px);
  font-variant-numeric:tabular-nums}

/* MÀU TÊN — bốn mức thầy chốt ở đợt 4:
   huy chương (full điểm, hạng 1-2-3) vàng + hào quang nháy · full điểm ngoài
   top 3 xanh lá · có điểm chưa full đen · chưa làm bài nào đỏ (và nháy hào
   quang đỏ khi còn dưới 6 tiếng, cùng nhịp 3,4s với thẻ gấp ở trang chính). */
.lb-row.hc   .lb-name{color:#D79B0C; animation:hao-quang-ten 2.4s ease-in-out infinite}
.lb-row.du   .lb-name{color:var(--m-la)}
.lb-row.co   .lb-name{color:var(--ink)}
.lb-row.chua .lb-name{color:#D93B40}
.lb-row.chua .lb-score,.lb-row.chua .lb-time{color:#C9A3A4}
body.gio-gap .lb-row.chua .lb-name{animation:nhay-ten-do 3.4s ease-in-out infinite}
/* ⭐ ĐỢT 5 — hào quang TOẢ RA XUNG QUANH chứ không phải viền quanh nét chữ:
   bóng bán kính NHỎ + đậm thì mắt đọc ra là viền; muốn thành quầng sáng thì
   phải nhiều lớp bán kính LỚN dần và nhạt dần, lớp trong cùng cũng đã 8px. */
@keyframes hao-quang-ten{
  0%,100%{text-shadow:0 0 8px rgba(243,178,27,.30), 0 0 18px rgba(243,178,27,.14)}
  50%    {text-shadow:0 0 10px rgba(247,196,60,.75), 0 0 22px rgba(243,178,27,.50),
                      0 0 36px rgba(243,178,27,.28)}
}
@keyframes nhay-ten-do{
  0%,100%{text-shadow:0 0 8px rgba(217,59,64,.26), 0 0 18px rgba(217,59,64,.12)}
  50%    {text-shadow:0 0 10px rgba(224,87,91,.72), 0 0 22px rgba(217,59,64,.46),
                      0 0 36px rgba(217,59,64,.26)}
}
/* ⭐ ĐỢT 6 — trong mốc 6 tiếng, em NÀO CHƯA FULL cũng đỏ + nháy (không riêng
   em chưa làm): hàng `co` (có điểm nhưng dưới 100) đổi màu theo. */
body.gio-gap .lb-row.co .lb-name{color:#D93B40;
  animation:nhay-ten-do 3.4s ease-in-out infinite}

/* Ô HẠN trên thanh đầu toả hào quang đỏ khi còn dưới 6 tiếng MÀ lớp vẫn còn
   người chưa full ở bất cứ bảng nào (JS gắn `lop-thieu` lên <body>). Nhịp
   3,4s — đúng nhịp thẻ gấp bên trang chính. Bóng đặt ở lớp bọc `.han-boc`
   (bẫy 32: filter không sống chung với clip-path). */
body.gio-gap.lop-thieu .han-boc{animation:hao-quang-han 3.4s ease-in-out infinite}
@keyframes hao-quang-han{
  0%,100%{filter:drop-shadow(0 1px 2px rgba(224,87,91,.28))
                 drop-shadow(0 0 6px rgba(224,87,91,.35))}
  50%    {filter:drop-shadow(0 1px 2px rgba(224,87,91,.4))
                 drop-shadow(0 0 18px rgba(224,87,91,.8))}
}

/* Cả THẺ (khung act + tiêu đề + bảng) còn người chưa full thì toả hào quang
   đỏ ra nền trang. ⛔ Dùng BOX-SHADOW chứ không filter: filter biến thẻ thành
   stacking context ⇒ khung act bật đèn (z-index 46) bị nhốt lại DƯỚI tấm nền
   tối z-index 44, bóng đèn hỏng ngay. */
/* ⭐ ĐỢT 8 — còn 6-24 TIẾNG: thẻ chưa full toả hào quang VÀNG tĩnh, y màu thẻ
   `gio-vang` bên trang chính (chỉ mốc dưới 6 tiếng mới đỏ + nháy). */
body.gio-vang .card.con-thieu{
  box-shadow:0 1px 3px rgba(22,35,42,.07), 0 2px 5px rgba(224,180,17,.22),
             0 0 18px rgba(224,180,17,.40)}
/* ⭐ ĐỢT 10 — HẾT HẠN rồi thì act nào chưa full điểm cũng đỏ y như mốc 6 tiếng
   (thầy chốt): hết giờ mà còn thiếu là chuyện đáng báo động hơn, không có lý
   gì hào quang lại tắt đi. */
body.gio-gap .card.con-thieu,
body.gio-het .card.con-thieu{animation:hao-quang-the 3.4s ease-in-out infinite}
@keyframes hao-quang-the{
  0%,100%{box-shadow:0 1px 3px rgba(22,35,42,.07), 0 0 8px rgba(224,87,91,.30)}
  50%    {box-shadow:0 1px 3px rgba(22,35,42,.07), 0 0 26px rgba(224,87,91,.60)}
}
@media (prefers-reduced-motion: reduce){
  body.gio-gap.lop-thieu .han-boc,
  body.gio-gap .card.con-thieu,body.gio-het .card.con-thieu{animation:none}
}
/* Làm mới: cả danh sách ẩn đi rồi hiện lại LẦN LƯỢT TỪ TRÊN XUỐNG (độ trễ do
   JS đặt vào `--tre` của từng dòng). */
.lb-row.di {animation:dong-di  .28s var(--em) both; animation-delay:var(--tre,0s)}
.lb-row.den{animation:dong-den .34s var(--em) both; animation-delay:var(--tre,0s)}
@keyframes dong-di {from{opacity:1} to{opacity:0; transform:translateX(-12px)}}
@keyframes dong-den{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){
  .lb-row .lb-name,.lb-head h3 i,.lam-moi.quay{animation:none !important}
  .lb-row.di,.lb-row.den{animation-duration:.01s}
}

/* ---------- TRÌNH PHÁT BÀI NGHE (đợt 8 · ⭐ LÀM LẠI ĐỢT 9 THEO ẢNH MẪU) ----
   Thầy đưa ảnh `TRINH PHAT.png`: MỘT HÀNG duy nhất —
   [▶ TRÒN đậm] · 00:00 · ◀ · [thanh mảnh, nút kéo chấm tròn đặc] · ▶ · 03:45
   · [loa] · | · [1x]. Loa bấm ra thanh âm lượng nhỏ; 1x bấm ra bảng tốc độ.
   NỀN GRADIENT xanh lá đuổi theo tiến độ, mép gradient PHẢI PHAI DẦN (fade
   ~14% bề ngang).
   ⭐ ĐỢT 10 — thầy chốt 2 việc ở đây:
    · BỎ HẲN hai lớp SÓNG (sóng trôi + sóng sánh ở mép), chỉ giữ gradient phai.
    · BỎ `overflow:hidden` — chính nó cắt cụt hai pop-up (âm lượng · tốc độ) vì
      cả hai mở NGƯỢC LÊN TRÊN, vượt ra ngoài lòng khung. Bỏ đi thì pop-up hiện
      trọn vẹn, còn nền gradient vẫn được bo góc tự nhiên theo border-radius. */
.nghe{position:relative; display:flex; align-items:center;
  gap:18px; padding:16px 18px; border-radius:18px; border:1px solid var(--line);
  /* Ba chặng: đậm → phai → nền. Mép mềm, không còn vạch cứng.
     ⭐ ĐỢT 13 — bề rộng đoạn phai tách ra thành biến `--phai` (mặc định 14%):
     ở GIÂY CUỐI, JS bóp nó về 0 để khung được lấp ĐẦY HẲN — còn phai thì nhìn
     như vẫn chưa đầy (thầy bắt được). */
  background:linear-gradient(90deg,
    #B9E3CC 0,
    #B0E0C6 max(0%, calc(var(--tien,0%) - var(--phai,14%))),
    var(--accent-soft) var(--tien,0%),
    var(--accent-soft) 100%)}
.nghe > *{position:relative}

/* Nút phát: TRÒN, xanh đậm, icon trắng (đúng ảnh). */
.ng-play{flex:none; width:52px; height:52px; border-radius:50%; background:var(--accent);
  color:#fff; display:grid; place-items:center; box-shadow:var(--shadow);
  transition:transform .15s var(--em), filter .15s}
.ng-play:hover{transform:scale(1.05); filter:brightness(1.08)}
.ng-play svg{width:21px; height:21px; fill:currentColor}
.ng-play.dung svg{margin-left:2px}

/* Giờ hai bên thanh — chữ mono cho số khỏi nhảy. */
.ng-nay,.ng-tong{flex:none; font-weight:700; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums; user-select:none}
/* ⭐ ĐỢT 11 — đồng hồ TRÁI (và kéo theo nút ◀) dịch sang phải cho xa nút phát:
   trước chúng dính sát nút phát, nhìn lệch hẳn về bên trái. Chỗ này lấy từ
   thanh thời gian nên thanh chỉ ngắn thêm ở PHÍA TRÁI. */
.ng-nay{margin-left:16px}

/* ◀ / ▶ ±5 giây: TAM GIÁC ĐẶC trần trụi như ảnh, không khung.
   ⭐ ĐỢT 10 — TO GẤP ĐÔI (tam giác 15 → 30px, vùng bấm 26 → 48px).
   ⭐ ĐỢT 11 — to thêm một nấc nữa: tam giác 34px, vùng bấm 54px. */
.ng-nhay{flex:none; width:54px; height:54px; display:grid; place-items:center;
  background:transparent; border:0; color:var(--accent);
  transition:transform .12s, filter .15s}
.ng-nhay:hover{filter:brightness(1.2)}
.ng-nhay:active{transform:scale(.88)}
.ng-nhay svg{width:34px; height:34px; fill:currentColor}

/* ⭐ ĐỢT 10 — thanh thời gian NGẮN LẠI ~15% mà vẫn ĐÚNG GIỮA: thêm lề ngang
   ĐỀU HAI BÊN. Chỗ trống nhường ra rơi đúng vào khe giữa thanh với hai nút ±5s
   (cộng thêm `gap` của khung đã nới 12 → 16px) nên đồng hồ và hai nút giãn ra,
   khỏi bấm nhầm. ⛔ Đừng thu bằng `transform:scaleX` — phép tính chỗ bấm/kéo
   theo `getBoundingClientRect` sẽ lệch. */
.ng-thanh{flex:1; min-width:0; margin:0 clamp(10px, 3.4%, 28px);
  position:relative; height:26px; display:flex;
  align-items:center; cursor:pointer; touch-action:none;
  user-select:none; -webkit-user-select:none}
.ng-thanh::before{content:""; position:absolute; left:0; right:0; height:6px;
  border-radius:99px; background:#C8DED7}
.ng-chay{position:relative; height:6px; border-radius:99px; background:var(--accent); width:0}
/* Nút kéo: CHẤM TRÒN ĐẶC màu đậm (đúng ảnh, hết kiểu viền rỗng). */
.ng-num{position:absolute; top:50%; width:15px; height:15px; margin:-7.5px 0 0 -7.5px;
  border-radius:50%; background:var(--accent);
  box-shadow:0 1px 4px rgba(22,35,42,.3); left:0; transition:transform .12s}
.ng-thanh:hover .ng-num{transform:scale(1.15)}

/* Loa: icon trần, bấm ra THANH ÂM LƯỢNG nhỏ thả phía trên. */
.ng-loa-boc{position:relative; flex:none}
.ng-loa{width:30px; height:30px; display:grid; place-items:center; background:transparent;
  border:0; color:var(--accent); transition:transform .12s, filter .15s}
.ng-loa:hover{filter:brightness(1.2)}
.ng-loa:active{transform:scale(.9)}
.ng-loa svg{width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none;
  stroke-linecap:round; stroke-linejoin:round}
/* ⭐ ĐỢT 11 — ÂM LƯỢNG dựng DỌC, đúng cỡ bảng tốc độ (thầy chốt). Hai pop-up
   dùng chung một bộ khung + một bộ hiệu ứng ẩn/hiện (xem `.pop-phat` bên dưới). */
.luong-pop{position:absolute; right:-8px; bottom:calc(100% + 10px); z-index:42;
  width:74px; padding:12px 5px; background:var(--surface);
  border:1px solid var(--line); border-radius:12px;
  box-shadow:0 12px 30px rgba(22,35,42,.18);
  display:flex; justify-content:center}
.ng-lthanh{position:relative; width:18px; height:163px;
  cursor:pointer; touch-action:none; user-select:none}
.ng-lthanh::before{content:""; position:absolute; top:0; bottom:0; left:50%;
  margin-left:-1.5px; width:3px; border-radius:99px; background:#C9DFD8}
.ng-lchay{position:absolute; bottom:0; left:50%; margin-left:-1.5px; width:3px;
  border-radius:99px; background:var(--accent); height:100%}
.ng-lnum{position:absolute; left:50%; width:11px; height:11px; margin:0 0 -5.5px -5.5px;
  border-radius:50%; background:var(--accent); box-shadow:0 1px 3px rgba(22,35,42,.25);
  bottom:100%}

/* Vạch ngăn mảnh trước cụm tốc độ (đúng ảnh). */
.ng-vach{flex:none; width:1px; height:26px; background:#C8DAD5}

/* 1x: chữ trần, bấm ra bảng tốc độ dọc. */
.ng-toc{flex:none; min-width:34px; height:30px; background:transparent; border:0;
  font-weight:800; font-size:14px; color:var(--accent);
  transition:transform .12s, filter .15s}
.ng-toc:hover{filter:brightness(1.2)}
.ng-toc:active{transform:scale(.92)}
.ng-toc.cham{color:#C98A0B}

/* Chữ "+ 5s / − 5s" hiện mờ giữa khung rồi tan (đợt 8, giữ).
   ⭐ ĐỢT 10 — nó nằm ĐẦU khung nên trước đây bị thanh thời gian và mấy nút vẽ
   ĐÈ LÊN, gần như không đọc được. Nay cho hẳn `z-index` để nổi lên TRÊN CÙNG
   (vẫn `pointer-events:none` nên không cản bấm). Hai pop-up thì để cao hơn nữa
   cho khỏi bị chữ này che lúc đang hiện. */
.ng-bao{position:absolute; inset:0; display:grid; place-items:center; z-index:30;
  pointer-events:none; font-weight:800; font-size:34px; letter-spacing:.06em;
  color:var(--ink); opacity:0}
.ng-bao.hien{animation:bao-5s .9s ease forwards}
@keyframes bao-5s{0%{opacity:0} 30%{opacity:.3} 65%{opacity:.3} 100%{opacity:0}}

.ng-toc-boc{position:relative; flex:none; display:flex; align-items:center}
/* Bảng chọn tốc độ: dựng DỌC, mở lên trên nút. */
.toc-menu{position:absolute; right:0; bottom:calc(100% + 8px); z-index:42;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 14px 34px rgba(22,35,42,.18); padding:5px; display:flex;
  flex-direction:column; gap:2px; width:74px}
/* ⭐ ĐỢT 11 — HAI POP-UP ẨN/HIỆN THẬT MƯỢT (thầy chốt): không dùng
   `display:none` nữa (bật tắt phựt một cái, không hiệu ứng nào chạy được) mà
   mờ dần + nhích lên + phóng nhẹ. Lúc ẩn thì `pointer-events:none` nên nó
   không cản bấm, còn `visibility` chờ hết hiệu ứng mới tắt (`.24s`) để không
   cắt ngang lúc đang tan. */
.luong-pop,.toc-menu{opacity:0; visibility:hidden; transform:translateY(8px) scale(.96);
  transform-origin:bottom center; pointer-events:none;
  transition:opacity .2s var(--em), transform .24s var(--em), visibility 0s .24s}
.luong-pop.mo,.toc-menu.mo{opacity:1; visibility:visible; transform:none;
  pointer-events:auto; transition:opacity .2s var(--em), transform .24s var(--em),
  visibility 0s}
@media (prefers-reduced-motion: reduce){
  .luong-pop,.toc-menu{transition-duration:.01s}
}
.toc-menu button{padding:7px 12px; border-radius:8px; font-weight:700; font-size:12.5px;
  color:var(--ink); text-align:center; transition:background .12s}
.toc-menu button:hover{background:var(--ground)}
.toc-menu button.dang{background:var(--accent); color:#fff; font-weight:800}


/* ---------- CSS TU DIEN A-DICTIONARY ----------
   Thầy chốt: từ điển **PHỦ KÍN khung leaderboard** (kể cả tên template và nút
   làm mới), đụng chỗ khác KHÔNG đóng — chỉ nút X mới đóng.
   Vì thế `.td-pop` nay nằm TRONG `.lb-cot` và trải `inset:0`, không còn là
   pop-up thả xuống từ đầu thẻ như hồi ở mẫu DICTS. */
.nut-tudien{height:34px; padding:0 13px; border-radius:10px; display:inline-flex;
  align-items:center; gap:7px; background:var(--ground); border:1px solid var(--line);
  color:var(--accent); font-weight:800; font-size:10.5px; letter-spacing:.12em;
  transition:border-color .15s, transform .15s}
.nut-tudien:hover{border-color:var(--accent); transform:translateY(-1px)}
.nut-tudien svg{width:15px; height:15px; stroke:currentColor; stroke-width:2; fill:none;
  stroke-linecap:round; stroke-linejoin:round}
/* Nút nhỏ CHỈ CÓ Ở DẠNG HẸP: nằm trong đầu bảng, góc trên bên TRÁI, đối xứng
   với nút làm mới bên phải (thầy chốt). Dạng rộng thì ẩn. */
.lb-head .nut-td-nho{display:none; position:absolute; left:0; top:50%;
  transform:translateY(-50%); width:26px; height:26px; border-radius:8px;
  background:var(--accent-soft); color:var(--accent); place-items:center;
  transition:filter .12s}
.lb-head .nut-td-nho:hover{filter:brightness(.95)}
.lb-head .nut-td-nho svg{width:14px; height:14px; stroke:currentColor; stroke-width:2.2;
  fill:none; stroke-linecap:round; stroke-linejoin:round}

.td-pop{position:absolute; inset:0; z-index:24; display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 16px 40px rgba(22,35,42,.18); padding:9px 11px 10px;
  opacity:0; transform:scale(.985); pointer-events:none;
  transition:opacity .2s, transform .2s var(--em)}
.td-pop.mo{opacity:1; transform:none; pointer-events:auto}
.td-dau{flex:none; display:flex; align-items:center; justify-content:center;
  position:relative; margin-bottom:8px; min-height:24px}
.td-dau h4{margin:0; font-weight:800; font-size:10px; letter-spacing:.2em;
  color:var(--muted); text-transform:uppercase}
.td-dau .dong-td{position:absolute; right:0; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
  background:var(--ground)}
.td-dau .dong-td svg{width:12px; height:12px; stroke:var(--muted); stroke-width:2.4;
  fill:none; stroke-linecap:round}

/* Ruột: dạng rộng xếp DỌC, khối tra ở trên, hàng từ đã tra ở DƯỚI CÙNG. */
.td-than{flex:1; min-height:0; display:flex; flex-direction:column; gap:8px}
.td-chinh{flex:1; min-height:0; display:flex; flex-direction:column}
.td-nhap{flex:none; display:flex; gap:7px}
/* ⛔ CỠ CHỮ Ô NHẬP KHÔNG ĐƯỢC DƯỚI 16px: Safari trên iPhone/iPad tự PHÓNG TO
   cả trang khi con trỏ vào ô có chữ nhỏ hơn 16px, phóng rồi không tự thu lại —
   học sinh đang làm bài mà trang nhảy cỡ là hỏng. Mọi thứ khác trong từ điển
   thu nhỏ được, riêng dòng này thì không (thầy chốt đợt 2). */
.td-nhap input{flex:1; min-width:0; height:34px; padding:0 11px; border-radius:10px;
  border:1px solid var(--line); background:var(--ground); font:600 16px var(--sans);
  color:var(--ink); outline:none}
.td-nhap input:focus{border-color:var(--accent); background:var(--surface)}
.td-nhap button{flex:none; height:34px; padding:0 12px; border-radius:10px;
  background:var(--accent); color:#fff; font-weight:800; font-size:11px;
  letter-spacing:.05em; transition:filter .14s}
.td-nhap button:hover{filter:brightness(1.08)}
.td-kq{flex:1; min-height:0; margin-top:8px; font-size:11.8px; line-height:1.45;
  color:var(--ink); overflow-y:auto; -webkit-overflow-scrolling:touch;
  touch-action:pan-y; overscroll-behavior:contain}

/* Hàng từ đã tra. Chữ TO + ĐẬM cho dễ bấm (thầy chốt). Dạng rộng: một hàng
   ngang dưới cùng, dài quá thì kéo ngang. */
/* Dạng rộng: KÉO NGANG được bằng ngón tay (`pan-x`); dạng hẹp đổi thành cột
   nên kéo DỌC — xem khối 1040px. `overscroll-behavior` để kéo hết hàng thì
   dừng chứ không kéo lây cả trang. */
.td-gan{flex:none; display:flex; gap:6px; overflow-x:auto; overflow-y:hidden;
  padding-top:7px; border-top:1px solid var(--line); scrollbar-width:thin;
  -webkit-overflow-scrolling:touch; touch-action:pan-x; overscroll-behavior:contain}
.td-gan:empty{display:none}
.td-gan button{flex:none; height:26px; padding:0 10px; border-radius:9px;
  background:var(--accent-soft); color:var(--accent); font-weight:800;
  font-size:12px; transition:filter .12s, transform .12s}
.td-gan button:hover{filter:brightness(.96); transform:translateY(-1px)}
.td-gan button.dang-xem{background:var(--accent); color:#fff}

.td-tu{font-weight:800; font-size:13.5px}
.td-phienam{font:600 11.5px var(--mono); color:var(--accent); margin-left:6px}
.td-loa{display:inline-grid; place-items:center; width:20px; height:20px;
  border-radius:7px; background:var(--accent-soft); color:var(--accent);
  vertical-align:middle; margin-left:5px}
.td-loa svg{width:12px; height:12px; stroke:currentColor; stroke-width:2; fill:none;
  stroke-linecap:round; stroke-linejoin:round}
/* Dòng tiếng Việt (đợt 9): nghĩa in đậm + lời giải thích, nền xanh nhạt. */
.td-viet{margin-top:7px; padding:6px 9px; border-radius:9px;
  background:var(--accent-soft); font-size:11.5px; line-height:1.4}
.td-viet b{color:var(--accent)}
.td-loai{margin-top:6px; font-weight:800; font-size:9.2px; letter-spacing:.13em;
  color:var(--muted); text-transform:uppercase}
.td-nghia{margin:2px 0 0; padding-left:15px}
.td-nghia li{margin-bottom:2px}
.td-mo{color:var(--muted); font-weight:600}

/* ---------- SIDEBAR (chép nguyên từ trang chính v19) ---------- *//* ---------- SIDEBAR (chép nguyên từ trang chính v19) ---------- */
.phu-mo{position:fixed; inset:0; z-index:40; background:rgba(22,35,42,.34);
  opacity:0; pointer-events:none; transition:opacity .25s}
body.mo-menu .phu-mo{opacity:1; pointer-events:auto}

/* Chân sidebar = slogan ANDREW CLASSES (thầy chốt đợt 6), kiểu chữ mảnh giãn

.side-foot{padding:14px 18px 18px; border-top:1px solid var(--line);

.vi-to .nh{font-size:12px; font-weight:700; color:#B08344; letter-spacing:.04em}
/* Ô SAO trong menu (đợt 4): MỘT ngôi sao to, năm sao con lấp lánh quanh nó
   — thay cho ba ngôi sao ⭐⭐⭐ của bản cũ. */
.sao-ve{position:relative; width:104px; height:74px; margin:0 auto 2px}
.sao-lon{position:absolute; left:50%; top:50%; width:52px; height:52px;
  margin:-26px 0 0 -26px; fill:#F3B21B;
  filter:drop-shadow(0 2px 6px rgba(226,160,20,.45));
  animation:sao-tho 3.6s ease-in-out infinite}
.sao-con{position:absolute; width:12px; height:12px; fill:#F7CE63;
  animation:lap-lanh 2.6s ease-in-out infinite}
.sao-con.c1{left:6px;  top:12px; width:14px; height:14px; animation-delay:0s}
.sao-con.c2{right:8px; top:6px;                            animation-delay:.45s}
.sao-con.c3{right:2px; bottom:14px; width:10px; height:10px; animation-delay:.9s}
.sao-con.c4{left:14px; bottom:6px;  width:10px; height:10px; animation-delay:1.35s}
.sao-con.c5{left:50%; top:-2px; margin-left:-5px; width:9px; height:9px; animation-delay:1.8s}
@keyframes sao-tho{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
@keyframes lap-lanh{
  0%,100%{opacity:.25; transform:scale(.7) rotate(0deg)}
  50%    {opacity:1;   transform:scale(1.15) rotate(35deg)}
}
@media (prefers-reduced-motion: reduce){
  .sao-lon,.sao-con{animation:none} .sao-con{opacity:.85}
}

  .lb-ds{grid-auto-flow:column; grid-template-columns:repeat(3,minmax(0,1fr));

/* ---------- VIẾT TẮT TÊN (cùng lối app myTeam, chép từ trang chính v19) ----

   khi HAI em trùng nhau ở dạng đó mới nới thêm một bậc cho cả hai (NGUYỄN BẢO
   AN và TRẦN BẢO AN thành N.B.AN / T.B.AN). ⚠️ Phải xét trên CẢ LỚP, không chỉ
   mấy em đang có điểm — không thì hôm nay em ấy là B.AN, mai thành N.B.AN. */
function tachTu(ten){ return String(ten || '').trim().split(/\s+/).filter(Boolean); }
function dangTat(tu, mucDo){
  var cuoi = tu[tu.length - 1];
  var truoc = tu.slice(Math.max(0, tu.length - 1 - mucDo), tu.length - 1);
  return truoc.map(function(t){ return t.charAt(0) + '.'; }).join('') + cuoi;
}
function bangVietTat(dsTen){
  var duyNhat = [], da = {};
  dsTen.forEach(function(t){ if (t && !da[t]) { da[t] = 1; duyNhat.push(t); } });
  var muc = {};
  duyNhat.forEach(function(t){ muc[t] = 1; });
  for (var vong = 0; vong < 8; vong++) {
    var nhom = {}, conTrung = false;
    duyNhat.forEach(function(t){
      var tu = tachTu(t);
      var k = dangTat(tu, Math.min(muc[t], tu.length - 1));
      (nhom[k] = nhom[k] || []).push(t);
    });
    Object.keys(nhom).forEach(function(k){
      if (nhom[k].length < 2) return;
      nhom[k].forEach(function(t){
        var tu = tachTu(t);
        if (muc[t] < tu.length - 1) { muc[t]++; conTrung = true; }
      });
    });
    if (!conTrung) break;
  }
  var ra = {};
  duyNhat.forEach(function(t){
    var tu = tachTu(t);
    ra[t] = dangTat(tu, Math.min(muc[t], tu.length - 1));
  });
  return ra;
}
var TAT = bangVietTat(CA_LOP);
