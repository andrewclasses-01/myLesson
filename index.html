<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrew Classes</title>
<link rel="icon" href="assets/avatar-tron.jpg">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="nw/nw.css?v=1">
<link rel="stylesheet" href="css/nw-thanh.css?v=6">
<style>
/* mẫu v29 (24/09): ô mật khẩu KHOÁ tạm thời — thầy chốt "để trống vẫn đăng nhập được", mở sau khi myNetwork xong */
.dn-o.khoa input{background:#F1F5F4; border-color:var(--line); cursor:not-allowed; padding-right:46px}
.dn-o.khoa input::placeholder{color:#7C8E8A; font-weight:600}
.dn-o.khoa .o-khoa{position:absolute; right:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:#9fb0ac; pointer-events:none}
/* màn chọn nơi học (em có mã ở 2 nơi) */
.dn-chao{display:flex; flex-direction:column; align-items:center; text-align:center; margin:-4px 0 16px}
.dn-chao .av{width:64px; height:64px; font-size:22px; margin-bottom:10px; box-shadow:0 6px 18px rgba(14,124,110,.22)}
.dn-chao h2{margin:0; font-size:18px}
.chon-nut{width:100%; display:flex; align-items:center; gap:12px; padding:13px 14px; margin-bottom:10px; border-radius:14px;
  background:#fff; border:1.5px solid var(--line); text-align:left; transition:border-color .15s, background-color .15s; position:relative}
.chon-nut:hover{border-color:var(--accent); background:var(--accent-soft)}
.chon-nut .cn-ic{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); flex:none}
.chon-nut .cn-ic svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.chon-nut .cn-ten{flex:1; font-weight:800; font-size:14.5px}
.chon-nut .cn-go{font-size:22px; color:var(--muted); line-height:1}
.dn-dk{margin-top:16px; font-size:13.5px; display:flex; justify-content:center; align-items:center; gap:14px}
.dn-dk button{color:var(--accent); font-weight:800}
.dn-dk .gach{width:1px; height:14px; background:var(--line)}
.dn-dk button:hover{text-decoration:underline}
.chon-nut .cn-moi{position:absolute; top:-8px; right:12px; padding:2px 8px; border-radius:99px; background:var(--do); color:#fff; font-size:9.5px; font-weight:800; letter-spacing:.06em}
</style>
</head>
<body class="dn">
<div class="login-bg"></div>
<div class="dn-khung">
  <aside class="dn-trai">
    <img class="dn-hinh" src="nw/dang-nhap-2.webp" alt="" width="960" height="960">
    <p class="dn-slogan">Cùng khám phá những <span class="xanh">bài học thú vị.</span></p>
  </aside>

  <div class="dn-phai">
    <div class="card login-card dn-card">
      <div class="brand dn-brand-nho"><img src="assets/avatar-tron.jpg" alt=""><h1>Andrew Classes<small>NETWORK</small></h1></div>

      <section class="man" id="manVao">
        <label class="dn-o gon"><input id="inMa" type="text" autocomplete="username" placeholder="Andrew Classes ID" data-goi="Andrew Classes ID" autocapitalize="characters" spellcheck="false"></label>
        <label class="dn-o gon khoa"><input id="inMk" type="password" placeholder="Để trống ô này" disabled tabindex="-1">
          <svg class="o-khoa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg></label>
        <button class="btn primary wide" id="btnVao">ĐĂNG NHẬP</button>
        <p class="tiny warn" id="loiVao" hidden></p>
        <!-- thầy 24/09: chỗ để sau này mở MÀN ĐĂNG KÝ cho học sinh mới — tạm "sắp ra mắt" -->
        <div class="nut-thay dn-dk"><button type="button" id="btnDangKy">Đăng ký</button><i class="gach"></i><button type="button" id="btnLienHe">Liên hệ</button></div>
      </section>

      <section class="man" id="manChon">
        <div class="dn-chao"><span class="av" id="chonAv"></span><h2 id="chonTen"></h2></div>
        <div id="chonDs"></div>
        <div class="nut-thay"><button type="button" id="btnKhac">Không phải em? Đăng nhập ID khác</button></div>
      </section>

      <section class="man hien" id="manCho"><div class="dn-cho"><div class="xoay"></div><p class="tiny">Đang mở…</p></div></section>
    </div>
    <footer class="login-foot dn-foot"><p>Copyright © 2016 - 2026 by ANDREW · Phone &amp; Zalo: 0359.769.765</p></footer>
  </div>
</div>

<script src="config.js?v=110"></script>
<script src="js/chung.js?v=59"></script>
<script src="js/nw-dangnhap.js?v=1"></script>
<script src="js/nw-thanh.js?v=6"></script>
</body>
</html>
