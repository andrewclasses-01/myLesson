    · tiêu đề thẻ (t-ten) là TÊN BÀI GIẢNG thật (`b.baiGiang.tieuDe`, cắt bỏ

:root{
  --ground:#F7FAF9; --surface:#FFFFFF; --ink:#16232A; --muted:#5F7370;
  --accent:#0E7C6E; --accent-ink:#FFFFFF; --accent-soft:#E3F1EE;
  --amber:#F2A93B; --amber-soft:#FCF3E2;
  --xanh-la:#1DA45C;
  --line:#E0EAE7;
  --tim:#7C5CE6;
  --m-do:#E0575B; --m-cam:#F0821E; --m-vang:#E0B411; --m-duong:#3E7BFA; --m-la:#18A957;
  --shadow:0 1px 3px rgba(22,35,42,.07), 0 8px 24px rgba(22,35,42,.06);
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
  --sans:'Montserrat',"Segoe UI",system-ui,sans-serif;
  --em:cubic-bezier(.22,.9,.3,1);
  /* ⭐ 11/09/2026 (thầy chốt) — cao hơn thẻ thường (200px) để: (1) dòng chủ đề
     bài giảng không giới hạn số dòng có chỗ xuống 2 dòng, (2) hàng CẢ LỚP có
     chỗ cho cụm avatar TOP 3 (`--av` ~24-26px) chồng lên vệt tiến trình. */
  --cao-the:272px;
  --cao-dau:77px;
  --banphim:0px;
  --san-chat:96px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground); color:var(--ink); font:500 15px/1.6 var(--sans)}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}

.wrap{max-width:1180px; margin:0 auto; padding:0 20px}

/* ---------- THANH ĐẦU (y hệt lop.html) ---------- */
.top{position:sticky; top:0; z-index:30; background:rgba(247,250,249,.86);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top-in{display:flex; align-items:center; gap:14px; padding:12px 20px}
.av{flex:none; display:grid; place-items:center; border-radius:50%;
  font-weight:800; color:#fff; user-select:none; position:relative; overflow:hidden}
.av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.av .av-anh{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%}
.av.me, .side-head .av{overflow:visible}
.av-cham{position:absolute; top:-1px; right:-1px; width:13px; height:13px;
  border-radius:50%; background:var(--m-do); border:2.5px solid #fff;
  box-shadow:0 1px 3px rgba(22,35,42,.28); z-index:5; pointer-events:none}
.side-head .av-cham{width:12px; height:12px}
.av.me{width:52px; height:52px; font-size:19px; cursor:pointer;
  background:linear-gradient(135deg,#0E7C6E,#16A08E); box-shadow:var(--shadow);
  position:relative; transition:transform .18s var(--em), box-shadow .18s; overflow:visible}
.av.me:hover{transform:scale(1.06); box-shadow:0 0 0 4px var(--accent-soft), var(--shadow)}
/* ⭐ v1.335.0 (14/10/2026, thầy chốt: HS khóa cũng có ví sao) — chép nguyên từ lop.html. ĐỢT 4 → ĐỢT 11 (chép nguyên từ bai.html/bai-sp.html, 28/08 đồng bộ lại
   lop.html cho khớp — bản cũ ở đây lệch phải + bị .av cắt mất một góc):
   SỐ SAO nằm giữa đáy quả bóng avatar, khung nền trắng, kèm icon ngôi sao +
   3 tia lấp lánh xung quanh. */
.sao-hieu{position:absolute; left:50%; bottom:-2px; transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:1.5px;
  padding:0 3.5px; border-radius:99px; background:#fff;
  box-shadow:0 1px 3px rgba(22,35,42,.20);
  font-size:9.5px; font-weight:800; white-space:nowrap; line-height:1.45;
  color:#E5A20D; letter-spacing:.1px; font-variant-numeric:tabular-nums}
/* ⛔ `:not(.lap)` — ba sparkle cũng là <svg> con trực tiếp của cụm này, không
   loại chúng ra thì chúng ăn luôn cỡ của ngôi sao chính. */
.sao-hieu > svg:not(.lap){width:9.5px; height:9.5px; fill:#F3B21B; flex:none}
/* Sparkle quanh cụm số: 3 sao tí hon nhấp nháy lệch pha, chạy mãi (dùng lại
   @keyframes lap-lanh đã có sẵn cho khối .sao-ve bên dưới). */
.sao-hieu .lap{position:absolute; fill:#F7CE63; animation:lap-lanh 2.2s ease-in-out infinite}
.sao-hieu .lap.l1{width:7px; height:7px; left:-10px; top:-4px; animation-delay:0s}
.sao-hieu .lap.l2{width:6px; height:6px; right:-9px; top:6px; animation-delay:.7s}
.sao-hieu .lap.l3{width:5px; height:5px; left:6px; top:-9px; animation-delay:1.4s}
@media (prefers-reduced-motion: reduce){ .sao-hieu .lap{animation:none; opacity:.7} }
.who{min-width:0}
.who .ten{font-weight:800; font-size:18px; line-height:1.25; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who .lop{font-size:12.5px; color:var(--muted); font-weight:600}

/* ---------- BỐ CỤC MÁY TÍNH (y hệt lop.html) ---------- */
.main{display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:22px;
  align-items:stretch; padding:22px 20px 40px}
@media (min-width:1041px){
  .main{min-height:min(70vh, 620px)}
}
.cot-bai{display:flex; flex-direction:column; gap:16px}
.vach{height:0; border-top:1.5px dashed #B9CCC7; margin:-1px 0}

.chua-co{display:flex; align-items:center; justify-content:center; gap:9px;
  min-height:64px; text-align:center; font-size:14px; font-weight:600;
  color:#93A5A1; letter-spacing:.01em}
.chua-co svg{width:17px; height:17px; stroke:currentColor; stroke-width:2; fill:none;
  stroke-linecap:round; stroke-linejoin:round}
.chua-co.vui{color:#B08344; font-weight:700}

/* ---------- THẺ BÀI TẬP (y hệt lop.html) ---------- */
.the{display:block; width:100%;
  filter:drop-shadow(0 1px 2px rgba(22,35,42,.08)) drop-shadow(0 8px 20px rgba(22,35,42,.07));
  transition:transform .2s var(--em)}
.the:hover{transform:translateY(-2px)}
.the-in{--mui:64px; position:relative; display:flex; flex-direction:column;
  align-items:stretch;
  height:var(--cao-the); background:var(--surface); border-radius:12px 0 0 12px;
  clip-path:polygon(0 0, calc(100% - var(--mui)) 0, 100% 50%,
                    calc(100% - var(--mui)) 100%, 0 100%);
  padding-right:var(--mui); text-align:left; width:100%; transition:background .3s}
.play{position:absolute; right:0; top:0; bottom:0; width:var(--mui);
  display:grid; place-items:center; transition:background .2s}
.play svg{width:22px; height:22px; fill:#fff; margin-right:30px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.the.moi   .play{background:linear-gradient(135deg,#0E9E85,#22C3A4)}
.the.moi:hover .play{background:linear-gradient(135deg,#0B8672,#16AE92)}
.the.cu    .play{background:#C3D3CF}
.the.cu:hover .play{background:#B2C5C0}
.the.khoa .play, .the.khoa:hover .play{background:#9FB0AC}
.the.khoa .play svg{width:20px; height:20px}
.the.khoa:hover{transform:none}
.the.khoa{cursor:default}

.the-in.tt-do{background:#FDF3F3}
.the-in.tt-la{background:#F2FBF5}
.the-in.tt-vang{background:#FEFAEE}
.the-in.tt-duong{background:#F3F7FE}

.the.xong-het{filter:drop-shadow(0 2px 4px rgba(24,169,87,.22))
                     drop-shadow(0 0 16px rgba(24,169,87,.42))}
.the.cu.xong-het{filter:drop-shadow(0 1px 2px rgba(24,169,87,.16))
                        drop-shadow(0 0 3px rgba(24,169,87,.26))}
.the.gio-duong{filter:drop-shadow(0 2px 4px rgba(62,123,250,.18))
                      drop-shadow(0 0 15px rgba(62,123,250,.34))}
.the.gio-vang{filter:drop-shadow(0 2px 4px rgba(224,180,17,.22))
                     drop-shadow(0 0 15px rgba(224,180,17,.42))}
.the.gap{animation:hao-quang-do 3.4s ease-in-out infinite}
@keyframes hao-quang-do{
  0%,100%{filter:drop-shadow(0 2px 4px rgba(224,87,91,.28))
                 drop-shadow(0 0 7px rgba(224,87,91,.35))}
  50%    {filter:drop-shadow(0 2px 4px rgba(224,87,91,.40))
                 drop-shadow(0 0 22px rgba(224,87,91,.80))}
}
@media (prefers-reduced-motion: reduce){
  .the.gap{animation:none;
    filter:drop-shadow(0 2px 4px rgba(224,87,91,.35)) drop-shadow(0 0 16px rgba(224,87,91,.6))}
}

/* ---------- RUỘT THẺ (y hệt lop.html) ---------- */
.the-body{flex:none; min-width:0; padding:11px 14px 6px 20px; display:flex;
  align-items:center; column-gap:12px; overflow:hidden}
.t-chu{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
/* ⭐⭐ 11/09/2026 (thầy chốt) — dòng LỚN nay là SỐ LESSON (`.t-ten`, chữ lấp
   lánh — dải màu vàng chạy qua chữ bằng `background-clip:text`), dòng dưới
   (`.t-chude`) là TÊN BÀI GIẢNG ĐẦY ĐỦ, không cắt/không giới hạn số dòng —
   thẻ cao lên (xem `--cao-the`) để chừa chỗ. */
.t-ten{position:relative; font-size:19px; font-weight:800; letter-spacing:.005em;
  line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:linear-gradient(100deg, var(--ink) 26%, #E5A20D 42%, #FFE9AE 50%,
    #E5A20D 58%, var(--ink) 74%);
  background-size:230% 100%; -webkit-background-clip:text; background-clip:text;
  color:transparent; animation:lap-lanh-chu 4.4s ease-in-out infinite}
@keyframes lap-lanh-chu{0%{background-position:190% 0} 60%,100%{background-position:-40% 0}}
@media (prefers-reduced-motion: reduce){ .t-ten{animation:none; background-position:0 0} }
.t-ten .ngay{margin-left:8px; color:var(--xanh-la)}
.t-ten .khoang{margin-left:8px; font-size:13px; font-weight:700; color:var(--muted)}
/* ⭐ 11/09/2026 (thầy chốt) — CÙNG font với mã lesson của thẻ lớp thường
   (`.t-ma` bên `lop.html`, ví dụ "LSA2-S2.T2.P4-5"): `--mono`, 13,4px, màu
   muted. Chỉ khác một chỗ: ở đây là CÂU CHỦ ĐỀ dài nên cho xuống dòng tự do,
   không ellipsis một dòng như bên đó. */
.t-chude{font:600 13.4px/1.4 var(--mono); color:var(--muted); letter-spacing:.01em;
  white-space:normal; overflow-wrap:break-word}

.han-boc{flex:none; width:176px;
  display:flex; align-items:center; justify-content:center; gap:10px}
.t-han{display:flex; flex-direction:column; gap:4px; width:158px;
  padding:6px 12px 7px; border-radius:12px;
  background:var(--amber-soft); border:1px solid #F5E3C0}
.t-han .han-dong{display:flex; align-items:center; justify-content:center; gap:0;
  font-size:12px; font-weight:700; color:#9A6A12; white-space:nowrap}
.t-han .han-vach{height:0; border-top:1px dashed #EBD3A6}
.dhho{font-size:19px; font-weight:800; text-align:center; line-height:1.15;
  letter-spacing:.6px; font-variant-numeric:tabular-nums; white-space:nowrap}
.dhho.xanh{color:var(--m-la)} .dhho.cam{color:#DE7A12} .dhho.do{color:#D93B40}
.dhho.xong{font-size:15.5px; letter-spacing:.9px; color:var(--m-la)}
.dhho.khoa{font-size:13.5px; letter-spacing:.7px; color:#7B8C89}
.tich-to{font-size:30px; font-weight:800; color:var(--m-la); line-height:1;
  filter:drop-shadow(0 1px 4px rgba(24,169,87,.35))}
.t-han.gap-gio{background:#FDECEC; border-color:#F6CFCF}
.t-han.gap-gio .han-dong{color:#B03A3E}
.t-han.gap-gio .han-vach{border-color:#F3CACA}
.t-han.da-xong{background:#EFFAF3; border-color:#C9EBD6}
.t-han.da-xong .han-dong{color:#2C7A50}
.t-han.da-xong .han-vach{border-color:#CFEBDA}

/* ---------- VÙNG ĐIỂM — RIÊNG của trang khóa học ----------
   Khác trang lớp ở chỗ: mỗi thẻ có nút chuyển EM (mặc định) ⇄ CẢ LỚP, và
   nhãn mỗi hàng chỉ là "BT1"/"TNBG"/"SÁCH…" (không phải tên act đầy đủ như
   trang lớp) — nên cột nhãn co RẤT hẹp, phần còn lại nhường HẾT cho thanh
   tiến trình (thầy chốt "thanh kéo dài tối đa"), và cột số bên phải ép sát
   gần lề phải hơn (thầy chốt "lề phải đang rộng mất cân đối"). */
.the-diem{flex:1; min-height:0; width:100%; overflow:hidden;
  border-top:1.5px dashed var(--line);
  padding:8px 10px 11px 20px; display:flex; flex-direction:column; gap:4px}
.the-diem.chi-tay{align-items:center; justify-content:center; text-align:center;
  padding:0 20px}
/* ⭐ 11/09/2026 (thầy chốt) — bỏ hẳn dòng chữ "EM ĐÃ XONG x/x"/"CẢ LỚP • x EM",
   nút EM/CẢ LỚP chuyển về GIỮA hàng, style vuông bo góc (trước tròn quá), chữ
   TRÁI đổi thành TÊN HỌC SINH (trước ghi cứng "EM"). Có khối `.chon-thumb`
   trượt mượt theo nút đang chọn — `dinhViThumb()` bên JS đo `offsetLeft/
   offsetWidth` của nút rồi đặt `transform`/`width`, không đặt số cứng vì tên
   dài ngắn mỗi em một khác. */
.xem-dau{flex:none; display:flex; align-items:center; justify-content:center;
  min-height:20px; margin-bottom:2px}
.chon-xem{position:relative; display:inline-flex; background:#EDF3F1; border-radius:9px; padding:2px; gap:2px}
.chon-thumb{position:absolute; top:2px; bottom:2px; left:0; width:0; border-radius:6px;
  background:#fff; box-shadow:0 1px 2px rgba(22,35,42,.12);
  transition:transform .34s var(--em), width .34s var(--em)}
.chon-xem span[data-xem]{position:relative; z-index:1; padding:3px 12px;
  font:800 9.5px/1.6 var(--sans); letter-spacing:.08em; color:#7B8C89; cursor:pointer;
  white-space:nowrap; transition:color .18s var(--em)}
.chon-xem span[data-xem].on{color:var(--accent)}
/* ⭐⭐ 11/09/2026 (thầy chốt) — CẢ KHỐI thanh tiến trình trượt ngang mượt khi
   đổi TÊN EM ⇄ CẢ LỚP. ⛔⛔ SUPERSEDES bẫy `display:contents` ghi trước đó ở
   đây (gộp `hang-em`/`td-dong` chung một thẻ làm mất cả hàng — đổi hẳn cách
   dựng nên bẫy đó không còn đường tái phạm): nay `hangEm()`/`hangLop()` trả
   THẲNG `.td-dong`, không còn thẻ bọc riêng từng hàng; MỘT thẻ bọc DUY NHẤT
   cho cả khối — `.hang-grp-em`/`.hang-grp-lop` — chồng `position:absolute`
   lên nhau trong `.diem-rows`, chỉ đổi `transform`/`opacity` nên CSS chạy
   mượt được (không phải bật/tắt `display` giữa chừng như trước). Khối đang ẩn
   vẫn CÓ KÍCH THƯỚC THẬT (không `display:none`) nên `coAvatarThanh()` đo được
   NGAY TỪ ĐẦU cả hai khối, không cần đợi bấm mới đo đúng — xem hàm đó. */
.diem-rows{position:relative; flex:1; min-height:0; overflow:hidden}
.hang-grp{position:absolute; inset:0; display:flex; flex-direction:column;
  justify-content:space-around; gap:4px;
  transition:transform .42s var(--em), opacity .3s var(--em)}
.hang-grp-em{transform:translateX(0); opacity:1}
.hang-grp-lop{transform:translateX(100%); opacity:0; pointer-events:none}
.the.lop .hang-grp-em{transform:translateX(-100%); opacity:0; pointer-events:none}
.the.lop .hang-grp-lop{transform:translateX(0); opacity:1; pointer-events:auto}
@media (prefers-reduced-motion: reduce){ .chon-thumb,.hang-grp{transition:none} }
/* Cột nhãn RẤT hẹp (nhãn dài nhất chỉ "SÁCH 12,13" cỡ 8 ký tự) — chỗ dôi ra
   rơi hết vào thanh tiến trình. Cột số + dấu ✓ ép sát lề phải. */
.td-dong{display:grid; grid-template-columns:minmax(0,46px) minmax(60px,1fr) minmax(30px,auto) 16px;
  align-items:center; column-gap:8px}
.td-ten{font:800 11px/1.3 var(--sans); letter-spacing:.02em; color:#3D5450;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.td-bar{position:relative; height:8px; border-radius:99px; background:#E7EDEB}
.td-bar i{position:absolute; inset:0 auto 0 0; display:block; height:100%; border-radius:99px;
  transition:width .5s var(--em)}
.td-so{font:800 11.5px/1.3 var(--sans); text-align:right; color:#54706B; white-space:nowrap;
  font-variant-numeric:tabular-nums}
.td-so.em-chua{color:#A9B6B3}
.td-tich{font:800 11px/1.3 var(--sans); color:var(--m-la); text-align:center}
.td-so.m-la{color:var(--m-la)} .td-so.m-do{color:var(--m-do)}
i.m-do{background:var(--m-do)} i.m-cam{background:var(--m-cam)} i.m-vang{background:var(--m-vang)}
i.m-duong{background:var(--m-duong)} i.m-la{background:var(--m-la)}
/* ⭐ 11/09/2026 (thầy chốt) — AVATAR TOP 3 trên hàng CẢ LỚP (`hangLop()`),
   PORT nguyên xi từ lop.html: `coAvatarThanh()` đo chiều cao hàng thật rồi
   đặt `--av`, `xepAvatarMoc()` xếp chỗ dọc `.td-bar`. Bản sao ở `lop.html`
   (và `dashboard.html`/`sp-chitiet.html`) — sửa công thức thì sửa cả bên đó. */
.av-thanh{position:absolute; top:50%; width:var(--av,14px); height:var(--av,14px);
  border-radius:999px; transform:translate(-50%,-50%); overflow:hidden; background:#CFDCD9;
  display:grid; place-items:center; font:800 calc(var(--av,14px)*.4)/1 var(--sans); color:#fff;
  box-shadow:0 0 0 1.5px #fff, 0 1px 2px rgba(22,35,42,.35)}
.av-thanh img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%}
.av-moc[data-hang="1"]{z-index:3} .av-moc[data-hang="2"]{z-index:2} .av-moc[data-hang="3"]{z-index:1}
/* Dòng SÁCH — chưa có act AWord (chưa track điểm), thanh để trống + gạch ngang. */
.td-dong-sach .td-bar{background:#EEF3F1}

/* ---------- ⭐⭐ v1.113.0 (16/09/2026, thầy chốt) — POP-UP KẾT QUẢ DẠNG TAB ----------
   Bấm VÙNG THANH của thẻ ⇒ pop-up: mỗi BT một TAB. Đang ở nút TÊN EM ⇒ tab hiện kết
   quả RIÊNG của em (số câu đúng/tổng · thời gian · hạng trong khóa); đang ở CẢ LỚP ⇒
   bảng xếp hạng cả khóa của act đó (đúng `.xh-dong` như trang lớp/dashboard).
   Khung `.pop-*`/`.xh-*`/`.doi-vach` chép từ lop.html; `.pop-tabs`/`.pop-tab`/`.kq-*`
   là bản chép với dashboard.html — sửa một bên phải sửa bên kia. */
.pop-nen{position:fixed; inset:0; z-index:55; display:grid; place-items:center;
  padding:20px; background:rgba(22,35,42,.42); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .26s var(--em)}
.pop-nen.mo{opacity:1; pointer-events:auto}
.pop{width:min(440px,100%); max-height:92vh; background:var(--surface);
  border-radius:20px; box-shadow:0 24px 60px rgba(22,35,42,.28);
  display:flex; flex-direction:column; overflow:hidden;
  transform:translateY(18px) scale(.96); opacity:0;
  transition:transform .3s var(--em), opacity .26s var(--em)}
.pop-nen.mo .pop{transform:none; opacity:1}
.pop-head{flex:none; display:flex; align-items:center; gap:10px;
  padding:13px 15px 11px; border-bottom:1px solid var(--line)}
.pop-head h3{margin:0; font-size:14px; font-weight:800; letter-spacing:.03em}
.pop-head .phu{font-size:10.5px; font-weight:600; color:var(--muted); margin-top:1px}
.pop-head .dong{margin-left:auto; width:32px; height:32px; border-radius:10px;
  display:grid; place-items:center; background:var(--ground)}
.pop-head .dong svg{width:16px; height:16px; stroke:var(--muted); stroke-width:2.4;
  fill:none; stroke-linecap:round}
.pop-tabs{flex:none; display:flex; gap:6px; padding:10px 12px 2px; overflow-x:auto; scrollbar-width:none}
.pop-tab{flex:1 0 auto; min-width:56px; padding:6px 10px; border-radius:10px; background:#EDF3F1;
  font:800 11px/1.3 var(--sans); letter-spacing:.06em; color:#7B8C89; white-space:nowrap;
  transition:background .18s var(--em), color .18s var(--em)}
.pop-tab:hover{background:#E1EBE8}
.pop-tab.on{background:var(--accent); color:#fff}
.pop-tab .tab-so{display:block; font-size:9.5px; font-weight:700; letter-spacing:.02em; opacity:.75; margin-top:1px}
.pop-tab.on .tab-so{opacity:.92}
.pop-ds{flex:1; min-height:0; overflow-y:auto; padding:6px 9px 8px}
.pop-foot{flex:none; padding:8px 16px 11px; border-top:1px solid var(--line);
  font-size:9px; font-weight:500; letter-spacing:.22em; color:#A9B6B3; text-align:center}
.pop-trong{padding:22px 14px; text-align:center; color:#8AA09C; font-size:12.5px; line-height:1.5}
.doi-vach{display:flex; align-items:center; gap:10px; margin:14px 9px 6px}
.doi-vach:first-child{margin-top:6px}
.doi-vach .line{flex:1; height:1px; background:var(--line)}
.doi-vach .lb{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--accent);
  white-space:normal; text-align:center; line-height:1.35}
.doi-vach .lb .tong{margin-left:6px; font-weight:700; letter-spacing:.03em; color:var(--muted); white-space:nowrap}
.doi-vach .lb .tong::before{content:'•'; margin-right:6px; color:var(--line)}
/* thiết kế K10 7 (12/10/2026, thầy chốt) — pop-up kết quả lesson CHƯƠNG: tab cho MỌI bước; bước KHÔNG có điểm (đọc sách,
   video mẫu, gửi Zalo) chỉ hiện "Đã xong" (xanh) / "—" (chưa xong, đỏ) — không hạng, không giờ. */
.xh-dong.tay{grid-template-columns:22px minmax(0,1fr) auto}
.xh-dong.tay .xh-diem{padding:0 4px; font-size:11.5px}
.xh-dong.tay.du .xh-diem,.xh-dong.tay.du .xh-hang{color:var(--m-la)}
.xh-dong{display:grid; grid-template-columns:22px minmax(0,1fr) 3.6ch var(--w-giay,4.8ch);   /* v1.263.4: --w-giay = cột giờ nới theo số dài nhất CỦA BẢNG */
  gap:6px; align-items:center; padding:0 6px; border-radius:7px;
  height:24px; font-weight:700; font-size:12px; line-height:1}
.xh-dong:nth-child(odd){background:#F3F8F6}
.xh-dong.toi{box-shadow:inset 0 0 0 1.5px var(--accent)}
.xh-hang{font-weight:800; font-size:10.5px; color:#9AACA8; text-align:center; font-variant-numeric:tabular-nums}
.xh-hang .huy{display:block; width:19px; height:19px; margin:0 auto}
.xh-ten{font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.xh-diem{font-weight:800; color:var(--accent); text-align:center; font-variant-numeric:tabular-nums}
.xh-giay{color:#93A5A1; text-align:center; font-size:11px; font-variant-numeric:tabular-nums}
.xh-dong.hc .xh-ten{color:#D79B0C; animation:hao-quang-ten-pop 2.4s ease-in-out infinite}
.xh-dong.du .xh-ten{color:var(--m-la)}
.xh-dong.co .xh-ten{color:var(--ink)}
.xh-dong.chua .xh-ten{color:#D93B40}
.xh-dong.chua .xh-diem,.xh-dong.chua .xh-giay{color:#C9A3A4}
/* v1.136.0 — em KHÔNG TÍNH ở bài này: xám toàn dòng, luôn nằm cuối bảng */
.xh-dong.mien .xh-ten,.xh-dong.mien .xh-diem,.xh-dong.mien .xh-giay,.xh-dong.mien .xh-hang{color:#9AA7A2}
@keyframes hao-quang-ten-pop{
  0%,100%{text-shadow:0 0 8px rgba(243,178,27,.30), 0 0 18px rgba(243,178,27,.14)}
  50%    {text-shadow:0 0 10px rgba(247,196,60,.75), 0 0 22px rgba(243,178,27,.50)}
}
@media (prefers-reduced-motion:reduce){ .xh-dong.hc .xh-ten{animation:none} }
/* Ô kết quả RIÊNG CỦA EM (chế độ TÊN EM): số câu đúng to, thanh %, thời gian + hạng. */
.kq-em{padding:10px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:10px}
.kq-so{display:flex; align-items:baseline; gap:4px; font-weight:800; color:var(--ink)}
.kq-so b{font-size:38px; line-height:1; color:var(--accent)}
.kq-so span{font-size:18px; color:var(--muted)}
.kq-so em{font-style:normal; font-size:11px; letter-spacing:.08em; color:var(--muted); margin-left:6px}
.kq-so.du b{color:var(--m-la)}
.kq-bar{position:relative; width:100%; max-width:300px; height:10px; border-radius:99px; background:#E7EDEB}
.kq-bar i{position:absolute; inset:0 auto 0 0; height:100%; border-radius:99px}
.kq-phu{display:flex; gap:18px; font:800 12px/1.4 var(--sans); color:#54706B; font-variant-numeric:tabular-nums}
.kq-phu .hang{color:var(--accent)}
.kq-phu .hang.top{color:#D79B0C}

/* ---------- CHAT (y hệt lop.html) ---------- */
.chat-cot{min-width:0; min-height:0}
@media (min-width:1041px){
  .chat-cot{position:relative}

/* ⭐ v1.335.0 — ô SAO ĐANG CÓ trong menu (chép nguyên lop.html). */
.vi-to{margin:14px 12px 6px; padding:18px 16px; border-radius:16px; text-align:center;
  background:linear-gradient(160deg,#FEF6E6,#FCEFD8); border:1px solid #F5E3C0}
.vi-to .so{font-size:38px; font-weight:800; color:#9A6A12; line-height:1.1}
.vi-to .nh{font-size:12px; font-weight:700; color:#B08344; letter-spacing:.04em}
/* Ô SAO trong menu (đợt 4): MỘT ngôi sao to, năm sao con lấp lánh quanh nó
   — thay cho ba ngôi sao ⭐⭐⭐ của bản cũ. */
.sao-ve{position:relative; width:104px; height:74px; margin:0 auto 2px}
.sao-lon{position:absolute; left:50%; top:50%; width:52px; height:52px;
  margin:-26px 0 0 -26px; fill:#F3B21B;
  filter:drop-shadow(0 2px 6px rgba(226,160,20,.45));
  animation:sao-tho 3.6s ease-in-out infinite}
.sao-con{position:absolute; width:12px; height:12px; fill:#F7CE63;
  animation:lap-lanh 2.6s ease-in-out infinite}
.sao-con.c1{left:6px;  top:12px; width:14px; height:14px; animation-delay:0s}
.sao-con.c2{right:8px; top:6px;                            animation-delay:.45s}
.sao-con.c3{right:2px; bottom:14px; width:10px; height:10px; animation-delay:.9s}
.sao-con.c4{left:14px; bottom:6px;  width:10px; height:10px; animation-delay:1.35s}
.sao-con.c5{left:50%; top:-2px; margin-left:-5px; width:9px; height:9px; animation-delay:1.8s}
@keyframes sao-tho{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
@keyframes lap-lanh{
  0%,100%{opacity:.25; transform:scale(.7) rotate(0deg)}
  50%    {opacity:1;   transform:scale(1.15) rotate(35deg)}
}
@media (prefers-reduced-motion: reduce){
  .sao-lon,.sao-con{animation:none} .sao-con{opacity:.85}
}
.toast{position:fixed; left:50%; bottom:26px; z-index:60; transform:translate(-50%,20px);
  background:var(--ink); color:#fff; font-size:13px; font-weight:600;
  border-radius:12px; padding:10px 18px; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s var(--em)}
.toast.hien{opacity:1; transform:translate(-50%,0)}

<script>
var $ = function(s){ return document.querySelector(s); };
function chuAnToan(x){ return window.AWC.chuAnToan(x); }

var MAN_HEP = window.matchMedia('(max-width:620px)');
var CHAT_DUOI = window.matchMedia('(max-width:1040px)');
function laDienThoai(){ return MAN_HEP.matches; }
function chatODuoi(){ return CHAT_DUOI.matches; }

var MAU_AV = ['#0E7C6E','#B3541E','#5B8DEF','#8CC63F','#E36B5C','#9C6ADE','#F2A93B'];
function avKhongDau(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
}
function avSlugLop(s){ return avKhongDau(s).replace(/[^a-z0-9]/g, '') || 'lop'; }
function avSlugTen(s){
  return avKhongDau(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'hs';
}
function veAv(ten, i){
  var chu = ten.trim().split(/\s+/).map(function(t){return t[0];}).slice(-2).join('');
  var tenDay = A.avTenDayDu(ten, typeof CA_LOP !== 'undefined' ? CA_LOP : []);
  var anh = LOP_SLUG ? ('<img class="av-anh" src="' + (window.AC_GOC_DL || '') + 'assets/avatar/' + LOP_SLUG + '/' + avSlugTen(tenDay) +
    '.jpg" alt="" onerror="this.remove()">') : '';
  return '<span class="av" data-av-em="' + A.chuAnToan(tenDay) + '" data-av-lop="' + A.chuAnToan(LOP || '') +
    '" style="background:' + MAU_AV[i % MAU_AV.length] + '">' + chu + anh + '</span>';
}

/* ---------- DỮ LIỆU THẬT ---------- */
var A = window.AWC;
var DL = { lop: [], bai: {} };
var EM = null;
var TOI = '';            /* tên em đang đăng nhập */
var LOP = '';            /* tên khóa HIỆN cho em xem, vd "NỀN TẢNG K9" */
var LOP_SLUG = '';
var LOP_DL = '';         /* mã khóa trong lop.json/bai.json, vd "NNTNGK9" */
var MA_HS = '';
var KHOA = null;         /* bản ghi khóa học ({maLop,tenGoc,hocSinh,loai:'khoa'}) */
var CA_LOP = [];         /* tên cả khóa (những em cùng theo khóa này) */
var LOP_OBJ = null;      /* v1.136.0 — đối tượng khóa (cần cho `A.emKhongTinh`) */
var SI_SO = 0;
var CA_TINH = [];        /* v1.309.0 — tên em ĐANG TÍNH (bỏ học sinh học thử) — x/N, sĩ số */
var DIEM = {}, CHUAN = {};   /* mã act -> danh sách điểm / chuẩn đủ điểm */
var BAI_MOI = null;      /* thẻ trên vạch (bài mới nhất còn hạn) */
var BAI_CU = [];         /* thẻ dưới vạch */
var dangDocDiem = true;
/* ⭐ v1.286.0 (09/10/2026, thầy chốt) — PHIM GIỚI THIỆU khóa mới (NỀN TẢNG K10+, js/gioi-thieu.js): GT_CTX = em + khóa;
   (v1.340.0: thẻ GIỚI THIỆU nay là một bài do app giao — xem GT_BAI/GT_ST/veTheGt bên dưới.) */
var GT_CTX = null;
/* ⭐ v1.340.0 — GT_BAI = bài GIỚI THIỆU app giao cho lớp (kieu 'GIOITHIEU') · GT_ST = tiến độ phim của em ({xong, man}; null = đang đọc) */
var GT_BAI = null, GT_ST = null;
function laTheGt(b){ return !!(b && b.goc && b.goc.kieu === 'GIOITHIEU'); }
function veTheGt(b){
  var xong = !GT_ST || !!GT_ST.xong;   // chưa đọc xong tiến độ ⇒ vẽ kiểu "đã xem" (khỏi nháy chữ XEM NGAY)
  return GioiThieu.theHtml(GT_CTX, { xong: xong, han: b.han });
}

var IC_GIO = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';

var GIAY = 1000, PHUT = 60 * GIAY, TIENG = 60 * PHUT;
var GAP_TIENG = 6;

function ngayGach(s){
  var m = /^(\d{1,2})\.(\d{1,2})$/.exec(String(s || '').trim());
  return m ? (m[1] + '/' + m[2]) : String(s || '');
}
function ngayCuaMoc(ms){
  if (ms == null) return '';
  var d = new Date(ms);
  return d.getDate() + '/' + (d.getMonth() + 1);
}
/* Bài khóa KHÔNG có `b.ngay` (khác bài thường) — chỉ có `taoLuc` "YYYY-MM-DD"
   (ngày app đẩy LESSON này lên web, ghi ở `dungBaiKhoaTuDong()`). Đọc bằng
   regex thẳng trên chuỗi, ĐỪNG `new Date(iso)` — giờ UTC lệch múi giờ máy
   học sinh là sai ngày (đúng nếp `mocHan()` bên `chung.js` đọc `taoLuc`). */
function ngayCuaISO(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '').trim());
  return m ? (Number(m[3]) + '/' + Number(m[2])) : '';
}

/* Tên bài giảng thật, cắt bỏ "BÀI GIẢNG N:" thầy gõ ở đầu — chỉ giữ phần
   sau dấu ':' đầu tiên. Chưa có `baiGiang.tieuDe` thì lùi về tên dạng bài
   chung (`A.tenBai`) để KHÔNG BAO GIỜ hiện trống trơn. */
function tenBaiGiang(b){
  if (b.dang === 'KHOA' && b.noiDung && !String((b.baiGiang || {}).tieuDe || '').trim()) return String(b.noiDung).trim();   // 11/10/2026 — lesson CHƯƠNG: tên chương · v1.341.0 tự nhận: không tiêu đề bài giảng
  var bg = b.baiGiang || {};
  var t = String(bg.tieuDe || '').trim();
  if (!t) return A.tenBai(b);
  var i = t.indexOf(':');
  return (i >= 0 ? t.slice(i + 1).trim() : t) || A.tenBai(b);
}

/* Một bài (dạng KHOA) trong bai.json -> một THẺ trên trang này. */
function theTuBai(b){
  var moc = A.mocHan(b);
  var maLs = A.maLesson(b);
  return {
    id: b.id,
    dang: b.dang || '',
    loai: '',
    trang: A.trangCuaBai(b),
    lesson: maLs || 'LESSON',   /* dòng LỚN, lấp lánh */
    chuDe: tenBaiGiang(b),      /* dòng dưới — tên bài giảng đầy đủ, không cắt */
    giao: ngayGach(b.ngay) || ngayCuaISO(b.taoLuc),
    han: A.chuHan(b),
    hanNgan: ngayCuaMoc(moc),
    hanMoc: moc,
    khoa: A.trangThaiThe(b) === 'khoa',
    suaHan: A.daSuaHan(b),
    conHan: A.conHan(b),
    dangHoc: false,          /* ⛔ khóa học chưa có lịch buổi học riêng — xem đầu file */
    bai: [],                 /* ⛔ cố ý để trống — trang này KHÔNG dùng số đếm "cả lớp
                                 xong hết" để tô hào quang xanh lá, xem đầu file */
    khoi: b.khoi || [],       /* vùng điểm (veDiem) đọc thẳng từ đây */
    goc: b,
    stage: false,
    tay: b.tay || '',
    thieu: []
  };
}

function tinhHinhGio(b){
  if (b.khoa) return 'khoa';
  if (b.hanMoc == null) return 'thuong';
  var con = (b.hanMoc - A.gioNay()) / TIENG;
  if (con <= GAP_TIENG) return 'gap';
  if (con <= 24) return '24h';
  return 'thuong';
}

function veHan(b, tt){
  var xongHet = (tt === 'xong');
  var moc = (b.hanMoc == null) ? 0 : b.hanMoc;
  var chu = b.han ? ('Hạn ' + b.han) : 'Chưa đặt hạn';
  var lop = 't-han' + (tt === 'gap' ? ' gap-gio' : (xongHet ? ' da-xong' : ''));
  return '<span class="han-boc"><span class="' + lop + '">' +
      '<span class="han-dong">' + chu + '</span>' +
      '<span class="han-vach"></span>' +
      '<span class="dhho" data-moc="' + moc + '" data-xong="' + (xongHet ? 1 : 0) +
        '" data-khoa="' + (b.khoa ? 1 : 0) + '">…</span>' +
    '</span>' +
    (xongHet ? '<span class="tich-to">✓</span>' : '') +
  '</span>';
}

function veMui(khoa){
  return '<span class="play">' + (khoa
    ? '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10.5" rx="2.2"/>' +
      '<path d="M8.2 10.5V7.4a3.8 3.8 0 0 1 7.6 0v3.1" fill="none" stroke="#fff" stroke-width="2.2"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>') + '</span>';
}

/* ---------- VÙNG ĐIỂM — nút EM ⇄ CẢ LỚP, nhãn ngắn BT/TNBG/SÁCH ---------- */
function nhanRow(k){
  if (k.nhanBuoc) return k.nhanBuoc;   // thiết kế K10 5 — act thuộc bước của lesson CHƯƠNG
  if (k.loai === 'sach') return 'SÁCH' + (k.trang ? ' ' + A.chuAnToan(k.trang) : '');
  var ten = String(k.ten || '').trim();
  // 12/10/2026 — hiểu cả "BÀI TẬP 1: …" (→ BT1) và "BT BỔ SUNG / BÀI TẬP BỔ SUNG: …" (→ BTBS) — Lesson 23 K9 bị cắt "BÀI T…".
  if (/^(?:BT|B[ÀA]I\s*T[ẬA]P)\s*B[ỔO]\s*SUNG/i.test(ten)) return 'BTBS';
  var m = /^(?:BT|B[ÀA]I\s*T[ẬA]P)\s*0*([0-9]+)/i.exec(ten);
  if (m) return 'BT' + m[1];
  if (/QUIZ/i.test(k.mau || '') || /TR[ẮA]C\s*NGHI[ỆE]M/i.test(ten)) return 'TNBG';
  return A.chuAnToan(ten) || 'BT';
}

function mauTheoPhanTram(pt, xong){
  if (xong) return 'm-la';
  if (pt >= 70) return 'm-vang';
  if (pt > 0) return 'm-cam';
  return 'm-do';
}

/* ═══ AVATAR TOP 3 trên hàng CẢ LỚP — PORT nguyên xi từ lop.html (11/09/2026,
   thầy chốt) ═══ Ba bạn điểm cao nhất của act đó, chụm ở cuối vệt màu, hạng 1
   ngoài cùng bên phải. Chưa em nào làm (hoặc chưa đọc xong điểm) thì không
   hiện gì — giống hệt lop.html. ⛔ Bản sao ở `lop.html` — sửa công thức thì
   sửa cả hai. */
var AV_MOC_SO = 3;
function avChuTat(ten){
  var tu = String(ten || '').trim().split(/\s+/).filter(Boolean);
  if (!tu.length) return '?';
  if (tu.length === 1) return tu[0].charAt(0).toUpperCase();
  return (tu[tu.length - 2].charAt(0) + tu[tu.length - 1].charAt(0)).toUpperCase();
}
function avMocHtml(dsDiem, lopGoc){
  var ds = (dsDiem || []).slice();
  if (!ds.length) return '';
  ds.sort(function(a, b){
    if (b.diem !== a.diem) return b.diem - a.diem;
    return (a.giay || 0) - (b.giay || 0);
  });
  return ds.filter(function(e){ return e && e.ten; }).slice(0, AV_MOC_SO)
    .map(function(e, i){
      return '<span class="av-thanh av-moc" data-hang="' + (i + 1) + '" title="' +
        A.chuAnToan(e.ten) + ' · hạng ' + (i + 1) + ' · ' + e.diem + '%">' +
        '<img class="av-anh" src="' + A.chuAnToan(A.avUrl(lopGoc, e.ten)) + '" alt="" onerror="this.remove()">' +
        A.chuAnToan(avChuTat(e.ten)) + '</span>';
    }).join('');
}
/* Đo chiều cao THẬT của mỗi hàng `.td-dong` rồi đặt `--av` — không đặt số
   cứng, hàng co giãn theo `--cao-the`/số hàng. Trần 40px như lop.html.
   ⛔ Gộp nhóm theo `h.parentElement` — nay là `.hang-grp-em`/`.hang-grp-lop`
   (MỘT thẻ bọc CHUNG cho cả khối, xem `veDiem()`), một hộp thật luôn có kích
   thước (chỉ trượt ra ngoài bằng `transform`, không `display:none`) nên đo
   được CẢ HAI khối ngay từ lúc mới vẽ — không cần đợi bấm mới đo đúng cỡ,
   khác hẳn bản trước khi mỗi hàng còn bọc riêng từng thẻ `display:contents`. */
function coAvatarThanh(goc){
  var ds = (goc || document).querySelectorAll('.td-dong');
  if (!ds.length) return;
  var nhom = [];
  Array.prototype.forEach.call(ds, function(h){
    var o = nhom.filter(function(x){ return x.cha === h.parentElement; })[0];
    if (!o) { o = { cha: h.parentElement, hang: [] }; nhom.push(o); }
    o.hang.push(h);
  });
  nhom.forEach(function(o){
    var ob = o.cha.getBoundingClientRect();
    var tam = o.hang.map(function(h){
      var b = h.getBoundingClientRect();
      return { giua: b.top + b.height / 2, cao: b.height };
    });
    if (!tam.length || !tam[0].cao) return;
    var co = 999;
    tam.forEach(function(x, i){
      if (i > 0) co = Math.min(co, tam[i].giua - tam[i - 1].giua);
      if (i < tam.length - 1) co = Math.min(co, tam[i + 1].giua - tam[i].giua);
      co = Math.min(co, (x.giua - ob.top) * 2, (ob.bottom - x.giua) * 2);
    });
    var av = Math.max(10, Math.min(40, Math.round(co - 2)));
    o.hang.forEach(function(h){ h.style.setProperty('--av', av + 'px'); });
  });
}
/* Đặt chỗ cho CỤM avatar MỐC: tâm hạng 1 ghim đúng cuối vệt màu, hạng sau
   lùi sang trái đều nhau; cả cụm kẹp trong hai mép THANH. */
function xepAvatarMoc(goc){
  var bars = (goc || document).querySelectorAll('.td-bar');
  Array.prototype.forEach.call(bars, function(bar){
    var av = bar.querySelectorAll('.av-moc');
    if (!av.length) return;
    var rong = bar.offsetWidth || bar.getBoundingClientRect().width;
    var d = av[0].getBoundingClientRect().width || 14;
    if (!rong || !d) return;
    var n = av.length, r = d / 2;
    var buoc = d * 0.85;
    if (n > 1 && (n - 1) * buoc + d > rong) buoc = Math.max(0, (rong - d) / (n - 1));
    var vet = bar.querySelector('i');
    var ptVet = vet ? (parseFloat(vet.style.width) || 0) : 0;
    var trai = (n - 1) * buoc + r;
    var p = Math.min(rong - r, Math.max(trai, rong * ptVet / 100));
    Array.prototype.forEach.call(av, function(x, i){
      x.style.left = (Math.round((p - buoc * i) * 10) / 10) + 'px';
    });
  });
}
function veLaiAvatarMoc(goc){ coAvatarThanh(goc); xepAvatarMoc(goc); }
function henVeLaiAvatarMoc(goc){
  veLaiAvatarMoc(goc);
  requestAnimationFrame(function(){ veLaiAvatarMoc(goc); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ veLaiAvatarMoc(goc); });
  var tre = (typeof THOI_CHUYEN === 'number' ? THOI_CHUYEN : 420) + 100;
  setTimeout(function(){ veLaiAvatarMoc(goc); }, tre);
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') veLaiAvatarMoc(document);
});

/* Khối trắng trượt sau nút EM/CẢ LỚP đang chọn (`.chon-thumb`) — đo
   `offsetLeft`/`offsetWidth` của nút `.on` rồi đặt `transform`/`width`, vì
   tên học sinh dài ngắn mỗi em một khác, không đặt số cứng được.
   `tucThi` = true: đặt vị trí NGAY, không cho chạy animation (lúc mới vẽ thẻ
   — không thì thumb "bay" từ góc trái vào ngay lần đầu hiện thẻ, không đẹp). */
function dinhViThumb(hop, tucThi){
  var thumb = hop && hop.querySelector('.chon-thumb');
  var on = hop && hop.querySelector('[data-xem].on');
  if (!thumb || !on) return;
  if (tucThi) thumb.style.transition = 'none';
  thumb.style.width = on.offsetWidth + 'px';
  thumb.style.transform = 'translateX(' + on.offsetLeft + 'px)';
  if (tucThi) {
    thumb.getBoundingClientRect();   // ⛔ ép reflow trước khi trả lại transition
    thumb.style.transition = '';
  }
}
function henDinhViThumb(goc){
  (goc || document).querySelectorAll('.chon-xem').forEach(function(hop){
    dinhViThumb(hop, true);
    requestAnimationFrame(function(){ dinhViThumb(hop, true); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function(){ dinhViThumb(hop, true); });
    }
  });
}

function hangSach(k){
  return '<span class="td-dong td-dong-sach">' +
    '<span class="td-ten">' + nhanRow(k) + '</span>' +
    '<span class="td-bar"></span>' +
    '<span class="td-so em-chua">—</span>' +
    '<span class="td-tich"></span></span>';
}

/* ⭐ v1.114.0 (16/09/2026, thầy báo "BT 40 câu mà thẻ hiện 0/100") — MẪU SỐ KHI EM CHƯA
   LÀM = SỐ CÂU/ĐIỂM TỐI ĐA CỦA ĐỀ (`chuan.soCau`, đếm từ nội dung bài giao, luật từng
   template chép theo AWord — xem `soCauTuDoc` trong js/chung.js). Trước đó lùi về
   `chuan.dinh` = 100 là thang PHẦN TRĂM ⇒ đề 40 câu hiện "0/100". Đề không đếm được
   (soCau = 0) mới lùi về `dinh` như cũ. Em đã làm thì vẫn `tho.tong` (mẫu số THẬT của lượt). */
function mauSoDe(chuan){
  if (!chuan) return 0;
  if (chuan.soCau > 0) return chuan.soCau;
  return (!chuan.tru && chuan.dinh > 0) ? chuan.dinh : 0;
}

/* Một hàng ở chế độ EM: SỐ CÂU ĐÚNG / TỔNG SỐ CÂU (thầy chốt, không hiện %).
   Chưa làm thì DUNG=0 và TỔNG = số câu của đề (`mauSoDe`, v1.114.0; không hiện chữ
   "chưa làm" nữa — thầy chốt 11/09/2026). */
function hangEm(k){
  if (k.loai === 'sach') return hangSach(k);
  var ds = DIEM[k.ma] || [];
  var toi = null, khoaTen = A.khoaTen(TOI);
  for (var i = 0; i < ds.length; i++) {
    if (A.khoaTen(ds[i].ten) === khoaTen) { toi = ds[i]; break; }
  }
  var chuan = CHUAN[k.ma];
  var xong = A.xongAct(ds, TOI, chuan);
  var tho = toi && toi.tho ? toi.tho : null;
  var tong = (tho && tho.tong > 0) ? tho.tong : mauSoDe(chuan);
  var dung = tho ? tho.diem : 0;
  var pt = tong > 0 ? Math.round(dung / tong * 100) : 0;
  return '<span class="td-dong">' +
    '<span class="td-ten">' + nhanRow(k) + '</span>' +
    '<span class="td-bar"><i class="' + mauTheoPhanTram(pt, xong) + '" style="width:' + pt + '%"></i></span>' +
    '<span class="td-so' + (xong ? ' m-la' : '') + '">' + dung + '/' + tong + '</span>' +
    '<span class="td-tich">' + (xong ? '✓' : '') + '</span></span>';
}

/* Một hàng ở chế độ CẢ LỚP: số em (cùng theo khóa này) đã xong / sĩ số. */
function hangLop(k){
  if (k.loai === 'sach') return hangSach(k);
  var ds = DIEM[k.ma] || [], chuan = CHUAN[k.ma], n = 0;
  for (var i = 0; i < CA_TINH.length; i++) {
    if (A.xongAct(ds, CA_TINH[i], chuan)) n++;
  }
  var pt = SI_SO > 0 ? Math.round(n / SI_SO * 100) : 0;
  var du = SI_SO > 0 && n >= SI_SO;
  return '<span class="td-dong">' +
    '<span class="td-ten">' + nhanRow(k) + '</span>' +

/* ⭐ 11/10/2026 — THẺ LESSON CHƯƠNG (khóa NỀN TẢNG — Phần A…): mỗi hàng là MỘT BƯỚC (B1 đọc sách · B2/B3 act AWord ·
   B4 video mẫu · B5 quay + gửi Zalo) thay cho vùng điểm act. Bước nào xong đọc từ bản tóm tắt mà
   trang bài ghi trong máy (`awc_khoa_buoc_<id bài>_<mã em>`, bai.html `luuTomTatKhoa`) + điểm AWord thật (act đã giao). */
function hangBuocChuong(nhan, xong, so, tong, dangLam){

    '<span class="td-tich">' + (xong ? '✓' : '') + '</span></span>';

/* ⭐ thiết kế K10 3 (12/10/2026) — TIẾN ĐỘ BƯỚC TỪ MÁY CHỦ: bản tóm tắt `awc_khoa_buoc_…` chỉ có ở máy em đã mở trang bài ⇒
   đổi máy (làm bước trên máy tính, mở trang khóa bằng điện thoại) thì B1/B4/B5 hiện "chưa xong". Nay đọc thêm trường `chuong`
   của `lessonVideoTienDo/<mã em>__<id bài>` (bai.html ghi, đồng bộ nhiều máy từ v1.311.0): 1 lượt đọc/bài chương cho em;
   THẦY (`?gv=1`) đọc cả lớp để vẽ hàng CẢ LỚP. BẢN CHÉP luật xong bước của dashboard `xongBuocTayKh` / bai.html `btXongKhoa`. */
var CHUONG_FS = {};   // id bài -> 'dang' | { <tên em>: {tay:{}, vid:{}} }
function soFsC(v){ return v ? Number(v.integerValue != null ? v.integerValue : v.doubleValue) : NaN; }
function chuongTuFsC(f){
  var r = { tay: {}, vid: {} };
  try {
    var c = f && f.mapValue && f.mapValue.fields; if (!c) return r;
    var tay = (c.tay && c.tay.mapValue && c.tay.mapValue.fields) || {};
    Object.keys(tay).forEach(function(id){ var x = soFsC(tay[id]); if (x > 0) r.tay[id] = x; });
    var vid = (c.vid && c.vid.mapValue && c.vid.mapValue.fields) || {};
    Object.keys(vid).forEach(function(id){
      var m = (vid[id].mapValue && vid[id].mapValue.fields) || {};
      var vs = (m.khuc && m.khuc.arrayValue && m.khuc.arrayValue.values) || [], ds = [];
      for (var i = 0; i + 1 < vs.length; i += 2) ds.push([soFsC(vs[i]), soFsC(vs[i + 1])]);
      r.vid[id] = { tong: soFsC(m.tong) || 0, khuc: ds };
    });
  } catch (e) {}
  return r;
}
function xnTuFsC(j){
  var r = {}, m = (j && j.fields && j.fields.tay && j.fields.tay.mapValue && j.fields.tay.mapValue.fields) || {};
  Object.keys(m).forEach(function(id){ var x = soFsC(m[id]); if (x > 0) r[id] = x; });
  return r;
}
function xongBuocTayC(c, x){
  if (!c) return false;
  if (x.loai === 'zalo') return ((c.xn || {})[x.id] || 0) > 0;   // 12/10/2026 — chỉ THẦY xác nhận (kho lessonXacNhan)
  if (x.loai === 'sach') return (c.tay[x.id] || 0) > 0;
  if (x.loai !== 'video') return false;
  var v = c.vid[x.id]; if (!v || !(v.tong > 0)) return false;
  var g = [], phu = 0;
  v.khuc.filter(function(r){ return isFinite(r[0]) && isFinite(r[1]) && r[1] > r[0]; })
    .sort(function(p, q){ return p[0] - q[0]; })
    .forEach(function(r){ if (g.length && r[0] <= g[g.length - 1][1] + 0.05) g[g.length - 1][1] = Math.max(g[g.length - 1][1], r[1]); else g.push([r[0], r[1]]); });
  g.forEach(function(r){ var a = Math.max(0, r[0]), b2 = Math.min(v.tong, r[1]); if (b2 > a) phu += b2 - a; });
  return phu >= v.tong - 1.5;
}
function laBuocAct(x){ return !!(x.ma && (x.loai === 'acts' || x.loai === 'act')); }
function docChuongFs(g){
  if (CHUONG_FS[g.id]) return;
  CHUONG_FS[g.id] = 'dang';
  var db = (A.CFG && A.CFG.AWORD_DB) || {};
  var ds = (EM && EM.vaiTro === 'gv')
    ? ((KHOA && KHOA.hocSinh) || []).filter(function(h){ return String(h.ma || '').trim(); }).map(function(h){ return { ten: h.ten, ma: A.chuanMa(h.ma) }; })
    : [{ ten: TOI, ma: MA_HS }];
  var ra = {}, i = 0;
  function ke(){
    if (i >= ds.length) return Promise.resolve();
    var h = ds[i++];
    if (!db.projectId || !db.apiKey || !h.ma) return ke();
    var goc = 'https://firestore.googleapis.com/v1/projects/' + db.projectId + '/databases/(default)/documents/';
    var duoi = encodeURIComponent(h.ma + '__' + g.id) + '?key=' + encodeURIComponent(db.apiKey);
    var doc = function(u){ return fetch(u, { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : null; })['catch'](function(){ return null; }); };
    // 12/10/2026 — đọc kèm dấu THẦY xác nhận bước zalo (`lessonXacNhan`, chỉ thầy ghi) ⇒ `xn`
    return Promise.all([doc(goc + 'lessonVideoTienDo/' + duoi), doc(goc + 'lessonXacNhan/' + duoi)])
      .then(function(kq){ var c = chuongTuFsC(((kq[0] && kq[0].fields) || {}).chuong); c.xn = xnTuFsC(kq[1]); ra[h.ten] = c; })
      .then(ke);
  }
  var chay = [];
  for (var k = 0; k < Math.min(6, ds.length); k++) chay.push(ke());
  Promise.all(chay).then(function(){
    CHUONG_FS[g.id] = ra;
    if (!dangDocDiem) dungCot();
    // pop-up kết quả đang mở bài này (tab bước không điểm chờ "đang đọc…") ⇒ vẽ lại
    if (POP && POP.b && POP.b.goc && POP.b.goc.id === g.id && $('#popNen').classList.contains('mo')) { veTabsPop(); veRuotPop(); }
  });
}
/* Hàng CẢ LỚP của một bước (chế độ thầy): số em đang tính đã xong / sĩ số. `n === null` = đang đọc. */
function hangBuocLop(nhan, n, avHtml){

function veDiemChuong(b){

      }

  }
  try { tt = JSON.parse(((window.__thayVao || (EM && EM.xemNhu)) ? sessionStorage : localStorage).getItem('awc_khoa_buoc_' + g.id + '_' + MA_HS) || '{}') || {}; } catch (e) { tt = {}; }
  var bx = tt.bt || {};
  var hang = [];
  (g.bt || []).forEach(function(x, i){
    var m = /^\s*B[UƯ]ỚC\s*(\d{1,2})/i.exec(String(x.tieuDe || ''));
    var nhan = 'B' + (m ? m[1] : (i + 1));
    var xong = (x.loai !== 'zalo' && !!bx[x.id]) || (!laBuocAct(x) && !!fs && xongBuocTayC(fs[TOI], x));   // K10 3 — máy chủ (đổi máy vẫn đúng); zalo chỉ tin dấu thầy
    if (!xong && x.ma && (x.loai === 'acts' || x.loai === 'act')) {

      xong = A.xongAct(ds, TOI, chuan);
      var toi = null, k = A.khoaTen(TOI);
      for (var j = 0; j < ds.length; j++) if (A.khoaTen(ds[j].ten) === k) { toi = ds[j]; break; }
      var tho = toi && toi.tho ? toi.tho : null;
      var tong = (tho && tho.tong > 0) ? tho.tong : mauSoDe(chuan);
      if (!xong) { hang.push(hangBuocChuong(nhan, false, tho ? tho.diem : 0, tong, !!tho)); return; }
    }
    hang.push(hangBuocChuong(nhan, xong, 0, 0, false));

  return '<span class="the-diem"><span class="diem-rows"><span class="hang-grp hang-grp-em">' + hang.join('') + '</span></span></span>';

function veDiem(b){

     (thầy không làm bài ⇒ hàng "của em" toàn 0/0). Hàng cả lớp đặt trong khung `.hang-grp-em` (khung đang hiện sẵn). */

/* ---------- ⭐⭐ v1.113.0 (16/09/2026, thầy chốt "Tab từng BT") — POP-UP KẾT QUẢ ----------
   Bấm VÙNG THANH của thẻ (không phải nút TÊN EM/CẢ LỚP, không phải phần đầu thẻ) ⇒
   pop-up với mỗi act một TAB. Chế độ theo nút đang bật trên thẻ:
     - TÊN EM  ⇒ `veKetQuaEm()`: số câu đúng/tổng (thầy chốt không hiện %), thời gian,
                 hạng của em trong khóa (xếp theo điểm rồi nhanh hơn — cùng luật leaderboard).
     - CẢ LỚP  ⇒ `veCotActPop()`: bảng xếp hạng cả khóa của act đó, em chưa làm đỏ ở cuối,
                 dòng của chính em viền xanh (`.toi`).
   Dashboard có bản chép (`moPopTabAct` — chỉ chế độ CẢ LỚP) — sửa hình dạng thì sửa cả hai. */
var POP = { b: null, acts: [], i: 0, che: 'em' };
function actsCuaThe(b){
  var ds = (b.khoi || []).filter(function(k){ return k.loai === 'act' && k.ma; });
  // thiết kế K10 5+7 — lesson CHƯƠNG: MỖI BƯỚC một tab "BƯỚC n" (theo `bt`), bước không có điểm mang `tay` + `buoc`
  if (b.goc && A.laBaiBuoc(b.goc)) {   // v1.341.0 tự nhận dạng
    ds = b.goc.bt.map(function(x, i){
      var m = /^\s*B[UƯ]ỚC\s*(\d{1,2})/i.exec(String(x.tieuDe || ''));
      var nhan = 'BƯỚC ' + (m ? m[1] : (i + 1));
      if (laBuocAct(x)) return { loai: 'act', ma: x.ma, mau: x.mau, ten: x.tieuDe || x.actTen || nhan, nhanBuoc: nhan };

    });
  }
  return ds;
}
function nhanBuocTheoMa(g, ma){
  var bt = g.bt || [];
  for (var i = 0; i < bt.length; i++) if (bt[i].ma === ma) {
    var m = /^\s*B[UƯ]ỚC\s*(\d{1,2})/i.exec(String(bt[i].tieuDe || ''));
    return 'BƯỚC ' + (m ? m[1] : (i + 1));
  }
  return '';
}
function veHuyPop(hang){
  var mat = ['#F5BE2A', '#B9C4CC', '#CE8845'][hang - 1];

      '" stroke-width="2.4" stroke-linecap="round"/>' +

function chuGiayPop(g){

/* Xếp hạng một act trong khóa: có điểm lên trước (điểm cao, rồi nhanh hơn), chưa làm

/* ⭐ v1.136.0 — gọi thẳng `A.xepHangAct` (luật xếp hạng DUY NHẤT của cả bốn bảng). Khóa học

function khongTinhPop(ma){

function veCotActPop(k){

     trước AWord Đợt 492) TRÀN ô làm cả dòng lệch cột. Cả bảng (mọi dòng một act) cùng nới theo số DÀI NHẤT ⇒ vẫn thẳng cột. */

  return vachActPop(k, daLam + '/' + SI_SO + ' đã làm') + hang;
}
/* Kết quả RIÊNG của em ở một act. Mẫu số = CHUẨN ĐỦ ĐIỂM (như hàng trên thẻ). */
function ketQuaEm(k){
  var ds = DIEM[k.ma] || [], chuan = CHUAN[k.ma];
  var toi = null, khoaTen = A.khoaTen(TOI);
  for (var i = 0; i < ds.length; i++) {
    if (A.khoaTen(ds[i].ten) === khoaTen) { toi = ds[i]; break; }
  }
  var xong = A.xongAct(ds, TOI, chuan);
  var tho = toi && toi.tho ? toi.tho : null;
  var tong = (tho && tho.tong > 0) ? tho.tong : mauSoDe(chuan);
  var dung = tho ? tho.diem : 0;
  var hang = 0;
  if (toi) {
    var xep = xepActPop(k.ma);
    for (var j = 0; j < xep.length; j++) {
      if (!xep[j].chua && A.khoaTen(xep[j].ten) === khoaTen) { hang = j + 1; break; }
    }
  }
  return { co: !!toi, dung: dung, tong: tong, xong: xong, giay: toi ? toi.giay : 0, hang: hang };
}
function veKetQuaEm(k){
  var q = ketQuaEm(k);
  if (!q.co) {
    return vachActPop(k, 'chưa làm') +
      '<div class="pop-trong">Em chưa làm bài này.<br>Bấm vào phần đầu thẻ để mở bài nhé.</div>';
  }
  var pt = q.tong > 0 ? Math.round(q.dung / q.tong * 100) : 0;
  return vachActPop(k, q.dung + '/' + q.tong) +
    '<div class="kq-em">' +
      '<div class="kq-so' + (q.xong ? ' du' : '') + '"><b>' + q.dung + '</b><span>/' + q.tong + '</span><em>CÂU ĐÚNG</em></div>' +
      '<div class="kq-bar"><i class="' + mauTheoPhanTram(pt, q.xong) + '" style="width:' + pt + '%"></i></div>' +
      '<div class="kq-phu"><span>⏱ ' + chuGiayPop(q.giay) + '</span>' +
        '<span class="hang' + (q.hang && q.hang <= 3 ? ' top' : '') + '">Hạng ' + q.hang + '/' + SI_SO + '</span></div>' +
    '</div>';
}
/* ⭐ thiết kế ƯU TIÊN PHẦN CÒN THIẾU (12/10/2026, thầy chốt "mọi nơi") — bấm thanh tiến trình ⇒ pop-up mở ĐÚNG phần lớp còn thiếu
   đầu tiên: pop-up dạng TAB chọn tab đó; dạng CỘT cuộn tới cột đó (máy tính đủ chỗ thì các cột đã nằm ngang, điện thoại cột
   xếp dọc ⇒ cuộn xuống); STAGE chọn chặng SỚM NHẤT còn em chưa xong. BẢN CHÉP ở lop.html · khoa.html · dashboard.html.
   Khung pop-up lúc mở còn đang trượt (transform scale) ⇒ đo bằng rect rồi chia tỉ lệ. */
function cuonPopToi(el){
  var ds = document.getElementById('popDs');
  if (!el || !ds) return;
  requestAnimationFrame(function(){   // chờ khung pop-up hiện (đo lúc còn ẩn ra 0)
    var r = ds.getBoundingClientRect(), s = (r.height / ds.offsetHeight) || 1;
    ds.scrollTop += (el.getBoundingClientRect().top - r.top) / s - 2;
  });
}
function cuonTabPopToi(){
  var bar = document.getElementById('popTabs'), t = bar && bar.querySelector('.pop-tab.on');
  if (!t) return;
  requestAnimationFrame(function(){
    var r = bar.getBoundingClientRect(), s = (r.width / bar.offsetWidth) || 1;
    bar.scrollLeft += (t.getBoundingClientRect().left - r.left) / s - 12;
  });
}
/* Tab này còn thiếu? — chế độ CẢ LỚP: còn em (đang tính) chưa xong; chế độ EM: chính em chưa xong. */
function buocThieuPop(k){
  if (k.tay) {
    var fs = fsChuongPop();
    if (POP.che === 'lop') return !!fs && CA_TINH.some(function(ten){ return !xongTayPop(ten, k, fs); });
    return !xongTayPop(TOI, k, fs);
  }
  if (POP.che === 'lop') {
    var c = CHUAN[k.ma], moc = (c && !c.tru) ? c.dinh : 0;
    return xepActPop(k.ma).some(function(e){ return !e.mien && (e.chua || e.diem < moc); });
  }
  return !ketQuaEm(k).xong;
}
function fsChuongPop(){
  var g = POP.b && POP.b.goc; if (!g) return null;
  var fs = CHUONG_FS[g.id];
  if (!fs) { docChuongFs(g); return null; }
  return fs === 'dang' ? null : fs;
}
function xongTayPop(ten, k, fs){
  if (fs && xongBuocTayC(fs[ten], k.buoc)) return true;
  if (k.buoc.loai === 'zalo') return false;   // 12/10/2026 — zalo chỉ tin dấu thầy (đã xét qua fs ở trên)
  if (A.khoaTen(ten) !== A.khoaTen(TOI)) return false;
  try { var tt = JSON.parse(((window.__thayVao || (EM && EM.xemNhu)) ? sessionStorage : localStorage).getItem('awc_khoa_buoc_' + POP.b.goc.id + '_' + MA_HS) || '{}') || {}; return !!(tt.bt || {})[k.buoc.id]; } catch (e) { return false; }
}
function veCotTayPop(k){
  var fs = fsChuongPop();
  if (!fs) return vachActPop(k, 'đang đọc…') + '<div class="pop-trong">Đang đọc tiến độ của cả lớp…</div>';
  var mien = khongTinhPop();
  var ds = CA_LOP.map(function(ten, i){ return { ten: ten, i: i, mien: mien.indexOf(ten) >= 0, xong: xongTayPop(ten, k, fs) }; });
  ds.sort(function(a, b){ return (a.mien - b.mien) || (b.xong - a.xong) || (a.i - b.i); });
  var n = ds.filter(function(e){ return e.xong && !e.mien; }).length, toi = A.khoaTen(TOI);
  return vachActPop(k, n + '/' + SI_SO + ' đã xong') + ds.map(function(e){

    return '<span class="xh-dong ' + lop + '"' + (e.mien ? ' title="Không tính ở bài này"' : '') + '>' +
      '<span class="xh-hang">' + (e.xong && !e.mien ? '✓' : '–') + '</span>' +
      '<span class="xh-ten">' + A.chuAnToan(e.ten) + '</span>' +
      '<span class="xh-diem">' + (e.xong ? 'Đã xong' : '—') + '</span></span>';
  }).join('');
}
function veEmTayPop(k){
  var xong = xongTayPop(TOI, k, fsChuongPop());
  return vachActPop(k, xong ? 'đã xong' : 'chưa xong') + (xong

}
function veTabsPop(){

function chuoiGio(ms){

    cu = BAI_CU.slice(0, 2);

  }

  // riêng (`.gtk-the`, không có class `.the`) ⇒ bỏ khỏi `dsThe` để chỉ số `.the` ↔ bài bên dưới vẫn khớp.
  $('#cotBai').innerHTML = tren + '<div class="vach"></div>' + cu.map(function(b){ return laTheGt(b) ? veTheGt(b) : veTheCu(b); }).join('');
  dsThe = dsThe.filter(function(b){ return !laTheGt(b); });
  var nutGt = $('#gtkThe');
  if (nutGt) {
    nutGt.onclick = function(){

      if (GT_ST && !GT_ST.xong && !(EM && EM.vaiTro === 'gv'))

  }

  document.querySelectorAll('.the').forEach(function(t, i){

      var n = e.target.closest('[data-xem]');

        henVeLaiAvatarMoc(t);

      if (!b.id || !b.trang) { baoToast('Bài này thầy giao trên giấy, không có trang trên web.'); return; }

       Nút TÊN EM/CẢ LỚP nằm TRONG vùng này: để cú bấm đó nổi lên `t.onclick` ở trên
       (không chặn), còn lại chặn nổi bọt và mở pop-up theo chế độ đang bật. Phần đầu thẻ

/* ---------- ĐỔI BỐ CỤC CHO MƯỢT (FLIP — y hệt lop.html) ---------- */
var THOI_CHUYEN = 420;
function giamChuyenDong(){
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function truotTu(el, r0){
  var r1 = el.getBoundingClientRect();
  if (!r1.width || !r1.height || !r0.width || !r0.height) return;
  var dx = r0.left - r1.left, dy = r0.top - r1.top;
  var sx = r0.width / r1.width, sy = r0.height / r1.height;
  el.style.transition = 'none';
  el.style.transformOrigin = 'top left';
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
  el.getBoundingClientRect();
  el.style.transition = 'transform ' + THOI_CHUYEN + 'ms var(--em)';
  el.style.transform = '';
  setTimeout(function(){ el.style.transition = ''; el.style.transformOrigin = ''; }, THOI_CHUYEN + 60);
}
function chupCho(){
  var chat = document.querySelector('.chat');
  return {
    chat: chat ? chat.getBoundingClientRect() : null,
    the: [].map.call(document.querySelectorAll('.the'), function(t){ return t.getBoundingClientRect(); })
  };
}
function doiBoCucMuot(choCu, veLai){
  var chat = document.querySelector('.chat');
  if (!chat || !choCu || !choCu.chat || giamChuyenDong()) { veLai(); return; }
  veLai();
  var moi = document.querySelectorAll('.the');
  var cu = choCu.the;
  var n = Math.min(moi.length, cu.length);
  for (var i = 0; i < n; i++) truotTu(moi[i], cu[i]);
  truotTu(chat, choCu.chat);
}
var hepTruoc = chatODuoi(), dtTruoc = laDienThoai();
var choTruoc = null, dangDoiBoCuc = false;
window.addEventListener('resize', function(){
  doCaoDau(); doSanChat();
  var hep = chatODuoi(), dt = laDienThoai();
  if (hep !== hepTruoc || dt !== dtTruoc) {
    hepTruoc = hep; dtTruoc = dt;
    dangDoiBoCuc = true;
    doiBoCucMuot(choTruoc, function(){ dungCot(); });
    setTimeout(function(){ dangDoiBoCuc = false; choTruoc = chupCho(); }, THOI_CHUYEN + 80);
    return;
  }
  if (!dangDoiBoCuc) choTruoc = chupCho();
});

  var chuTat = tu.slice(-2).map(function(t){ return t[0]; }).join('').toUpperCase();
  A.gaAvatar($('#nutMenu'), LOP, TOI, chuTat, false);
  A.gaAvatar(document.querySelector('.side-head .av'), LOP, TOI, chuTat, false);
  if (EM && EM.vaiTro === 'gv') { avThay($('#nutMenu')); avThay(document.querySelector('.side-head .av')); }

  var tenTren = document.querySelector('.who .ten');
  if (tenTren) tenTren.textContent = TOI;
  var tenSide = document.querySelector('.side-head .ten');
  if (tenSide) tenSide.textContent = TOI;

  var lopTren = document.querySelector('.who .lop');
  if (lopTren) lopTren.textContent = 'Khóa ' + LOP + ' • Thầy Andrew';
  var lopSide = document.querySelector('.side-head .phu2');
  if (lopSide) lopSide.textContent = 'Khóa ' + LOP;

  var ctTen = document.querySelector('.chat-head .ct-ten');
  if (ctTen) ChatUI.datDau(document.querySelector('.chat-head .ct-av'), ctTen, 'Khóa ' + LOP, LOP);
  var ver = $('#verFoot');
  if (ver) ver.textContent = 'v' + (A.CFG.PHIEN_BAN || '?');

  document.title = 'Khóa ' + LOP + ' · ' + (A.CFG.TEN_SITE || 'Lesson in Andrew Classes');
}

A.napDuLieu().then(function(dl){
  DL = dl;
  EM = A.batBuocDangNhap(dl);
  if (!EM) return;
  TOI = EM.ten; MA_HS = EM.ma;
  LOP_DL = EM.lop;
  if (window.ACOnline) ACOnline.bat('khoa', function(){ return { lop: LOP_DL, ma: MA_HS, ten: TOI }; });   // v1.211.0
  var l = A.lopTheoMa(dl, LOP_DL);
  if (!l) { location.replace('index.html'); return; }   /* mã không còn ở nơi đã nhớ */
  KHOA = l;
  LOP = l.tenGoc || EM.lop;
  LOP_SLUG = avSlugLop(LOP);
  LOP_OBJ = l;
  CA_LOP = A.caLopDayDu(l);
  // ⭐ v1.309.0 — học sinh học thử không vào sĩ số / x/N (vẫn ở CA_LOP để hiện xám cuối bảng xếp hạng)
  CA_TINH = (l.hocSinh || []).filter(function(h){ return !h.thu; }).map(function(h){ return h.ten; });
  SI_SO = CA_TINH.length;
  A.batAvatarKho(LOP, l.hocSinh || [], l.hsDb || []);

  dienDanhTinh();
  doCaoDau(); doSanChat();
  dungCot();                 /* hiện "đang đọc kết quả" trước */

  var dsGoc = A.baiCuaLop(dl, LOP_DL)
    .filter(function(b){ return !EM.thu || A.theChoHocThu(b, EM.vao); });   // v1.309.0 học thử: thẻ từ ngày vào

  /* v1.286.0 — phim giới thiệu khóa mới: chưa xem xong ⇒ TỰ MỞ (chạy tiếp màn dở); xong rồi ⇒ thẻ GIỚI THIỆU
     ⭐ v1.340.0 (15/10/2026, thầy chốt) — chỉ lớp được GIAO bài GIỚI THIỆU (app myLesson, `kieu:'GIOITHIEU'`); qua hạn ⇒ không tự bật
     (thẻ trong danh sách vẫn bấm xem được). Thẻ GIỚI THIỆU nay là MỘT BÀI trong danh sách (`veTheGt`), không còn chỉ hiện lúc khóa trống. */
  GT_BAI = window.GioiThieu && GioiThieu.baiCua ? GioiThieu.baiCua(dsGoc) : null;
  if (GT_BAI) {
    var gtTuBat = A.conHan(GT_BAI) && A.trangThaiThe(GT_BAI) !== 'khoa';
    GT_CTX = { lop: LOP, lopMa: LOP_DL, ma: MA_HS, ten: TOI, vaiTro: EM.vaiTro, xemNhu: !!EM.xemNhu, ban: CA_LOP };
    /* 12/10/2026 — CHỈ thầy với danh tính THẦY (`?gv=1`) mới xem kiểu "xem lại". Xem như em / đăng nhập thay ⇒ đi đường của EM:
       đọc tiến độ phim THẬT của em trên máy chủ (đã xong ⇒ thẻ; đang dở ⇒ mở tiếp đúng màn), thao tác không ghi lên máy chủ. */
    if (EM.vaiTro === 'gv') {
      /* v1.287.0 — thầy: phim TỰ MỞ một lần (có nút Đóng, không ghi gì) để thầy thấy đúng như em; sau đó chỉ có thẻ.
         12/10/2026 (thầy báo "đã xong mấy lần vẫn ra") — dấu "đã tự mở" trước nhớ theo TAB (sessionStorage) mà dashboard/app mở
         trang khóa ở tab/khung MỚI mỗi lần ⇒ lần nào cũng như lần đầu. Nay nhớ theo MÁY (localStorage): mỗi khóa tự mở đúng 1 lần/máy. */
      GT_ST = { xong: true, man: 0 };
      var khoaTab = 'gtk_thay_' + LOP_DL, daMo = false;
      try { daMo = !!(localStorage.getItem(khoaTab) || sessionStorage.getItem(khoaTab)); if (gtTuBat) localStorage.setItem(khoaTab, '1'); } catch (e) {}
      if (!daMo && gtTuBat) GioiThieu.mo(GT_CTX, { lai: true, daXong: true });
    }
    else GioiThieu.docTrangThai(GT_CTX).then(function(st){
      GT_ST = st;
      if (st.xong || !gtTuBat) {
        if (!gtTuBat) GioiThieu.khongApDung(LOP_DL); else GioiThieu.boChe();   // qua hạn ⇒ lần sau khỏi che màn chờ
        if (!dangDocDiem) dungCot();
        return;
      }
      if (!dangDocDiem) dungCot();
      GioiThieu.mo(GT_CTX, { man: st.man, khiXong: function(){ GT_ST = { xong: true, man: 0 }; if (!dangDocDiem) dungCot(); } });
    });
  } else if (window.GioiThieu) GioiThieu.khongApDung(LOP_DL);   // lớp chưa được giao GIỚI THIỆU ⇒ lần sau khỏi che màn chờ

  var ds = dsGoc.map(theTuBai);
  BAI_MOI = null;
  for (var i = 0; i < ds.length; i++) {
    if (ds[i].conHan) { BAI_MOI = ds[i]; break; }
  }
  BAI_CU = ds.filter(function(t){ return t !== BAI_MOI; });

  var maKhacNhau = [];
  ds.forEach(function(b){
    (b.khoi || []).forEach(function(k){
      if (k.loai === 'act' && k.ma && maKhacNhau.indexOf(k.ma) < 0) maKhacNhau.push(k.ma);
    });
  });
  return Promise.all(maKhacNhau.map(function(ma){
    return Promise.all([A.diemCuaAct(ma), A.chuanDiem(ma)]).then(function(r){
      DIEM[ma] = r[0]; CHUAN[ma] = r[1];
    })['catch'](function(){ DIEM[ma] = []; });
  })).then(function(){
    dangDocDiem = false;
    dungCot();
    choTruoc = chupCho();
    // v1.309.0 — học sinh học thử: không có ô chat lớp/khóa
    if (EM.thu) { var chatCot = document.querySelector('.chat-cot'); if (chatCot) chatCot.hidden = true; }
    else noiChat();
  });
})['catch'](function(e){
  dangDocDiem = false;
  if (window.GioiThieu) GioiThieu.boChe();   // v1.287.0 không để màn che chờ của phim giới thiệu đè lên báo lỗi
  $('#cotBai').innerHTML = '<div class="chua-co">' + IC_GIO + 'Chưa đọc được dữ liệu khóa học. Em thử tải lại trang nhé.</div>';
});

/* ---------- SIDEBAR ---------- */
var veMenuChinh = AWVi.dungMenu({
  hop: $('#dsMenu'),
  oSao: document.querySelector('.vi-to'),   // v1.335.0 — HS khóa cũng có ví sao
  layCtx: function(){
    return { khoa: true, lop: LOP, lopMa: LOP_DL, ten: TOI, ma: MA_HS, caLop: CA_LOP, dsLop: (LOP_OBJ && LOP_OBJ.hocSinh) || [], thuLop: A.tenHocThu(LOP_OBJ), baoToast: baoToast };
  }
});
function dongHet(){ document.body.classList.remove('mo-menu'); }
$('#nutMenu').onclick = function(){
  if (veMenuChinh) veMenuChinh();
  document.body.classList.add('mo-menu');
};
$('#phuMo').onclick = dongHet;
document.querySelectorAll('[data-dong]').forEach(function(b){ b.onclick = dongHet; });

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { dongHet(); dongPop(); if (window.ChatUI) ChatUI.dongHet(); }
});

/* ---------- CHAT (kho tin thật — dùng chung js/chat.js với lop.html) ---------- */
var TIN_MAU = [];          /* tin đang hiện = TIN_CU nối TIN_SONG */
// ⭐ "Kéo lên tải thêm" (15/09/2026) — TIN_SONG là phần SỐNG do AWChat.nghe() đổ về (30 tin gần nhất, tự cập nhật);
// TIN_CU là các trang CŨ HƠN tải thêm bằng AWChat.taiThem() — TĨNH. Xem đầu `js/chat.js`.
var TIN_SONG = [], TIN_CU = [], hetCu = false, dangTaiCu = false;
function gopTinMau(){ TIN_MAU = TIN_CU.concat(TIN_SONG); }
var khung = $('#khungChat');

/* ⭐⭐ v1.186.0 (thầy chốt mẫu "bản 12", 30/09/2026) — KHUÔN CHAT KIỂU ZALO DÙNG CHUNG: js/chat-ui.js + css/chat-ui.css.
   Vẽ tin, cảm xúc (thả nhiều lần, 6 loại, tối đa 10/loại), trả lời, thu hồi, ô nhập có hình emoji, @ nhắc tên,
   khay emoji/sticker, giữ tin trên điện thoại — TẤT CẢ nằm trong chat-ui.js, trang này chỉ nối vào kho (AWChat).
   Bản vẽ tay cũ (veTin/cụm cảm xúc/cụm xoá) đã bỏ — cùng lúc ở lop.html, khoa.html, dashboard.html. */
function soMauAv(ten){ var s = 0; ten = String(ten || ''); for (var i = 0; i < ten.length; i++) s += ten.charCodeAt(i); return s; }
var UI_CHAT = ChatUI.tao({
  khung: khung, chan: document.querySelector('.chat-foot'), idNhap: 'oChat',
  toi: { get khoa(){ return MA_HS; }, get ten(){ return TOI; } },
  get laThay(){ return MA_HS === 'GV'; },
  laCuaToi: function(t){ return !!(t.ma && MA_HS && t.ma === MA_HS); },
  av: function(t){
    if (t.vaiTro === 'gv') return '<span class="av" data-uid="quantri_thay" data-ten="Thầy Andrew" style="background:#0E7C6E">GV<img class="av-anh" src="assets/avatar-tron.jpg" alt="" onerror="this.remove()"></span>';
    return veAv(String(t.ten || '?'), soMauAv(t.ten));
  },
  nhan: function(t){ return t.vaiTro === 'gv' ? '<span class="cu-nhan">THẦY</span>' : ''; },
  dsNhac: function(){ return CA_TINH.concat(['Thầy Andrew']); },   // v1.309.0 bỏ em học thử (không ở chat)
  gui: function(g){
    if (KHAN_CAP_CHAT) return Promise.reject(Object.assign(new Error('khoa'), { code: 'awc/chat-khoa' }));
    if (camChatCon()) return Promise.reject(Object.assign(new Error('cam'), { code: 'awc/bi-cam' }));   // v1.216.0
    return AWChat.gui(LOP_DL, Object.assign({ ten: TOI, ma: MA_HS, vaiTro: (EM && EM.vaiTro) || 'hs' }, g));
    /* KHÔNG tự chèn tin vào khung: `onSnapshot` bắn về ngay sau đó, chèn tay là tin hiện HAI LẦN. */
  },
  thachDau: function(){ return MA_HS && MA_HS !== 'GV' ? LOP_DL : ''; },   // ⚔ v1.348.0 — nút thách đấu bạn đang online (js/the-td.js)
  lopGiai: function(){ return LOP_DL || ''; },   // ⭐ v1.351.0 — dải ghim giải đấu đầu khung chat (js/the-td.js)
  datCx: function(t, v){ if (camChatCon()) return Promise.reject(Object.assign(new Error('cam'), { code: 'awc/bi-cam' })); return AWChat.datCx(LOP_DL, t.id, MA_HS, v); },
  ghiXem: function(luc){ return AWChat.ghiXem(LOP_DL, MA_HS, TOI, luc); },   // v1.210.0 — "đã xem" tin cuối
  thuHoi: function(t){ return AWChat.thuHoi(LOP_DL, t.id, MA_HS === 'GV'); },
  xoa: function(t){ return AWChat.xoa(LOP_DL, t.id); },
  loi: function(e){ baoToast(typeof e === 'string' ? e : AWChat.chuLoi(e)); },
  trong: 'Khóa mình chưa ai nhắn gì.<br>Em mở lời trước nhé!',
  khiGo: function(){ if (typeof doSanChat === 'function') doSanChat(); },
  veLaiTuKho: function(){ veChat(); }
});
/* Thầy đăng nhập thay em / xem như em (js/thay-vao.js): chat CHỈ ĐỌC (tin sẽ mang tên em + dấu máy của thầy). */
if (window.__thayVao) UI_CHAT.datChiXem(true, 'Đang mở thay em — chat chỉ để đọc.');

// ⭐ Dải nhỏ ở ĐẦU khung: "Đang tải tin cũ hơn…" / "— Đã đến tin đầu tiên —". Không tính vào TIN_MAU.
function veDauTrangCu(){
  if (dangTaiCu) return '<div class="tai-cu">Đang tải tin cũ hơn…</div>';
  if (hetCu) return '<div class="tai-cu">— Đã đến tin đầu tiên —</div>';
  return '';
}
function veChat(){ UI_CHAT.ve(TIN_MAU, veDauTrangCu()); }

// Kéo lên sát đầu khung chat → tải thêm TOI_DA_TIN_THEM tin cũ hơn, MỘT LẦN (không phải kênh sống — xem `AWChat.taiThem()`).
// Giữ nguyên vị trí đang đọc: đo chiều cao TRƯỚC/SAU rồi bù `scrollTop`.
function taiThemCu(){
  if (dangTaiCu || hetCu || !TIN_MAU.length) return;
  // ⛔ Đo NGAY LÚC NÀY, TRƯỚC khi vẽ banner "Đang tải…" (đo sau thì lệch đúng chiều cao banner ~33px, đo thật 15/09).
  var caoTruoc = khung.scrollHeight, cuonTruoc = khung.scrollTop;
  dangTaiCu = true;
  veChat();
  AWChat.taiThem(LOP_DL, TIN_MAU[0].luc, function(ds){
    dangTaiCu = false;
    if (!ds.length) { hetCu = true; veChat(); return; }
    TIN_CU = ds.concat(TIN_CU);
    gopTinMau();
    var kieuCuonCu = khung.style.scrollBehavior;
    khung.style.scrollBehavior = 'auto';      // chèn tin cũ không được cuộn mượt
    veChat();
    khung.scrollTop = khung.scrollHeight - caoTruoc + cuonTruoc;
    khung.style.scrollBehavior = kieuCuonCu;
  }, function(e){
    dangTaiCu = false;
    veChat();
    baoToast(AWChat.chuLoi(e));
  });
}
khung.addEventListener('scroll', function(){
  if (khung.scrollTop < 60) taiThemCu();
});

function mocTinCuoi(){
  var l = 0;
  TIN_MAU.forEach(function(t){ var x = Number(t.luc) || 0; if (x > l) l = x; });
  return l;
}
function capNhatChamTin(){
  var l = mocTinCuoi();
  A.datMocTinMoi(LOP_DL, l);
  A.veChamDo(!!l && l > A.mocDaXem(LOP_DL, MA_HS));
  /* ⭐ thiết kế ĐT 8 (thầy chốt) — số trên icon Tin nhắn = số tin CHƯA XEM của lớp này (không tính tin của chính em). Đọc ở trang
     Tin nhắn (cùng khoá "đã xem") là số tự hết. Không tốn thêm lượt đọc: đếm trên tin đang có sẵn. */
  /* v1.253.0 — sổ chưa đọc CHUNG (js/tn-pop-ds.js) đã chạy ⇒ nó đếm số CUỘC chưa đọc (lớp + chat riêng, mọi máy); đếm cũ chỉ là dự phòng. */
  if (window.NWB && !(window.TnPop && TnPop.soChay)) {
    var xem = A.mocDaXem(LOP_DL, MA_HS), n = 0;
    TIN_MAU.forEach(function(t){ if ((Number(t.luc) || 0) > xem && !(t.ma && t.ma === MA_HS)) n++; });
    NWB.datSo('tinNhan', n);
  }
}
/* v1.253.0 — "đã xem" đổi (xem ở máy khác ⇒ mốc kho chép xuống máy, hoặc vừa xem ở trang này) ⇒ chấm đỏ avatar tính lại */
window.addEventListener('ac-tn-xem', function(){ capNhatChamTin(); });
function danhDauDocChat(){
  var l = mocTinCuoi();
  if (!l) return;
  A.danhDauDaXem(LOP_DL, MA_HS, l);
  A.veChamDo(false);
}
/* 🚨 27/09/2026 — CÔNG TẮC KHẨN CẤP (js/chat.js khối "CÔNG TẮC KHẨN CẤP"): thầy khoá chat mọi lớp ⇒ ô nhập chỉ đọc,
   nút gửi tắt. Mở khoá là tự trở lại, không cần tải trang. */
var KHAN_CAP_CHAT = false;
/* 🔇 v1.216.0 — THẦY CẤM CHAT RIÊNG EM (js/chat.js khối "CẤM CHAT TỪNG EM"): kho classChatCam/<lớp>/em/<mã em>, chỉ em + thầy đọc.
   Đang cấm ⇒ ô nhập đóng băng "Em đang bị cấm chat."; hết giờ (den) tự mở lại — hẹn giờ theo giờ chuẩn, luật kho cũng tự hết hạn. */
var CAM_CHAT = null, henCamChat = null, goCamChat = null;
function camChatCon(){ return CAM_CHAT && AWChat.camChuan ? AWChat.camChuan(CAM_CHAT) : null; }
function veKhoaChat(){
  clearTimeout(henCamChat);
  var cam = camChatCon();
  if (KHAN_CAP_CHAT) UI_CHAT.khoa(true, 'Chat đang tạm khoá, em quay lại sau nhé.');
  else if (cam) UI_CHAT.khoa(true, 'Em đang bị cấm chat.');
  else UI_CHAT.khoa(false);
  if (cam) henCamChat = setTimeout(veKhoaChat, Math.max(1000, Math.min(cam.den - (window.gioChuan ? window.gioChuan() : Date.now()) + 1500, 2000000000)));
}
function ngheCamChat(){
  if (goCamChat) { goCamChat(); goCamChat = null; }
  CAM_CHAT = null;
  if (!window.AWChat || !AWChat.ngheCam) return;
  goCamChat = AWChat.ngheCam(LOP_DL, MA_HS, function(x){ CAM_CHAT = x; veKhoaChat(); });
}
(function(){
  if (!window.AWChat || !AWChat.ngheKhanCap) return;
  AWChat.ngheKhanCap(function(k){
    KHAN_CAP_CHAT = k.khoaChat;
    veKhoaChat();
  });
})();

function noiChat(){
  TIN_CU = []; hetCu = false; dangTaiCu = false;   // phòng mới, quên trang cũ đã tải
  khung.innerHTML = '<div class="chat-cho">Đang mở phòng trò chuyện…</div>';
  ngheCamChat();   // v1.216.0 — em có đang bị thầy cấm chat không
  AWChat.nghe(LOP_DL, function(ds){
    TIN_SONG = ds;
    gopTinMau();
    veChat();
    capNhatChamTin();
  }, function(e){
    khung.innerHTML = '<div class="chat-cho">' + chuAnToan(AWChat.chuLoi(e)) + '</div>';
    UI_CHAT.khoa(true, 'Chưa mở được phòng chat.');
  });
  UI_CHAT.datXem({});   // v1.210.0 — "đã xem" tin cuối (gọi SAU nghe(): nghe() tự tắt kênh đã xem cũ)
  if (AWChat.ngheXem) AWChat.ngheXem(LOP_DL, function(m){ UI_CHAT.datXem(m); });
}

/* Bấm vào chỗ TRỐNG trong khung chat → con trỏ nhảy vào ô nhập. */
khung.addEventListener('click', function(e){
  if (e.target === khung || e.target.classList.contains('cu-ds') || e.target.classList.contains('cu-hang')) UI_CHAT.focus();
});
/* ⭐ v1.37.0 — bấm bất cứ chỗ nào trong khung trò chuyện = "em đã đọc" ⇒ tắt chấm đỏ ở mọi avatar. Gõ vào ô nhập cũng tính. */
(function(){
  var kc = document.querySelector('.chat');
  if (kc) kc.addEventListener('pointerdown', danhDauDocChat);
  $('#oChat').addEventListener('focus', danhDauDocChat);
})();

var henToast = null;
function baoToast(chu){
  var t = $('#toast');
  t.textContent = chu;
  t.classList.add('hien');
  clearTimeout(henToast);
  henToast = setTimeout(function(){ t.classList.remove('hien'); }, 2600);
}

setInterval(nhipDongHo, 1000);
</script>
