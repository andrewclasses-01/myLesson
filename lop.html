        của mình; các em giữa chia đều theo điểm giữa hai mốc đó.
     3. KHÔNG BAO GIỜ ĐÈ NHAU — gần nhất chỉ được CHẠM CẠNH, kể cả khi trùng điểm.

   ⛔⛔ Luật 1+2 là THƯỚC RIÊNG TỪNG ĐỘI (mốc phải = tổng đội, mỗi đội một khác). Nó ĐÈ LÊN
   luật "ai điểm cao đứng cao xuyên đội" của bản trước — thầy đã biết và vẫn chọn (02/09).
   ⇒ ĐỪNG so vị trí avatar giữa HAI ĐỘI khác nhau; muốn so điểm cá nhân thì đọc số trong
   tooltip. Xem GHI CHU DU AN.md mục 02/09 đợt 3.

   ⛔ Chạy SAU `coAvatarThanh` (cần biết đường kính) và sau khi thanh đã có bề ngang thật.
   ⛔ Bản sao ở `dashboard.html` và `sp-chitiet.html` — sửa là sửa cả ba. */
/* ⛔⛔ ĐO NGAY SAU KHI VẼ LÀ CHƯA CHẮC ĐÚNG. Lúc đó font Montserrat có thể chưa tải xong, nên
   chiều cao hàng và bề ngang thanh vẫn là số của font dự phòng. Đo thật 02/09: avatar tính ra
   **15,6px** trong khi cỡ đúng là **33px**, và em cao điểm nhất thò ra ngoài vệt màu 9px —
   nhìn thì tưởng sai công thức, thật ra chỉ là đo quá sớm.
   ⇒ Đo lại ở BA mốc: ngay lập tức · nhịp vẽ kế tiếp · lúc trình duyệt báo font đã xong.
   ⛔ Đừng đổi sang ResizeObserver: chính việc đặt `--av` làm kích thước đổi ⇒ tự gọi lại mình
   vô tận, phải bịa thêm chốt so sánh. Ba mốc cố định vừa rẻ vừa không vòng lặp. */
function veLaiAvatar(goc){ coAvatarThanh(goc); xepAvatarThanh(goc); xepAvatarMoc(goc); }
/* ⭐ v1.58.0 — trang mở trong tab NỀN thì thanh chưa có bề ngang thật lúc đo; tab hiện lại thì đo lại. */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') veLaiAvatar(document);
});
function henVeLaiAvatar(goc){
  veLaiAvatar(goc);
  requestAnimationFrame(function(){ veLaiAvatar(goc); });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function(){ veLaiAvatar(goc); });
  }
  /* ⭐ v1.58.0 — MỐC THỨ TƯ: SAU KHI THẺ TRƯỢT XONG. Đo thật 03/09 (bàn thử 8137, lớp B1-A (H)):
     ba mốc trên đều rơi vào lúc thẻ còn đang trượt/co giãn theo lối FLIP (`THOI_CHUYEN` 420ms,
     xem "ĐỔI BỐ CỤC CHO MƯỢT") — thanh đo được 254px trong khi bề ngang thật là 508px ⇒ cả hàng
     avatar dồn về nửa trái (em cao nhất đứng giữa thanh). Kéo cửa sổ một cái là đúng ngay (vì
     có `resize`), tức là chỉ thiếu MỘT lượt đo muộn. Hai mốc muộn: ngay sau FLIP và 1,2 giây
     (mạng chậm/ảnh về muộn). Rẻ (chỉ đọc DOM) và không tự gọi lại mình. */
  var tre = (typeof THOI_CHUYEN === 'number' ? THOI_CHUYEN : 420) + 100;
  setTimeout(function(){ veLaiAvatar(goc); }, tre);
  setTimeout(function(){ veLaiAvatar(goc); }, 1200);
}

/* ═══ (02/09 đợt 4 — thầy chốt) AVATAR TOP 3 TRÊN THANH BÀI THƯỜNG ═══════════════════════
   ⭐ v1.61.0 (04/09/2026 — thầy chốt) — TRƯỚC ĐÂY MỘT avatar (hạng 1), NAY BA: ba bạn điểm
   cao nhất của act đó, CHỤM Ở CUỐI VỆT MÀU, hạng 1 ngoài cùng bên phải (đúng chỗ avatar cũ

   KHÔNG hiện gì (thầy chốt 02/09, giữ nguyên).

   ⛔ Hoà điểm thì lấy em LÀM NHANH HƠN — đúng luật bảng xếp hạng act đang chạy (`gopTotNhat`
   xếp `diem` giảm dần rồi `giay` tăng dần), để avatar trên thanh KHỚP với ba hạng đầu trong

   ⛔ Đừng nhầm hai thứ trên cùng một thanh: VỆT MÀU đo "bao nhiêu em đã xong / sĩ số", còn

var AV_MOC_SO = 3;   /* v1.61.0 — bao nhiêu bạn trên một thanh */
function avMocHtml(dsDiem, lopGoc){

  if (!ds.length) return '';
  ds.sort(function(a, b){

    return (a.giay || 0) - (b.giay || 0);
  });
  /* ⛔ Lọc em không tên TRƯỚC khi cắt 3, không thì một bản ghi hỏng ăn mất một suất. */

        A.chuAnToan(avChuTat(e.ten)) + '</span>';

/* Đặt chỗ cho CỤM avatar MỐC: tâm hạng 1 ghim đúng cuối vệt màu, hạng sau lùi sang trái đều
   nhau; cả cụm kẹp trong hai mép THANH để không đè sang cột tên bên trái hay cột số bên phải.
   ⛔ Khác hẳn `xepAvatarThanh` của SP CHECK (avatar rải theo ĐIỂM RIÊNG từng em).
   ⛔ ĐỪNG ĐẶT SỐ CỨNG cho bước lùi: cột thanh co tới `minmax(56px,1fr)`, mà đường kính avatar
   lại do `coAvatarThanh` đo theo chiều cao hàng. Số cứng là chỗ tràn chỗ thừa — bước lùi phải
   TỰ CO cho cụm vừa lòng thanh. */
function xepAvatarMoc(goc){
  var bars = (goc || document).querySelectorAll('.td-bar');
  Array.prototype.forEach.call(bars, function(bar){
    var av = bar.querySelectorAll('.av-moc');   /* đã theo đúng thứ tự hạng 1 → 3 */
    if (!av.length) return;
    var rong = bar.offsetWidth || bar.getBoundingClientRect().width;   // v1.58.0 — offsetWidth không dính transform scale lúc thẻ đang trượt (FLIP)
    var d = av[0].getBoundingClientRect().width || 14;
    if (!rong || !d) return;
    var n = av.length, r = d / 2;
    /* ⭐ v1.61.1 — thầy chốt 04/09: bản đầu để `0.62` (chồng mí 38%) thì mặt hai bạn sau bị
       che gần hết. Nay `0.85` = chồng mí ~15%, chỉ còn chớm vành tai. */
    var buoc = d * 0.85;
    if (n > 1 && (n - 1) * buoc + d > rong) buoc = Math.max(0, (rong - d) / (n - 1));
    var vet = bar.querySelector('i');
    var ptVet = vet ? (parseFloat(vet.style.width) || 0) : 0;
    /* Tâm hạng 1 không được lùi quá trái (cụm thò khỏi thanh) cũng không quá phải. */
    var trai = (n - 1) * buoc + r;
    var p = Math.min(rong - r, Math.max(trai, rong * ptVet / 100));
    Array.prototype.forEach.call(av, function(x, i){
      x.style.left = (Math.round((p - buoc * i) * 10) / 10) + 'px';
    });
  });
}

var TRAN_DOI_AV = 200;   /* thanh đầy ở 200 lỗi — cùng mốc với `tinhDoiSp` */
function xepAvatarThanh(goc){
  var bars = (goc || document).querySelectorAll('.doi-bar');
  Array.prototype.forEach.call(bars, function(bar){
    var av = bar.querySelectorAll('.av-thanh');
    if (!av.length) return;
    var rong = bar.offsetWidth || bar.getBoundingClientRect().width;   // v1.58.0 — offsetWidth không dính transform scale lúc thẻ đang trượt (FLIP)
    if (!rong) return;
    var vet = bar.querySelector('i');
    var ptVet = vet ? (parseFloat(vet.style.width) || 0) : 100;
    var cuoiVet = rong * ptVet / 100;
    /* ⛔ Gỡ cỡ riêng của lần chạy trước RỒI mới đo, không thì mỗi lần chạy lại lấy đúng cái
       cỡ đã thu nhỏ làm chuẩn và thu nhỏ tiếp — vài lần là avatar teo mất. */
    bar.style.removeProperty('--av');
    var dHang = av[0].getBoundingClientRect().width || 14;
    /* ⭐ v1.58.0 (03/09/2026 — thầy chốt): KHÔNG thu nhỏ avatar theo vệt màu nữa. Bản 02/09
       lấy đường kính = vệt màu ÷ số em, nên cùng một loại bài SP CHECK mà thẻ điểm thấp
       (vệt 40px, 4 em) ra avatar 10px còn thẻ khác 24-30px — thầy coi đó là LỖI (03/09).
       Nay MỌI thanh giữ đúng cỡ của hàng (`--av` do `coAvatarThanh` đo); vệt màu không đủ
       chỗ thì NỚI mép phải ra vùng trống (tối đa tới hết thanh), chạm cạnh chứ không đè —
       thanh cũng không đủ thì mới đành rải đều cho chạm nhau (nhánh 'rải đều' bên dưới). */
    var d = dHang;
    var r = d / 2;
    /* Tâm avatar phải cách mép ít nhất BÁN KÍNH thì cả vòng tròn mới nằm gọn trong vệt màu */
    var lo = r, hi = Math.max(lo, cuoiVet - r);
    var can = lo + (av.length - 1) * d;
    if (can > hi) hi = Math.min(Math.max(lo, rong - r), can);
    var ds = Array.prototype.slice.call(av).map(function(e){
      return { e: e, so: +e.dataset.so || 0, luc: +e.dataset.luc || 0 };
    });
    /* Điểm thấp về bên trái. TRÙNG ĐIỂM: em nộp SỚM hơn đứng về phía điểm cao. */
    ds.sort(function(a, b){ return (a.so - b.so) || (b.luc - a.luc); });
    var minS = ds[0].so, maxS = ds[ds.length - 1].so;
    var pMin = Math.min(hi, Math.max(lo, rong * (minS / TRAN_DOI_AV)));
    ds.forEach(function(x){
      x.p = (maxS === minS) ? hi : pMin + (x.so - minS) / (maxS - minS) * (hi - pMin);
    });
    /* Giãn ra cho không em nào đè em nào: tâm cách tâm ít nhất ĐÚNG MỘT ĐƯỜNG KÍNH. */
    var buoc = d;
    if (ds.length > 1 && (ds.length - 1) * buoc >= hi - lo) {
      /* Vệt màu quá ngắn, không đủ chỗ xếp hàng ⇒ rải đều cả dải (chạm nhau là cùng) */
      ds.forEach(function(x, i){ x.p = lo + i * (hi - lo) / (ds.length - 1); });
    } else {
      for (var i = 1; i < ds.length; i++) {
        if (ds[i].p < ds[i - 1].p + buoc) ds[i].p = ds[i - 1].p + buoc;
      }
      /* Đẩy phải xong có thể lòi ra khỏi vệt màu ⇒ ghim em cuối vào mép rồi đẩy ngược lại */
      if (ds[ds.length - 1].p > hi) {
        ds[ds.length - 1].p = hi;
        for (var j = ds.length - 2; j >= 0; j--) {
          if (ds[j].p > ds[j + 1].p - buoc) ds[j].p = ds[j + 1].p - buoc;
        }
      }
      if (ds[0].p < lo) {
        var bu = lo - ds[0].p;
        ds.forEach(function(x){ x.p = Math.min(hi, x.p + bu); });
      }
    }
    ds.forEach(function(x){ x.e.style.left = (Math.round(x.p * 10) / 10) + 'px'; });
  });
}
/* Chữ tắt khi em chưa có ảnh: 2 chữ đầu của HAI TỪ CUỐI ("HOÀNG CHI" → "HC") */
function avChuTat(ten){
  var tu = String(ten || '').trim().split(/\s+/).filter(Boolean);
  if (!tu.length) return '?';
  if (tu.length === 1) return tu[0].charAt(0).toUpperCase();
  return (tu[tu.length - 2].charAt(0) + tu[tu.length - 1].charAt(0)).toUpperCase();
}

function veDoiSpKhoi(b){
  var doiSp = b.doiSp || [];
  /* ⛔ Ảnh nằm theo TÊN GỐC có gạch ("B2-B") — biến `LOP`, KHÔNG phải `LOP_DL` ("B2B").
     Xem khối chú thích "HAI TÊN LỚP, đừng lẫn" chỗ nhận dữ liệu. */
  var lopGoc = LOP || LOP_DL;
  var thanh = doiSp.map(function(d){
    return '<span class="doi-dong">' +
      '<span class="doi-ten" title="' + A.chuAnToan(d.ten) + '">' + A.chuAnToan(d.ten) + '</span>' +
      '<span class="doi-bar"><i class="' + d.mau + '" style="width:' + d.pt + '%"></i>' +
        avThanhHtml(d, lopGoc) + '</span>' +
      '<span class="doi-so ' + d.mau + '">' + d.tong + '</span>' +
    '</span>';
  }).join('');

  var lopSo = ' doi' + Math.min(Math.max(doiSp.length, 2), 5);
  return '<span class="the-diem' + lopSo + '">' + thanh + '</span>';
}

/* ---------- CẮT CỘT "CHƯA XONG BÀI" CHO VỪA CHỖ (v17) ----------
   Chiều cao thẻ là cố định, còn phần trên (số dòng act–thanh–số lượng, có
   hay không có dòng CHÚ Ý) thì đổi theo từng bài ⇒ chỗ trống dành cho cột
   tên cũng đổi theo. Nên đo chỗ trống THẬT rồi bỏ bớt tên từ dưới lên, chứ
   không ấn định trước một con số.
   ⛔ Không dùng scrollHeight để đo: .khoi-thieu căn giữa theo chiều dọc nên
   phần tràn chia đều hai đầu, scrollHeight chỉ đếm phần tràn xuống dưới —
   đo kiểu đó là thiếu một nửa. Phải CỘNG chiều cao thật của từng khối con. */
function caoCaLe(el){
  if (!el) return 0;
  var st = getComputedStyle(el);
  return el.offsetHeight + (parseFloat(st.marginTop) || 0) + (parseFloat(st.marginBottom) || 0);
}
function datDongThem(khoi, con){
  var them = khoi.querySelector('.them');
  if (con <= 0) { if (them) khoi.removeChild(them); return; }
  if (!them) {
    them = document.createElement('span');
    them.className = 'them';
    khoi.appendChild(them);
  }
  them.textContent = '+' + con + ' bạn nữa';
}
function vuaCotThieu(khoi){
  var ds = khoi.querySelector('.ds-thieu');
  if (!ds) return;
  var tong = parseInt(khoi.getAttribute('data-tong'), 10) || (ds.children.length / 2);
  var canDung = function(){
    return caoCaLe(khoi.querySelector('.tieu')) + caoCaLe(ds) +
           caoCaLe(khoi.querySelector('.them'));
  };
  var soHang = ds.children.length / 2;
  datDongThem(khoi, tong - soHang);
  var vong = 0;
  while (soHang > 1 && canDung() > khoi.clientHeight && vong++ < 40) {
    ds.removeChild(ds.lastElementChild);   // ô số
    ds.removeChild(ds.lastElementChild);   // tên
    soHang--;
    datDongThem(khoi, tong - soHang);
  }
}
function vuaMoiCotThieu(){
  document.querySelectorAll('.khoi-thieu').forEach(vuaCotThieu);
}

/* ---------- BA NHÃN RỘNG BẰNG NHAU + CỘT TÊN VỪA KHÍT (v1.15.0) ----------
   Thầy chốt 25/08/2026: "WORDS 1 · WORDS 2 · PRONUNC có độ rộng bằng nhau, rồi
   kéo dài thanh tiến trình để lấp chỗ trống vừa tạo ra".

   Cách làm: ĐO chữ thật rồi giãn nhẹ (letter-spacing) mấy nhãn ngắn cho bằng
   nhãn dài nhất trong NHÓM CHUẨN, sau đó hạ `--cot-ten` đúng bằng bề ngang ấy.

   ⭐⭐ v1.47.0 (thầy chốt 02/09/2026) — ĐO THEO TỪNG THẺ, KHÔNG CÒN CHUNG CẢ TRANG.
   `--cot-ten` nay đặt lên chính `.the-diem` của từng thẻ. Hai chỗ hỏng của lối cũ:
     · Thẻ KHÔNG có nhãn chuẩn nào (ví dụ chỉ mỗi "QUIZ") thì hàm BỎ HẲN biến ⇒
       rơi về số cứng 112px trong CSS, trong khi chữ QUIZ chỉ ~30px ⇒ dôi ~80px
       trống hoác giữa chữ và thanh (thầy chụp ảnh báo 02/09). Nay lấy luôn bề
       ngang nhãn dài nhất CỦA THẺ ĐÓ, chặn trần bằng đúng số cũ của CSS.
     · Một biến chung cho cả trang nghĩa là thẻ "QUIZ" phải gánh bề ngang của
       thẻ "PRONUNCIATION" nằm bên dưới nó.
   ⛔ HỆ QUẢ THẦY ĐÃ BIẾT VÀ VẪN CHỌN: thanh của hai thẻ có nhãn dài ngắn khác
   nhau sẽ KHÔNG thẳng hàng nhau nữa. Đừng "sửa cho nhất quán" — đó là cái giá
   đổi lấy việc không còn khoảng chết.

   ⛔ CHỈ giãn nhãn thuộc NHÓM CHUẨN (`WORDS n` · `PRONUNC`). Ngăn thầy tự gõ
   tên có thể dài gấp đôi — gộp nó vào phép lấy max là WORDS 1 bị giãn toác ra
   như chữ bảng hiệu. Nhãn lạ để nguyên, vẫn cắt "…" như cũ.
   ⛔ letter-spacing cộng thêm một khe SAU CẢ CHỮ CUỐI ⇒ chia cho SỐ KÝ TỰ, không
   phải (số ký tự − 1). Chia sai là mỗi nhãn dôi ra đúng một khe, ba nhãn lệch.
   ⛔ Phải đo trên chính phần tử thật (mỗi bề ngang màn hình một cỡ chữ khác) và
   chỉ đo khi font đã nạp — Montserrat về muộn thì con số đo được lệch hẳn. */
var NHAN_CHUAN = /^(WORDS(\s+\d+)?|PRONUNC)$/;
function canhNhanO(){
  var ds = [].slice.call(document.querySelectorAll('.td-ten'));
  if (!ds.length) return;

  /* Thước đo: một ô ẩn mang ĐÚNG kiểu chữ của nhãn, không giãn chữ. */
  var thuoc = document.getElementById('doNhan');
  if (!thuoc) {
    thuoc = document.createElement('span');
    thuoc.id = 'doNhan';
    thuoc.style.cssText = 'position:absolute; left:-9999px; top:0; white-space:pre;'
      + ' visibility:hidden; pointer-events:none';
    document.body.appendChild(thuoc);
  }
  /* ⛔ XOÁ phần giãn của lượt trước TRƯỚC KHI đọc kiểu chữ — không thì lượt sau
     đọc phải letter-spacing do chính mình vừa đặt và cộng dồn mãi. */
  ds.forEach(function(e){ e.style.letterSpacing = ''; });

  /* ⛔ Đừng chép bằng thuộc tính gộp `font`: Chrome trả chuỗi RỖNG cho nó ở
     nhiều trường hợp, chép xong thước đo lại về cỡ chữ mặc định 16px. Chép
     từng phần thì chắc chắn. Cũng phải chép letter-spacing GỐC của CSS (.02em)
     — đó là mốc để tính phần giãn thêm. */
  var st = getComputedStyle(ds[0]);
  thuoc.style.fontFamily = st.fontFamily;
  thuoc.style.fontSize = st.fontSize;
  thuoc.style.fontWeight = st.fontWeight;
  thuoc.style.fontStyle = st.fontStyle;
  thuoc.style.textTransform = st.textTransform;
  thuoc.style.letterSpacing = st.letterSpacing === 'normal' ? '0px' : st.letterSpacing;

  /* Cùng một chuỗi ở cùng một cỡ chữ thì bề ngang y nhau ⇒ nhớ chung cho cả
     trang, dù mỗi thẻ tự tính con số của mình. */
  var rong = {};
  function doChu(t){
    if (rong[t] == null) { thuoc.textContent = t; rong[t] = thuoc.getBoundingClientRect().width; }
    return rong[t];
  }

  /* Gom nhãn theo THẺ (`.the-diem`). Nhãn lạc không nằm trong thẻ nào thì gom
     chung một rổ và đặt biến lên <html> như lối cũ — chỉ là lối thoát an toàn. */
  var oThe = [], nhom = [];
  ds.forEach(function(e){
    var the = e.closest ? e.closest('.the-diem') : null;
    var i = oThe.indexOf(the);
    if (i < 0) { oThe.push(the); nhom.push([e]); } else nhom[i].push(e);
  });

  /* Trần cho thẻ KHÔNG có nhãn chuẩn: đúng bằng số cứng của CSS (`.td-dong`),
     kẻo tên lạ thầy tự gõ dài quá nuốt mất thanh. Hai ngưỡng phải khớp CSS. */
  var tran = laDienThoai() ? 90 : 112;
  /* Lối cũ đặt biến lên <html>; gỡ đi kẻo còn sót của lần chạy trước. */
  document.documentElement.style.removeProperty('--cot-ten');

  nhom.forEach(function(oCon, i){
    var dinh = 0, rongNhat = 0;
    oCon.forEach(function(e){
      var t = e.textContent.trim();
      var w = doChu(t);
      if (w > rongNhat) rongNhat = w;
      if (NHAN_CHUAN.test(t) && w > dinh) dinh = w;
    });
    /* Thẻ có nhãn chuẩn thì giãn cho bằng nhau như cũ; thẻ toàn nhãn lạ thì
       KHÔNG giãn chữ (giãn "QUIZ" cho bằng "READING QUIZ" là chữ bảng hiệu),
       chỉ co cột về đúng bề ngang nhãn dài nhất. */
    var coChuan = !!dinh;
    if (!coChuan) dinh = Math.min(rongNhat, tran);

    oCon.forEach(function(e){
      var t = e.textContent.trim();
      if (!coChuan || !NHAN_CHUAN.test(t) || !t.length) { e.style.letterSpacing = ''; return; }
      var them = (dinh - rong[t]) / t.length;
      e.style.letterSpacing = them > 0.05 ? (Math.round(them * 100) / 100 + 'px') : '';
    });

    /* Cột tên vừa khít nhãn chuẩn (+1px cho phần lẻ khi trình duyệt làm tròn).
       Có nhãn lạ dài hơn thì nhường nó tới mức TRẦN của CSS, không quá. */
    var can = Math.ceil(coChuan ? Math.max(dinh, Math.min(rongNhat, dinh + 26)) : dinh) + 1;
    if (oThe[i]) oThe[i].style.setProperty('--cot-ten', can + 'px');
    else document.documentElement.style.setProperty('--cot-ten', can + 'px');
  });
}
/* Montserrat nạp qua mạng: nạp xong chữ đổi cỡ đôi chút nên đo lại một lần
   nữa — cả chiều cao thanh đầu lẫn số tên vừa cột. Cắt bớt là việc MỘT CHIỀU
   nên chạy lại bao nhiêu lần cũng vô hại.
   fonts.ready là promise ⇒ luôn chạy SAU khi dungCot() vẽ xong. */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){
    doCaoDau(); doSanChat(); canhNhanO(); vuaMoiCotThieu();
  });
}
/* (Việc đo lại lúc kéo giãn cửa sổ nay nằm chung trong một trình nghe resize
   duy nhất ở phần ĐỔI BỐ CỤC bên dưới — để khỏi chạy hai lần.) */

/* ---------- POP-UP XEM NHANH CẢ LỚP ----------
   Dựng từ TOÀN BỘ danh sách lớp: em nào có tên trong b.thieu là còn thiếu,
   còn lại coi như xong hết. Nhờ vậy MỌI thẻ đều mở được bảng, không cần
   liệt kê riêng danh sách em đã xong cho từng bài.

   ⭐⭐ v1.47.0 (thầy chốt 02/09/2026) — BỎ HẲN XẾP HẠNG Ở POP-UP NÀY.
   Nó gộp NHIỀU act nên "hạng" chẳng đo được cái gì rõ ràng; nay chỉ trả lời
   đúng một câu: em nào XONG, em nào CHƯA. Bỏ luôn icon cúp — con số bên trái
   từ nay chỉ là SỐ THỨ TỰ DÒNG.
   Thứ tự: nhóm XONG lên trên, giữ nguyên THỨ TỰ myStudent (chính là thứ tự
   `hocSinh` app đẩy sang, tức thứ tự CA_LOP); nhóm CHƯA XONG dồn xuống dưới,
   thiếu ÍT lên trước — thiếu NHIỀU xuống cuối cùng, cùng số thiếu thì lại
   theo thứ tự myStudent.
   ⛔ Gỡ theo trong cùng đợt: `dungHangLop()` · `HANG_LOP` · `chuLuc()` — cả
   cụm đó chỉ đẻ ra để phục vụ phép xếp hạng vừa bỏ.
   ⛔ Bản chép CÙNG LUẬT ở `dashboard.html` (`xepCaLop`) — sửa một bên phải
   sửa bên kia, kẻo hai trang lại lệch thứ tự như trước 02/09. */
function xepCaLop(b){
  var conThieu = {};
  (b.thieu || []).forEach(function(e){ conThieu[e.ten] = e.so; });

  var xong = CA_LOP.filter(function(t){ return !conThieu[t]; }).map(function(t){
    return { ten:t, du:true, phu:'hoàn thành' };
  });

  /* ⛔ Đừng trông vào thứ tự vào mảng: `b.thieu` dựng từ `Object.keys()` nên
     thứ tự khoá là chuyện của trình duyệt. Chốt lại bằng chỉ số trong CA_LOP. */
  var thieu = (b.thieu || []).slice()
    .sort(function(a, c){
      if (a.so !== c.so) return a.so - c.so;
      return CA_LOP.indexOf(a.ten) - CA_LOP.indexOf(c.ten);
    })
    .map(function(e){ return { ten:e.ten, du:false, so:e.so, phu:'chưa hoàn thành' }; });

  return xong.concat(thieu);
}

var IC_TICH = '✓';

function moPopCaLop(b){
  var ds = xepCaLop(b);
  /* Dòng phụ: tên bài • mã lesson (thầy chốt bỏ phần đếm số em đã xong). */
  $('#popPhu').textContent = b.ten + (b.ma ? ' • ' + b.ma : '');
  $('#popDs').innerHTML = ds.map(function(e, i){
    /* ⭐ v1.47.0 — chỉ còn SỐ THỨ TỰ DÒNG, không cúp, không hạng (thầy chốt
       02/09). Bảng xếp hạng thật nằm ở leaderboard trong trang bài tập. */
    return '<div class="pop-dong ' + (e.du ? 'du' : 'thieu') + '">' +
      '<span class="pop-hang">' + (i + 1) + '</span>' +
      '<span class="pop-ten">' + e.ten + '</span>' +
      '<span class="pop-phu">' + e.phu + '</span>' +
      (e.du ? '<span class="pop-cuoi">' + IC_TICH + '</span>'
            : '<span class="pop-cuoi so">' + e.so + '</span>') +
    '</div>';
  }).join('');
  $('#popNen').classList.add('mo');
}

/* ⭐ 27/08 — POP-UP CHI TIẾT SP CHECK: dùng lại ĐÚNG khung #popNen/#popDs, chỉ
   đổi ruột — mỗi TEAM một vạch mảnh (tên + tổng lỗi "N FOUND" giữa vạch), dưới
   vạch là từng bạn xếp theo số lỗi bắt được (nhiều nhất lên trên, đã sắp sẵn
   trong `tinhDoiSp()`). Gọi thay `moPopCaLop()` khi thẻ là spcheck VÀ đã có
   `b.doiSp` — chưa có (đang tải/buổi mô hình 1) thì vẫn rơi về bảng cả lớp cũ. */
function moPopDoiSp(b){
  $('#popPhu').textContent = b.ten + (b.ma ? ' • ' + b.ma : '');
  $('#popDs').innerHTML = (b.doiSp || []).map(function(d){
    var vach = '<span class="doi-vach"><span class="line"></span>' +
      '<span class="lb">' + A.chuAnToan(d.ten) +
        '<span class="tong">' + d.tong + ' FOUND</span></span>' +
      '<span class="line"></span></span>';
    var hang = d.hs.map(function(e, i){
      return '<span class="hs-dong">' +
        '<span class="hs-hang">' + (i + 1) + '</span>' +
        '<span class="hs-ten">' + tenTat(e.ten) + '</span>' +
        '<span class="hs-so">' + e.so + '</span>' +
      '</span>';
    }).join('');
    return vach + hang;
  }).join('');
  $('#popNen').classList.add('mo');
}
function dongPop(){ $('#popNen').classList.remove('mo'); }

/* ---------- Ô HẠN + ĐỒNG HỒ ĐẾM NGƯỢC ----------
   Bản thật: mốc = GIỜ VÀO LỚP kế tiếp (lịch học myStudent), riêng bài
   SP CHECK (check speaking) thì trừ đi 1 tiếng. */
var GIAY = 1000, PHUT = 60 * GIAY, TIENG = 60 * PHUT;
/* ⏱ MỐC BÁO GẤP = 6 TIẾNG trước giờ vào lớp (thầy nâng từ 3 lên 6 ngày
   18/08). Từ mốc này: ô hạn đỏ · thẻ nháy đỏ · thanh chưa đủ chuyển đỏ ·
   cột CHƯA XONG BÀI hiện ra. Đổi số này là đổi cả bốn thứ trên. */
var GAP_TIENG = 6;

/* ⭐ v1.9.0 — TÌNH HÌNH của thẻ mới tính từ HẠN THẬT chứ không còn nút xem thử:
     xong hết  -> 'xong'   (mọi bài đủ cả lớp)
     còn <6h   -> 'gap'    · còn 6-24h -> '24h'   · còn hơn 24h -> 'thuong'
   Chưa đặt hạn (bài cũ chưa có ngày) thì coi như 'thuong' và ô hạn để trống. */
function tinhHinhGio(b){
  /* ⭐ v1.35.0 — TẠM KHOÁ đứng trước mọi trạng thái: đồng hồ dừng, không màu gấp. */
  if (b.khoa) return 'khoa';
  /* ⭐ v1.56.0 — thẻ thầy đã ĐỔI HẠN RIÊNG thì KHÔNG bao giờ ăn trạng thái 'xong':
     đồng hồ chạy lại như thẻ mới cho tới mốc hạn mới (thầy chốt 03/09/2026). */
  if (!b.suaHan &&
      (b.bai || []).length && (b.bai || []).every(function(x){ return x.xong >= SI_SO; })) {
    return 'xong';
  }
  if (b.hanMoc == null) return 'thuong';
  var con = (b.hanMoc - Date.now()) / TIENG;
  if (con <= GAP_TIENG) return 'gap';
  if (con <= 24) return '24h';
  return 'thuong';
}

function veHan(b, tt){
  var xongHet = (tt === 'xong');
  /* Mốc THẬT của bài. Bài chưa có hạn thì để đồng hồ trống, không bịa giờ. */
  var moc = (b.hanMoc == null) ? 0 : b.hanMoc;
  var lop = 't-han' + (tt === 'gap' ? ' gap-gio' : (xongHet ? ' da-xong' : ''));
  return '<span class="han-boc"><span class="' + lop + '">' +
      '<span class="han-dong">' + IC_GIO +
        (b.han ? ('Hạn ' + b.han) : 'Chưa đặt hạn') + '</span>' +
      '<span class="han-vach"></span>' +
      '<span class="dhho" data-moc="' + moc + '" data-xong="' + (xongHet ? 1 : 0) +
        '" data-khoa="' + (b.khoa ? 1 : 0) + '">…</span>' +
    '</span>' +
    (xongHet ? '<span class="tich-to">✓</span>' : '') +
  '</span>';
}

/* ⭐ v1.35.0 — mũi bên phải thẻ: tam giác ▶ như cũ, thẻ TẠM KHOÁ thì là ổ khoá. */
function veMui(khoa){
  return '<span class="play">' + (khoa
    ? '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10.5" rx="2.2"/>' +
      '<path d="M8.2 10.5V7.4a3.8 3.8 0 0 1 7.6 0v3.1" fill="none" stroke="#fff" stroke-width="2.2"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>') + '</span>';
}

function chuoiGio(ms){
  var s = Math.floor(ms / 1000);
  var h = Math.floor(s / 3600), p = Math.floor((s % 3600) / 60), g = s % 60;
  return h + ':' + ('0' + p).slice(-2) + ':' + ('0' + g).slice(-2);
}

var HEN_DH = null;
function nhipDongHo(){
  document.querySelectorAll('.dhho[data-moc]').forEach(function(e){
    /* ⭐ v1.35.0 — thẻ TẠM KHOÁ: đồng hồ DỪNG, không bao giờ hiện HẾT HẠN (thầy chốt). */
    if (e.getAttribute('data-khoa') === '1') {
      e.textContent = 'TẠM KHOÁ'; e.className = 'dhho khoa'; return;
    }
    if (e.getAttribute('data-xong') === '1') {
      e.textContent = 'COMPLETE'; e.className = 'dhho xong'; return;
    }
    var moc = +e.getAttribute('data-moc');
    /* moc = 0 nghĩa là bài CHƯA có hạn (app chưa gõ) — để gạch ngang, đừng
       hiện "HẾT HẠN" làm học sinh tưởng đã trễ. */
    if (!moc) { e.textContent = '—'; e.className = 'dhho'; return; }
    var con = moc - Date.now();
    if (con <= 0) { e.textContent = 'HẾT HẠN'; e.className = 'dhho do'; return; }
    e.textContent = chuoiGio(con);
    var tieng = con / TIENG;
    e.className = 'dhho ' + (tieng > 24 ? 'xanh' : (tieng > 12 ? 'cam' : 'do'));
  });
  A.nhipNghi(document);          /* ⭐ v1.48.0 — đồng hồ của thẻ "không giao bài" */
}
function chayDongHo(){
  clearInterval(HEN_DH);
  nhipDongHo();
  HEN_DH = setInterval(nhipDongHo, 1000);
}

/* ---------- VẼ THẺ ----------
   Thẻ MỚI ăn màu theo THỜI GIAN CÒN LẠI (thầy chốt 18/08):
     xong hết → xanh lá + hào quang xanh lá (ưu tiên cao nhất)
     > 24h    → xanh dương nhạt + hào quang xanh dương
     6h–24h   → vàng nhạt + hào quang vàng
     < 6h     → đỏ + hào quang đỏ nhấp nháy
   Thẻ CŨ vẫn theo kết quả bài (đỏ nếu thiếu, xanh lá nếu đủ). */
function veTheMoi(b, tt){
  var gap = (tt === 'gap');
  var bDung = (tt === 'xong') ? xongHetBai(b) : b;
  var th = tinhHinhThe(bDung, tt === 'xong');
  /* ⭐ v1.56.0 — thẻ đã đổi hạn riêng: bỏ luôn màu xanh lá "xong hết" + dấu ✓.
     ⛔ Phải chặn Ở ĐÂY nữa: `tinhHinhGio()` đã thôi trả 'xong' nhưng `tinhHinhThe()`
     tự đếm lại `bai[].xong >= SI_SO` nên vẫn ra `du:true` ⇒ thẻ xanh lá mà đồng hồ
     lại chạy, nhìn tréo ngoe. Các thanh tiến trình vẫn giữ nguyên số thật của lớp. */
  if (b.suaHan) th = { lop: th.lop, du: false };

  var lopThem, lopNen;
  /* v1.35.0 — TẠM KHOÁ đứng trước cả "xong hết": thẻ nhìn là biết đang khoá. */
  if (tt === 'khoa')    { lopThem = ' khoa';      lopNen = 'tt-duong'; }
  else if (th.du)       { lopThem = ' xong-het';  lopNen = 'tt-la'; }
  else if (gap)         { lopThem = ' gap';       lopNen = 'tt-do'; }
  else if (tt === '24h'){ lopThem = ' gio-vang';  lopNen = 'tt-vang'; }

/* ⭐ (02/09 đợt 2 — thầy chốt) AVATAR TO HẾT CỠ mà hai hàng liền nhau vẫn không chạm nhau.
   ⛔ PHẢI ĐO, đừng đặt số cứng — hàng co giãn theo chiều cao thẻ (thẻ 2 đội hàng cao gấp đôi
   thẻ 4 đội), số cứng là chỗ thừa chỗ thiếu.

   ⛔ Trần KHÔNG PHẢI chiều cao hàng mà là **khoảng cách TÂM–TÂM hai hàng liền nhau**: giữa
   hai hàng còn cái khe `gap` của `.diem-rows` (5px), avatar thò vào khe đó vẫn chẳng chạm ai.
   Lấy nhầm chiều cao hàng là bỏ phí 5px — bản đầu 02/09 đã phí đúng chỗ này.
   Chặn thứ hai: avatar không được thò khỏi KHỐI CHA (`.diem-rows` và `.the-diem` đều có
   `overflow:hidden`) ⇒ đường kính ≤ 2× khoảng cách từ tâm hàng tới mép khối.
   Mọi hàng trong cùng một khối lấy CHUNG một cỡ, không thì to nhỏ so le rất xấu.

   ⛔ Bản sao ở `dashboard.html` và `sp-chitiet.html` — sửa là sửa cả ba. */
function coAvatarThanh(goc){
  /* ⭐ (02/09 đợt 4) Đo CẢ hàng bài thường `.td-dong` — thanh đó nay cũng có avatar
     (bạn top 1 của act). Hai loại hàng không bao giờ nằm chung một thẻ nên gộp được. */
  var ds = (goc || document).querySelectorAll('.doi-dong, .td-dong');
  if (!ds.length) return;
  var nhom = [];
  Array.prototype.forEach.call(ds, function(h){
    var o = nhom.filter(function(x){ return x.cha === h.parentElement; })[0];
    if (!o) { o = { cha: h.parentElement, hang: [] }; nhom.push(o); }
    o.hang.push(h);
  });
  nhom.forEach(function(o){
    var ob = o.cha.getBoundingClientRect();
    var tam = o.hang.map(function(h){
      var b = h.getBoundingClientRect();
      return { giua: b.top + b.height / 2, cao: b.height };
    });
    if (!tam.length || !tam[0].cao) return;
    var co = 999;
    tam.forEach(function(x, i){
      if (i > 0) co = Math.min(co, tam[i].giua - tam[i - 1].giua);
      if (i < tam.length - 1) co = Math.min(co, tam[i + 1].giua - tam[i].giua);
      co = Math.min(co, (x.giua - ob.top) * 2, (ob.bottom - x.giua) * 2);
    });
    // ⭐ v1.58.0 — hàng ĐỘI (SP CHECK) chốt trần 26px cho MỌI thẻ: thẻ 3 đội (hàng 26px)
    // và thẻ 4 đội (hàng 25px, xem CSS `.doi4`) ra cùng một cỡ; trước đây 29px ↔ 17px.
    // Hàng bài thường (`.td-dong`, avatar bạn top 1) giữ trần 40px như cũ.
    var tran = o.hang[0].classList.contains('doi-dong') ? 26 : 40;
    var av = Math.max(10, Math.min(tran, Math.round(co - 2)));
    o.hang.forEach(function(h){ h.style.setProperty('--av', av + 'px'); });
  });
}

/* ---------- ĐỔI BỐ CỤC CHO MƯỢT (v19) ----------
   Khung chat nhảy từ bên cạnh xuống dưới (và ngược lại) là do @media đổi —
   mà @media thì đổi PHỰT một cái, không có đường nào cho CSS chạy mượt.
   Nên dùng lối FLIP: ĐO chỗ cũ → đổi bố cục → ĐO chỗ mới → ép ngược về chỗ
   cũ bằng transform rồi thả cho nó tự trượt về chỗ mới.
     · Thẻ còn giữ lại  → trượt từ chỗ cũ sang chỗ mới.
     · Thẻ 3–4 bị bỏ    → bản sao co dần rồi CHUI VÀO thẻ cuối cùng còn lại.
     · Thẻ mới hiện ra  → nở ra từ chỗ thẻ cuối (chiều ngược lại).
     · Khung chat       → trượt kèm co giãn từ ô cũ sang ô mới.
   ⛔ Phải CHỤP BẢN SAO thẻ sắp bỏ TRƯỚC khi dựng lại cột, vì dungCot() xoá
   sạch innerHTML — sau đó không còn gì mà cho chạy nữa. */
var THOI_CHUYEN = 420;
function giamChuyenDong(){
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
/* Ép phần tử về chỗ cũ rồi thả ra cho nó tự trượt về chỗ thật của mình. */
function truotTu(el, r0, hienDan){
  var r1 = el.getBoundingClientRect();
  if (!r1.width || !r1.height || !r0.width || !r0.height) return;
  var dx = r0.left - r1.left, dy = r0.top - r1.top;
  var sx = r0.width / r1.width, sy = r0.height / r1.height;
  el.style.transition = 'none';
  el.style.transformOrigin = 'top left';
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
  if (hienDan) el.style.opacity = '0';
  el.getBoundingClientRect();        // ⛔ bắt buộc: ép trình duyệt nhận chỗ cũ trước
  el.style.transition = 'transform ' + THOI_CHUYEN + 'ms var(--em)' +
                        (hienDan ? ', opacity ' + THOI_CHUYEN + 'ms var(--em)' : '');
  el.style.transform = '';
  if (hienDan) el.style.opacity = '';
  setTimeout(function(){
    el.style.transition = ''; el.style.transformOrigin = '';
  }, THOI_CHUYEN + 60);
}
/* Bản sao của thẻ vừa bị bỏ: co lại thành một vệt mỏng rồi chui vào thẻ cuối. */
function chuiVaoThe(ban, r0, dich){
  ban.style.cssText += ';position:fixed; left:' + r0.left + 'px; top:' + r0.top +
    'px; width:' + r0.width + 'px; height:' + r0.height + 'px; margin:0; z-index:20;' +
    'pointer-events:none; transform-origin:top left;' +
    'transition:transform ' + THOI_CHUYEN + 'ms var(--em), opacity ' + THOI_CHUYEN + 'ms var(--em)';
  document.body.appendChild(ban);
  var dx = dich.left - r0.left;
  var dy = dich.top + dich.height / 2 - r0.top;
  requestAnimationFrame(function(){
    ban.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.45,.06)';
    ban.style.opacity = '0';
  });
  setTimeout(function(){
    if (ban.parentNode) ban.parentNode.removeChild(ban);
  }, THOI_CHUYEN + 80);
}
/* Chụp chỗ đứng hiện thời của khung chat và từng thẻ. */
function chupCho(){
  var chat = document.querySelector('.chat');
  return {
    chat: chat ? chat.getBoundingClientRect() : null,
    the: [].map.call(document.querySelectorAll('.the'), function(t){
      return t.getBoundingClientRect();
    })
  };
}
/* ⛔ BẪY LỚN: KHÔNG đo "chỗ cũ" ngay trong lúc bố cục vừa đổi được.
   Sự kiện `change` của matchMedia (và cả `resize`) chỉ chạy SAU khi trình
   duyệt đã áp @media và bày lại trang xong — đo lúc đó là đo chỗ MỚI, hiệu
   số bằng 0, chạy mà không thấy gì (đã thử, chỉ mỗi khung chat nhúc nhích
   vì phần đó do JS vẽ lại). Nên chỗ cũ phải là ảnh chụp ở LẦN RESIZE TRƯỚC,
   tức lúc còn đang ở bố cục cũ. */
function doiBoCucMuot(choCu, veLai){
  var chat = document.querySelector('.chat');
  if (!chat || !choCu || !choCu.chat || giamChuyenDong()) { veLai(); return; }

  /* Bản sao của các thẻ hiện có, phòng khi lát nữa bị bớt đi. */
  var ban = [].map.call(document.querySelectorAll('.the'), function(t){
    return t.cloneNode(true);
  });

  veLai();

  var moi = document.querySelectorAll('.the');
  var cu = choCu.the;
  var n = moi.length, i;
  for (i = 0; i < n && i < cu.length; i++) truotTu(moi[i], cu[i], false);

  if (cu.length > n && n > 0) {                     // rộng → hẹp: bớt thẻ
    var dich = moi[n - 1].getBoundingClientRect();
    for (i = n; i < cu.length && i < ban.length; i++) chuiVaoThe(ban[i], cu[i], dich);
  }
  if (n > cu.length && cu.length > 0) {             // hẹp → rộng: thêm thẻ
    var nguon = cu[cu.length - 1];
    for (i = cu.length; i < n; i++) truotTu(moi[i], nguon, true);
  }
  truotTu(chat, choCu.chat, false);
}

/* Đổi qua lại máy tính ↔ cửa sổ hẹp ↔ điện thoại thì dựng lại cột thẻ (số thẻ
   và số tên khác nhau) rồi cho chạy mượt sang bố cục mới.
   Theo dõi CẢ HAI ngưỡng: 1040 đổi số thẻ và chỗ đứng của khung chat, 620 đổi
   cỡ chữ nên số tên vừa cột cũng khác.
   ⛔ Nghe `resize` chứ không nghe `change` của matchMedia: cần giữ ảnh chụp
   chỗ đứng ở lần resize TRƯỚC (lúc còn bố cục cũ) thì mới có cái để chạy từ
   đó về chỗ mới — xem chú thích ở doiBoCucMuot. */
var hepTruoc = chatODuoi(), dtTruoc = laDienThoai();
var choTruoc = null, dangDoiBoCuc = false;

window.addEventListener('resize', function(){
  doCaoDau(); doSanChat();
  coAvatarThanh(); xepAvatarThanh();   /* ⭐ 02/09 — đổi khổ màn thì đo + xếp lại avatar */
  var hep = chatODuoi(), dt = laDienThoai();
  if (hep !== hepTruoc || dt !== dtTruoc) {
    hepTruoc = hep; dtTruoc = dt;
    dangDoiBoCuc = true;
    doiBoCucMuot(choTruoc, function(){ dungCot(); });
    setTimeout(function(){
      dangDoiBoCuc = false;
      choTruoc = chupCho();          // đo lại khi đã đứng yên hẳn
    }, THOI_CHUYEN + 80);
    return;
  }
  /* Đang chạy dở thì đừng chụp: lúc ấy phần tử còn đang bị transform, chụp
     vào là lần sau chạy từ chỗ sai. */
  if (!dangDoiBoCuc) choTruoc = chupCho();
});

/* ---------- ĐO THANH ĐẦU + BÀN PHÍM ẢO (v18) ----------
   ⛔ Đừng gõ tay chiều cao thanh đầu vào calc() nữa: v16 gõ 62 trong khi thật
   là 65, cả trang dôi 3px và phải cuộn. Đo rồi đặt vào biến là hết cả lớp lỗi
   đó, kể cả sau này có đổi cỡ ảnh đại diện hay cỡ chữ. */
function doCaoDau(){
  var t = document.querySelector('.top');
  if (t) document.documentElement.style.setProperty('--cao-dau', t.offsetHeight + 'px');
}
/* Sàn của khung chat = tiêu đề + chân khung (ô nhập), cộng 2px viền. Ô nhập
   cao lên khi gõ tin dài nên đo lại mỗi lần ô nhập nới cao. */
function doSanChat(){
  var d = document.querySelector('.chat-head'), c = document.querySelector('.chat-foot');
  if (!d || !c) return;
  document.documentElement.style.setProperty('--san-chat',
    (d.offsetHeight + c.offsetHeight + 2) + 'px');
}

/* Bàn phím ảo: iPhone/iPad KHÔNG đẩy trang lên, nó phủ đè ⇒ ô nhập bị khuất.
   visualViewport cho biết phần màn CÒN NHÌN THẤY; lấy hiệu với chiều cao
   trang là ra phần bị che, trừ vào chiều cao .main thì ô nhập tự nổi lên trên
   bàn phím. Android (Chrome) đã tự thu trang nhờ interactive-widget ở thẻ
   meta ⇒ hiệu bằng 0, công thức này tự động không làm gì thêm — không sợ
   trừ hai lần. */
var manNhin = window.visualViewport;
function doBanPhim(){
  if (!manNhin) return;
  var che = window.innerHeight - manNhin.height - manNhin.offsetTop;
