/* ---------- ĐỔI BỐ CỤC CHO MƯỢT (v19) ----------
   Khung chat nhảy từ bên cạnh xuống dưới (và ngược lại) là do @media đổi —
   mà @media thì đổi PHỰT một cái, không có đường nào cho CSS chạy mượt.
   Nên dùng lối FLIP: ĐO chỗ cũ → đổi bố cục → ĐO chỗ mới → ép ngược về chỗ
   cũ bằng transform rồi thả cho nó tự trượt về chỗ mới.
     · Thẻ còn giữ lại  → trượt từ chỗ cũ sang chỗ mới.
     · Thẻ 3–4 bị bỏ    → bản sao co dần rồi CHUI VÀO thẻ cuối cùng còn lại.
     · Thẻ mới hiện ra  → nở ra từ chỗ thẻ cuối (chiều ngược lại).
     · Khung chat       → trượt kèm co giãn từ ô cũ sang ô mới.
   ⛔ Phải CHỤP BẢN SAO thẻ sắp bỏ TRƯỚC khi dựng lại cột, vì dungCot() xoá
   sạch innerHTML — sau đó không còn gì mà cho chạy nữa. */
var THOI_CHUYEN = 420;
function giamChuyenDong(){
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
/* Ép phần tử về chỗ cũ rồi thả ra cho nó tự trượt về chỗ thật của mình. */
function truotTu(el, r0, hienDan){
  var r1 = el.getBoundingClientRect();
  if (!r1.width || !r1.height || !r0.width || !r0.height) return;
  var dx = r0.left - r1.left, dy = r0.top - r1.top;
  var sx = r0.width / r1.width, sy = r0.height / r1.height;
  el.style.transition = 'none';
  el.style.transformOrigin = 'top left';
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
  if (hienDan) el.style.opacity = '0';
  el.getBoundingClientRect();        // ⛔ bắt buộc: ép trình duyệt nhận chỗ cũ trước
  el.style.transition = 'transform ' + THOI_CHUYEN + 'ms var(--em)' +
                        (hienDan ? ', opacity ' + THOI_CHUYEN + 'ms var(--em)' : '');
  el.style.transform = '';
  if (hienDan) el.style.opacity = '';
  setTimeout(function(){
    el.style.transition = ''; el.style.transformOrigin = '';
  }, THOI_CHUYEN + 60);
}
/* Bản sao của thẻ vừa bị bỏ: co lại thành một vệt mỏng rồi chui vào thẻ cuối. */
function chuiVaoThe(ban, r0, dich){
  ban.style.cssText += ';position:fixed; left:' + r0.left + 'px; top:' + r0.top +
    'px; width:' + r0.width + 'px; height:' + r0.height + 'px; margin:0; z-index:20;' +
    'pointer-events:none; transform-origin:top left;' +
    'transition:transform ' + THOI_CHUYEN + 'ms var(--em), opacity ' + THOI_CHUYEN + 'ms var(--em)';
  document.body.appendChild(ban);
  var dx = dich.left - r0.left;
  var dy = dich.top + dich.height / 2 - r0.top;
  requestAnimationFrame(function(){
    ban.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.45,.06)';
    ban.style.opacity = '0';
  });
  setTimeout(function(){
    if (ban.parentNode) ban.parentNode.removeChild(ban);
  }, THOI_CHUYEN + 80);
}
/* Chụp chỗ đứng hiện thời của khung chat và từng thẻ. */
function chupCho(){
  var chat = document.querySelector('.chat');
  return {
    chat: chat ? chat.getBoundingClientRect() : null,
    the: [].map.call(document.querySelectorAll('.the'), function(t){
      return t.getBoundingClientRect();
    })
  };
}
/* ⛔ BẪY LỚN: KHÔNG đo "chỗ cũ" ngay trong lúc bố cục vừa đổi được.
   Sự kiện `change` của matchMedia (và cả `resize`) chỉ chạy SAU khi trình
   duyệt đã áp @media và bày lại trang xong — đo lúc đó là đo chỗ MỚI, hiệu
   số bằng 0, chạy mà không thấy gì (đã thử, chỉ mỗi khung chat nhúc nhích
   vì phần đó do JS vẽ lại). Nên chỗ cũ phải là ảnh chụp ở LẦN RESIZE TRƯỚC,
   tức lúc còn đang ở bố cục cũ. */
function doiBoCucMuot(choCu, veLai){
  var chat = document.querySelector('.chat');
  if (!chat || !choCu || !choCu.chat || giamChuyenDong()) { veLai(); return; }

  /* Bản sao của các thẻ hiện có, phòng khi lát nữa bị bớt đi. */
  var ban = [].map.call(document.querySelectorAll('.the'), function(t){
    return t.cloneNode(true);
  });

  veLai();

  var moi = document.querySelectorAll('.the');
  var cu = choCu.the;
  var n = moi.length, i;
  for (i = 0; i < n && i < cu.length; i++) truotTu(moi[i], cu[i], false);

  if (cu.length > n && n > 0) {                     // rộng → hẹp: bớt thẻ
    var dich = moi[n - 1].getBoundingClientRect();
    for (i = n; i < cu.length && i < ban.length; i++) chuiVaoThe(ban[i], cu[i], dich);
  }
  if (n > cu.length && cu.length > 0) {             // hẹp → rộng: thêm thẻ
    var nguon = cu[cu.length - 1];
    for (i = cu.length; i < n; i++) truotTu(moi[i], nguon, true);
  }
  truotTu(chat, choCu.chat, false);
}

/* Đổi qua lại máy tính ↔ cửa sổ hẹp ↔ điện thoại thì dựng lại cột thẻ (số thẻ
   và số tên khác nhau) rồi cho chạy mượt sang bố cục mới.
   Theo dõi CẢ HAI ngưỡng: 1040 đổi số thẻ và chỗ đứng của khung chat, 620 đổi
   cỡ chữ nên số tên vừa cột cũng khác.
   ⛔ Nghe `resize` chứ không nghe `change` của matchMedia: cần giữ ảnh chụp
   chỗ đứng ở lần resize TRƯỚC (lúc còn bố cục cũ) thì mới có cái để chạy từ
   đó về chỗ mới — xem chú thích ở doiBoCucMuot. */
var hepTruoc = chatODuoi(), dtTruoc = laDienThoai();
var choTruoc = null, dangDoiBoCuc = false;

window.addEventListener('resize', function(){
  doCaoDau(); doSanChat();
  var hep = chatODuoi(), dt = laDienThoai();
  if (hep !== hepTruoc || dt !== dtTruoc) {
    hepTruoc = hep; dtTruoc = dt;
    dangDoiBoCuc = true;
    doiBoCucMuot(choTruoc, function(){ dungCot(); });
    setTimeout(function(){
      dangDoiBoCuc = false;
      choTruoc = chupCho();          // đo lại khi đã đứng yên hẳn
    }, THOI_CHUYEN + 80);
    return;
  }
  /* Đang chạy dở thì đừng chụp: lúc ấy phần tử còn đang bị transform, chụp
     vào là lần sau chạy từ chỗ sai. */
  if (!dangDoiBoCuc) choTruoc = chupCho();
});

/* ---------- ĐO THANH ĐẦU + BÀN PHÍM ẢO (v18) ----------
   ⛔ Đừng gõ tay chiều cao thanh đầu vào calc() nữa: v16 gõ 62 trong khi thật
   là 65, cả trang dôi 3px và phải cuộn. Đo rồi đặt vào biến là hết cả lớp lỗi
   đó, kể cả sau này có đổi cỡ ảnh đại diện hay cỡ chữ. */
function doCaoDau(){
  var t = document.querySelector('.top');
  if (t) document.documentElement.style.setProperty('--cao-dau', t.offsetHeight + 'px');
}
/* Sàn của khung chat = tiêu đề + chân khung (ô nhập), cộng 2px viền. Ô nhập
   cao lên khi gõ tin dài nên đo lại mỗi lần ô nhập nới cao. */
function doSanChat(){
  var d = document.querySelector('.chat-head'), c = document.querySelector('.chat-foot');
  if (!d || !c) return;
  document.documentElement.style.setProperty('--san-chat',
    (d.offsetHeight + c.offsetHeight + 2) + 'px');
}

/* Bàn phím ảo: iPhone/iPad KHÔNG đẩy trang lên, nó phủ đè ⇒ ô nhập bị khuất.
   visualViewport cho biết phần màn CÒN NHÌN THẤY; lấy hiệu với chiều cao
   trang là ra phần bị che, trừ vào chiều cao .main thì ô nhập tự nổi lên trên
   bàn phím. Android (Chrome) đã tự thu trang nhờ interactive-widget ở thẻ
   meta ⇒ hiệu bằng 0, công thức này tự động không làm gì thêm — không sợ
   trừ hai lần. */
var manNhin = window.visualViewport;
function doBanPhim(){
  if (!manNhin) return;
  var che = window.innerHeight - manNhin.height - manNhin.offsetTop;
  /* Dưới 90px là thanh địa chỉ co giãn chứ không phải bàn phím — bỏ qua,
     kẻo trang giật lên giật xuống lúc các em cuộn. */
  if (!(che > 90)) che = 0;
  document.documentElement.style.setProperty('--banphim', Math.round(che) + 'px');
  document.documentElement.classList.toggle('go-chat', che > 0);
}
if (manNhin) {
  manNhin.addEventListener('resize', doBanPhim);
  manNhin.addEventListener('scroll', doBanPhim);
}
/* Bấm vào ô nhập thì kéo tin mới nhất lên: bàn phím vừa hiện, khung chat vừa
   thu lại, phải đợi trình duyệt dựng xong mới cuộn cho đúng. */
$('#oChat').addEventListener('focus', function(){
  setTimeout(function(){
    doBanPhim();
    khung.scrollTop = khung.scrollHeight;
    $('#oChat').scrollIntoView({ block:'nearest' });
  }, 280);
});
$('#oChat').addEventListener('blur', function(){
  setTimeout(doBanPhim, 120);
});

/* ---------- KHỞI ĐỘNG (v1.9.0) ----------
   Thứ tự bắt buộc:
     1. đọc lop.json + bai.json  -> biết em là ai, lớp nào, có bài gì
     2. điền thanh đầu + sidebar  -> chữ đã đúng rồi mới đo chiều cao

   ⛔ Đo (`doCaoDau`/`doSanChat`) phải chạy SAU khi tên em đã điền: tên dài
   ngắn khác nhau làm thanh đầu cao khác nhau, đo trước là lệch cả cột. */
function giuXemNhu(){

/* Đặt CHỮ vào một ô đang có sẵn phần tử con (avatar có huy hiệu sao bên trong,
   tiêu đề chat có icon) — chỉ thay phần chữ, giữ nguyên mọi thẻ con. */
function datChu(el, chu){
  if (!el) return;
  Array.prototype.slice.call(el.childNodes).forEach(function(n){
    if (n.nodeType === 3) el.removeChild(n);
  });
  el.insertBefore(document.createTextNode(chu), el.firstChild);
}

/* ═══════════════ SP CHECK — MỞ THẲNG PHÒNG CHẤM mySpeaking ═══════════════
   Thầy chốt 20/08: bấm thẻ → pop-up loading → mở TAB MỚI đã vào sẵn bài, bỏ cả
   ba màn (mã lớp · chọn team+tên · xác nhận). Team KHÔNG lấy từ myLesson mà để
   mySpeaking lo — bên đó giữ `teams[]` và `pairs[]` (đội nào chấm đội nào) của
   từng buổi.

   ⛔ HAI BẪY ĐÃ ĐO THẬT, đừng bỏ:
   1. **Bộ não chậm 8-40 giây** (đo bằng curl: 40,1s · 10,7s · 8,6s) ⇒ phải có
      pop-up, có nút Huỷ, và tự bỏ cuộc sau 45s.
   2. **Tên hai bên LỆCH**: myLesson có `CHẤN PHONG` (chuẩn myStudent, có dấu),
      mySpeaking lớp B2B đang ghi `PHONG` (tên ngắn trong DS của buổi). So thẳng
      là trượt ⇒ dùng `timEmTrongBuoi()` bên dưới. Đây đúng là bẫy bên mySpeaking
      đã ghi trong CLAUDE.md của họ ("tra không ra ⇒ mất sạch dữ liệu đã nộp").
   ⭐ SỬA 20/08 (thầy chỉ ngay sau khi xem): **KHÔNG tự nhảy tab nữa.** Pop-up
   tải xong, báo xong, rồi học sinh **bấm nút "Mở phòng chấm"** mới sang tab mới.
   Nhờ vậy cú `window.open` luôn nằm trong một cú bấm thật ⇒ không bao giờ bị
   trình duyệt chặn, và cũng bỏ luôn được nhánh dự phòng của bản trước. */

/* Bỏ dấu + viết hoa + gom khoảng trắng — để so tên hai hệ. */
function khongDau(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .replace(/\s+/g, ' ').trim().toUpperCase();
}
/* `A` có phải là ĐUÔI THEO TỪ của `B` không: PHONG ⊂ CHAN PHONG (đúng),
   nhưng ONG ⊄ CHAN PHONG (sai — cắt giữa từ). */
function laDuoiTu(a, b){
  var ta = khongDau(a).split(' '), tb = khongDau(b).split(' ');
  if (!ta.length || ta.length >= tb.length) return false;
  for (var i = 0; i < ta.length; i++) {
    if (ta[ta.length - 1 - i] !== tb[tb.length - 1 - i]) return false;
  }
  return true;
}

/* Tìm em trong các đội của buổi. Trả:
     {team, ten}                — tìm thấy chắc chắn
     {loi:'khong-thay'}         — không có tên nào hợp
     {loi:'mo-ho', ds:[…]}      — tên ngắn khớp NHIỀU đội (vd "MINH" hợp cả
                                  "DUY MINH" lẫn "BINH MINH") ⇒ KHÔNG đoán bừa. */
function timEmTrongBuoi(ten, teams){
  var chuan = khongDau(ten), thay = [];
  (teams || []).forEach(function(t){
    (t.members || []).forEach(function(m){
      if (khongDau(m) === chuan) thay.push({ team:t.team, ten:m, khop:'dung' });
    });
  });
  if (thay.length === 1) return thay[0];
  if (thay.length > 1)   return { loi:'mo-ho', ds:thay };

  (teams || []).forEach(function(t){
    (t.members || []).forEach(function(m){
      if (laDuoiTu(m, ten) || laDuoiTu(ten, m)) thay.push({ team:t.team, ten:m, khop:'duoi' });
    });
  });
  if (thay.length === 1) return thay[0];
  if (thay.length > 1)   return { loi:'mo-ho', ds:thay };
  return { loi:'khong-thay' };
}

/* Gói dữ liệu buổi cho mySpeaking — đi theo đường link vì hai trang KHÁC TÊN
   MIỀN nên không dùng chung bộ nhớ trình duyệt được. */
function goiB64(o){
  var chuoi = unescape(encodeURIComponent(JSON.stringify(o)));
  return btoa(chuoi).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* ═══ (Đợt Firebase 26/08/2026) KHO MỚI CỦA mySpeaking = FIRESTORE ═══
   Buổi speaking nay nằm ở `spBuoi/{LOP_BAI}` (project aword-70dae — đúng project đọc điểm
   AWord, cấu hình sẵn trong A.CFG.AWORD_DB). Kho mới trả lời DƯỚI 1 GIÂY nên hỏi TRƯỚC;
   lớp chưa có buổi Firestore (buổi cũ còn trong Google Sheets) thì rơi về bộ não Apps
   Script 8-40 giây như xưa. ⛔ Chưa dán luật Firestore khối spBuoi thì mọi lượt gọi bị
   từ chối — code tự rơi về đường cũ, không vỡ gì. */
function spFsGoc(){
  var db = (A.CFG && A.CFG.AWORD_DB) || null;
  if (!db || !db.projectId) return '';
  return 'https://firestore.googleapis.com/v1/projects/' + db.projectId +
    '/databases/(default)/documents';
}
function spFsGiai(f){
  if (!f || typeof f !== 'object') return null;
  if ('stringValue' in f) return f.stringValue;
  if ('integerValue' in f) return parseInt(f.integerValue, 10);
  if ('doubleValue' in f) return f.doubleValue;
  if ('booleanValue' in f) return f.booleanValue;
  if ('arrayValue' in f) return ((f.arrayValue && f.arrayValue.values) || []).map(spFsGiai);
  if ('mapValue' in f) {
    var o = {}, fs = (f.mapValue && f.mapValue.fields) || {};
    for (var k in fs) o[k] = spFsGiai(fs[k]);
    return o;
  }
  return null;
}
function spFsGiaiDoc(doc){
  var o = {}, fs = (doc && doc.fields) || {};
  for (var k in fs) o[k] = spFsGiai(fs[k]);
  if (doc && doc.name) o._id = String(doc.name).split('/').pop();
  return o;
}
/* Buổi ĐANG MỞ của một lớp trong kho mới — null nếu không có / kho chưa mở khoá. */
function spBuoiFs(maLop){
  var goc = spFsGoc();
  var db = (A.CFG && A.CFG.AWORD_DB) || {};
  if (!goc) return Promise.resolve(null);
  var body = { structuredQuery: {
    from: [{ collectionId: 'spBuoi' }],
    where: { compositeFilter: { op: 'AND', filters: [
      { fieldFilter: { field: { fieldPath: 'classCode' }, op: 'EQUAL',
        value: { stringValue: String(maLop || '').replace(/\s+/g, '').toUpperCase() } } },
      { fieldFilter: { field: { fieldPath: 'active' }, op: 'EQUAL',
        value: { booleanValue: true } } }
    ] } },
    limit: 5
  } };
  return fetch(goc + ':runQuery?key=' + db.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) throw new Error('FS_' + r.status);
    return r.json();
  }).then(function(ds){
    var doc = (Array.isArray(ds) ? ds : []).filter(function(x){ return x.document; })[0];
    if (!doc) return null;
    var b = spFsGiaiDoc(doc.document);
    return { _id: b._id, classCode: b.classCode || '', name: b.className || '',
      code: b.code || '', lesson: b.lesson || '', topic: b.topic || b.lesson || '',
      teams: b.teams || [], pairs: b.pairs || [] };
  });
}
/* Ai đã nộp trong một buổi kho mới — chỉ kéo về TÊN + sid (không kéo nội dung lỗi). */
function spDaNopFs(buoiId){
  var goc = spFsGoc();
  var db = (A.CFG && A.CFG.AWORD_DB) || {};
  var body = { structuredQuery: {
    from: [{ collectionId: 'baiNop' }],
    select: { fields: [{ fieldPath: 'student' }, { fieldPath: 'sid' }] },
    limit: 300
  } };
  return fetch(goc + '/spBuoi/' + encodeURIComponent(buoiId) + ':runQuery?key=' + db.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) throw new Error('FS_' + r.status);
    return r.json();
  }).then(function(ds){
    var thay = {}, out = [];
    (Array.isArray(ds) ? ds : []).forEach(function(x){
      if (!x.document) return;
      var d = spFsGiaiDoc(x.document);
      var ten = String(d.student || '').trim();
      if (ten && !thay[ten.toUpperCase()]) { thay[ten.toUpperCase()] = 1; out.push({ ten: ten }); }
    });
    return out;
  });
}
/* Mã bài của thẻ có khớp buổi không — so "chịu lệch": bằng nhau, hoặc cái này nằm trong
   cái kia sau khi bỏ dấu (thẻ ghi "DS-S4.I2.W3 GERMS", buổi ghi "GERMS"). */
function spKhopBai(maThe, tenBuoi){
  var a = khongDau(maThe), b = khongDau(tenBuoi);
  if (!a || !b) return false;
  return a === b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}

/* Có buổi trong tay (từ kho nào cũng vậy) → tìm em → dựng gói → nút "Mở phòng chấm".
   `kho` đi kèm trong gói để web mySpeaking biết bài nộp phải ghi vào đâu. */
function spVaoBuoi(b, lop, kho){
  var em = timEmTrongBuoi(TOI, lop.teams);
  if (em.loi === 'khong-thay')
    return spLoi(b, 'Em chưa có trong đội nào của buổi này. Em hỏi thầy Andrew nhé.');
  if (em.loi === 'mo-ho')
    return spLoi(b, 'Tên của em trùng với ' + em.ds.length +
      ' bạn trong buổi này nên thầy chưa mở được. Em báo thầy Andrew nhé.');

  var cap = (lop.pairs || []).filter(function(p){ return Number(p.checker) === Number(em.team); })[0];
  if (!cap) return spLoi(b, 'Đội ' + em.team + ' chưa được xếp chấm đội nào.');
  var doiCham = (lop.teams || []).filter(function(t){ return Number(t.team) === Number(cap.checked); })[0];
  if (!doiCham) return spLoi(b, 'Chưa tìm thấy đội mà em phải chấm.');

  var goi = goiB64({
    v:1, kho: kho, classCode: lop.classCode, tenLop: lop.name, lesson: lop.lesson,
    topic: lop.topic || lop.lesson, ten: em.ten, tenDayDu: TOI,
    team: em.team, cham: cap.checked,
    video: doiCham.video || '', members: doiCham.members || []
  });
  var duong = SP_WEB + '?goi=' + goi;

  if (spDongHo) { clearTimeout(spDongHo); spDongHo = null; }
  spDuong = duong;
  /* ⭐ Thầy chốt: KHÔNG tự nhảy tab — em bấm nút này mới mở. */
  spHien('Đã lấy xong dữ liệu', 'Em chấm <b>TEAM ' + cap.checked + '</b>.', 'xong',
    [{ chu:'Đóng', lam:spDong },
     { chu:'Mở phòng chấm', chinh:true, lam:function(){
         window.open(spDuong, '_blank'); spDong(); } }]);
}

function spLoi(b, chu){
  if (spHuy) return;
  spHuy = true;
  if (spDongHo) { clearTimeout(spDongHo); spDongHo = null; }
  spHien('Chưa vào được', chu, 'loi',
    [{ chu:'Đóng', lam:spDong },
     { chu:'Thử lại', chinh:true, lam:function(){ spDong(); moPhongCham(b); } }]);
}

/* ═══ ĐỔ TRẠNG THÁI NỘP BÀI VÀO THẺ SPEAKING (thầy chốt: "đẩy sẵn + đổ sau") ═══
   Thẻ hiện NGAY bằng số app myLesson đẩy sẵn; xong xuôi mới ngầm hỏi bộ não
   "buổi này ai đã nộp" rồi vẽ lại — em không phải chờ 8-40 giây lần nào.
   ⛔ Bộ não chưa có cửa `?danop=1` (chưa deploy) thì nó trả `{ok:true,app:…}`
   KHÔNG có mảng `daNop` ⇒ hàm này lặng lẽ giữ nguyên số đẩy sẵn. Đúng thiết kế:
   thêm cửa lúc nào thì thẻ tự sống lúc ấy, không phải sửa lại trang. */

/* Ngược chiều `timEmTrongBuoi`: từ tên TRONG BUỔI ("PHONG") tìm về tên đầy đủ
   của lớp ("CHẤN PHONG"). Khớp nhiều thì trả rỗng — thà thiếu còn hơn gán nhầm. */
function timTenLop(tenBuoi, ds){
  var chuan = khongDau(tenBuoi);
  var thay = ds.filter(function(t){ return khongDau(t) === chuan; });
  if (thay.length !== 1) {
    if (thay.length > 1) return '';
    thay = ds.filter(function(t){ return laDuoiTu(tenBuoi, t) || laDuoiTu(t, tenBuoi); });
  }
  return thay.length === 1 ? thay[0] : '';
}

/* Đổ danh sách "ai đã nộp" (từ kho nào cũng chung một khuôn [{ten}]) vào thẻ. */
function spDoDaNop(dsDaNop){
  var xong = {}, khongGhep = [];
  dsDaNop.forEach(function(x){
    var ten = timTenLop(x.ten, CA_LOP);
    if (ten) xong[ten] = true; else khongGhep.push(x.ten);
  });
  /* Tên nộp bài không ghép được với em nào trong lớp ⇒ thẻ ĐẾM THIẾU. Ghi ra
     console để còn biết đường sửa danh sách buổi bên mySpeaking.
     (Trong bản mẫu, `CHẤN PHONG` cố ý không nằm trong `CA_LOP` nên `PHONG`
     luôn rơi vào đây — bản thật danh sách lớp có đủ cả em.) */
  if (khongGhep.length && window.console)
    console.warn('speaking: khong ghep duoc ten ->', khongGhep.join(', '));
  var chua = CA_LOP.filter(function(t){ return !xong[t]; });
  BAI_SP.bai[0].xong = CA_LOP.length - chua.length;
  BAI_SP.thieu = chua.map(function(t){ return { ten:t, so:1 }; });
  dungCot();
}

function capNhatTheSpeaking(){
  if (!BAI_SP || !BAI_SP.ma) return;
  /* (Đợt Firebase) kho MỚI trước: buổi đang mở của lớp có trong Firestore và khớp
     mã bài của thẻ thì đếm thẳng từ đó (nhanh + không tốn lượt gọi bộ não). */
  spBuoiFs(lopMa())
    .then(function(buoi){
      if (buoi && spKhopBai(BAI_SP.ma, buoi.lesson)) {
        return spDaNopFs(buoi._id).then(spDoDaNop);
      }
      capNhatTheSpeakingGas();
    })
    .catch(function(){ capNhatTheSpeakingGas(); });
}

/* Đường cũ — hỏi bộ não Apps Script `?danop=1` (buổi còn trong Google Sheets). */
function capNhatTheSpeakingGas(){
  if (!SP_NAO) return;
  var ctl = (window.AbortController) ? new AbortController() : null;
  var het = setTimeout(function(){ if (ctl) ctl.abort(); }, 20000);
  fetch(SP_NAO + '?danop=1&classCode=' + encodeURIComponent(lopMa()) +
        '&lesson=' + encodeURIComponent(BAI_SP.ma) + '&_=' + Date.now(),
        { cache:'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(het);
      if (!j || !j.ok || !Array.isArray(j.daNop)) return;   /* cửa chưa có ⇒ giữ số đẩy sẵn */
      spDoDaNop(j.daNop);
    })
    .catch(function(){ clearTimeout(het); });
}

/* ---------- CHAT (v1.11.0 — KHO TIN THẬT) ----------
   Tới v1.10.x khung này còn bị KHOÁ vì chưa có chỗ chứa tin. Nay tin nằm trong
   Firestore, mỗi lớp một phòng, cả thầy lẫn học sinh nhắn chung một chỗ —
   xem `js/chat.js` (kèm đoạn LUẬT FIRESTORE thầy cần dán một lần).
   ⛔ Chưa dán luật thì khung báo hiền một dòng, KHÔNG để trống trơn khiến em
   nào cũng tưởng "lớp chưa ai nhắn gì". */
var TIN_MAU = [];          /* tin đang hiện, đổ về từ kho (giữ tên cũ cho các
                              hàm cảm xúc bên dưới không phải sửa) */

function veTin(t, i){
  var laToi = !!(t.ma && MA_HS && t.ma === MA_HS);
  var laThay = t.vaiTro === 'gv';
  var bong = '<div class="bong">' + chuAnToan(t.chu) + '</div>';
  var gio = AWChat.chuGio(t.luc);

  if (laToi) {
    return '<div class="msg toi" data-i="' + i + '">' + veAv(t.ten, i) +
      '<div class="msg-c">' +
        '<div class="hang-bong">' + bong + '</div>' +
        '<div class="gio-duoi">' + chuAnToan(gio) + '</div>' +
      '</div></div>';
  }
  return '<div class="msg' + (laThay ? ' cua-thay' : '') + '" data-i="' + i + '">' +
    veAv(t.ten, i) +
    '<div class="msg-c">' +
      '<div class="msg-top"><span class="n">' + chuAnToan(t.ten) +
        (laThay ? ' <b class="nhan-thay">THẦY</b>' : '') + '</span>' +
      '<span class="t">' + chuAnToan(gio) + '</span></div>' +
      '<div class="hang-bong">' + bong + '</div>' +
    '</div></div>';
}

var khung = $('#khungChat');

function veChat(){
  if (!TIN_MAU.length) {
    khung.innerHTML = '<div class="chat-cho">Lớp mình chưa ai nhắn gì.<br>' +
      'Em mở lời trước nhé!</div>';
    return;
  }
  /* Đang ở sát đáy thì sau khi vẽ lại vẫn giữ ở đáy (tin mới về);
     em đang cuộn đọc tin cũ thì KHÔNG giật xuống. */
  var oDay = (khung.scrollHeight - khung.scrollTop - khung.clientHeight) < 60;
  khung.innerHTML = TIN_MAU.map(veTin).join('');
  if (oDay) khung.scrollTop = khung.scrollHeight;
}

function noiChat(){
  khung.innerHTML = '<div class="chat-cho">Đang mở phòng trò chuyện…</div>';
  AWChat.nghe(LOP_DL, function(ds){
    TIN_MAU = ds;
    veChat();
  }, function(e){
    khung.innerHTML = '<div class="chat-cho">' + chuAnToan(AWChat.chuLoi(e)) + '</div>';
    var o = $('#oChat'); if (o) o.disabled = true;
  });
}

/* Sáu cảm xúc thả được — giữ lại cho đợt nối kho tin thật. */
var CAM_XUC = [
  { ma:'tim',  ky:'❤️' }, { ma:'haha', ky:'😆' }, { ma:'khoc', ky:'😢' },
  { ma:'gaCon', ky:'🐥' }, { ma:'ngac', ky:'😮' }, { ma:'like', ky:'👍' }
];
function kyHieuCx(ma){
  for (var i = 0; i < CAM_XUC.length; i++) if (CAM_XUC[i].ma === ma) return CAM_XUC[i].ky;
  return '';
}

/* ---------- THẢ / XEM CẢM XÚC (v17) ----------
   Tin CHƯA có cảm xúc nào → chạm nút ♡ là thả tim.
   Tin ĐÃ có cảm xúc      → chạm vào cụm là mở pop-up "ai thả gì" (thầy chốt).
   GIỮ 0,42s hoặc chuột phải → bảng chọn 6 cảm xúc + ✕ gỡ cảm xúc của mình. */
var GIU_MS = 420;
/* ⛔ Nhớ CHỈ SỐ TIN chứ đừng nhớ phần tử nút: mỗi lần đổi cảm xúc là cụm
   được vẽ lại, phần tử cũ thành rác — giữ nó là trỏ vào chỗ đã mất. */
var cxTin = null;
var henGiu = null, daGiu = false;

$('#cxMenu').innerHTML =
  CAM_XUC.map(function(c){
    return '<button type="button" data-cx="' + c.ma + '" title="' + c.ma + '">' + c.ky + '</button>';
  }).join('') +
  '<button type="button" class="bo" data-cx="" title="Bỏ cảm xúc">✕</button>';

function dsCx(i){ return TIN_MAU[i].cx || (TIN_MAU[i].cx = []); }
function cxCuaToi(i){
  var ds = dsCx(i);
  for (var k = 0; k < ds.length; k++) if (ds[k].ten === TOI) return ds[k].ma;
  return '';
}
function chiSoTin(nut){
  var m = nut.closest('.msg');
  return m ? parseInt(m.getAttribute('data-i'), 10) : null;
}
/* Cụm hiện ra: TIM luôn đứng đầu (♡ mờ nếu chưa ai thả tim), rồi tới các
   cảm xúc khác mà lớp đã thả — mỗi loại MỘT icon, xếp theo thứ tự trong
   CAM_XUC để lần nào cũng giống nhau. */
function veCumCx(i){
  var ds = dsCx(i);
  var dem = {};
  ds.forEach(function(e){ dem[e.ma] = (dem[e.ma] || 0) + 1; });

  /* Tim luôn đứng đầu: có ai thả thì đỏ, chưa ai thả thì VẪN QUẢ TIM ẤY
     nhưng rút hết màu (class .mo) — cùng hình, cùng cỡ, chỉ khác màu. */
  var o = '<span class="ky' + (dem['tim'] ? '' : ' mo') + '">' + kyHieuCx('tim') + '</span>';

  /* Hiện ĐỦ mọi loại lớp đã thả, xếp theo thứ tự trong CAM_XUC cho ổn định. */
  var loai = CAM_XUC.filter(function(c){ return c.ma !== 'tim' && dem[c.ma]; });
  o += loai.map(function(c){ return '<span class="ky">' + c.ky + '</span>'; }).join('');

  /* Có loại nào từ 2 lượt trở lên (ví dụ 5 bạn cùng thả tim) thì ghi thêm
     TỔNG số lượt của cả tin. Chỉ một icon một lượt thì khỏi, cho đỡ rối. */
  var trung = CAM_XUC.some(function(c){ return dem[c.ma] > 1; });
  if (trung) o += '<span class="dem">' + ds.length + '</span>';

  var soO = 1 + loai.length + (trung ? 1 : 0);
  var lop = 'nut-cx' + (ds.length ? ' co' : '') +
            (cxCuaToi(i) === 'tim' ? ' tim-toi' : '') +
            (soO > 4 ? ' nhieu' : '');
  var nhan = ds.length ? 'Xem ai đã thả cảm xúc' : 'Thả tim';
  return '<button class="' + lop + '" type="button" title="' + nhan + '" aria-label="' + nhan + '">' +
    o + '</button>';
}
function veLaiCum(i){
  var msg = khung.querySelector('.msg[data-i="' + i + '"]');
  var cu = msg && msg.querySelector('.nut-cx');
  if (cu) cu.outerHTML = veCumCx(i);
}
/* Đặt cảm xúc CỦA RIÊNG EM (ma rỗng = gỡ); cảm xúc của bạn khác giữ nguyên. */
function datCxToi(i, ma){
  TIN_MAU[i].cx = dsCx(i).filter(function(e){ return e.ten !== TOI; });
  if (ma) TIN_MAU[i].cx.push({ ten:TOI, ma:ma });
  veLaiCum(i);
}

/* Pop-up "AI THẢ CẢM XÚC GÌ" (v19): khung nhỏ dán ngay dưới cụm cảm xúc của
   đúng tin đó, không làm mờ nền — chỉ icon + tên, xếp theo thứ tự CAM_XUC. */
function moPopCx(nut, i){
  var ds = dsCx(i);
  if (!ds.length) return;
  var xep = [];
  CAM_XUC.forEach(function(c){
    ds.forEach(function(e){ if (e.ma === c.ma) xep.push({ ten:e.ten, ky:c.ky }); });
  });
  var o = $('#cxAi');
  o.innerHTML = xep.map(function(e){
    return '<div class="d' + (e.ten === TOI ? ' toi' : '') + '">' +
      '<span class="k">' + e.ky + '</span>' +
      '<span class="t">' + (e.ten === TOI ? 'Em' : e.ten) + '</span>' +
    '</div>';
  }).join('');
  o.classList.add('mo');           // hiện trước để đo được kích thước thật
  datChoCxAi(o, nut);
}
/* Đặt ngay DƯỚI cụm cảm xúc; sát đáy màn thì lật lên trên. */
function datChoCxAi(o, nut){
  var r = nut.getBoundingClientRect(), h = o.getBoundingClientRect();
  var rong = document.documentElement.clientWidth;
  var x = r.left + r.width / 2 - h.width / 2;
  x = Math.max(8, Math.min(x, rong - h.width - 8));
  var y = r.bottom + 6;
  if (y + h.height > window.innerHeight - 8) y = r.top - h.height - 6;
  o.style.left = Math.round(x) + 'px';
  o.style.top  = Math.round(y) + 'px';
}
function dongPopCx(){ $('#cxAi').classList.remove('mo'); }

function moBangCx(nut){
  var m = $('#cxMenu');
  cxTin = chiSoTin(nut);
  m.classList.add('mo');                       // hiện trước để đo được kích thước
  var r = nut.getBoundingClientRect(), mr = m.getBoundingClientRect();
  var x = r.left + r.width / 2 - mr.width / 2;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - mr.width - 8));
  var y = r.top - mr.height - 8;
  if (y < 8) y = r.bottom + 8;                 // gần mép trên thì lật xuống dưới
  m.style.left = Math.round(x) + 'px';
  m.style.top  = Math.round(y) + 'px';
}
function dongBangCx(){ $('#cxMenu').classList.remove('mo'); cxTin = null; }

$('#cxMenu').onclick = function(e){
  var b = e.target.closest('button');
  if (!b || cxTin === null) return;          // tin số 0 cũng hợp lệ nên so với null
  datCxToi(cxTin, b.getAttribute('data-cx'));
  dongBangCx();
};

khung.addEventListener('pointerdown', function(e){
  var nut = e.target.closest('.nut-cx');
  if (!nut) return;
  daGiu = false;
  clearTimeout(henGiu);
  henGiu = setTimeout(function(){ daGiu = true; moBangCx(nut); }, GIU_MS);
});
khung.addEventListener('pointerup', function(e){
  var nut = e.target.closest('.nut-cx');
  clearTimeout(henGiu);
  if (!nut || daGiu) return;
  var i = chiSoTin(nut);
  if (i === null) return;
  /* Chạm nhanh: tin đã có cảm xúc → mở danh sách "ai thả gì"; tin còn trống
     → chạm là thả tim luôn cho nhanh. */
  if (dsCx(i).length) moPopCx(nut, i); else datCxToi(i, 'tim');
});
khung.addEventListener('pointercancel', function(){ clearTimeout(henGiu); });
khung.addEventListener('pointerleave', function(){ clearTimeout(henGiu); });
/* Chuột phải trên máy tính cũng mở bảng chọn cho nhanh. */
khung.addEventListener('contextmenu', function(e){
  var nut = e.target.closest('.nut-cx');
  if (!nut) return;
  e.preventDefault();
  moBangCx(nut);
});
document.addEventListener('pointerdown', function(e){
  if ($('#cxMenu').classList.contains('mo') &&
      !e.target.closest('#cxMenu') && !e.target.closest('.nut-cx')) dongBangCx();
  if ($('#cxAi').classList.contains('mo') &&
      !e.target.closest('#cxAi') && !e.target.closest('.nut-cx')) dongPopCx();
});
window.addEventListener('scroll', function(){ dongBangCx(); dongPopCx(); }, true);

/* Bấm vào chỗ trống bất kỳ trong khung chat → con trỏ nhảy vào ô nhập. */
document.querySelector('.chat').addEventListener('click', function(e){
  if (e.target.closest('.nut-cx') || e.target.closest('button') ||
      e.target.closest('textarea') || e.target.closest('.bong')) return;
  $('#oChat').focus();
});

/* Ô nhập tự nới cao theo đúng số dòng, KHÔNG chặn trần: thầy chốt phải luôn
   nhìn thấy trọn tin trước khi gửi. Tin dài nhất (300 ký tự) chỉ chiếm chừng
   nửa khung chat — phần danh sách tin tự co lại rồi bung ra sau khi gửi. */
function noOChat(){
  var o = $('#oChat');
  o.style.height = 'auto';
  /* box-sizing:border-box nên phải cộng thêm phần VIỀN — scrollHeight chỉ
     tính tới padding, thiếu 3px viền là dòng cuối vẫn bị khuất. */
  var vien = o.offsetHeight - o.clientHeight;
  o.style.height = (o.scrollHeight + vien) + 'px';
}

function guiTin(){
  var o = $('#oChat');
  var chu = o.value.trim();
  if (!chu) return;
  o.disabled = true;
  AWChat.gui(LOP_DL, { ten: TOI, ma: MA_HS, vaiTro: 'hs', chu: chu })
    .then(function(){
      o.value = '';
      noOChat();
      /* KHÔNG tự chèn tin vào khung: `onSnapshot` bắn về ngay sau đó, chèn tay
         là tin hiện HAI LẦN. */
    })['catch'](function(e){
      baoToast(AWChat.chuLoi(e));
    })
    .then(function(){ o.disabled = false; o.focus(); });
}
$('#nutGui').onclick = guiTin;
$('#oChat').oninput = noOChat;
/* Enter = gửi · Shift+Enter = xuống dòng trong ô nhập. */
$('#oChat').onkeydown = function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); guiTin(); }
};
noOChat();

var henToast = null;
function baoToast(chu){
  var t = $('#toast');
  t.textContent = chu;
  t.classList.add('hien');
  clearTimeout(henToast);
  henToast = setTimeout(function(){ t.classList.remove('hien'); }, 2600);
}
</script>
</body>
</html>
