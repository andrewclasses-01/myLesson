/* ═══════════════ SP CHECK — MỞ THẲNG PHÒNG CHẤM mySpeaking ═══════════════
   Thầy chốt 20/08: bấm thẻ → pop-up loading → mở TAB MỚI đã vào sẵn bài, bỏ cả
   ba màn (mã lớp · chọn team+tên · xác nhận). Team KHÔNG lấy từ myLesson mà để
   mySpeaking lo — bên đó giữ `teams[]` và `pairs[]` (đội nào chấm đội nào) của
   từng buổi.

   ⛔ HAI BẪY ĐÃ ĐO THẬT, đừng bỏ:
   1. **Bộ não chậm 8-40 giây** (đo bằng curl: 40,1s · 10,7s · 8,6s) ⇒ phải có
      pop-up, có nút Huỷ, và tự bỏ cuộc sau 45s.
   2. **Tên hai bên LỆCH**: myLesson có `CHẤN PHONG` (chuẩn myStudent, có dấu),
      mySpeaking lớp B2B đang ghi `PHONG` (tên ngắn trong DS của buổi). So thẳng
      là trượt ⇒ dùng `timEmTrongBuoi()` bên dưới. Đây đúng là bẫy bên mySpeaking
      đã ghi trong CLAUDE.md của họ ("tra không ra ⇒ mất sạch dữ liệu đã nộp").
   ⭐ SỬA 20/08 (thầy chỉ ngay sau khi xem): **KHÔNG tự nhảy tab nữa.** Pop-up
   tải xong, báo xong, rồi học sinh **bấm nút "Mở phòng chấm"** mới sang tab mới.
   Nhờ vậy cú `window.open` luôn nằm trong một cú bấm thật ⇒ không bao giờ bị
   trình duyệt chặn, và cũng bỏ luôn được nhánh dự phòng của bản trước. */

/* Bỏ dấu + viết hoa + gom khoảng trắng — để so tên hai hệ. */
function khongDau(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .replace(/\s+/g, ' ').trim().toUpperCase();
}
/* `A` có phải là ĐUÔI THEO TỪ của `B` không: PHONG ⊂ CHAN PHONG (đúng),
   nhưng ONG ⊄ CHAN PHONG (sai — cắt giữa từ). */
function laDuoiTu(a, b){
  var ta = khongDau(a).split(' '), tb = khongDau(b).split(' ');
  if (!ta.length || ta.length >= tb.length) return false;
  for (var i = 0; i < ta.length; i++) {
    if (ta[ta.length - 1 - i] !== tb[tb.length - 1 - i]) return false;
  }
  return true;
}

/* Tìm em trong các đội của buổi. Trả:
     {team, ten}                — tìm thấy chắc chắn
     {loi:'khong-thay'}         — không có tên nào hợp
     {loi:'mo-ho', ds:[…]}      — tên ngắn khớp NHIỀU đội (vd "MINH" hợp cả
                                  "DUY MINH" lẫn "BINH MINH") ⇒ KHÔNG đoán bừa. */
function timEmTrongBuoi(ten, teams){
  var chuan = khongDau(ten), thay = [];
  (teams || []).forEach(function(t){
    (t.members || []).forEach(function(m){
      if (khongDau(m) === chuan) thay.push({ team:t.team, ten:m, khop:'dung' });
    });
  });
  if (thay.length === 1) return thay[0];
  if (thay.length > 1)   return { loi:'mo-ho', ds:thay };

  (teams || []).forEach(function(t){
    (t.members || []).forEach(function(m){
      if (laDuoiTu(m, ten) || laDuoiTu(ten, m)) thay.push({ team:t.team, ten:m, khop:'duoi' });
    });
  });
  if (thay.length === 1) return thay[0];
  if (thay.length > 1)   return { loi:'mo-ho', ds:thay };
  return { loi:'khong-thay' };
}

/* Gói dữ liệu buổi cho mySpeaking — đi theo đường link vì hai trang KHÁC TÊN
   MIỀN nên không dùng chung bộ nhớ trình duyệt được. */
function goiB64(o){
  var chuoi = unescape(encodeURIComponent(JSON.stringify(o)));
  return btoa(chuoi).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* ═══ (Đợt Firebase 26/08/2026) KHO MỚI CỦA mySpeaking = FIRESTORE ═══
   Buổi speaking nay nằm ở `spBuoi/{LOP_BAI}` (project aword-70dae — đúng project đọc điểm
   AWord, cấu hình sẵn trong A.CFG.AWORD_DB). Kho mới trả lời DƯỚI 1 GIÂY nên hỏi TRƯỚC;
   lớp chưa có buổi Firestore (buổi cũ còn trong Google Sheets) thì rơi về bộ não Apps
   Script 8-40 giây như xưa. ⛔ Chưa dán luật Firestore khối spBuoi thì mọi lượt gọi bị
   từ chối — code tự rơi về đường cũ, không vỡ gì. */
function spFsGoc(){
  var db = (A.CFG && A.CFG.AWORD_DB) || null;
  if (!db || !db.projectId) return '';
  return 'https://firestore.googleapis.com/v1/projects/' + db.projectId +
    '/databases/(default)/documents';
}
function spFsGiai(f){
  if (!f || typeof f !== 'object') return null;
  if ('stringValue' in f) return f.stringValue;
  if ('integerValue' in f) return parseInt(f.integerValue, 10);
  if ('doubleValue' in f) return f.doubleValue;
  if ('booleanValue' in f) return f.booleanValue;
  if ('arrayValue' in f) return ((f.arrayValue && f.arrayValue.values) || []).map(spFsGiai);
  if ('mapValue' in f) {
    var o = {}, fs = (f.mapValue && f.mapValue.fields) || {};
    for (var k in fs) o[k] = spFsGiai(fs[k]);
    return o;
  }
  return null;
}
function spFsGiaiDoc(doc){
  var o = {}, fs = (doc && doc.fields) || {};
  for (var k in fs) o[k] = spFsGiai(fs[k]);
  if (doc && doc.name) o._id = String(doc.name).split('/').pop();
  return o;
}
/* Buổi ĐANG MỞ của một lớp trong kho mới — null nếu không có / kho chưa mở khoá. */
function spBuoiFs(maLop){
  var goc = spFsGoc();
  var db = (A.CFG && A.CFG.AWORD_DB) || {};
  if (!goc) return Promise.resolve(null);
  var body = { structuredQuery: {
    from: [{ collectionId: 'spBuoi' }],
    where: { compositeFilter: { op: 'AND', filters: [
      { fieldFilter: { field: { fieldPath: 'classCode' }, op: 'EQUAL',
        value: { stringValue: String(maLop || '').replace(/\s+/g, '').toUpperCase() } } },
      { fieldFilter: { field: { fieldPath: 'active' }, op: 'EQUAL',
        value: { booleanValue: true } } }
    ] } },
    limit: 5
  } };
  return fetch(goc + ':runQuery?key=' + db.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) throw new Error('FS_' + r.status);
    return r.json();
  }).then(function(ds){
    var doc = (Array.isArray(ds) ? ds : []).filter(function(x){ return x.document; })[0];
    if (!doc) return null;
    var b = spFsGiaiDoc(doc.document);
    return { _id: b._id, classCode: b.classCode || '', name: b.className || '',
      code: b.code || '', lesson: b.lesson || '', topic: b.topic || b.lesson || '',
      teams: b.teams || [], pairs: b.pairs || [],
      /* (Đợt B 27/08/2026) mô hình 2 = bản tổng lỗi + màn phản biện (mySpeaking app v1.7.0 đóng dấu) */
      moHinh: b.moHinh === 2 ? 2 : 1 };
  });
}
/* Ai đã nộp trong một buổi kho mới — chỉ kéo về TÊN (không kéo nội dung lỗi).
   (Đợt B) buổi MÔ HÌNH 2: mỗi em chấm = 1 bản tổng trong `tongLoi` — đếm ở đó;
   buổi mô hình 1 giữ nếp cũ đếm `baiNop` (mỗi lượt nộp 1 tài liệu). */
function spDaNopFs(buoiId, moHinh){
  var goc = spFsGoc();
  var db = (A.CFG && A.CFG.AWORD_DB) || {};
  var body = { structuredQuery: {
    from: [{ collectionId: moHinh === 2 ? 'tongLoi' : 'baiNop' }],
    select: { fields: [{ fieldPath: 'student' }] },
    limit: 300
  } };
  return fetch(goc + '/spBuoi/' + encodeURIComponent(buoiId) + ':runQuery?key=' + db.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) throw new Error('FS_' + r.status);
    return r.json();
  }).then(function(ds){
    var thay = {}, out = [];
    (Array.isArray(ds) ? ds : []).forEach(function(x){
      if (!x.document) return;
      var d = spFsGiaiDoc(x.document);
      var ten = String(d.student || '').trim();
      if (ten && !thay[ten.toUpperCase()]) { thay[ten.toUpperCase()] = 1; out.push({ ten: ten }); }
    });
    return out;
  });
}

/* ⭐ 27/08 — THẺ SP CHECK: THANH TIẾN TRÌNH THEO TEAM. Chỉ buổi MÔ HÌNH 2 (bản
   tổng lỗi `tongLoi/{slug}`, mỗi em chấm = 1 tài liệu) có đủ dữ liệu để dựng —
   buổi mô hình 1 (`baiNop` cũ) không có `myTeam`/`errors` nên vẫn dùng dòng
   chung cũ (`veDiem`, xem nhánh trong `veTheMoi`/`veTheCu`).
   `student` = TÊN NGƯỜI CHẤM (bắt lỗi), `myTeam` = đội của chính người đó,
   `checkedTeam` = đội BỊ chấm. "TEAM N · x FOUND" tính theo `myTeam` — đúng
   nghĩa "đội N tìm/bắt được bao nhiêu lỗi" (mySpeaking gọi FOUND cho đội chấm,
   CAUGHT cho đội bị chấm — ta dùng FOUND). */
function spDoiSpFs(buoiId){
  var goc = spFsGoc();
  var db = (A.CFG && A.CFG.AWORD_DB) || {};
  var body = { structuredQuery: {
    from: [{ collectionId: 'tongLoi' }],
    // ⭐ 02/09 — thêm `capNhatLuc`: cần mốc nộp để xếp trên/dưới khi hai em TRÙNG ĐIỂM
    // (avatar trên thanh đội). Thiếu trường này thì mọi em `luc = 0`, chồng lớp hú hoạ.
    select: { fields: [{ fieldPath: 'student' }, { fieldPath: 'myTeam' }, { fieldPath: 'errors' }, { fieldPath: 'capNhatLuc' }] },
    limit: 300
  } };
  return fetch(goc + '/spBuoi/' + encodeURIComponent(buoiId) + ':runQuery?key=' + db.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) throw new Error('FS_' + r.status);
    return r.json();
  }).then(function(ds){
    return (Array.isArray(ds) ? ds : []).filter(function(x){ return x.document; })
      .map(function(x){ return spFsGiaiDoc(x.document); });
  });
}
/* Một tài liệu tongLoi có bao nhiêu lỗi CÒN SỐNG (bỏ câu đã "go"/"an" qua
   phản biện — cùng luật `song` mySpeaking đang dùng ở mọi nơi khác). */
function soLoiSong(errors){
  return (errors || []).filter(function(er){ return !er.trangThai || er.trangThai === 'song'; }).length;
}
/* Ngưỡng CỐ ĐỊNH theo TB lỗi/người — thầy chốt: ≥30 luôn xanh lá, ≥25 luôn xanh
   dương, ≥20 luôn cam; dưới 20 mới xét theo HẠNG (tinhDoiSp lo tiếp). */
var DOI_MAU_CO_DINH = [ { min:30, m:'m-la' }, { min:25, m:'m-duong' }, { min:20, m:'m-cam' } ];
function mauCoDinhDoi(tb){
  for (var i = 0; i < DOI_MAU_CO_DINH.length; i++)
    if (tb >= DOI_MAU_CO_DINH[i].min) return DOI_MAU_CO_DINH[i].m;
  return null;
}
/* Gộp `docs` (tongLoi thô) + `teams` (roster của buổi) thành mảng hiển thị cho
   thẻ + pop-up. Bạn nào chưa nộp vẫn hiện, tính 0 lỗi (không bỏ sót — thầy
   chốt "thể hiện rõ ràng mỗi bạn đã bắt được bao nhiêu lỗi"). */
function tinhDoiSp(teams, docs){
  var theoTen = {}, lucTen = {};
  (docs || []).forEach(function(d){
    var ten = khongDau(d.student);
    if (!ten) return;
    theoTen[ten] = (theoTen[ten] || 0) + soLoiSong(d.errors);
    /* ⭐ 02/09 — mốc nộp, để phân trên/dưới khi HAI EM TRÙNG ĐIỂM (xem `avThanhHtml`) */
    var l = +d.capNhatLuc || 0;
    if (l && (!lucTen[ten] || l < lucTen[ten])) lucTen[ten] = l;
  });
  var doi = (teams || []).map(function(t){
    var hs = (t.members || []).map(function(m){
      return { ten: m, so: theoTen[khongDau(m)] || 0, luc: lucTen[khongDau(m)] || 0 };
    }).sort(function(a, b){ return b.so - a.so; });
    var tong = hs.reduce(function(s, e){ return s + e.so; }, 0);
    return { team: t.team, ten: 'TEAM ' + t.team, tong: tong,
      tb: hs.length ? tong / hs.length : 0, hs: hs };
  });

  /* ⛔ (02/09 đợt 3) Đoạn tính `maxLop` (thước chung cả lớp) ĐÃ GỠ: thầy chốt avatar phải nằm
     gọn trong PHẦN MÀU của chính đội mình, em giỏi nhất chạm mép phải vệt màu ⇒ mỗi đội một
     thước, không còn thước chung nữa. Chỗ xếp nay do `xepAvatarThanh()` tính từ bề ngang thật
     của thanh — xem chú thích ở hàm đó, kèm hệ quả phải biết. */

  /* Đội đã có màu cố định (TB ≥20) đứng ngoài; đội còn lại xếp HẠNG theo tổng
     lỗi: hạng 1 xanh lá, 2 xanh dương, 3 cam, 4-5 đỏ — thầy chốt riêng: nhóm
     dưới 4 đội thì đội BÉT luôn đỏ (bỏ qua màu đúng thứ tự của hạng đó). */
  var chuaCoMau = doi.filter(function(d){ return !mauCoDinhDoi(d.tb); })
    .sort(function(a, b){ return b.tong - a.tong; });
  var mauHang = ['m-la', 'm-duong', 'm-cam', 'm-do', 'm-do'];
  chuaCoMau.forEach(function(d, i){
    d.mau = (chuaCoMau.length < 4 && i === chuaCoMau.length - 1) ? 'm-do' : (mauHang[i] || 'm-do');
  });
  doi.forEach(function(d){ if (!d.mau) d.mau = mauCoDinhDoi(d.tb); });

  /* ⭐ 28/08 tối — thầy chốt: thanh có DUNG TÍCH CỐ ĐỊNH 200 lỗi (không co giãn
     theo đội cao điểm nhất nữa) — dưới 200 thì chia đều trong thanh, đủ 200 là
     đầy thanh, số vẫn tăng tiếp còn thanh đứng yên. */
  var TRAN_DOI = 200;
  doi.forEach(function(d){ d.pt = Math.min(100, Math.round(d.tong / TRAN_DOI * 100)); });
  /* Đội nhiều điểm nhất luôn lên trên — vẽ theo đúng thứ tự mảng này (veDoiSpKhoi
     chỉ .map() theo thứ tự), tự sắp lại mỗi lần dữ liệu mới về. */
  doi.sort(function(a, b){ return b.tong - a.tong; });
  return doi;
}
/* Mã bài của thẻ có khớp buổi không — so "chịu lệch": bằng nhau, hoặc cái này nằm trong
   cái kia sau khi bỏ dấu (thẻ ghi "DS-S4.I2.W3 GERMS", buổi ghi "GERMS"). */
function spKhopBai(maThe, tenBuoi){
  var a = khongDau(maThe), b = khongDau(tenBuoi);
  if (!a || !b) return false;
  return a === b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}

var spHuy = false, spDongHo = null, spDuong = '';
/* Số thứ tự LƯỢT mở phòng chấm. Hai con số đỏ đọc xong sau khi nút đã hiện, mà
   em có thể đã đóng pop-up rồi bấm lại thẻ khác — so lượt để không treo số của
   lượt cũ lên nút của lượt mới. */
var spLuot = 0;
var IC_SP_CHAM = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 12.5l2 2 4.5-5" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9.5" stroke="#fff" stroke-width="2"/></svg>';
var IC_SP_PB = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v10H9l-4 4V5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
/* ⭐ 03/09/2026 — icon hai nút NHỎ. Nét lấy màu chữ của chính nút (`currentColor`) chứ
   không ghim trắng như hai nút to: nút nhỏ nền nhạt, chữ đậm màu, ghim trắng là mất tích. */
var IC_SP_XN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 7-7"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>';
var IC_SP_KT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="11" height="11" rx="2"/><rect x="10" y="10" width="11" height="11" rx="2"/></svg>';

/* n.ic (svg, tuỳ chọn): nút to trạng thái XONG có icon + hiệu ứng hào quang khi
   bấm; nút thường (Huỷ/Đóng/Thử lại) không có `ic` thì giữ nguyên chữ trơn.
   n.viec (02/09/2026): 'cham' | 'pb' — tên VIỆC của nút, để `spGanSo()` tìm đúng
   nút mà treo ô tròn đỏ khi số đọc xong. Không đánh theo VỊ TRÍ nút vì buổi kiểu
   cũ chỉ có một nút, vị trí 1 lúc là Phản biện lúc lại không có.
   doi (02/09/2026): số đội em phải chấm — có thì hiện khối "EM CHẤM / TEAM X". */
function spHien(tieu, phu, kieu, nut, doi){
  var hop = $('#spHop');
  hop.classList.remove('xong', 'loi');
  if (kieu) hop.classList.add(kieu);
  $('#spTieu').textContent = tieu;
  $('#spPhu').innerHTML = phu;
  $('#spDoi').classList.toggle('hien', doi != null && doi !== '');
  if (doi != null && doi !== '') $('#spDoiSo').textContent = doi;
  $('#spNut').innerHTML = '';
  /* ⭐ 03/09/2026 — nút nay xếp HAI CỘT (`n.cot` = 0 trái / 1 phải, `n.to` = nút to hay
     nút nhỏ). Nút không khai `cot` (mọi lời báo lỗi, "Huỷ", "Thử lại"…) vẫn nằm thẳng
     trong `#spNut` như cũ — CSS `.sp-hop:not(.xong)` giữ nguyên nếp hàng ngang.
     ⛔ Đừng bắt mọi lời gọi phải khai `cot`: `spLoi`/`spNgoaiDoi`/`moPhongCham` đều gọi
     `spHien` với nút trơn, ép cột là chúng rơi vào lưới 2 cột trông rất kỳ. */
  var oCot = [null, null];
  function layCot(i){
    if (!oCot[i]) {
      oCot[i] = document.createElement('div');
      oCot[i].className = 'sp-cot';
      $('#spNut').appendChild(oCot[i]);
    }
    return oCot[i];
  }
  (nut || []).forEach(function(n){
    var b = document.createElement('button');
    var lop = [];
    if (n.chinh) lop.push('chinh');
    if (n.cot != null) lop.push(n.to ? 'to' : 'nho', n.cot === 0 ? 'la' : 'duong');
    if (lop.length) b.className = lop.join(' ');
    if (n.viec) b.dataset.viec = n.viec;
    if (n.ic) {
      var loi = n.to === 0
        ? '<span class="hang">' + n.ic + '<span>' + chuAnToan(n.chu) + '</span></span>'
        : n.ic + '<span>' + chuAnToan(n.chu) + '</span>';
      b.innerHTML = loi + (n.phu ? '<span class="chu">' + chuAnToan(n.phu) + '</span>' : '') +
        '<span class="sp-halo"></span>';
    } else b.textContent = n.chu;
    b.onclick = function(){
      var halo = b.querySelector('.sp-halo');
      if (halo) {
        var v = document.createElement('span');
        v.className = 'di';
        halo.appendChild(v);
        v.addEventListener('animationend', function(){ v.remove(); });
      }
      n.lam();
    };
    (n.cot != null ? layCot(n.cot) : $('#spNut')).appendChild(b);
  });
  $('#spNut').classList.toggle('hai-cot', oCot[0] != null || oCot[1] != null);
  $('#spNen').classList.add('mo');
}
function spDong(){
  $('#spNen').classList.remove('mo');
  if (spDongHo) { clearTimeout(spDongHo); spDongHo = null; }
}
function spThoi(){
  spHuy = true;
  spDong();
}

function moPhongCham(b){
  spHuy = false;
  spDuong = '';
  spLuot++;   /* mỗi lần bấm là một lượt — xem chú thích chỗ khai báo `spLuot` */
  spHien('Đang lấy dữ liệu chấm speaking',
    'Việc này có thể cần chờ một chút.',
    '', [{ chu:'Huỷ', lam:spThoi }]);

  spDongHo = setTimeout(function(){
    if (spHuy) return;
    spHuy = true;
    spHien('Mạng đang chậm',
      'Chưa mở được phòng chấm. Em thử lại giúp thầy nhé.', 'loi',
      [{ chu:'Đóng', lam:spDong }, { chu:'Thử lại', chinh:true, lam:function(){ spDong(); moPhongCham(b); } }]);
  }, 45000);

  /* (Đợt Firebase) kho MỚI trước — dưới 1 giây; không có buổi thì bộ não cũ 8-40s */
  spBuoiFs(lopMa())
    .then(function(lop){
      if (spHuy) return;
      if (lop) return spVaoBuoi(b, lop, 'fs');
      spHoiGas(b);
    })
    .catch(function(e){
      if (spHuy) return;
      /* ⭐⭐ v1.29.0 — KHO CẠN HẠN MỨC THÌ DỪNG HẲN, ĐỪNG LÙI VỀ BỘ NÃO CŨ.
         `spBuoiFs` ném `Error('FS_' + mã HTTP)`; 429 = "Quota exceeded" — gói
         Firebase MIỄN PHÍ cho 50.000 lượt đọc/ngày trên CẢ project, cạn là mọi
         phép đọc bị chặn tới nửa đêm giờ Los Angeles (≈14:00 giờ VN).

         ⛔ VÌ SAO PHẢI CHẶN CÚ LÙI: bộ não Apps Script cũ chỉ biết các buổi còn
         nằm trong Google Sheets. Buổi mở bằng myLesson (từ Đợt C) nằm ở
         Firestore nên bộ não cũ KHÔNG THẤY ⇒ nó trả về "Lớp mình chưa có buổi
         speaking nào đang mở" — một câu SAI SỰ THẬT, sau khi bắt em ngồi chờ
         8-40 giây. Đúng cảnh A2B ngày 28/08/2026: buổi vẫn mở đàng hoàng, chỉ
         là kho không cho đọc. Nói thẳng "kho quá tải" còn hơn đổ oan cho thầy
         là chưa mở buổi. */
      var ma = String((e && e.message) || '');
      if (ma.indexOf('429') >= 0) return spDangNangCap();
      spHoiGas(b);
    });
}

/* Đường cũ — bộ não Apps Script (buổi còn nằm trong Google Sheets) */
function spHoiGas(b){
  fetch(SP_NAO + '?config=1&_=' + Date.now(), { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (spHuy) return;
      var lop = (j.classes || []).filter(function(c){
        return khongDau(c.classCode) === khongDau(lopMa()); })[0];
      if (!lop) return spLoi(b, 'Lớp mình chưa có buổi speaking nào đang mở.');
      spVaoBuoi(b, lop, 'gas');
    })
    .catch(function(e){
      if (window.console) console.warn('speaking:', e);
      spLoi(b, 'Chưa gọi được thầy Andrew. Em kiểm tra mạng rồi thử lại nhé.');
    });
}

/* ═══ ⭐ 02/09/2026 (web v1.53.0) — HAI Ô TRÒN ĐỎ TRÊN HAI NÚT ═══════════════
   Thầy chốt: nút Chấm bài đeo số câu em chấm ĐANG BỊ PHẢN BIỆN; nút Phản biện
   đeo số câu của RIÊNG EM đang chờ em xác nhận. Hai con số này chính là hai
   nhãn em sẽ thấy khi vào bên trong mySpeaking — "REQUIREMENT: n" ở màn chấm và
   "UNCONFIRMED: n" (chế độ MINE) ở màn phản biện. ⛔ Đổi luật đếm ở đây là phải
   đổi cả `mySpeaking/web/js/app.js` (`demTranhChap` · `layThieuBatBuocPb`), kẻo
   số ngoài nút một đằng số trong màn một nẻo — thà không có số còn hơn số sai.

   ⛔ LUẬT 8 (Firestore tính tiền theo SỐ TÀI LIỆU). Đã đo trên 3 buổi thật
   02/09/2026: quét sạch hai ngăn con tốn 207 · 378 · 556 tài liệu MỖI LẦN BẤM.
   Nên ở đây KHÔNG quét, mà hỏi đúng 4 câu đã lọc sẵn — đo lại trên chính 3 buổi
   ấy còn trung bình 30 · 71 · 77 tài liệu (cao nhất 193), và cho ra số GIỐNG HỆT
   cách quét sạch ở cả 41/41 học sinh. Bốn câu đó là:
     1. tongLoi  student     = tên em   → bản chấm CỦA EM (1 tài liệu)
     2. tongLoi  checkedTeam = đội em   → các bản chấm SOI VÀO ĐỘI EM (3-4 tài liệu)
     3. phanHoi  chuLoi      = tên em   → phiếu tích trên bản chấm của em
     4. phanHoi  voter       = tên em   → phiếu chính em đã tích
   `chuLoi` trong phanHoi là TÊN EM CHẤM (chủ của bản chấm), KHÔNG phải người bị
   bắt lỗi — người bị bắt lỗi nằm ở `err.who`. Đọc nhầm hai trường này là số sai
   mà không có gì báo. Đã kiểm bằng dữ liệu thật: errId `mtcclrqrvv` có
   chuLoi=HOÀNG CHI (em chấm) trong khi who=THƯ (em bị bắt lỗi).

   Việc đọc chạy SAU khi nút đã hiện (nếp "đẩy sẵn + đổ sau" của thẻ speaking) —
   em không phải chờ thêm giây nào, số nhảy vào sau. */

/* Hỏi một ngăn con của buổi, lọc sẵn theo MỘT trường. Trả [] nếu kho im lặng. */
function spTruyCon(buoiId, ngan, truong, gtri){
  var goc = spFsGoc();
  var db = (A.CFG && A.CFG.AWORD_DB) || {};
  if (!goc || !buoiId) return Promise.resolve([]);
  var body = { structuredQuery: {
    from: [{ collectionId: ngan }],
    where: { fieldFilter: { field: { fieldPath: truong }, op: 'EQUAL',
      value: { stringValue: String(gtri) } } },
    /* Chốt trần: buổi đông nhất đo được có 541 phiếu CHO CẢ BUỔI, một em không
       thể chạm 400. Có trần thì lỡ dữ liệu hỏng cũng không kéo về vô hạn. */
    limit: 400
  } };
  return fetch(goc + '/spBuoi/' + encodeURIComponent(buoiId) + ':runQuery?key=' + db.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    if (!r.ok) throw new Error('FS_' + r.status);
    return r.json();
  }).then(function(ds){
    return (Array.isArray(ds) ? ds : [])
      .filter(function(x){ return x.document; })
      .map(function(x){ return spFsGiaiDoc(x.document); });
  });
}

/* So tên kiểu mySpeaking: bỏ khoảng trắng thừa + không phân biệt hoa thường.
   ⛔ Cố ý KHÔNG dùng `khongDau()` như `timEmTrongBuoi`: bên mySpeaking ghi phiếu
   bằng phép so NÀY, nới lỏng hơn ở đây là số ngoài nút lệch số trong màn. */
function spTenBang(a, b){
  return !!a && !!b && String(a).trim().toUpperCase() === String(b).trim().toUpperCase();
}

/* Đếm hai con số. `doiEm` là chuỗi kiểu "TEAM 2" — đúng khuôn kho ghi trong
   tongLoi.checkedTeam (đã xem dữ liệu thật, không phải đoán). */
function spDemViec(buoiId, tenEm, doiEm){
  return Promise.all([
    spTruyCon(buoiId, 'tongLoi', 'student', tenEm),
    spTruyCon(buoiId, 'tongLoi', 'checkedTeam', doiEm),
    spTruyCon(buoiId, 'phanHoi', 'chuLoi', tenEm),
    spTruyCon(buoiId, 'phanHoi', 'voter', tenEm)
  ]).then(function(kq){
    var banEm = kq[0][0] || {}, banSoiDoiEm = kq[1], phieuTrenBanEm = kq[2], phieuCuaEm = kq[3];

    /* (1) REQUIREMENT — câu em chấm CÒN TRANH CHẤP THẬT: có người phản đối mà
       chính chủ (err.who) chưa tự nhận, và em chưa chốt Keep/Agree (`ketLuan`). */
    var soCham = (banEm.errors || []).filter(function(e){
      if (e.trangThai !== 'song' || e.ketLuan) return false;
      var ph = phieuTrenBanEm.filter(function(p){ return p.errId === e.id; });
      var coPhanDoi = ph.some(function(p){ return p.y === 'phanDoi'; });
      var chinhChuDaNhan = !!e.who && ph.some(function(p){
        return p.y === 'dongY' && spTenBang(p.voter, e.who); });
      return coPhanDoi && !chinhChuDaNhan;
    }).length;

    /* (2) UNCONFIRMED của RIÊNG EM — câu ghi tên em mà em chưa tích gì.
       'an' = em chấm tự xoá · 'go' = đã được gỡ ⇒ cả hai đều hết việc. */
    var daTich = {};
    phieuCuaEm.forEach(function(p){ daTich[p.errId] = true; });
    var soPb = 0;
    banSoiDoiEm.forEach(function(d){
      (d.errors || []).forEach(function(e){
        if (e.trangThai === 'an' || e.trangThai === 'go') return;
        if (!spTenBang(e.who, tenEm)) return;
        if (daTich[e.id]) return;
        soPb++;
      });
    });

    return { cham: soCham, pb: soPb };
  });
}

/* ⭐ 03/09/2026 — HAI SỐ CỦA HAI NÚT NHỎ (gộp lỗi trùng). Đọc RIÊNG, chạy SAU hai số
   trên để nút to có số trước; kho `cum`/`cumPhieu` chưa dán luật thì phép này ném 403
   và nút nhỏ đứng dấu `!` — hai nút to KHÔNG bị ảnh hưởng.
     · kiemtratrung = số cụm đội EM đang soạn mà CHƯA GỬI (việc dang dở, phải bấm gửi)
     · xacnhantrung = số cụm đội em CHẤM đã gửi mà EM chưa bỏ phiếu
   ⛔ Đừng đếm "số lỗi chưa gộp" cho nút KIỂM TRA TRÙNG: con số đó luôn hàng trăm và
      không bao giờ về 0 (phần lớn lỗi vốn không trùng ai), treo lên nút là vô nghĩa. */
function spDemTrung(buoiId, tenEm, doiEm, doiEmCham){
  return Promise.all([
    spTruyCon(buoiId, 'cum', 'doiBiCham', doiEm),
    spTruyCon(buoiId, 'cum', 'doiBiCham', doiEmCham),
    spTruyCon(buoiId, 'cumPhieu', 'voter', tenEm)
  ]).then(function(kq){
    var song = function(c){ return (c.ids || []).length > 1; };   /* ids rỗng = cụm đã giải tán */
    var cuaEm = kq[0].filter(song), doiKia = kq[1].filter(song), phieuEm = kq[2];
    var daBo = {};
    phieuEm.forEach(function(p){ if (p.y) daBo[p.cumId] = true; });
    return {
      kt: cuaEm.filter(function(c){ return !c.daGui; }).length,
      xn: doiKia.filter(function(c){ return c.daGui && !daBo[c._id]; }).length
    };
  });
}

/* Treo ô tròn đỏ lên nút. `n` là số, hoặc '!' khi ĐỌC KHÔNG ĐƯỢC.
   ⛔ Đọc hỏng thì KHÔNG được im lặng bỏ trống: nút trống có nghĩa là "0 việc"
   (số 0 vốn không vẽ gì), im lặng là nói với em rằng em hết việc — đúng họ bẫy
   "báo ok giả". Dấu `!` để em biết là chưa đọc được chứ không phải hết việc. */
function spGanSo(viec, n, chuThich){
  var b = document.querySelector('#spNut button[data-viec="' + viec + '"]');
  if (!b || !n) return;
  var s = document.createElement('span');
  s.className = 'sp-bad';
  s.textContent = (typeof n === 'number' && n > 99) ? '99+' : String(n);
  s.title = chuThich;
  b.appendChild(s);
}

/* Đọc rồi treo số — chạy nền, hỏng thì chỉ ghi console + treo dấu `!`. */
function spDoSo(buoiId, tenEm, doiEm, doiEmCham){
  var luot = spLuot;
  spDemViec(buoiId, tenEm, doiEm).then(function(v){
    if (luot !== spLuot) return;   /* em đã đóng / mở lượt khác */
    spGanSo('cham', v.cham, v.cham + ' câu em chấm đang bị phản biện');
    spGanSo('pb', v.pb, v.pb + ' câu của em đang chờ em xác nhận');
  }).catch(function(e){
    if (luot !== spLuot) return;
    if (window.console) console.warn('speaking: khong dem duoc so viec ->', e);
    spGanSo('cham', '!', 'Chưa đọc được số việc — em cứ vào bình thường nhé');
    spGanSo('pb', '!', 'Chưa đọc được số việc — em cứ vào bình thường nhé');
  });
  /* Hai nút nhỏ đọc RIÊNG một mạch: kho `cum` có thể chưa dán luật (403) mà hai nút
     to vẫn phải có số đúng — gộp chung một Promise.all là hỏng một cái hỏng cả bốn. */
  spDemTrung(buoiId, tenEm, doiEm, doiEmCham).then(function(v){
    if (luot !== spLuot) return;
    spGanSo('kt', v.kt, v.kt + ' cụm đội em đang soạn, chưa gửi');
    spGanSo('xn', v.xn, v.xn + ' cụm đang chờ em bỏ phiếu');
  }).catch(function(e){
    if (luot !== spLuot) return;
    if (window.console) console.warn('speaking: khong dem duoc so cum trung ->', e);
    spGanSo('kt', '!', 'Chưa đọc được — em cứ vào bình thường nhé');
    spGanSo('xn', '!', 'Chưa đọc được — em cứ vào bình thường nhé');
  });
}

/* Có buổi trong tay (từ kho nào cũng vậy) → tìm em → dựng gói → nút "Mở phòng chấm".
   `kho` đi kèm trong gói để web mySpeaking biết bài nộp phải ghi vào đâu. */
function spVaoBuoi(b, lop, kho){
  var em = timEmTrongBuoi(TOI, lop.teams);
  if (em.loi === 'khong-thay')
    return spNgoaiDoi();
  if (em.loi === 'mo-ho')
    return spLoi(b, 'Tên của em trùng với ' + em.ds.length +
      ' bạn trong buổi này nên thầy chưa mở được. Em báo thầy Andrew nhé.');

  var cap = (lop.pairs || []).filter(function(p){ return Number(p.checker) === Number(em.team); })[0];
  if (!cap) return spLoi(b, 'Đội ' + em.team + ' chưa được xếp chấm đội nào.');
  var doiCham = (lop.teams || []).filter(function(t){ return Number(t.team) === Number(cap.checked); })[0];
  if (!doiCham) return spLoi(b, 'Chưa tìm thấy đội mà em phải chấm.');

  /* (Đợt B) cờ mô hình đi kèm trong gói — mh:2 là buổi bản-tổng-lỗi (màn chấm mới bên mySpeaking) */
  var mh = lop.moHinh === 2 ? 2 : 1;
  var clips = (lop.teams || []).map(function(t){ return { t: t.team, v: t.video || '' }; });
  var goi = goiB64({
    v:1, kho: kho, mh: mh, classCode: lop.classCode, tenLop: lop.name, lesson: lop.lesson,
    topic: lop.topic || lop.lesson, ten: em.ten, tenDayDu: TOI,
    team: em.team, cham: cap.checked,
    video: doiCham.video || '', members: doiCham.members || [],
    /* (Đợt 3) video của MỌI đội — bên mySpeaking bấm logo là mở pop-up xem
       cả lớp để học hỏi tham khảo (thầy chốt 26/08). */
    clips: clips
  });
  var duong = SP_WEB + '?goi=' + goi;

  /* (Đợt B) nút PHẢN BIỆN — chỉ buổi mô hình 2: gói mang video + thành viên của CHÍNH ĐỘI EM
     (bên mySpeaking mở màn xem lỗi đội mình bị chấm + tích đồng ý/phản đối). */
  var duongPb = '';
  var doiEm = (lop.teams || []).filter(function(t){ return Number(t.team) === Number(em.team); })[0];
  if (mh === 2 && doiEm && doiEm.video) {
    duongPb = SP_WEB + '?goi=' + goiB64({
      v:1, kho: kho, mh: 2, pb: 1, classCode: lop.classCode, tenLop: lop.name, lesson: lop.lesson,
      topic: lop.topic || lop.lesson, ten: em.ten, tenDayDu: TOI,
      team: em.team, cham: cap.checked,
      video: doiEm.video || '', members: doiEm.members || [],
      clips: clips
    });
  }

  /* ⭐ 03/09/2026 — HAI ĐƯỜNG MỚI của tính năng GỘP LỖI TRÙNG.
       kt (KIỂM TRA TRÙNG)  — đội EM bị chấm ⇒ mang video + thành viên ĐỘI EM, y như `pb`.
                              kèm `cb` = đội ĐANG CHẤM đội em, để bên kia ghi "TEAM mấy
                              sẽ bỏ phiếu". Tra trong `pairs`: checked == đội em.
       xn (XÁC NHẬN TRÙNG)  — em đi chấm ⇒ mang video + thành viên ĐỘI BỊ CHẤM, y như `cham`.
     ⛔ Cả hai chỉ dựng cho buổi MÔ HÌNH 2 (buổi cũ Google Sheets không có kho `cum`). */
  var duongKt = '', duongXn = '';
  if (mh === 2) {
    var capChamEm = (lop.pairs || []).filter(function(p){ return Number(p.checked) === Number(em.team); })[0];
    if (doiEm && doiEm.video) {
      duongKt = SP_WEB + '?goi=' + goiB64({
        v:1, kho: kho, mh: 2, kt: 1, classCode: lop.classCode, tenLop: lop.name, lesson: lop.lesson,
        topic: lop.topic || lop.lesson, ten: em.ten, tenDayDu: TOI,
        team: em.team, cham: cap.checked, cb: capChamEm ? capChamEm.checker : 0,
        video: doiEm.video || '', members: doiEm.members || [], clips: clips
      });
    }
    duongXn = SP_WEB + '?goi=' + goiB64({
      v:1, kho: kho, mh: 2, xn: 1, classCode: lop.classCode, tenLop: lop.name, lesson: lop.lesson,
      topic: lop.topic || lop.lesson, ten: em.ten, tenDayDu: TOI,
      team: em.team, cham: cap.checked,
      video: doiCham.video || '', members: doiCham.members || [], clips: clips
    });
  }

  if (spDongHo) { clearTimeout(spDongHo); spDongHo = null; }
  spDuong = duong;
  /* ⭐ Thầy chốt: KHÔNG tự nhảy tab — em bấm nút này mới mở.
     ⭐ 03/09/2026 — BỐN NÚT, XẾP HAI CỘT (thầy duyệt qua bản mẫu):
       cột trái XANH LÁ  = việc CHẤM   : CHẤM BÀI CÁ NHÂN (to) · XÁC NHẬN TRÙNG (nhỏ)
       cột phải XANH DƯƠNG = việc BỊ CHẤM: PHẢN BIỆN CÁ NHÂN (to) · KIỂM TRA TRÙNG (nhỏ)
     Chú thích nằm TRONG nút, một dòng, nghiêng. ⛔ Đừng tách ra thành dòng chữ rời
     bên dưới nút — thầy đã bảo bỏ. */
  var nut = [
    { cot:0, to:1, chu:'CHẤM BÀI CÁ NHÂN', phu:'Bài chấm của cá nhân em',
      ic:IC_SP_CHAM, viec:'cham', lam:function(){ window.open(spDuong, '_blank'); spDong(); } }
  ];
  if (duongXn) nut.push({ cot:0, to:0, chu:'XÁC NHẬN TRÙNG', phu:'Cả đội quyết các lỗi chấm trùng',
    ic:IC_SP_XN, viec:'xn', lam:function(){ window.open(duongXn, '_blank'); spDong(); } });
  if (duongPb) nut.push({ cot:1, to:1, chu:'PHẢN BIỆN CÁ NHÂN', phu:'Phản biện của cá nhân em',
    ic:IC_SP_PB, viec:'pb', lam:function(){ window.open(duongPb, '_blank'); spDong(); } });
  if (duongKt) nut.push({ cot:1, to:0, chu:'KIỂM TRA TRÙNG', phu:'Gộp lỗi bị bắt trùng của đội em',
    ic:IC_SP_KT, viec:'kt', lam:function(){ window.open(duongKt, '_blank'); spDong(); } });
  /* ⭐ 02/09/2026 — đội em chấm nay là khối riêng `.sp-doi` (tham số thứ 5), câu
     phụ để RỖNG. Xem chú thích khối CSS `.sp-doi` vì sao không nhét vào `.sp-phu`. */
  spHien('Đã lấy xong dữ liệu', '', 'xong', nut, cap.checked);
  /* Nút đã hiện rồi mới đi đếm — em không phải chờ thêm, số nhảy vào sau.
     ⛔ CHỈ buổi mô hình 2 trong kho Firestore mới có hai ngăn tongLoi/phanHoi để
     đếm. Buổi cũ đi đường Apps Script (`spHoiGas`) dựng `lop` từ Google Sheets,
     không hề có `_id` — gọi đếm ở đó thì 4 câu hỏi đều rỗng, ra số 0, và số 0 lại
     KHÔNG vẽ gì ⇒ nút trắng trơn, đúng nghĩa "im lặng báo hết việc". Chặn hẳn ở
     đây thay vì để nó tự ra 0. */
  if (mh === 2 && lop._id) spDoSo(lop._id, em.ten, 'TEAM ' + em.team, 'TEAM ' + cap.checked);
}

function spLoi(b, chu){
  if (spHuy) return;
  spHuy = true;
  if (spDongHo) { clearTimeout(spDongHo); spDongHo = null; }
  spHien('Chưa vào được', chu, 'loi',
    [{ chu:'Đóng', lam:spDong },
     { chu:'Thử lại', chinh:true, lam:function(){ spDong(); moPhongCham(b); } }]);
}

/* Em không có trong đội nào của buổi — không phải lỗi để thử lại, chỉ báo 1 dòng. */
function spNgoaiDoi(){
  if (spHuy) return;
  spHuy = true;
  if (spDongHo) { clearTimeout(spDongHo); spDongHo = null; }
  spHien('', 'EM KHÔNG THUỘC ĐỘI NÀO, HẸN EM Ở BÀI KIỂM TRA SAU NHÉ!', 'ngoaidoi',
    [{ chu:'Đóng', lam:spDong }]);
}

/* ⭐ v1.29.1 (thầy chốt) — KHO TỪ CHỐI ĐỌC (429): chỉ MỘT DÒNG, không nói gì thêm.
   ⛔ Cố ý KHÔNG dùng `spLoi`: nó kèm tiêu đề "Chưa vào được" + nút "Thử lại", mà
   bấm lại ngay thì kho vẫn từ chối — chỉ tổ mời em bấm vô ích. Cũng cố ý KHÔNG
   khai lý do kỹ thuật (hạn mức, mốc giờ): em chỉ cần biết chờ rồi tải lại. */
function spDangNangCap(){
  if (spHuy) return;
  spHuy = true;
  if (spDongHo) { clearTimeout(spDongHo); spDongHo = null; }
  spHien('', 'HỆ THỐNG ĐANG NÂNG CẤP, EM HÃY CHỜ MỘT LÁT RỒI TẢI LẠI', 'motdong',
    [{ chu:'Đóng', lam:spDong }]);
}

/* ═══ ĐỔ TRẠNG THÁI NỘP BÀI VÀO THẺ SPEAKING (thầy chốt: "đẩy sẵn + đổ sau") ═══
   Thẻ hiện NGAY bằng số app myLesson đẩy sẵn; xong xuôi mới ngầm hỏi bộ não
   "buổi này ai đã nộp" rồi vẽ lại — em không phải chờ 8-40 giây lần nào.
   ⛔ Bộ não chưa có cửa `?danop=1` (chưa deploy) thì nó trả `{ok:true,app:…}`
   KHÔNG có mảng `daNop` ⇒ hàm này lặng lẽ giữ nguyên số đẩy sẵn. Đúng thiết kế:
   thêm cửa lúc nào thì thẻ tự sống lúc ấy, không phải sửa lại trang. */

/* Ngược chiều `timEmTrongBuoi`: từ tên TRONG BUỔI ("PHONG") tìm về tên đầy đủ
   của lớp ("CHẤN PHONG"). Khớp nhiều thì trả rỗng — thà thiếu còn hơn gán nhầm. */
function timTenLop(tenBuoi, ds){
  var chuan = khongDau(tenBuoi);
  var thay = ds.filter(function(t){ return khongDau(t) === chuan; });
  if (thay.length !== 1) {
    if (thay.length > 1) return '';
    thay = ds.filter(function(t){ return laDuoiTu(tenBuoi, t) || laDuoiTu(t, tenBuoi); });
  }
  return thay.length === 1 ? thay[0] : '';
}

/* Đổ danh sách "ai đã nộp" (từ kho nào cũng chung một khuôn [{ten}]) vào thẻ. */
function spDoDaNop(dsDaNop){
  var xong = {}, khongGhep = [];
  dsDaNop.forEach(function(x){
    var ten = timTenLop(x.ten, CA_LOP);
    if (ten) xong[ten] = true; else khongGhep.push(x.ten);
  });
  /* Tên nộp bài không ghép được với em nào trong lớp ⇒ thẻ ĐẾM THIẾU. Ghi ra
     console để còn biết đường sửa danh sách buổi bên mySpeaking.
     (Trong bản mẫu, `CHẤN PHONG` cố ý không nằm trong `CA_LOP` nên `PHONG`
     luôn rơi vào đây — bản thật danh sách lớp có đủ cả em.) */
  if (khongGhep.length && window.console)
    console.warn('speaking: khong ghep duoc ten ->', khongGhep.join(', '));
  var chua = CA_LOP.filter(function(t){ return !xong[t]; });
  BAI_SP.bai[0].xong = CA_LOP.length - chua.length;
  BAI_SP.thieu = chua.map(function(t){ return { ten:t, so:1 }; });
  dungCot();
}

function capNhatTheSpeaking(){
  if (!BAI_SP || !BAI_SP.ma) return;
  /* (Đợt Firebase) kho MỚI trước: buổi đang mở của lớp có trong Firestore và khớp
     mã bài của thẻ thì đếm thẳng từ đó (nhanh + không tốn lượt gọi bộ não).
     ⭐ 27/08 — buổi MÔ HÌNH 2: một lượt gọi `spDoiSpFs()` vừa ra "ai đã nộp"
     (mọi em có tài liệu tongLoi = đã nộp, kể cả 0 lỗi) VỪA ra thanh theo team
     (`tinhDoiSp`) — đỡ tốn thêm lượt gọi Firestore. Đặt `BAI_SP.doiSp` TRƯỚC
     khi gọi `spDoDaNop` (nó tự vẽ lại thẻ ở cuối) để một lần vẽ là đủ. Buổi
     mô hình 1 (cũ) giữ nguyên đường `spDaNopFs`, không có thanh team. */
  spBuoiFs(lopMa())
    .then(function(buoi){
      if (!buoi || !spKhopBai(BAI_SP.ma, buoi.lesson)) return capNhatTheSpeakingGas();
      if (buoi.moHinh === 2) {
        return spDoiSpFs(buoi._id).then(function(docs){
          var doi = tinhDoiSp(buoi.teams, docs);
          if (doi.length) BAI_SP.doiSp = doi;
          spDoDaNop(docs.map(function(d){ return { ten: d.student }; }));
        });
      }
      return spDaNopFs(buoi._id, buoi.moHinh).then(spDoDaNop);
    })
    .catch(function(){ capNhatTheSpeakingGas(); });
}

/* Đường cũ — hỏi bộ não Apps Script `?danop=1` (buổi còn trong Google Sheets). */
function capNhatTheSpeakingGas(){
  if (!SP_NAO) return;
  var ctl = (window.AbortController) ? new AbortController() : null;
  var het = setTimeout(function(){ if (ctl) ctl.abort(); }, 20000);
  fetch(SP_NAO + '?danop=1&classCode=' + encodeURIComponent(lopMa()) +
        '&lesson=' + encodeURIComponent(BAI_SP.ma) + '&_=' + Date.now(),
        { cache:'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(het);
      if (!j || !j.ok || !Array.isArray(j.daNop)) return;   /* cửa chưa có ⇒ giữ số đẩy sẵn */
      spDoDaNop(j.daNop);
    })
    .catch(function(){ clearTimeout(het); });
}

/* ---------- CHAT (v1.11.0 — KHO TIN THẬT) ----------
   Tới v1.10.x khung này còn bị KHOÁ vì chưa có chỗ chứa tin. Nay tin nằm trong
   Firestore, mỗi lớp một phòng, cả thầy lẫn học sinh nhắn chung một chỗ —
   xem `js/chat.js` (kèm đoạn LUẬT FIRESTORE thầy cần dán một lần).
   ⛔ Chưa dán luật thì khung báo hiền một dòng, KHÔNG để trống trơn khiến em
   nào cũng tưởng "lớp chưa ai nhắn gì". */
var TIN_MAU = [];          /* tin đang hiện, đổ về từ kho (giữ tên cũ cho các
                              hàm cảm xúc bên dưới không phải sửa) */

// ⭐ v1.52.0 (gói bảo mật C) — CHỈ THẦY xoá được tin (luật Firestore `delete: if laThay()`).
// Trước (Đợt D) em tự xoá tin của mình được; nay luật chặn ⇒ giấu nút kẻo bấm là 403.
// Em tự xoá tin của mình: để đợt sau khi có đăng nhập học sinh.
function coTheXoaTin(t){
  return !!(t.id && MA_HS === 'GV');
}
function veTin(t, i){
  var laToi = !!(t.ma && MA_HS && t.ma === MA_HS);
  var laThay = t.vaiTro === 'gv';
  // ⭐ 28/08 — cụm xoá nằm NGAY TRONG bong bóng (xem CSS `.xoa-cum`): bấm ⁝ mới
  // hiện chữ "Xoá", bấm "Xoá" mới ra hộp confirm (không đổi — xem trình nghe
  // click bên dưới). Không xoá được thì bỏ hẳn cụm, không vẽ ⁝ vô nghĩa.
  var xoaCum = coTheXoaTin(t)
    ? '<span class="xoa-cum">' +
        '<button class="nut-xoa-tin" type="button" data-xoa-mo title="Xoá tin nhắn">⁝</button>' +
        '<button class="nut-xoa-that" type="button" data-xoa="' + chuAnToan(t.id) + '">Xoá</button>' +
      '</span>'
    : '';
  var bong = '<div class="bong">' + chuAnToan(t.chu) + xoaCum + '</div>';
  var gio = AWChat.chuGio(t.luc);
  // ⭐ #8 — cụm thả cảm xúc CHƯA TỪNG được vẽ vào tin nhắn (chỉ có hàm vẽ LẠI
  // `veLaiCum`, không có lần vẽ ĐẦU) — nay gắn thẳng vào đây mới thật sự dùng
  // được. `veCumCx` đọc `TIN_MAU[i].cx` nên phải gọi SAU khi TIN_MAU đã có `t`.
  var cumCx = veCumCx(i);

  if (laToi) {
    return '<div class="msg toi" data-i="' + i + '">' + veAv(t.ten, i) +
      '<div class="msg-c">' +
        '<div class="hang-bong">' + cumCx + bong + '</div>' +
        '<div class="gio-duoi">' + chuAnToan(gio) + '</div>' +
      '</div></div>';
  }
  return '<div class="msg' + (laThay ? ' cua-thay' : '') + '" data-i="' + i + '">' +
    veAv(t.ten, i) +
    '<div class="msg-c">' +
      '<div class="msg-top"><span class="n">' + chuAnToan(t.ten) +
        (laThay ? ' <b class="nhan-thay">THẦY</b>' : '') + '</span>' +
      '<span class="t">' + chuAnToan(gio) + '</span></div>' +
      '<div class="hang-bong">' + bong + cumCx + '</div>' +
    '</div></div>';
}

var khung = $('#khungChat');

function veChat(){
  if (!TIN_MAU.length) {
    khung.innerHTML = '<div class="chat-cho">Lớp mình chưa ai nhắn gì.<br>' +
      'Em mở lời trước nhé!</div>';
    return;
  }
  /* Đang ở sát đáy thì sau khi vẽ lại vẫn giữ ở đáy (tin mới về);
     em đang cuộn đọc tin cũ thì KHÔNG giật xuống. */
  var oDay = (khung.scrollHeight - khung.scrollTop - khung.clientHeight) < 60;
  khung.innerHTML = TIN_MAU.map(veTin).join('');
  if (oDay) khung.scrollTop = khung.scrollHeight;
}

/* ⭐ v1.37.0 — CHẤM ĐỎ "lớp có tin nhắn mới".
   Trang này đã mở KÊNH CHAT SỐNG nên biết mốc tin cuối MIỄN PHÍ (không tốn
   thêm lượt đọc nào) — cất luôn vào đệm chung để hai trang bài khỏi phải hỏi
   kho. Thầy chốt: chấm CHỈ tắt khi em bấm vào khung chat. */
function mocTinCuoi(){
  var l = 0;
  TIN_MAU.forEach(function(t){ var x = Number(t.luc) || 0; if (x > l) l = x; });
  return l;
}
function capNhatChamTin(){
  var l = mocTinCuoi();
  A.datMocTinMoi(LOP_DL, l);
  A.veChamDo(!!l && l > A.mocDaXem(LOP_DL, MA_HS));
}
function danhDauDocChat(){
  var l = mocTinCuoi();
  if (!l) return;
  A.danhDauDaXem(LOP_DL, MA_HS, l);   /* ⛔ mốc CỦA TIN, không phải Date.now() */
  A.veChamDo(false);
}

function noiChat(){
  khung.innerHTML = '<div class="chat-cho">Đang mở phòng trò chuyện…</div>';
  AWChat.nghe(LOP_DL, function(ds){
    TIN_MAU = ds;
    veChat();
    capNhatChamTin();
  }, function(e){
    khung.innerHTML = '<div class="chat-cho">' + chuAnToan(AWChat.chuLoi(e)) + '</div>';
    var o = $('#oChat'); if (o) o.disabled = true;
  });
}

/* Sáu cảm xúc thả được — giữ lại cho đợt nối kho tin thật. */
var CAM_XUC = [
  { ma:'tim',  ky:'❤️' }, { ma:'haha', ky:'😆' }, { ma:'khoc', ky:'😢' },
  { ma:'gaCon', ky:'🐥' }, { ma:'ngac', ky:'😮' }, { ma:'like', ky:'👍' }
];
function kyHieuCx(ma){
  for (var i = 0; i < CAM_XUC.length; i++) if (CAM_XUC[i].ma === ma) return CAM_XUC[i].ky;
  return '';
}

/* ---------- THẢ / XEM CẢM XÚC (v17) ----------
   Tin CHƯA có cảm xúc nào → chạm nút ♡ là thả tim.
   Tin ĐÃ có cảm xúc      → chạm vào cụm là mở pop-up "ai thả gì" (thầy chốt).
   GIỮ 0,42s hoặc chuột phải → bảng chọn 6 cảm xúc + ✕ gỡ cảm xúc của mình. */
var GIU_MS = 420;
/* ⛔ Nhớ CHỈ SỐ TIN chứ đừng nhớ phần tử nút: mỗi lần đổi cảm xúc là cụm
   được vẽ lại, phần tử cũ thành rác — giữ nó là trỏ vào chỗ đã mất. */
var cxTin = null;
var henGiu = null, daGiu = false;

$('#cxMenu').innerHTML =
  CAM_XUC.map(function(c){
    return '<button type="button" data-cx="' + c.ma + '" title="' + c.ma + '">' + c.ky + '</button>';
  }).join('') +
  '<button type="button" class="bo" data-cx="" title="Bỏ cảm xúc">✕</button>';

// ⭐ #8 (Đợt D) — cx nay ĐẾN TỪ FIRESTORE dạng map { maNguoi: {ma,ten} } (kho
// tin thật, chia sẻ giữa mọi người). dsCx() đổi nó thành mảng [{ten,ma}] y hệt
// hình dạng cũ để mọi hàm bên dưới (veCumCx/moPopCx…) không phải sửa gì thêm.
function dsCx(i){
  var m = TIN_MAU[i].cx || {};
  return Object.keys(m).map(function(k){ return { ten: m[k].ten, ma: m[k].ma }; });
}
function cxCuaToi(i){
  var m = TIN_MAU[i].cx || {};
  return (m[MA_HS] && m[MA_HS].ma) || '';
}
function chiSoTin(nut){
  var m = nut.closest('.msg');
  return m ? parseInt(m.getAttribute('data-i'), 10) : null;
}
/* Cụm hiện ra: TIM luôn đứng đầu (♡ mờ nếu chưa ai thả tim), rồi tới các
   cảm xúc khác mà lớp đã thả — mỗi loại MỘT icon, xếp theo thứ tự trong
   CAM_XUC để lần nào cũng giống nhau. */
function veCumCx(i){
  var ds = dsCx(i);
  var dem = {};
  ds.forEach(function(e){ dem[e.ma] = (dem[e.ma] || 0) + 1; });

  /* Tim luôn đứng đầu: có ai thả thì đỏ, chưa ai thả thì VẪN QUẢ TIM ẤY
     nhưng rút hết màu (class .mo) — cùng hình, cùng cỡ, chỉ khác màu. */
  var o = '<span class="ky' + (dem['tim'] ? '' : ' mo') + '">' + kyHieuCx('tim') + '</span>';

  /* Hiện ĐỦ mọi loại lớp đã thả, xếp theo thứ tự trong CAM_XUC cho ổn định. */
  var loai = CAM_XUC.filter(function(c){ return c.ma !== 'tim' && dem[c.ma]; });
  o += loai.map(function(c){ return '<span class="ky">' + c.ky + '</span>'; }).join('');

  /* Có loại nào từ 2 lượt trở lên (ví dụ 5 bạn cùng thả tim) thì ghi thêm
     TỔNG số lượt của cả tin. Chỉ một icon một lượt thì khỏi, cho đỡ rối. */
  var trung = CAM_XUC.some(function(c){ return dem[c.ma] > 1; });
  if (trung) o += '<span class="dem">' + ds.length + '</span>';

  var soO = 1 + loai.length + (trung ? 1 : 0);
  var lop = 'nut-cx' + (ds.length ? ' co' : '') +
            (cxCuaToi(i) === 'tim' ? ' tim-toi' : '') +
            (soO > 4 ? ' nhieu' : '');
  var nhan = ds.length ? 'Xem ai đã thả cảm xúc' : 'Thả tim';
  return '<button class="' + lop + '" type="button" title="' + nhan + '" aria-label="' + nhan + '">' +
    o + '</button>';
}
function veLaiCum(i){
  var msg = khung.querySelector('.msg[data-i="' + i + '"]');
  var cu = msg && msg.querySelector('.nut-cx');
  if (cu) cu.outerHTML = veCumCx(i);
}
/* Đặt cảm xúc CỦA RIÊNG EM (ma rỗng = gỡ); cảm xúc của bạn khác giữ nguyên.
   ⭐ Đợt D — vẽ lại NGAY (lạc quan) rồi mới ghi lên Firestore; ghi hỏng (vd
   chưa dán luật mới) thì báo hiền + tự lùi lại giao diện, không đứng im như
   đã lưu mà thực ra chưa. */
function datCxToi(i, ma){
  var t = TIN_MAU[i];
  var cuTruoc = t.cx && t.cx[MA_HS];
  var m = t.cx || (t.cx = {});
  if (ma) m[MA_HS] = { ma:ma, ten:TOI }; else delete m[MA_HS];
  veLaiCum(i);
  if (!t.id) return;
  AWChat.suaCx(LOP_DL, t.id, MA_HS, ma, TOI)['catch'](function(e){
    if (cuTruoc) m[MA_HS] = cuTruoc; else delete m[MA_HS];
    veLaiCum(i);
    baoToast(AWChat.chuLoi(e));
  });
}

/* Pop-up "AI THẢ CẢM XÚC GÌ" (v19): khung nhỏ dán ngay dưới cụm cảm xúc của
   đúng tin đó, không làm mờ nền — chỉ icon + tên, xếp theo thứ tự CAM_XUC. */
function moPopCx(nut, i){
  var ds = dsCx(i);
  if (!ds.length) return;
  var xep = [];
  CAM_XUC.forEach(function(c){
    ds.forEach(function(e){ if (e.ma === c.ma) xep.push({ ten:e.ten, ky:c.ky }); });
  });
  var o = $('#cxAi');
  o.innerHTML = xep.map(function(e){
    return '<div class="d' + (e.ten === TOI ? ' toi' : '') + '">' +
      '<span class="k">' + e.ky + '</span>' +
      '<span class="t">' + (e.ten === TOI ? 'Em' : e.ten) + '</span>' +
    '</div>';
  }).join('');
  o.classList.add('mo');           // hiện trước để đo được kích thước thật
  datChoCxAi(o, nut);
}
/* Đặt ngay DƯỚI cụm cảm xúc; sát đáy màn thì lật lên trên. */
function datChoCxAi(o, nut){
  var r = nut.getBoundingClientRect(), h = o.getBoundingClientRect();
  var rong = document.documentElement.clientWidth;
  var x = r.left + r.width / 2 - h.width / 2;
  x = Math.max(8, Math.min(x, rong - h.width - 8));
  var y = r.bottom + 6;
  if (y + h.height > window.innerHeight - 8) y = r.top - h.height - 6;
  o.style.left = Math.round(x) + 'px';
  o.style.top  = Math.round(y) + 'px';
}
function dongPopCx(){ $('#cxAi').classList.remove('mo'); }

function moBangCx(nut){
  var m = $('#cxMenu');
  cxTin = chiSoTin(nut);
  m.classList.add('mo');                       // hiện trước để đo được kích thước
  var r = nut.getBoundingClientRect(), mr = m.getBoundingClientRect();
  var x = r.left + r.width / 2 - mr.width / 2;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - mr.width - 8));
  var y = r.top - mr.height - 8;
  if (y < 8) y = r.bottom + 8;                 // gần mép trên thì lật xuống dưới
  m.style.left = Math.round(x) + 'px';
  m.style.top  = Math.round(y) + 'px';
}
function dongBangCx(){ $('#cxMenu').classList.remove('mo'); cxTin = null; }

$('#cxMenu').onclick = function(e){
  var b = e.target.closest('button');
  if (!b || cxTin === null) return;          // tin số 0 cũng hợp lệ nên so với null
  datCxToi(cxTin, b.getAttribute('data-cx'));
  dongBangCx();
};

khung.addEventListener('pointerdown', function(e){
  var nut = e.target.closest('.nut-cx');
  if (!nut) return;
  daGiu = false;
  clearTimeout(henGiu);
  henGiu = setTimeout(function(){ daGiu = true; moBangCx(nut); }, GIU_MS);
});
khung.addEventListener('pointerup', function(e){
  var nut = e.target.closest('.nut-cx');
  clearTimeout(henGiu);
  if (!nut || daGiu) return;
  var i = chiSoTin(nut);
  if (i === null) return;
  /* Chạm nhanh: tin đã có cảm xúc → mở danh sách "ai thả gì"; tin còn trống
     → chạm là thả tim luôn cho nhanh. */
  if (dsCx(i).length) moPopCx(nut, i); else datCxToi(i, 'tim');
});
khung.addEventListener('pointercancel', function(){ clearTimeout(henGiu); });
khung.addEventListener('pointerleave', function(){ clearTimeout(henGiu); });
/* Chuột phải trên máy tính cũng mở bảng chọn cho nhanh. */
khung.addEventListener('contextmenu', function(e){
  var nut = e.target.closest('.nut-cx');
  if (!nut) return;
  e.preventDefault();
  moBangCx(nut);
});
/* ⭐ 28/08 — cụm xoá 2 bước: bấm ⁝ mới hiện chữ "Xoá" (data-xoa-mo), bấm "Xoá"
   mới ra hộp confirm rồi xoá thật (data-xoa, giữ NGUYÊN xử lý cũ của Đợt D).
   Không dùng pointerup chung với cụm cảm xúc kẻo bắt nhầm giữ/chạm. */
function dongXoaCum(tru){
  document.querySelectorAll('.xoa-cum.mo').forEach(function(c){
    if (c !== tru) c.classList.remove('mo');
  });
}
khung.addEventListener('click', function(e){
  var mo = e.target.closest('[data-xoa-mo]');
  if (mo) {
    var cum = mo.closest('.xoa-cum');
    var dangMo = cum.classList.contains('mo');
    dongXoaCum(null);
    cum.classList.toggle('mo', !dangMo);
    return;
  }
  var nut = e.target.closest('[data-xoa]');
  if (!nut) return;
  var id = nut.getAttribute('data-xoa');
  if (!id || !window.confirm('Xoá tin nhắn này?')) return;
  nut.disabled = true;
  AWChat.xoa(LOP_DL, id)['catch'](function(err){
    nut.disabled = false;
    baoToast(AWChat.chuLoi(err));
  });
});

document.addEventListener('pointerdown', function(e){
  if ($('#cxMenu').classList.contains('mo') &&
      !e.target.closest('#cxMenu') && !e.target.closest('.nut-cx')) dongBangCx();
  if ($('#cxAi').classList.contains('mo') &&
      !e.target.closest('#cxAi') && !e.target.closest('.nut-cx')) dongPopCx();
  if (!e.target.closest('.xoa-cum')) dongXoaCum(null);
});
window.addEventListener('scroll', function(){ dongBangCx(); dongPopCx(); }, true);

/* Bấm vào chỗ trống bất kỳ trong khung chat → con trỏ nhảy vào ô nhập. */
document.querySelector('.chat').addEventListener('click', function(e){
  if (e.target.closest('.nut-cx') || e.target.closest('button') ||
      e.target.closest('textarea') || e.target.closest('.bong')) return;
  $('#oChat').focus();
});

/* Ô nhập tự nới cao theo đúng số dòng, KHÔNG chặn trần: thầy chốt phải luôn
   nhìn thấy trọn tin trước khi gửi. Tin dài nhất (300 ký tự) chỉ chiếm chừng
   nửa khung chat — phần danh sách tin tự co lại rồi bung ra sau khi gửi. */
function noOChat(){
  var o = $('#oChat');
  o.style.height = 'auto';
  /* box-sizing:border-box nên phải cộng thêm phần VIỀN — scrollHeight chỉ
     tính tới padding, thiếu 3px viền là dòng cuối vẫn bị khuất. */
  var vien = o.offsetHeight - o.clientHeight;
  o.style.height = (o.scrollHeight + vien) + 'px';
}

function guiTin(){
  var o = $('#oChat');
  var chu = o.value.trim();
  if (!chu) return;
  o.disabled = true;
  AWChat.gui(LOP_DL, { ten: TOI, ma: MA_HS, vaiTro: (EM && EM.vaiTro) || 'hs', chu: chu })
    .then(function(){
      o.value = '';
      noOChat();
      /* KHÔNG tự chèn tin vào khung: `onSnapshot` bắn về ngay sau đó, chèn tay
         là tin hiện HAI LẦN. */
    })['catch'](function(e){
      baoToast(AWChat.chuLoi(e));
    })
    .then(function(){ o.disabled = false; o.focus(); });
}
$('#nutGui').onclick = guiTin;
$('#oChat').oninput = noOChat;
/* ⭐ v1.37.0 — bấm bất cứ chỗ nào trong khung trò chuyện = "em đã đọc" ⇒ tắt
   chấm đỏ ở mọi avatar. Gõ vào ô nhập (bàn phím, không có cú bấm) cũng tính. */
(function(){
  var kc = document.querySelector('.chat');
  if (kc) kc.addEventListener('pointerdown', danhDauDocChat);
  $('#oChat').addEventListener('focus', danhDauDocChat);
})();
/* Enter = gửi · Shift+Enter = xuống dòng trong ô nhập. */
$('#oChat').onkeydown = function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); guiTin(); }
};
noOChat();

var henToast = null;
function baoToast(chu){
  var t = $('#toast');
  t.textContent = chu;
  t.classList.add('hien');
  clearTimeout(henToast);
  henToast = setTimeout(function(){ t.classList.remove('hien'); }, 2600);
}
</script>
</body>
</html>
