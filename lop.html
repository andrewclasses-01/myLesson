/* ============================================================
   NỀN — CHÚ THÍCH CỦA v19

   Sửa tiếp thì ghi ra TÊN FILE MỚI (v20…), đừng đè lên bản này.

   ĐỔI SO VỚI v18 (thầy chỉ 18/08, đợt tiếp) — 7 việc:

   1. Khung chat cao ĐÚNG BẰNG cột thẻ, tin nhắn dài thì cuộn trong khung
      (bọc vào .chat-cot; dạng máy tính cho chat nằm tuyệt đối trong đó).
   2. Đổi bố cục chat cạnh bên ↔ xuống dưới nay CHẠY MƯỢT (lối FLIP): thẻ
      3–4 co lại chui vào thẻ 2, khung chat trượt sang ô mới.
   3. Cửa sổ lùn dần thì khung chat co lại (tin nhắn chuyển thành cuộn) để ô
      nhập luôn hiện đủ; chỉ khi ngắn hơn cả 2 thẻ mới chịu để ô nhập trồi
      xuống dưới mép màn.
   4. Tim chưa thả to đúng bằng tim đã thả — cùng một quả tim, chỉ rút màu.
   5. Bỏ 😡, thay bằng gà con 🐥.
   6. Pop-up "ai thả gì" nhỏ gọn, dán ngay dưới bóng chat, KHÔNG làm mờ nền,
      bỏ chữ ANDREW CLASSES.
   7. Hiện ĐỦ mọi cảm xúc lớp đã thả (chật thì thu nhỏ / xuống 2 dòng); loại
      nào từ 2 lượt trở lên thì ghi thêm tổng số lượt.

   ---
   ĐỔI Ở v18 (giữ nguyên trong bản này) — 3 việc:

   A. Cột CHƯA XONG BÀI **luôn thẳng tâm ô hạn ở MỌI bề ngang**. Thủ phạm cũ
      là rule ép vùng điểm rộng cứng 392px trong khi đầu thẻ trải hết bề

      chỗ `@media (max-width:1140px)` cũ. Quét kiểm thẻ rộng 280→1000px:
      lệch 0px ở mọi bước.
   B. Cửa sổ hẹp (≤1040px, chat rơi xuống dưới) nay chỉ vẽ **2 thẻ** như dạng
      điện thoại và gói cả trang trong MỘT MÀN ⇒ khung chat rộng rãi, không
      phải cuộn tìm ô nhập.
   C. **Bàn phím ảo không còn đè lên ô nhập**: meta viewport thêm
      `interactive-widget=resizes-content` (Android), iOS đo bằng
      visualViewport đặt vào `--banphim`; khi bàn phím hiện thì gắn lớp
      `.go-chat` để cất cột thẻ, nhường trọn màn cho khung chat.
   D. (kèm theo) Chiều cao thanh đầu do **JS đo** đặt vào `--cao-dau`, bỏ hẳn
      số gõ tay trong calc() — chỗ này đã sai hai lần.

   ---
   ĐỔI Ở v17 (giữ nguyên trong bản này) — 5 việc:

   1. HẾT MẤT CHỮ ở thẻ có cột CHƯA XONG BÀI. Trước đây số tên là con số

:root{
  --ground:#F7FAF9; --surface:#FFFFFF; --ink:#16232A; --muted:#5F7370;
  --accent:#0E7C6E; --accent-ink:#FFFFFF; --accent-soft:#E3F1EE;
  --amber:#F2A93B; --amber-soft:#FCF3E2;
  --xanh-la:#1DA45C;
  --line:#E0EAE7;
  --m-do:#E0575B; --m-cam:#F0821E; --m-vang:#E0B411; --m-duong:#3E7BFA; --m-la:#18A957;
  --shadow:0 1px 3px rgba(22,35,42,.07), 0 8px 24px rgba(22,35,42,.06);
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
  --sans:'Montserrat',"Segoe UI",system-ui,sans-serif;
  --em:cubic-bezier(.22,.9,.3,1);
  --cao-the:200px;
  /* ⭐ v18 — hai số này do JS ĐO RỒI ĐẶT, không gõ tay nữa:
     --cao-dau  = chiều cao THẬT của thanh đầu (v16 gõ tay 62 trong khi thật
                  là 65 ⇒ cả trang dôi 3px, phải cuộn mới hết).
     --banphim  = phần màn bị BÀN PHÍM ẢO che (iPhone không đẩy trang, nó phủ
                  đè lên ô nhập). Trừ đi từng ấy thì ô nhập luôn nổi lên trên. */
  --cao-dau:77px;
  --banphim:0px;
  /* Sàn của khung chat ở cửa sổ hẹp = [tiêu đề + chân khung có ô nhập], do
     JS đo (doSanChat). Cửa sổ lùn dần thì phần tin nhắn cuộn lại cho tới
     hết; chạm sàn này rồi mà vẫn lùn nữa thì ô nhập mới trồi xuống dưới. */
  --san-chat:96px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground); color:var(--ink); font:500 15px/1.6 var(--sans)}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}

.wrap{max-width:1180px; margin:0 auto; padding:0 20px}

/* ---------- THANH ĐẦU ---------- */
.top{position:sticky; top:0; z-index:30; background:rgba(247,250,249,.86);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
/* ⛔ Các khối mang class .wrap mà tự đặt `padding` rút gọn sẽ XOÁ MẤT lề
   ngang 20px của .wrap — phải viết lại lề ngang ở đây, không thì cả trang
   dính sát mép màn hình (lỗi có từ bản đầu, phát hiện ở v10). */
.top-in{display:flex; align-items:center; gap:14px; padding:12px 20px}
.av{flex:none; display:grid; place-items:center; border-radius:50%;
  font-weight:800; color:#fff; user-select:none; position:relative; overflow:hidden}
.av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
/* ⭐ v1.37.0 — ẢNH ĐẠI DIỆN THẬT ở thanh đầu + đầu sidebar (CÙNG KHO ẢNH với
   khung chat — xem `A.gaAvatar` trong js/chung.js) và CHẤM ĐỎ báo tin nhắn
   mới. Ảnh tự bo tròn nên hai ô này để `overflow:visible`, cho chấm đỏ và
   huy hiệu sao tràn ra ngoài viền mà không bị cắt góc. */
.av .av-anh{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  border-radius:50%}
.av.me, .side-head .av{overflow:visible}
.av-cham{position:absolute; top:-1px; right:-1px; width:13px; height:13px;
  border-radius:50%; background:var(--m-do); border:2.5px solid #fff;
  box-shadow:0 1px 3px rgba(22,35,42,.28); z-index:5; pointer-events:none}
.side-head .av-cham{width:12px; height:12px}
.av.me{width:52px; height:52px; font-size:19px; cursor:pointer;
  background:linear-gradient(135deg,#0E7C6E,#16A08E); box-shadow:var(--shadow);
  position:relative; transition:transform .18s var(--em), box-shadow .18s;
  /* ⛔ 28/08 — .av dùng chung có overflow:hidden để cắt ảnh đại diện trong chat
     tròn đều; riêng nút NÀY không bao giờ mang ảnh (chỉ initials), và huy hiệu
     sao bên dưới CỐ Ý tràn ra ngoài viền tròn — mở lại overflow CHỈ ở đây. */
  overflow:visible}
.av.me:hover{transform:scale(1.06); box-shadow:0 0 0 4px var(--accent-soft), var(--shadow)}
/* ⭐ ĐỢT 4 → ĐỢT 11 (chép nguyên từ bai.html/bai-sp.html, 28/08 đồng bộ lại
   lop.html cho khớp — bản cũ ở đây lệch phải + bị .av cắt mất một góc):
   SỐ SAO nằm giữa đáy quả bóng avatar, khung nền trắng, kèm icon ngôi sao +
   3 tia lấp lánh xung quanh. */
.sao-hieu{position:absolute; left:50%; bottom:-2px; transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:1.5px;
  padding:0 3.5px; border-radius:99px; background:#fff;
  box-shadow:0 1px 3px rgba(22,35,42,.20);
  font-size:9.5px; font-weight:800; white-space:nowrap; line-height:1.45;
  color:#E5A20D; letter-spacing:.1px; font-variant-numeric:tabular-nums}
/* ⛔ `:not(.lap)` — ba sparkle cũng là <svg> con trực tiếp của cụm này, không
   loại chúng ra thì chúng ăn luôn cỡ của ngôi sao chính. */
.sao-hieu > svg:not(.lap){width:9.5px; height:9.5px; fill:#F3B21B; flex:none}
/* Sparkle quanh cụm số: 3 sao tí hon nhấp nháy lệch pha, chạy mãi (dùng lại
   @keyframes lap-lanh đã có sẵn cho khối .sao-ve bên dưới). */
.sao-hieu .lap{position:absolute; fill:#F7CE63; animation:lap-lanh 2.2s ease-in-out infinite}
.sao-hieu .lap.l1{width:7px; height:7px; left:-10px; top:-4px; animation-delay:0s}
.sao-hieu .lap.l2{width:6px; height:6px; right:-9px; top:6px; animation-delay:.7s}
.sao-hieu .lap.l3{width:5px; height:5px; left:6px; top:-9px; animation-delay:1.4s}
@media (prefers-reduced-motion: reduce){ .sao-hieu .lap{animation:none; opacity:.7} }
.who{min-width:0}
.who .ten{font-weight:800; font-size:18px; line-height:1.25; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who .ten .nick{color:var(--muted); font-weight:600}
.who .lop{font-size:12.5px; color:var(--muted); font-weight:600}
/* ⛔ Nút sao đã bỏ ở đợt 4. Phần thanh đầu bên phải cố ý để TRỐNG — dành cho
   quảng cáo / thông báo của thầy sau này. */

/* ---------- BỐ CỤC MÁY TÍNH ----------
   align-items:stretch để KHUNG CHAT cao đúng bằng cột thẻ (việc 2 dạng máy
   tính). Vì thế chat KHÔNG còn sticky/chiều cao theo màn hình nữa. */
.main{display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:22px;
  align-items:stretch; padding:22px 20px 40px}
/* ⭐ v1.11.0 — SÀN CHIỀU CAO CHO CẢ HÀNG LƯỚI.
   Khung chat cao ĐÚNG BẰNG cột thẻ (xem khối CHAT bên dưới) — hay ở chỗ tin
   nhắn nhiều mấy cũng không kéo dài trang, nhưng lớp CHƯA CÓ BÀI NÀO thì cột
   thẻ chỉ còn một dòng "No homework" ⇒ khung chat lùn tịt, chỉ thấy cái tiêu
   đề (thầy bắt được 23/08). Cho cả hàng một cái sàn là xong, thẻ nhiều thì
   hàng tự cao hơn sàn nên không ảnh hưởng gì. */
@media (min-width:1041px){
  .main{min-height:min(70vh, 620px)}
}
.cot-bai{display:flex; flex-direction:column; gap:16px}
.vach{height:0; border-top:1.5px dashed #B9CCC7; margin:-1px 0}

.chua-co{display:flex; align-items:center; justify-content:center; gap:9px;
  min-height:64px; text-align:center; font-size:14px; font-weight:600;
  color:#93A5A1; letter-spacing:.01em}
.chua-co svg{width:17px; height:17px; stroke:currentColor; stroke-width:2; fill:none;
  stroke-linecap:round; stroke-linejoin:round}
.chua-co.vui{color:#B08344; font-weight:700}

/* ---------- THẺ BÀI TẬP ---------- */
.the{display:block; width:100%;
  filter:drop-shadow(0 1px 2px rgba(22,35,42,.08)) drop-shadow(0 8px 20px rgba(22,35,42,.07));
  transition:transform .2s var(--em)}
.the:hover{transform:translateY(-2px)}
.the-in{--mui:64px; position:relative; display:flex; flex-direction:column;
  align-items:stretch;
  height:var(--cao-the); background:var(--surface); border-radius:12px 0 0 12px;
  clip-path:polygon(0 0, calc(100% - var(--mui)) 0, 100% 50%,
                    calc(100% - var(--mui)) 100%, 0 100%);
  padding-right:var(--mui); text-align:left; width:100%; transition:background .3s}
.play{position:absolute; right:0; top:0; bottom:0; width:var(--mui);
  display:grid; place-items:center; transition:background .2s}
.play svg{width:22px; height:22px; fill:#fff; margin-right:30px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.the.moi   .play{background:linear-gradient(135deg,#0E9E85,#22C3A4)}
.the.moi:hover .play{background:linear-gradient(135deg,#0B8672,#16AE92)}
.the.cu    .play{background:#C3D3CF}
.the.cu:hover .play{background:#B2C5C0}
/* ⭐ v1.35.0 — thẻ TẠM KHOÁ (thầy khoá ở dashboard): mũi xám + ổ khoá, không mở được,
   đồng hồ hiện chữ "TẠM KHOÁ" (xem nhipDongHo). Nền thẻ giữ màu xanh dương nhạt
   như bài còn lâu — cố ý KHÔNG dùng đỏ/vàng vì đồng hồ đã dừng. */
.the.khoa .play, .the.khoa:hover .play{background:#9FB0AC}
.the.khoa .play svg{width:20px; height:20px}
.the.khoa:hover{transform:none}
.the.khoa{cursor:default}

/* Nền thẻ.
   · THẺ CŨ (đã qua hạn): đỏ nếu còn thiếu, xanh lá nếu đủ.
   · THẺ MỚI (chưa tới hạn): màu theo THỜI GIAN CÒN LẠI — trên 24h xanh
     dương, 6–24h vàng, dưới 6h đỏ; xong hết thì xanh lá bất kể giờ. */
.the-in.tt-do{background:#FDF3F3}
.the-in.tt-la{background:#F2FBF5}
.the-in.tt-vang{background:#FEFAEE}
.the-in.tt-duong{background:#F3F7FE}

/* Hào quang toả ra ngoài thẻ. Thẻ MỚI toả rộng, thẻ CŨ chỉ còn một viền
   sáng rất mảnh — nhìn lướt là phân biệt được ngay bài nào đang cần làm. */
.the.xong-het{filter:drop-shadow(0 2px 4px rgba(24,169,87,.22))
                     drop-shadow(0 0 16px rgba(24,169,87,.42))}
.the.cu.xong-het{filter:drop-shadow(0 1px 2px rgba(24,169,87,.16))
                        drop-shadow(0 0 3px rgba(24,169,87,.26))}
.the.gio-duong{filter:drop-shadow(0 2px 4px rgba(62,123,250,.18))
                      drop-shadow(0 0 15px rgba(62,123,250,.34))}
.the.gio-vang{filter:drop-shadow(0 2px 4px rgba(224,180,17,.22))
                     drop-shadow(0 0 15px rgba(224,180,17,.42))}
.the.gap{animation:hao-quang-do 3.4s ease-in-out infinite}
@keyframes hao-quang-do{
  0%,100%{filter:drop-shadow(0 2px 4px rgba(224,87,91,.28))
                 drop-shadow(0 0 7px rgba(224,87,91,.35))}
  50%    {filter:drop-shadow(0 2px 4px rgba(224,87,91,.40))
                 drop-shadow(0 0 22px rgba(224,87,91,.80))}
}
@media (prefers-reduced-motion: reduce){
  .the.gap{animation:none;
    filter:drop-shadow(0 2px 4px rgba(224,87,91,.35)) drop-shadow(0 0 16px rgba(224,87,91,.6))}
}

/* ---------- RUỘT THẺ ----------
   MỘT BỐ CỤC DÙNG CHUNG cho máy tính lẫn điện thoại (thầy chốt 18/08 — bản
   điện thoại nhìn gọn hơn nên máy tính theo luôn): tên bài + ngày ở trái,
   Ô HẠN góc trên phải, mã lesson xuống dòng, rồi VÙNG ĐIỂM nằm bên dưới.
   Khác nhau giữa hai dạng chỉ còn là CỠ CHỮ và khoảng cách. */
/* ⭐ v17 — ĐỔI TỪ LƯỚI 2 HÀNG SANG MỘT HÀNG NGANG.
   Cụm chữ (tên bài + mã lesson) gói trong .t-chu là MỘT khối, ô hạn là khối
   kia ⇒ cụm chữ nằm ĐÚNG GIỮA TÂM ô hạn. Lối lưới cũ không làm được việc
   này: ô hạn cao hơn nên phần cao dư bị chia đều cho hai hàng, đẩy chữ lên
   trên. Mã lesson cũng to hơn một chút và sát tên bài hơn (thầy chốt 18/08). */
.the-body{flex:none; min-width:0; padding:11px 14px 6px 20px; display:flex;
  align-items:center; column-gap:12px; overflow:hidden}
.t-chu{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.t-ten{font-size:16.5px; font-weight:800; letter-spacing:-.01em; line-height:1.24;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.t-ten .ngay{margin-left:8px; color:var(--xanh-la)}
.t-ten .khoang{margin-left:8px}
.t-ma{font:600 13.4px/1.28 var(--mono); color:var(--muted); letter-spacing:.01em;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* Ô hạn nằm gọn trong cột phải 176px và căn giữa cột — đúng bằng bề ngang
   cụm CHƯA XONG BÀI bên dưới nên hai khối thẳng tâm nhau. */
.han-boc{flex:none; width:176px;
  display:flex; align-items:center; justify-content:center; gap:10px}
.t-han{display:flex; flex-direction:column; gap:4px; width:158px;
  padding:6px 12px 7px; border-radius:12px;
  background:var(--amber-soft); border:1px solid #F5E3C0}
.t-han .han-dong{display:flex; align-items:center; justify-content:center; gap:5px;
  font-size:12px; font-weight:700; color:#9A6A12; white-space:nowrap}
.t-han .han-dong svg{width:13px; height:13px; stroke:currentColor; stroke-width:2.4;
  fill:none; stroke-linecap:round; stroke-linejoin:round}
.t-han .han-vach{height:0; border-top:1px dashed #EBD3A6}
.dhho{font-size:19px; font-weight:800; text-align:center; line-height:1.15;
  letter-spacing:.6px; font-variant-numeric:tabular-nums; white-space:nowrap}
.dhho.xanh{color:var(--m-la)} .dhho.cam{color:#DE7A12} .dhho.do{color:#D93B40}
.dhho.xong{font-size:15.5px; letter-spacing:.9px; color:var(--m-la)}
.dhho.khoa{font-size:13.5px; letter-spacing:.7px; color:#7B8C89}   /* v1.35.0 */
.tich-to{font-size:30px; font-weight:800; color:var(--m-la); line-height:1;
  filter:drop-shadow(0 1px 4px rgba(24,169,87,.35))}
.t-han.gap-gio{background:#FDECEC; border-color:#F6CFCF}
.t-han.gap-gio .han-dong{color:#B03A3E}
.t-han.gap-gio .han-vach{border-color:#F3CACA}
.t-han.da-xong{background:#EFFAF3; border-color:#C9EBD6}
.t-han.da-xong .han-dong{color:#2C7A50}
.t-han.da-xong .han-vach{border-color:#CFEBDA}

/* ---------- VÙNG ĐIỂM (nằm DƯỚI phần đầu thẻ) ---------- */
.the-diem{flex:1; min-height:0; width:100%; overflow:hidden;
  border-top:1.5px dashed var(--line);
  padding:9px 14px 12px 20px; display:flex; flex-direction:column;
  justify-content:center; gap:5px}
/* Vùng điểm bấm được (mở bảng xếp hạng) — chỉ khi JS gắn role="button". */
.the-diem[role="button"]{cursor:pointer; transition:background .18s}
.the-diem[role="button"]:hover{background:rgba(14,124,110,.045)}
/* Còn dưới 6 tiếng: thanh dồn trái, cột tên còn thiếu mở ra bên phải. */
.the-diem.co-thieu{flex-direction:row; align-items:center; gap:12px}
.the-diem.co-thieu .khoi-thanh{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
/* Chỉ có bài viết tay: dòng CHÚ Ý nằm giữa TOÀN THẺ, bỏ vạch ngăn. */
.the-diem.chi-tay{position:absolute; left:0; right:var(--mui); top:0; bottom:0;
  width:auto; border-top:none; padding:0 20px; justify-content:center}

/* Cột CHƯA XONG BÀI: rộng đúng bằng cột ô hạn phía trên (176px) nên hai khối
   thẳng tâm nhau; chữ thụt vào hai bên cho khỏi dính vạch và mép thẻ. */
/* overflow:hidden là PHANH AN TOÀN — số dòng thật do JS `vuaCotThieu()` cắt
   cho vừa chiều cao còn lại, nên bình thường không bao giờ chạm tới phanh. */
.khoi-thieu{flex:none; width:176px; align-self:stretch; overflow:hidden;
  display:flex; flex-direction:column; justify-content:center;
  padding:0 9px; border-left:1px dashed #F0CFCF}
/* line-height 1.25 chứ không để 1.6 của body: chữ VIẾT HOA 9,5px mà giãn
   dòng 1,6 thì chỉ tổ ăn mất chỗ của một tên em (v17). */
.khoi-thieu .tieu{font-size:9.5px; font-weight:800; letter-spacing:.06em; color:#C0484C;
  line-height:1.25; margin-bottom:2px; text-align:center; white-space:nowrap}
.ds-thieu{width:100%; display:grid; grid-template-columns:1fr auto;
  column-gap:10px; row-gap:0; align-items:center}
.ds-thieu .ten{font-size:11px; font-weight:700; color:#7A4B4C; line-height:1.3;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* ⚠ Chiều cao mỗi dòng do Ô SỐ quyết định chứ không phải chữ tên (ô số cao
   hơn) — hạ ô số là cách rẻ nhất để thêm được một em vào cột. */
.ds-thieu .so{min-width:16px; height:13px; padding:0 4px; border-radius:5px;
  background:#FBE4E4; color:#C0484C; font-size:9.5px; font-weight:800;
  display:grid; place-items:center}
.khoi-thieu .them{margin-top:2px; text-align:center; font-size:10.5px; font-weight:700;
  line-height:1.25; color:#A98B8B; white-space:nowrap}

/* ⭐ v1.14.0 — CỘT TÊN RỘNG RA, THANH NGẮN LẠI (thầy chốt 24/08/2026).
   Nhãn dài nhất là "PRONUNCIATION": đo thật ở 11,5px/800/letter-spacing .02em
   = 108px, nên trần 112px là vừa khít mà không thừa. Trước đó cột chỉ 62px nên
   nhãn nào dài hơn "WORDS 1" cũng bị cắt "…".
   ⛔⛔ PHẢI LÀ `minmax(0,112px)` CHỨ ĐỪNG GÕ THẲNG `112px`. Ca chật nhất của
   trang này là thẻ GẤP trên điện thoại: vùng điểm nhường 106px cho cột CHƯA
   XONG BÀI nên cụm thanh chỉ còn ~161px — cột tên cứng 112px ăn gần hết, đo
   thật ở 375px thì THANH CÒN 11px, nhìn như mất hẳn (bản 62px cũ còn 51px).
   `minmax(0,…)` cho cột tên co lại ĐÚNG KHI hết chỗ (cắt "…", tên đủ nằm
   trong `title`), còn `minmax(56px,1fr)` giữ cho thanh không bao giờ tụt dưới
   56px. Chỗ nào rộng rãi thì cả hai vẫn đúng như trên. */
/* ⭐⭐ v1.15.0 — CỘT TÊN NGẮN LẠI, THANH DÀI RA (thầy chốt 25/08/2026).
   Nhãn dài nhất nay là "PRONUNC" (rút từ PRONUNCIATION, xem `A.tenO(ten,true)`)
   chứ không còn "PRONUNCIATION" 108px nữa ⇒ giữ trần 112px là để trống một
   mảng. `canhNhanO()` (JS, chạy sau mỗi lần vẽ thẻ) ĐO chữ thật rồi:
     · giãn nhẹ WORDS 1 · WORDS 2 cho RỘNG BẰNG PRONUNC (thầy chốt),
     · đặt `--cot-ten` = đúng bề ngang đó ⇒ chỗ dôi ra rơi hết vào thanh.
   ⛔ Vẫn `minmax(0,…)` chứ đừng gõ thẳng số: ca chật nhất là thẻ GẤP trên điện
   thoại (đo thật 375px), cột tên cứng là thanh còn 11px. 112px chỉ còn là TRẦN
   cho nhãn lạ (tên ngăn thầy tự gõ), bình thường không ai chạm tới.
   ⛔ Đo bằng JS nên phải chờ FONT nạp xong mới đo (`document.fonts.ready`) —
   đo lúc font dự phòng còn đang dùng là ra một con số khác hẳn.
   ⭐ v1.47.0 — `--cot-ten` nay đặt lên TỪNG `.the-diem` (không còn trên <html>),
   nên MỖI THẺ một bề ngang riêng vừa khít nhãn của chính nó; thẻ toàn nhãn lạ
   (chỉ "QUIZ") cũng được co chứ không rơi về 112px như trước. Xem `canhNhanO()`.
   ⛔ Ai dựng bàn thử `ban-thu-*.html` thì phải bọc đúng `.the-diem`, thiếu là
   biến không tới nơi và cột tên về lại số cứng dưới đây. */
.td-dong{display:grid;
  grid-template-columns:minmax(0,var(--cot-ten,112px)) minmax(56px,1fr) 44px 11px;
  align-items:center; gap:8px}
/* Thẻ ít bài vẫn giữ cụm cao bằng thẻ 3 bài — nhưng CHỈ giãn khoảng cách
   giữa các dòng. ⛔ Tuyệt đối không phóng to thanh hay chữ: mọi thanh tiến
   độ trong app phải cùng một cỡ, tăng giảm thì tăng giảm đồng loạt
   (thầy chốt 18/08). */
.the-diem.n1 .td-dong{min-height:67px}
.the-diem.n2 .td-dong{min-height:31px}
/* ⭐ v17 — THỨ TỰ ƯU TIÊN THẦY CHỐT: 2 bài đẹp nhất → 1 bài → 3 bài; 4 bài là
   mức TỐI ĐA của một lớp chính, rất hiếm gặp, nên được phép bó sát lại. Chỉ
   bóp KHOẢNG CÁCH (khe giữa dòng, khe của dòng CHÚ Ý), TUYỆT ĐỐI không bóp
   thanh tiến độ hay cỡ chữ — mọi thanh trong app vẫn phải cùng một cỡ.
   ⛔ .the-diem.co-thieu là flex NGANG nên `gap` ở đó là khe giữa cụm thanh và
   cột CHƯA XONG BÀI: phải tách riêng, không đặt gap chung kẻo dính cột. */
.the-diem.n3{padding-top:8px; padding-bottom:10px}
.the-diem.n4{padding-top:5px; padding-bottom:6px}
.the-diem.n4:not(.co-thieu){gap:3px}
.the-diem.co-thieu.n4 .khoi-thanh{gap:3px}
.the-diem.n4 .td-tay{margin-top:4px; padding-top:5px}
.td-ten{font-size:11.5px; font-weight:800; letter-spacing:.02em; color:#3D5450;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* ⛔ (02/09 đợt 4) BỎ `overflow:hidden` + thêm `position:relative` — y hệt `.doi-bar`:
   avatar bạn top 1 cao hơn thanh 7px nên overflow sẽ chém cụt. Bỏ được vì vệt màu `i` vốn
   TỰ bo tròn hai đầu, không cần khung cha cắt hộ. */
.td-bar{position:relative; height:7px; border-radius:99px; background:#E7EDEB}
.td-bar i{position:absolute; inset:0 auto 0 0; display:block; height:100%; border-radius:99px; transition:width .5s var(--em)}
.td-so{font-size:11.5px; font-weight:800; text-align:right; color:#54706B;
  white-space:nowrap; font-variant-numeric:tabular-nums}
.td-tich{font-size:11px; font-weight:800; color:var(--m-la); text-align:left}
i.m-do{background:var(--m-do)}      i.m-cam{background:var(--m-cam)}
i.m-vang{background:var(--m-vang)}  i.m-duong{background:var(--m-duong)}
i.m-la{background:var(--m-la)}
.td-so.m-la{color:var(--m-la)}
.td-so.m-do{color:var(--m-do)}
.td-tay{margin-top:7px; padding-top:9px; border-top:1px dotted #D3E0DC;
  font-size:10.5px; font-weight:800; letter-spacing:.02em; color:#8A6D2F;
  line-height:1.4; text-align:center}
/* Thẻ chỉ có bài viết tay (không có bài AWord nào): dòng CHÚ Ý là thứ duy
   nhất trong vùng điểm nên cho nó nằm CHÍNH GIỮA, bỏ vạch kẻ phía trên. */
.the-diem.chi-tay{justify-content:center}
.the-diem.chi-tay .td-tay{margin-top:0; padding-top:0; border-top:none}
.td-tay svg{width:12px; height:12px; margin-right:4px; vertical-align:-2px;
  stroke:#C8922B; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round}

/* ================================================================
   ⭐⭐ v1.48.0 — THẺ "KHÔNG GIAO BÀI" (thầy chốt 02/09/2026)
   Đầu thẻ: avatar thầy + NO HOMEWORK, ENJOY YOUR DAY! căn giữa TOÀN thẻ, dưới
   là đồng hồ đếm tới GIỜ VÀO HỌC buổi kế tiếp (TIẾNG:PHÚT).
   Ruột thẻ: MỘT canvas — bóng bay avatar cả lớp, bấm ▶ đổi sang trò khủng long.
   ⛔ Khối này CHÉP Y HỆT sang `dashboard.html` — sửa một bên phải sửa bên kia.
   ⛔ Thẻ nghỉ là `<div>` (không phải `<button>` như thẻ bài của trang này) vì
   chứa nút ▶ THẬT bên trong — HTML cấm nút lồng trong nút. Nhờ tách riêng thế
   này mà thẻ bài thường KHÔNG phải đổi cấu trúc gì cả.
   ================================================================ */
.the.nghi{cursor:default}
.the.nghi:hover{transform:none}
.the.nghi .the-in{background:#F2FBF5}
/* Ghi đè `.the-body` (vốn là hàng ngang tên-bài ‖ ô hạn) thành cụm dọc căn giữa. */
/* ⭐ v1.49.0 (thầy chốt) — BA DÒNG SÁT NHAU, đồng hồ nằm ĐÚNG TÂM thẻ.
   Bản cũ để nhãn và đồng hồ chung MỘT hàng ngang nên cả cụm mới là thứ được căn
   giữa, còn riêng đồng hồ thì luôn lệch sang phải. Tách ra thì đồng hồ tự đúng tâm.
   Lề trái/phải bằng nhau (18px) để cụm chữ cân giữa phần chữ của thẻ. */
/* ⭐ v1.51.0 (thầy chốt) — AVATAR bên trái, TO hơn (26 → 38px) và nằm GIỮA cụm
   hai dòng theo chiều dọc (`align-items:center`); hai dòng chữ CĂN TRÁI, thẳng
   hàng chữ đầu. Cả cụm vẫn nằm giữa thẻ theo chiều ngang. */
.nghi-dau{flex-direction:row; align-items:center; justify-content:center; gap:11px;
  padding:12px 18px 10px; text-align:left}
.nghi-chuoi{display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  min-width:0}
.nghi-ava{width:38px; height:38px; border-radius:50%; object-fit:cover; flex:none;
  box-shadow:0 0 0 2px #fff, 0 1px 4px rgba(22,35,42,.28)}
.nghi-chu{font-size:15.5px; font-weight:800; letter-spacing:.01em; color:#1f7a4d;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* ⭐ v1.50.0 (thầy chốt) — nhãn và đồng hồ CÙNG MỘT HÀNG, BẰNG CỠ NHAU (11.5px).
   Bản v1.48 để chung hàng nhưng đồng hồ to gấp đôi nên cụm lệch; bản v1.49 tách
   hai dòng cho đồng hồ đúng tâm. Nay bằng cỡ thì chung hàng vẫn cân. Đồng hồ
   vẫn nổi nhờ MÀU CAM. Chạy từng giây — xem nhipNghi() trong chung.js. */
.nghi-han{display:flex; align-items:baseline; justify-content:flex-start; gap:8px;
  font-size:11.5px; font-weight:800; letter-spacing:.06em; color:#93A5A1}
.nghi-nhan{font-style:normal}
.dhho-nghi{font-size:11.5px; font-weight:800; color:#E07A12; letter-spacing:.4px;
  font-variant-numeric:tabular-nums}
.nghi-han.het .nghi-nhan{display:none}
.nghi-han.het .dhho-nghi{color:#D93B40}
/* Sân chơi: canvas phủ kín, KHÔNG padding — mọi thứ vẽ bên trong nên không có
   gì thò ra để `clip-path`/`overflow` chém. */
/* ⭐ v1.50.0 — sân là HÀNG NGANG: dải icon (chỉ dashboard) · vạch ngăn · khung
   canvas — đúng khuôn `.the-diem` của thẻ bài thường. Trang học sinh không
   truyền dải icon nên canvas chiếm trọn. */
.nghi-san{padding:0; display:flex; align-items:stretch;
  border-top:1.5px dashed var(--line)}
.nghi-khung{position:relative; flex:1; min-width:0}
.nghi-canvas{position:absolute; inset:0; width:100%; height:100%; display:block;
  touch-action:manipulation}
.the.nghi .play{border:0; padding:0; cursor:pointer}
.the.nghi .play, .the.nghi:hover .play{background:linear-gradient(135deg,#0E9E85,#22C3A4)}
.the.nghi.dang-choi .play, .the.nghi.dang-choi:hover .play{
  background:linear-gradient(135deg,#B3541E,#E08A3C)}
@media (max-width:620px){
  .nghi-dau{padding:9px 10px 7px; gap:0}
  .nghi-ava{width:21px; height:21px}
  .nghi-chu{font-size:11.5px}
  .nghi-han{font-size:8.5px; gap:5px}
  .dhho-nghi{font-size:8.5px; letter-spacing:.3px}
}

/* ---------- SP CHECK — THANH TIẾN TRÌNH THEO TEAM (⭐ thiết kế lại 27/08) ----------
   Thay dòng "SPEAKING CHECK x/SI_SO" chung (dùng .td-dong) bằng MỘT DÒNG MỖI
   TEAM: tên team kề trái, thanh dài theo TỔNG SỐ LỖI đội đó bắt được so với
   đội nhiều nhất, tổng lỗi kề phải. Màu xem `tinhDoiSp()` (JS). Vẽ bởi
   `veDoiSpKhoi()`, nằm trong CHÍNH `.the-diem` dùng chung (co-thieu, cột CHƯA
   XONG BÀI... vẫn hoạt động y hệt) — chỉ ruột `.khoi-thanh`/thanh đổi khuôn.
   ⛔ Số team có thể tới 5 mà thẻ chỉ cao 200px (166px điện thoại) nên CHIỀU CAO
   MỖI DÒNG phải theo tầng `.doiN` giống hệt lối `.the-diem.n1 .td-dong` cũ —
   ĐỪNG phóng to cố định, kẻo 4-5 team tràn thẻ. */
.doi-dong{display:grid; grid-template-columns:46px minmax(28px,1fr) 32px;
  align-items:center; column-gap:7px}
.doi-ten{font-size:9.5px; font-weight:800; letter-spacing:.02em; color:#3D5450;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* ⛔ (02/09/2026) BỎ `overflow:hidden` khỏi `.doi-bar`: avatar 14px cao gấp đôi thanh 7px,
   để overflow là bị chém cụt còn một vệt. Bỏ được vì vệt màu `i` vốn TỰ bo tròn hai đầu.
   ⚠️ `.the-diem` bọc ngoài VẪN có `overflow:hidden` — nên 14px là VỪA KHÍT hàng 19px (thẻ
   4 đội) và 15px (thẻ 5 đội); to hơn nữa sẽ bị chém ở đó. */
.doi-bar{position:relative; height:7px; border-radius:99px; background:#E7EDEB}
.doi-bar i{position:absolute; inset:0 auto 0 0; display:block; height:100%; border-radius:99px; transition:width .5s var(--em)}
/* ⭐ AVATAR TỪNG EM TRÊN THANH ĐỘI (thầy chốt 02/09).
   Đường kính KHÔNG đặt số cứng: `--av` do `coAvatarThanh()` đo chiều cao THẬT của hàng rồi
   đặt vào — xem chú thích của hàm đó. `14px` chỉ là số đỡ khi JS chưa kịp chạy. */
.av-thanh{position:absolute; top:50%; width:var(--av,14px); height:var(--av,14px);
  border-radius:999px; transform:translate(-50%,-50%); overflow:hidden; background:#CFDCD9;
  display:grid; place-items:center; font:800 calc(var(--av,14px)*.4)/1 var(--font); color:#fff;
  box-shadow:0 0 0 1.5px #fff, 0 1px 2px rgba(22,35,42,.35)}
/* ⛔ Ảnh PHẢI `position:absolute; inset:0` — đúng nếp `.av img` của khung chat ngay trên.
   Để `width/height:100%` trần thì <img> thành MỘT Ô GRID RIÊNG nằm trên chữ tắt, chỉ cao
   bằng nửa khung ⇒ `object-fit:cover` cắt mất mặt em, nhìn như ảnh bị phóng to (thầy chụp
   ảnh báo 02/09). Ảnh gốc VUÔNG 96×96 nên phủ đúng cả khung là không cắt tí nào. */
.av-thanh img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%}
/* ⭐ v1.61.0 — CỤM TOP 3 trên thanh bài thường: ba avatar chồng mí nhau, hạng cao NẰM TRÊN.
   ⛔ Không có mấy dòng này thì thứ tự trong DOM tự quyết: hạng 3 vẽ sau nên đè lên mặt hạng
   1 — ngược hẳn ý nghĩa. Chỉ đụng `.av-moc`, KHÔNG đụng avatar SP CHECK. */
.av-moc[data-hang="1"]{z-index:3}
.av-moc[data-hang="2"]{z-index:2}
.av-moc[data-hang="3"]{z-index:1}
.doi-so{font-size:10.5px; font-weight:800; text-align:right; color:#54706B;
  font-variant-numeric:tabular-nums}
.doi-so.m-la{color:var(--m-la)} .doi-so.m-duong{color:var(--m-duong)}
.doi-so.m-cam{color:var(--m-cam)} .doi-so.m-do{color:var(--m-do)}
.doi-bar i.m-la{background:var(--m-la)} .doi-bar i.m-duong{background:var(--m-duong)}
.doi-bar i.m-cam{background:var(--m-cam)} .doi-bar i.m-do{background:var(--m-do)}
/* ⭐ v1.58.0 — thẻ 4-5 đội: bớt đệm trên/dưới + khe hàng để hàng cao lên (19→25px, 15→19px),
   nhờ đó avatar thẻ 4 đội bằng cỡ thẻ 3 đội (trần chung 26px trong `coAvatarThanh`).
   Ở trang này hàng nằm THẲNG trong `.the-diem` (không có `.diem-rows` như dashboard). */
.the-diem.doi2 .doi-dong{min-height:38px}
.the-diem.doi3 .doi-dong{min-height:26px}
.the-diem.doi4 .doi-dong{min-height:25px}
.the-diem.doi4{padding-top:5px; padding-bottom:6px; gap:2px}
.the-diem.doi5 .doi-dong{min-height:19px}
.the-diem.doi5{padding-top:4px; padding-bottom:4px; gap:2px}
.the-diem.doi5 .doi-ten,.the-diem.doi5 .doi-so{font-size:8.8px}
.the-diem.doi5 .doi-bar{height:6px}

/* ---------- CHAT ---------- */
/* ⭐ v19 — KHUNG CHAT CAO ĐÚNG BẰNG CỘT THẺ.
   Trước đây chat là ô lưới bình thường nên tin nhắn nhiều là nó ĐẨY CAO cả
   hàng lưới, dài hơn hẳn cột thẻ (thầy bắt được 18/08). Nay ở dạng máy tính
   nó nằm tuyệt đối trong .chat-cot: .chat-cot không có nội dung trong dòng
   nên KHÔNG góp chiều cao, hàng lưới cao đúng bằng cột thẻ, còn chat trải
   khít ô đó và cuộn bên trong.
   ⛔ Chỉ làm vậy ở dạng máy tính. Ở cửa sổ hẹp phải để chat nằm trong dòng
   thật, nếu không nó bị ép đúng bằng hàng lưới và khi cửa sổ lùn quá thì ô
   nhập bị CẮT MẤT thay vì trồi xuống dưới (xem min-height:min-content). */
.chat-cot{min-width:0; min-height:0}
@media (min-width:1041px){
  .chat-cot{position:relative}
  .chat{position:absolute; inset:0}
}
.chat{background:var(--surface); border:1px solid var(--line);
  border-radius:18px; box-shadow:var(--shadow); display:flex; flex-direction:column;
  overflow:hidden; min-height:0}
/* ⛔ BẪY: từng thử `.chat{min-height:min-content}` cho khỏi gõ tay con số —
   KHÔNG dùng được. Chrome tính min-content của khung chat theo TOÀN BỘ tin
   nhắn (926px) chứ không phải [tiêu đề + ô nhập], nên khung chat lại phình
   to hơn cột thẻ y như lỗi cũ. Sàn của khung chat nay đặt bằng biến
   --san-chat do JS ĐO (tiêu đề + chân khung), xem `doSanChat()`. */
.chat-head{flex:none; padding:13px 18px 12px; border-bottom:1px solid var(--line); text-align:center}
.chat-head h2{margin:0; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px}
.chat-head h2 svg{flex:none; width:17px; height:17px; stroke:var(--accent); stroke-width:2.2;
  fill:none; stroke-linecap:round; stroke-linejoin:round}
.chat-body{flex:1; min-height:0; overflow-y:auto; padding:14px 14px 6px; display:flex;
  flex-direction:column; gap:11px; scroll-behavior:smooth}
.msg{display:flex; gap:9px; max-width:88%}
.msg .av{width:32px; height:32px; font-size:12px; margin-top:14px}
.msg-c{min-width:0}
.msg-top{display:flex; align-items:baseline; gap:7px; padding-left:4px}
.msg-top .n{font-size:11.5px; font-weight:800}
.msg-top .t{font-size:10.5px; color:var(--muted); font-weight:600}
.bong{position:relative; background:var(--ground); border:1px solid var(--line);
  border-radius:4px 14px 14px 14px;
  padding:7px 12px; font-size:13.5px; line-height:1.5; overflow-wrap:break-word}
/* Bóng chat và nút cảm xúc đi cùng một hàng — nút ở BÊN PHẢI bóng với tin
   của bạn khác, BÊN TRÁI bóng với tin của chính em. */
.hang-bong{display:flex; align-items:center; gap:5px}
.msg.toi .hang-bong{flex-direction:row-reverse}
/* ⭐ 28/08 — cụm xoá tin ĐỔI CHỖ: nằm NGAY TRONG bong bóng, sát cạnh XA
   avatar nhất, canh giữa theo chiều cao. Avatar đổi bên giữa tin của mình
   (phải) và tin người khác (trái) nên cạnh "xa avatar" cũng đổi theo — xem
   `.msg.toi .xoa-cum` bên dưới. Bấm ⁝ thì ẩn ⁝ hiện chữ "Xoá" ngay tại chỗ,
   bấm "Xoá" mới ra hộp `confirm` rồi xoá thật (không đổi phần đó). */
.xoa-cum{position:absolute; top:50%; right:6px; transform:translateY(-50%); z-index:1}
.msg.toi .xoa-cum{right:auto; left:6px}
.nut-xoa-tin{width:18px; height:18px; border:0; border-radius:50%;
  background:rgba(255,255,255,.55); color:#8B9D98; opacity:.6; font-size:12px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:opacity .15s, background .15s, color .15s}
.msg.toi .nut-xoa-tin{background:rgba(0,0,0,.14); color:rgba(255,255,255,.85)}
.nut-xoa-tin:hover{opacity:1; background:#FDECEC; color:#D93B40}
.xoa-cum.mo .nut-xoa-tin{display:none}
.nut-xoa-that{display:none; border:0; border-radius:99px; padding:3px 8px;
  background:#D93B40; color:#fff; font-size:10.5px; font-weight:800; white-space:nowrap;
  cursor:pointer; box-shadow:0 1px 4px rgba(22,35,42,.2)}
.xoa-cum.mo .nut-xoa-that{display:block}
.nut-xoa-that:disabled{opacity:.5; pointer-events:none}
/* Tin của CHÍNH EM: bóng sát avatar, GIỜ GỬI xuống dòng dưới bóng, dạt phải. */
.msg.toi{align-self:flex-end; flex-direction:row-reverse; align-items:flex-start; gap:7px}
.msg.toi .av{margin-top:0}
.msg.toi .msg-c{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.msg.toi .msg-top{display:none}
.gio-duoi{font-size:10px; font-weight:600; color:var(--muted); padding-right:3px}
.msg.toi .bong{background:var(--accent); border-color:var(--accent); color:#fff;
  border-radius:14px 4px 14px 14px}

/* ---------- CỤM CẢM XÚC (v17 làm lại) ----------
   · LUÔN HIỆN, bỏ hẳn lối "rê chuột mới ló ra" của v16 — màn lớp là màn cảm
     ứng, không có rê chuột nên các em không biết chỗ đó bấm được.
   · Ô nút GIỮ NGUYÊN CỠ ở cả hai trạng thái: cùng cao 22px, cùng cỡ chữ
     14px, viền lúc nào cũng có sẵn (chỉ đổi màu) ⇒ thả tim chỉ thấy "sáng
     lên", không thấy nhảy cỡ (thầy chốt 18/08).
   · Lớp thả cảm xúc nào khác tim thì icon đó hiện THÊM bên cạnh tim.
   · Đã có cảm xúc mà chạm vào cụm = mở pop-up "ai thả gì"; muốn thả/gỡ của
     riêng mình thì GIỮ 0,42s (hoặc chuột phải) để ra bảng chọn. */
.nut-cx{flex:none; min-height:22px; padding:1px 5px; border-radius:11px;
  border:1px solid transparent; display:flex; align-items:center;
  flex-wrap:wrap; justify-content:center; gap:3px; row-gap:1px; max-width:104px;
  font-size:14px; line-height:1; color:#B4C3BF;
  transition:transform .16s var(--em), background .18s, border-color .18s}
.nut-cx:hover{transform:scale(1.12)}
.nut-cx .ky{font-size:14px; line-height:1}
/* ⭐ v19 — TIM CHƯA THẢ: vẫn là ĐÚNG QUẢ TIM ĐÓ, cùng hình cùng cỡ, chỉ rút
   hết màu đi. Trước dùng ký tự ♡ nên trông bé hơn hẳn quả tim màu. */
.nut-cx .ky.mo{filter:grayscale(1); opacity:.42}
/* Lớp thả nhiều loại quá thì thu nhỏ một nấc; quá 104px là tự xuống dòng 2
   (thầy chốt: phải hiện ĐỦ mọi cảm xúc, chứ không được giấu bớt). */
/* Rộng thêm một nấc khi đã thu nhỏ icon: 5 icon + ô tổng số vừa đúng MỘT
   dòng (109px). Để nguyên 104px thì mỗi con số bị rớt xuống dòng hai, trông
   như lỗi. Đông hơn nữa mới thật sự xuống hai dòng. */
.nut-cx.nhieu{gap:2px; padding:1px 4px; max-width:126px}
.nut-cx.nhieu .ky{font-size:12px}
/* Có loại nào từ 2 lượt trở lên thì ghi thêm TỔNG số lượt của cả tin. */
.nut-cx .dem{font-size:10.5px; font-weight:800; color:#7C8F8B; padding:0 1px}
.nut-cx.nhieu .dem{font-size:9.5px}
.nut-cx.co{background:var(--surface); border-color:var(--line);
  box-shadow:0 1px 4px rgba(22,35,42,.10); color:inherit}
/* Trong cụm CÓ TIM CỦA CHÍNH EM → nền hồng nhạt cho sáng hẳn lên. */
.nut-cx.tim-toi{background:#FFF4F4; border-color:#F4CBCE}

/* ⭐ v19 — POP-UP "AI THẢ GÌ": dán NGAY DƯỚI cụm cảm xúc của đúng tin đó,
   KHÔNG làm mờ nền phía sau, không tiêu đề, không slogan — chỉ icon + tên.
   (v18 dùng chung khung bảng xếp hạng: to, có nền mờ, có chữ ANDREW CLASSES;
   thầy chốt bỏ hết cho gọn.) */
.cx-ai{position:fixed; z-index:59; min-width:100px; max-width:200px;
  max-height:min(58vh,300px); overflow-y:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 8px 22px rgba(22,35,42,.16); padding:4px;
  opacity:0; transform:translateY(-5px) scale(.96); pointer-events:none;
  transition:opacity .15s var(--em), transform .15s var(--em)}
.cx-ai.mo{opacity:1; transform:none; pointer-events:auto}
.cx-ai .d{display:flex; align-items:center; gap:6px; padding:2px 6px;
  border-radius:7px; font-size:11px; font-weight:700; color:var(--ink);
  line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cx-ai .k{flex:none; font-size:12px; line-height:1}
.cx-ai .d.toi{background:var(--accent-soft); color:var(--accent)}

.cx-menu{position:fixed; z-index:58; display:flex; align-items:center; gap:1px;
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:4px 6px; box-shadow:0 10px 28px rgba(22,35,42,.2);
  opacity:0; transform:translateY(7px) scale(.93); pointer-events:none;
  transition:opacity .18s var(--em), transform .18s var(--em)}
.cx-menu.mo{opacity:1; transform:none; pointer-events:auto}
.cx-menu button{width:31px; height:31px; border-radius:50%; font-size:19px;
  line-height:1; display:grid; place-items:center; transition:transform .14s var(--em)}
.cx-menu button:hover{transform:scale(1.22)}
.cx-menu button.bo{font-size:14px; color:var(--muted); font-weight:800}

.chat-foot{flex:none; display:flex; align-items:center; gap:8px; padding:11px 12px;
  border-top:1px solid var(--line)}
/* font-size 16px là NGƯỠNG CỨNG của iOS Safari: nhỏ hơn thì bấm vào ô nhập
   là cả trang bị phóng to. Đừng hạ xuống cho "cân" — sẽ vỡ trải nghiệm. */
.chat-foot textarea{flex:1; min-width:0; font:600 16px/1.45 var(--sans); color:var(--ink);
  background:var(--ground); border:1.5px solid var(--line); border-radius:12px;
  padding:9px 14px; outline:none; transition:border-color .15s;
  resize:none; overflow-y:hidden}
.chat-foot textarea:focus{border-color:var(--accent)}
/* Nút gửi kiểu Messenger: chỉ mỗi icon máy bay giấy đặc, KHÔNG nền nút,
   luôn nằm giữa theo chiều cao ô nhập (align-items:center ở .chat-foot). */
.chat-foot button{flex:none; width:34px; height:34px; background:none;
  display:grid; place-items:center; transition:transform .15s var(--em), opacity .15s}
.chat-foot button:hover{transform:scale(1.12)}
.chat-foot button:active{transform:scale(.94)}
.chat-foot button svg{width:24px; height:24px; fill:var(--accent)}

/* ---------- SIDEBAR ---------- */
.phu-mo{position:fixed; inset:0; z-index:40; background:rgba(22,35,42,.34);
  opacity:0; pointer-events:none; transition:opacity .25s}
body.mo-menu .phu-mo{opacity:1; pointer-events:auto}
.side{position:fixed; top:0; bottom:0; z-index:41; width:min(320px,88vw);
  background:var(--surface); transition:transform .3s var(--em);
  display:flex; flex-direction:column}
.side.trai{left:0; transform:translateX(-105%); box-shadow:12px 0 40px rgba(22,35,42,.14)}
.side.phai{right:0; transform:translateX(105%); box-shadow:-12px 0 40px rgba(22,35,42,.14)}
body.mo-menu .side.trai{transform:none}
.side-head{display:flex; align-items:center; gap:12px; padding:18px;
  border-bottom:1px solid var(--line)}
.side-head .av{width:44px; height:44px; font-size:16px;
  background:linear-gradient(135deg,#0E7C6E,#16A08E)}
.side-head .ten{font-weight:800; font-size:15px; line-height:1.3}
.side-head .phu2{font-size:12px; font-weight:700; color:var(--muted)}
.side-head .dong{margin-left:auto; width:36px; height:36px; border-radius:10px;
  display:grid; place-items:center; background:var(--ground)}
.side-head .dong svg{width:18px; height:18px; stroke:var(--muted); stroke-width:2.4;
  fill:none; stroke-linecap:round}
.side-ds{flex:1; overflow-y:auto; padding:10px}
.side-ds button{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:12px 12px; border-radius:14px; transition:background .15s}
.side-ds button:hover{background:var(--accent-soft)}
.side-ds .ic{flex:none; width:38px; height:38px; border-radius:12px; display:grid;
  place-items:center; background:var(--ground)}
.side-ds .ic svg{width:19px; height:19px; stroke:var(--accent); stroke-width:2;
  fill:none; stroke-linecap:round; stroke-linejoin:round}
.side-ds .nh{font-weight:700; font-size:14px; line-height:1.3}
.side-ds .mo-ta{font-size:11.5px; color:var(--muted); font-weight:600}
.side-foot{padding:12px 18px 16px; border-top:1px solid var(--line);
  font-size:11px; color:var(--muted); font-weight:600}
.vi-to{margin:14px 12px 6px; padding:18px 16px; border-radius:16px; text-align:center;
  background:linear-gradient(160deg,#FEF6E6,#FCEFD8); border:1px solid #F5E3C0}
.vi-to .so{font-size:38px; font-weight:800; color:#9A6A12; line-height:1.1}
.vi-to .nh{font-size:12px; font-weight:700; color:#B08344; letter-spacing:.04em}
/* Ô SAO trong menu (đợt 4): MỘT ngôi sao to, năm sao con lấp lánh quanh nó
   — thay cho ba ngôi sao ⭐⭐⭐ của bản cũ. */
.sao-ve{position:relative; width:104px; height:74px; margin:0 auto 2px}
.sao-lon{position:absolute; left:50%; top:50%; width:52px; height:52px;
  margin:-26px 0 0 -26px; fill:#F3B21B;
  filter:drop-shadow(0 2px 6px rgba(226,160,20,.45));
  animation:sao-tho 3.6s ease-in-out infinite}
.sao-con{position:absolute; width:12px; height:12px; fill:#F7CE63;
  animation:lap-lanh 2.6s ease-in-out infinite}
.sao-con.c1{left:6px;  top:12px; width:14px; height:14px; animation-delay:0s}
.sao-con.c2{right:8px; top:6px;                            animation-delay:.45s}
.sao-con.c3{right:2px; bottom:14px; width:10px; height:10px; animation-delay:.9s}
.sao-con.c4{left:14px; bottom:6px;  width:10px; height:10px; animation-delay:1.35s}
.sao-con.c5{left:50%; top:-2px; margin-left:-5px; width:9px; height:9px; animation-delay:1.8s}
@keyframes sao-tho{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
@keyframes lap-lanh{
  0%,100%{opacity:.25; transform:scale(.7) rotate(0deg)}
  50%    {opacity:1;   transform:scale(1.15) rotate(35deg)}
}
@media (prefers-reduced-motion: reduce){
  .sao-lon,.sao-con{animation:none} .sao-con{opacity:.85}
}

/* ---------- POP-UP BẢNG CẢ LỚP (bấm vào khu CHƯA XONG BÀI) ----------
   Nền mờ + khung trượt lên; đóng bằng bấm ra ngoài, nút ×, hoặc Esc. */
.pop-nen{position:fixed; inset:0; z-index:55; display:grid; place-items:center;
  padding:20px; background:rgba(22,35,42,.42); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .26s var(--em)}
.pop-nen.mo{opacity:1; pointer-events:auto}
/* Cỡ dòng tính để LỚP ĐÔNG NHẤT (20 em) hiện hết trong một màn, không phải
   cuộn: mỗi dòng ~26px × 20 = 520px, cộng đầu 54 + chân 30 = ~604px, vẫn
   lọt trong 88vh của iPhone 11 Pro (812px). overflow-y giữ làm phanh an toàn. */
.pop{width:min(376px,100%); max-height:92vh; background:var(--surface);
  border-radius:20px; box-shadow:0 24px 60px rgba(22,35,42,.28);
  display:flex; flex-direction:column; overflow:hidden;
  transform:translateY(18px) scale(.96); opacity:0;
  transition:transform .3s var(--em), opacity .26s var(--em)}
.pop-nen.mo .pop{transform:none; opacity:1}
.pop-head{flex:none; display:flex; align-items:center; gap:10px;
  padding:13px 15px 11px; border-bottom:1px solid var(--line)}
.pop-head h3{margin:0; font-size:14px; font-weight:800; letter-spacing:.03em}
.pop-head .phu{font-size:10.5px; font-weight:600; color:var(--muted); margin-top:1px}
.pop-head .dong{margin-left:auto; width:32px; height:32px; border-radius:10px;
  display:grid; place-items:center; background:var(--ground)}
.pop-head .dong svg{width:16px; height:16px; stroke:var(--muted); stroke-width:2.4;
  fill:none; stroke-linecap:round}
.pop-ds{flex:1; min-height:0; overflow-y:auto; padding:6px 9px 8px}
/* 4 cột: số thứ tự · tên · trạng thái chữ · ô cuối (tích HOẶC số bài thiếu) —
   cột cuối rộng cố định nên tích và ô số luôn THẲNG MỘT CỘT.
   ⭐ v1.47.0 — đã bỏ icon cúp (`veCup` + `.cup1/2/3` + `.pop-hang svg`): pop-up
   này không còn xếp hạng, cột đầu chỉ là số thứ tự dòng. */
.pop-dong{display:grid; grid-template-columns:24px minmax(0,1fr) auto 28px;
  align-items:center; gap:7px; padding:3.5px 7px; border-radius:9px}
.pop-dong + .pop-dong{margin-top:1.5px}
.pop-dong.du{background:#F4FBF7}
.pop-dong.thieu{background:#FDF5F5}
.pop-hang{font-size:10.5px; font-weight:800; color:#8FA3A0; text-align:center}
.pop-ten{font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}
.pop-dong.du .pop-ten{color:var(--m-la)}
.pop-dong.thieu .pop-ten{color:var(--m-do)}
.pop-phu{font-size:9.5px; font-weight:700; color:#93A5A1; white-space:nowrap}
.pop-cuoi{justify-self:center; font-size:13px; font-weight:800; color:var(--m-la)}
.pop-cuoi.so{justify-self:center; min-width:20px; height:17px; padding:0 5px;
  border-radius:6px; background:#FBE4E4; color:#C0484C; font-size:10px;
  display:grid; place-items:center}
/* Chân bảng: slogan mảnh, chữ thưa — không phải dòng chú thích cách xếp hạng. */
.pop-foot{flex:none; padding:8px 16px 11px; border-top:1px solid var(--line);
  font-size:9px; font-weight:500; letter-spacing:.22em; color:#A9B6B3;
  text-align:center}

/* ---------- SP CHECK — POP-UP CHI TIẾT TỪNG BẠN THEO TEAM (⭐ 27/08) ----------
   Dùng lại ĐÚNG khung #popNen/.pop-ds có sẵn (bảng cả lớp) — chỉ ruột #popDs
   đổi khuôn: mỗi TEAM một vạch mảnh + tên team nằm giữa vạch, dưới vạch là
   từng bạn xếp theo số lỗi bắt được (nhiều nhất lên trên). Dựng bởi
   `moPopDoiSp()` (JS), thay cho `moPopCaLop()` khi thẻ là spcheck. */
.doi-vach{display:flex; align-items:center; gap:10px; margin:14px 9px 6px}
.doi-vach:first-child{margin-top:6px}
.doi-vach .line{flex:1; height:1px; background:var(--line)}
.doi-vach .lb{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--accent);
  white-space:nowrap}
.doi-vach .lb .tong{margin-left:6px; font-weight:700; letter-spacing:.03em; color:var(--muted)}
.doi-vach .lb .tong::before{content:'•'; margin-right:6px; color:var(--line)}
.hs-dong{display:grid; grid-template-columns:20px minmax(0,1fr) auto; align-items:center;
  column-gap:8px; padding:5px 9px; border-radius:8px}
.hs-dong + .hs-dong{margin-top:1px}
.hs-hang{font-size:10px; font-weight:800; color:#9CADA9; text-align:center}
.hs-ten{font-size:12px; font-weight:700; color:var(--ink); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.hs-so{font-size:12px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){
  .pop-nen,.pop{transition:none}
}

/* ---------- POP-UP MỞ PHÒNG CHẤM SPEAKING (⭐ SP CHECK, 20/08 — THIẾT KẾ LẠI 27/08) ----------
   Thầy chốt: bấm thẻ SPEAKING CHECK thì hiện pop-up cho học sinh BIẾT LÀ ĐANG
   TẢI (bộ não mySpeaking đo được 8-40 giây), xong mới mở tab mới.
   ⛔ Nền tối dùng z-index 44 = đúng tầng nền tối của bóng đèn bên trang bài
   tập; hộp 46. Xem bảng thứ tự lớp ở `bai-words.html`.
   ⭐ 27/08 — thầy chốt mẫu mới: khung to hơn, tiêu đề SPEAKING CHECK CỐ ĐỊNH có
   sao lấp lánh (không đổi theo trạng thái nữa) + dòng "in Andrew Classes" bên
   dưới; nút đóng X thay nút "Đóng" nhỏ; trạng thái XONG bỏ vòng xoay + tiêu đề
   phụ, chỉ còn 2 nút to Chấm bài (xanh lá) / Phản biện (xanh dương).
   ⭐⭐ 02/09/2026 (web v1.53.0) — THẦY DUYỆT QUA BẢN MẪU
   `mau-web/mau-sp-popup-02-09-2026.html`, đổi 4 việc:
     • Hộp rộng 400 → 460px, đệm trên 34 → 22px.
     • Slogan ANDREW CLASSES lên TRÊN CÙNG, nét mảnh; ⛔ BỎ HẲN dòng "in Andrew
       Classes" dưới tiêu đề (`.sp-sub` đã gỡ — đừng dựng lại).
     • Dòng "Em chấm TEAM X" TÁCH KHỎI `.sp-phu` thành khối riêng `.sp-doi`.
       ⛔ Cố ý tách: `.sp-phu` còn phải gánh MỌI câu báo lỗi ("Mạng đang chậm…",
       "Đội 3 chưa được xếp chấm đội nào."), nhét chung thì chỉnh kiểu chữ cho
       tên đội là câu lỗi cũng to đậm theo — đúng họ bẫy mượn tên `ngoaidoi`
       ghi ngay bên dưới.
     • Hai ô tròn đỏ `.sp-bad` ở góc trên phải mỗi nút — số do `spDemViec()` đọc. */
.sp-nen{position:fixed; inset:0; z-index:44; background:rgba(8,18,16,.62);
  backdrop-filter:blur(3px); display:grid; place-items:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .22s}
.sp-nen.mo{opacity:1; pointer-events:auto}
/* ⭐ 03/09/2026 — 460 → 560px (thầy chốt): bốn dòng chú thích trong nút phải gọn một dòng. */
.sp-hop{position:relative; width:min(560px,94vw); background:var(--surface);
  border-radius:24px; box-shadow:0 24px 60px rgba(22,35,42,.28);
  padding:22px 28px 26px; text-align:center; transform:translateY(8px) scale(.98);
  transition:transform .24s var(--em)}
.sp-nen.mo .sp-hop{transform:none}

.sp-x{position:absolute; top:12px; right:12px; width:28px; height:28px;
  border-radius:50%; border:none; background:#FDECEC; display:flex;
  align-items:center; justify-content:center; cursor:pointer; padding:0;
  transition:transform .15s var(--em), background .15s}
.sp-x:hover{background:#FBDADA; transform:scale(1.08)}
.sp-x svg{width:13px; height:13px}
.sp-x svg path{stroke:var(--m-do); stroke-width:2.6; stroke-linecap:round}

/* Slogan trên cùng: chữ nhỏ, nét MẢNH (300), giãn chữ rộng cho ra dáng thương
   hiệu. Lề phải 34px để không chui xuống dưới nút ✕ đang nằm đè góc. */
.sp-slogan{margin:0 34px 12px; font-weight:300; font-size:9.5px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}

.sp-titlewrap{position:relative; padding:4px 6px 2px}
.sp-brand{margin:0; font-weight:800; font-size:clamp(22px,6.4vw,30px); letter-spacing:.01em;
  color:var(--accent); line-height:1.1; position:relative; z-index:2}
.sp-spark{position:absolute; z-index:1; color:var(--amber); pointer-events:none;
  animation:sp-lap 2.4s ease-in-out infinite}
.sp-spark svg{display:block}
.sp-spark.s1{top:-4px; left:4%; width:16px; animation-delay:0s}
.sp-spark.s2{top:2px; right:2%; width:21px; animation-delay:.5s}
.sp-spark.s3{bottom:-6px; left:16%; width:12px; animation-delay:1s}
.sp-spark.s4{bottom:0; right:18%; width:13px; animation-delay:1.5s}
@keyframes sp-lap{
  0%,100%{opacity:.35; transform:scale(.8) rotate(0deg)}
  50%    {opacity:1; transform:scale(1.15) rotate(14deg)}
}
/* Khối "EM CHẤM / TEAM X" — chỉ hiện khi JS bật `.hien` (mọi trạng thái khác:
   đang tải, báo lỗi, em ngoài đội… đều không có đội nào để nói tới). */
.sp-doi{display:none; margin:20px 0 4px}
.sp-doi.hien{display:block}
.sp-doi-vach{display:flex; align-items:center; gap:10px}
.sp-doi-vach i{flex:1; height:1px; background:var(--line)}
.sp-doi-vach b{font-size:9.5px; font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap}
.sp-doi-ten{margin:9px 0 0; font-weight:800; font-size:26px; letter-spacing:.04em;
  color:var(--ink); line-height:1.1}
.sp-doi-ten em{font-style:normal; color:var(--accent)}

.sp-vong{width:40px; height:40px; margin:0 auto 12px; border-radius:50%;
  border:3.5px solid var(--accent-soft); border-top-color:var(--accent);
  animation:sp-quay .8s linear infinite}
@keyframes sp-quay{to{transform:rotate(360deg)}}
.sp-hop.xong .sp-vong{display:none}
.sp-hop.loi .sp-vong{animation:none; border-color:#F3C7C8; border-top-color:var(--m-do)}
.sp-tieu{margin:0 0 6px; font-weight:800; font-size:13px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink)}
.sp-hop.xong .sp-tieu{display:none}
.sp-phu{margin:0; font-size:12.5px; line-height:1.5; color:var(--muted)}
/* Trạng thái XONG truyền `phu` rỗng (dòng đội đã sang khối `.sp-doi` riêng) —
   thẻ <p> rỗng vẫn chiếm chiều cao dòng, phải giấu hẳn kẻo dôi một khoảng trống
   không ai hiểu vì đâu mà ra. */
.sp-phu:empty{display:none}

/* Kiểu "CHỈ MỘT DÒNG": bỏ vòng xoay + tiêu đề, còn đúng một dòng chữ hoa đậm.
   ⛔ v1.29.1 — `ngoaidoi` là tên theo VIỆC ("em ngoài đội"), nay có việc THỨ HAI
   dùng chung kiểu này (hệ thống đang nâng cấp). Thêm hẳn tên chung `motdong` thay
   vì mượn `ngoaidoi` cho việc khác: mượn tên là đúng họ bẫy `.aw-gs-card` bên
   AWord — người sau đọc `ngoaidoi` sẽ tưởng chỗ đó nói về đội. */
.sp-hop.ngoaidoi .sp-vong, .sp-hop.motdong .sp-vong{display:none}
.sp-hop.ngoaidoi .sp-tieu, .sp-hop.motdong .sp-tieu{display:none}
.sp-hop.ngoaidoi .sp-phu, .sp-hop.motdong .sp-phu{font-weight:800; font-size:14px;
  line-height:1.5; text-transform:uppercase; color:var(--ink)}

.sp-nut{display:flex; gap:8px; justify-content:center; margin-top:14px}
.sp-nut button{position:relative; height:34px; padding:0 16px; border-radius:10px;
  font-weight:800; font-size:11.5px; letter-spacing:.05em; border:1px solid var(--line);
  background:var(--ground); color:var(--muted); transition:filter .14s, transform .15s var(--em)}
.sp-nut button.chinh{background:var(--accent); border-color:var(--accent); color:#fff}
.sp-nut button:hover{filter:brightness(.97)}
.sp-nut button:active{transform:scale(.97)}

/* Trạng thái XONG: hai nút to hẳn, vuông vắn, xanh lá (Chấm bài) / xanh dương (Phản biện). */
.sp-hop.xong .sp-nut{gap:10px; margin-top:20px}
.sp-hop.xong .sp-nut button{flex:1; height:auto; padding:22px 10px; border:none;
  border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:7px;
  font-size:14px; letter-spacing:.03em; color:#fff}
.sp-hop.xong .sp-nut button svg{width:26px; height:26px}
.sp-hop.xong .sp-nut button.chinh{background:linear-gradient(155deg,var(--xanh-la),#0E7A3F)}
.sp-hop.xong .sp-nut button:not(.chinh){background:linear-gradient(155deg,var(--m-duong),#2456C4)}

/* ⭐⭐ 03/09/2026 — BỐN NÚT, HAI CỘT (thầy duyệt qua bản mẫu
   `mau-web/mau-kiem-tra-trung-03-09-2026.html`, 6 vòng chỉnh).
     cột trái XANH LÁ  : CHẤM BÀI CÁ NHÂN (to) · XÁC NHẬN TRÙNG (nhỏ)
     cột phải XANH DƯƠNG: PHẢN BIỆN CÁ NHÂN (to) · KIỂM TRA TRÙNG (nhỏ)
   ⛔ HỘP RỘNG 460 → 560px: bốn dòng chú thích nằm TRONG nút và phải gọn ĐÚNG MỘT DÒNG
      (`white-space:nowrap`). Hạ lại 460 mà quên nowrap là chú thích tự xuống hàng.
   ⛔ Cột là GRID hai hàng `1fr auto`, KHÔNG phải flex-column: chú thích dài ngắn khác
      nhau thì nút to bên này cao hơn bên kia, nhìn lệch ngay — thầy đã bắt một lần.
   ⛔ `.sp-nut.hai-cot` chỉ bật khi CÓ nút khai `cot`; mọi pop-up báo lỗi vẫn dùng hàng
      ngang cũ, đừng gộp hai nếp làm một. */
.sp-hop.xong .sp-nut.hai-cot{display:grid; grid-template-columns:1fr 1fr; align-items:stretch}
.sp-cot{display:grid; grid-template-rows:1fr auto; gap:6px; min-width:0}
.sp-hop.xong .sp-nut.hai-cot button{width:100%}
.sp-hop.xong .sp-nut button.to{padding:20px 10px 16px; font-size:13.5px}
.sp-hop.xong .sp-nut button.to.la{background:linear-gradient(155deg,var(--xanh-la),#0E7A3F)}
.sp-hop.xong .sp-nut button.to.duong{background:linear-gradient(155deg,var(--m-duong),#2456C4)}
.sp-hop.xong .sp-nut button.nho{padding:10px 8px; gap:3px; border-radius:13px; font-size:11.5px}
.sp-hop.xong .sp-nut button.nho svg{width:15px; height:15px}
.sp-hop.xong .sp-nut button.nho.la{background:#E4F5EA; color:#0E7A3F}
.sp-hop.xong .sp-nut button.nho.duong{background:#E4ECFE; color:#2456C4}
.sp-nut .nho .hang{display:flex; align-items:center; gap:5px}
/* Chú thích: nhỏ, nghiêng, nhẹ hơn tên nút, MỘT DÒNG. Chữ nào dài quá thì SỬA CHỮ cho
   ngắn lại, đừng cho nó xuống hàng. */
.sp-nut .to .chu{font-size:9.5px; line-height:1.3; font-style:italic; font-weight:500;
  letter-spacing:0; color:rgba(255,255,255,.82); white-space:nowrap}
.sp-nut .nho .chu{font-size:9px; line-height:1.3; font-style:italic; font-weight:500;
  letter-spacing:0; opacity:.72; white-space:nowrap}
.sp-nut .nho .sp-bad{top:-8px; right:-8px; min-width:23px; height:23px; font-size:11px}

/* ⭐ 02/09/2026 — Ô TRÒN ĐỎ BÁO SỐ VIỆC, góc trên bên phải mỗi nút.
   • Viền trắng 2,5px để tách hẳn khỏi nền nút, không bị "dính" vào màu nút.
   • `min-width` + đệm ngang: 1 chữ số thì TRÒN VO, 2-3 chữ số tự giãn thành
     viên thuốc chứ không bóp méo con số.
   • Số 0 thì `spGanSo()` KHÔNG vẽ gì — đừng để vòng tròn rỗng trên nút.
   ⛔ Đừng đặt `overflow:hidden` cho `.sp-nut` hay cho nút: ô này cố ý tràn ra
      ngoài mép nút (top/right âm), có overflow là bị xén mất một góc. */
.sp-bad{position:absolute; top:-9px; right:-9px; min-width:27px; height:27px;
  padding:0 7px; border-radius:999px; background:var(--m-do); color:#fff;
  font-size:12.5px; font-weight:800; letter-spacing:0; line-height:1;
  display:flex; align-items:center; justify-content:center;
  border:2.5px solid var(--surface); box-shadow:0 3px 10px rgba(224,87,91,.5);
  font-variant-numeric:tabular-nums; animation:sp-dap 2.6s ease-in-out infinite}
@keyframes sp-dap{
  0%,88%,100%{transform:scale(1)}
  93%        {transform:scale(1.14)}
}

.sp-halo{position:absolute; inset:-2px; border-radius:inherit; pointer-events:none}
.sp-halo span{position:absolute; inset:0; border-radius:inherit; border:2px solid #fff; opacity:0}

  0%{opacity:.85; transform:scale(1)}
  100%{opacity:0; transform:scale(1.3)}
}

/* ---------- BẢNG XEM THỬ (CHỈ CÓ TRONG BẢN MẪU) ---------- */
.thu{position:fixed; left:14px; bottom:14px; z-index:50; display:flex;
  flex-direction:column; gap:6px; background:var(--surface); border:1px solid #F6D3BC;
  border-radius:14px; padding:9px 10px; box-shadow:var(--shadow)}
.thu-hang{display:flex; align-items:center; gap:6px}
.thu b{font-size:9.5px; font-weight:800; letter-spacing:.05em; color:#B3541E;
  background:#FDEADF; border-radius:999px; padding:3px 8px; white-space:nowrap}
.thu button{font-size:11px; font-weight:700; color:var(--muted); border-radius:9px;
  padding:5px 9px; border:1px solid var(--line); transition:.15s; white-space:nowrap}
.thu button:hover{background:var(--ground)}
.thu button.chon{background:var(--accent); border-color:var(--accent); color:#fff}

.toast{position:fixed; left:50%; bottom:26px; z-index:60; transform:translate(-50%,20px);
  background:var(--ink); color:#fff; font-size:13px; font-weight:600;
  border-radius:12px; padding:10px 18px; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s var(--em)}
.toast.hien{opacity:1; transform:translate(-50%,0)}

/* ⛔⛔ ĐÃ GỠ HẲN Ở v18 — ĐỪNG DỰNG LẠI:
       @media (max-width:1140px){ .the-diem.co-thieu{width:392px} }
   Rule này ép vùng điểm rộng đúng 392px trong khi ĐẦU THẺ vẫn trải hết bề
   ngang thẻ ⇒ cột CHƯA XONG BÀI dừng ở 392px còn ô hạn nằm tít mép phải:
   ở cửa sổ 900px hai khối LỆCH NHAU 389px (thầy bắt được 18/08).
   Nó còn gây lỗi thứ hai ở v16: máy 375px lòng thẻ chỉ 297 mà vùng điểm bị
   ép 392 ⇒ cột tên bị đẩy hẳn ra ngoài thẻ, cắt mất sạch.
   Gỡ đi thì .the-diem trải hết bề ngang y như .the-body, mà hai khối cùng
   đệm phải 14px và cùng cột phải 176px ⇒ ô hạn và cột CHƯA XONG BÀI THẲNG
   TÂM NHAU trong MỌI bề ngang, không cần rule bù nào cả. */
/* ⭐ v18 — CỬA SỔ HẸP (chat rơi xuống dưới cột thẻ).
   Trước đây vẫn vẽ 4 thẻ và cho chat cao cứng 520px ⇒ phải cuộn mãi mới tới
   ô nhập. Nay xử y như dạng điện thoại: JS chỉ vẽ 2 thẻ (xem `soThe()`), cả
   trang gói trong MỘT MÀN, phần cao còn lại dồn hết cho khung chat.
   minmax(176px,1fr): cửa sổ lùn quá thì thà cho cuộn còn hơn bóp khung chat
   bẹp dí đến mức không đọc được. */
@media (max-width:1040px){
  /* minmax(--san-chat,1fr) chứ không phải minmax(176px,1fr) như v18: kéo cửa
     sổ lùn dần thì hàng chat cứ co lại (tin nhắn chuyển thành cuộn) để ô nhập
     luôn hiện ĐỦ. Chỉ khi cửa sổ ngắn hơn [2 thẻ + tiêu đề + ô nhập] thì lưới
     mới tràn và ô nhập trồi xuống dưới mép màn — thầy chấp nhận ca này. */
  .main{grid-template-columns:1fr; grid-template-rows:auto minmax(var(--san-chat),1fr);
    gap:14px; padding:14px 20px 16px;
    height:calc(100vh - var(--cao-dau) - var(--banphim));
    height:calc(100dvh - var(--cao-dau) - var(--banphim))}
  /* ⛔ Ô lưới bây giờ là .chat-cot chứ không phải .chat nữa, nên phải cho
     khung chat cao ĐÚNG BẰNG Ô (100%). Để height:auto là nó phình theo số
     tin nhắn rồi tràn ra ngoài ô, ô nhập tụt xuống tận đáy trang. */
  .chat{height:100%}

  /* ⭐ ĐANG GÕ (bàn phím ảo hiện lên) → CẤT CỘT THẺ, nhường trọn phần màn
     còn lại cho khung chat.
     ⛔ Chỉ trừ chiều cao bàn phím KHÔNG đủ: hàng thẻ là `auto` nên nó vẫn
     giữ nguyên 2 thẻ, cộng với minmax(176px) của chat là lưới phình quá
     khung ⇒ ô nhập tụt xuống DƯỚI mép bàn phím y như cũ (đo được: thò 26px).
     Lúc em đang gõ thì cần thấy cuộc trò chuyện chứ không cần nhìn thẻ bài,
     nên giấu hẳn là gọn nhất — bàn phím tắt là thẻ hiện lại ngay. */
  .go-chat .cot-bai,.go-chat .vach{display:none}
  .go-chat .main{grid-template-rows:1fr}
}

/* ============================================================
   DẠNG ĐIỆN THOẠI DỌC — chuẩn iPhone 11 Pro (375 × 812)
   · Chỉ 2 thẻ (JS lo), chat nằm dưới cùng.
   · Danh sách chưa xong bài VẪN ở bên phải các thanh, tối đa 3 bạn.
   · Thanh tiến độ ngắn lại, khoảng cách tên–thanh–số thu hẹp.
   ============================================================ */
@media (max-width:620px){
  :root{--cao-the:166px}
  /* Thẻ đừng chạm mép máy: chừa nền hai bên rộng hơn (12 → 18px). */
  .wrap{padding:0 18px}
  /* MỘT MÀN LÀ ĐỦ: 2 thẻ + khung chat (kể cả ô nhập) phải nằm trọn trong
     màn, không phải cuộn xuống mới thấy chỗ gõ. Hàng 2 của lưới ăn hết phần
     cao còn lại, và chat cao theo hàng đó.
     100dvh (không phải 100vh) vì thanh địa chỉ Safari co giãn — 100vh trên
     iPhone tính cả phần bị thanh đó che, đẩy ô nhập xuống dưới mép màn.
     ⚠ v18: chiều cao thanh đầu KHÔNG gõ tay nữa mà để JS đo rồi đặt vào
     --cao-dau (v16 gõ 62 trong khi thật là 65 ⇒ dôi 3px phải cuộn). --banphim
     là phần bị bàn phím ảo che, trừ luôn ở đây nên ô nhập không bao giờ bị đè.
     ⚠ Phải là HEIGHT chứ không phải min-height: với min-height, chiều cao
     khung vẫn tính là "auto" nên hàng 1fr không có gì để chia — nó co theo
     nội dung và khung chat lại dài ra như cũ. */
  .main{gap:12px; padding:12px 18px 14px; grid-template-rows:auto minmax(190px,1fr);
    height:calc(100vh - var(--cao-dau) - var(--banphim));
    height:calc(100dvh - var(--cao-dau) - var(--banphim))}
  .cot-bai{gap:12px}
  .vach{margin:0}

  .who .lop{display:none}
  .av.me{width:44px; height:44px; font-size:16px}
  .sao-hieu{bottom:-2px; font-size:8.5px; padding:0 3px}
  .sao-hieu > svg:not(.lap){width:8.5px; height:8.5px}
  .who .ten{font-size:15.5px}
  .top-in{gap:10px; padding:10px 18px}

  .the-in{--mui:42px}
  .play svg{width:17px; height:17px; margin-right:17px}
  /* Cùng bố cục với máy tính, chỉ thu nhỏ: cột phải 106px (thay 176px) và
     .khoi-thieu bên dưới cũng 106px để hai khối vẫn thẳng tâm. */
  /* v17: đầu thẻ nay là MỘT HÀNG NGANG (xem chú thích ở phần dùng chung),
     điện thoại chỉ việc thu nhỏ — cột phải 106px thay 176px. */
  .the-body{padding:9px 8px 5px 10px; column-gap:6px}
  .t-chu{gap:0}
  .t-ten{font-size:11px}
  .t-ma{font-size:10.2px}
  .t-ten .ngay,.t-ten .khoang{margin-left:5px}
  .han-boc{width:106px; gap:5px}
  .t-han{width:100px; min-width:0; padding:3px 6px 4px; border-radius:9px; gap:2px}
  .t-han .han-dong{font-size:8.5px; gap:3px}
  .t-han .han-dong svg{width:9px; height:9px}
  .dhho{font-size:13.5px; letter-spacing:.2px}
  .dhho.xong{font-size:11px; letter-spacing:.4px}
  .dhho.khoa{font-size:10px; letter-spacing:.3px}
  .tich-to{font-size:20px}

  .the-diem{padding:6px 8px 7px 12px; gap:3px}
  .the-diem.chi-tay{padding:0 14px}
  .the-diem.co-thieu{gap:10px}
  .the-diem.co-thieu .khoi-thanh{gap:3px}
  .the-diem.n1 .td-dong{min-height:52px}
  .the-diem.n2 .td-dong{min-height:24.5px}
  /* 4 bài trên điện thoại là ca chật nhất — bó thêm một nấc nữa. */
  .the-diem.n4{padding-top:5px; padding-bottom:6px}
  .the-diem.n4:not(.co-thieu){gap:2px}
  .the-diem.co-thieu.n4 .khoi-thanh{gap:2px}
  .the-diem.n4 .td-tay{margin-top:3px; padding-top:4px}
  .khoi-thieu{width:106px; padding:0 7px}
  .khoi-thieu .tieu{font-size:8px; letter-spacing:.04em; margin-bottom:1px}
  .ds-thieu{column-gap:6px}
  .ds-thieu .ten{font-size:9.5px; line-height:1.32}
  .ds-thieu .so{min-width:13px; height:12px; padding:0 3px; font-size:8.5px; border-radius:4px}
  .khoi-thieu .them{margin-top:1px; font-size:9px}

  /* thanh ngắn lại + các cột sát nhau hơn */
  /* v1.14.0 — cùng phép nới (và cùng cặp minmax) như bản rộng: "PRONUNCIATION"
     ở 9,5px đo được 87px ⇒ trần 90px; sàn thanh 40px cho thẻ GẤP.
     v1.15.0 — trần đó nay chỉ dành cho nhãn lạ; nhãn chuẩn thì `canhNhanO()`
     đo lại ở chính cỡ chữ 9,5px này rồi hạ `--cot-ten` xuống (đo trên phần tử
     thật nên tự đúng cho cả hai cỡ chữ, không phải gõ số riêng cho điện thoại). */
  .td-dong{grid-template-columns:minmax(0,var(--cot-ten,90px)) minmax(40px,1fr) 36px 9px; gap:5px}
  .td-ten{font-size:9.5px; letter-spacing:0}
  .td-bar{height:6px}
  .td-so{font-size:9.5px}
  .td-tich{font-size:9px}
  .td-tay{margin-top:6px; padding-top:7px; font-size:9px; line-height:1.3}
  .td-tay svg{width:10px; height:10px; margin-right:3px}

  /* Chat cao theo hàng lưới (không đặt height cứng) — nhờ vậy ô nhập luôn
     nằm trong màn, khỏi phải cuộn tìm. */
  /* ⛔ Ô lưới bây giờ là .chat-cot chứ không phải .chat nữa, nên phải cho
     khung chat cao ĐÚNG BẰNG Ô (100%). Để height:auto là nó phình theo số
     tin nhắn rồi tràn ra ngoài ô, ô nhập tụt xuống tận đáy trang. */
  .chat{height:100%}
  .chat-head{padding:10px 13px 8px}
  .chat-head h2{font-size:12.5px; gap:6px}
  .chat-head h2 svg{width:15px; height:15px}
  .chat-body{padding:10px 10px 4px; gap:8px}
  .bong{font-size:12.5px; padding:6px 10px}
  .msg .av{width:28px; height:28px; font-size:11px; margin-top:13px}
  .msg.toi .av{margin-top:0}
  .chat-foot{padding:9px 10px}
  .chat-foot textarea{padding:7px 12px}
  .chat-foot button{width:40px}

  .thu{left:8px; right:8px; bottom:8px}
  .thu-hang{justify-content:center; flex-wrap:wrap}
}

/* ============================================================

var $ = function(s){ return document.querySelector(s); };

/* Chống chèn thẻ HTML từ chữ người khác gõ (tên bài, TIN NHẮN của bạn cùng lớp).
   ⛔ Dùng chung với js/chung.js — ĐỪNG viết lại một bản riêng ở đây. */
function chuAnToan(x){ return window.AWC.chuAnToan(x); }

/* Hai ngưỡng này trùng với @media bên trên — sửa một chỗ thì sửa cả hai.
     620px  = dạng điện thoại (cỡ chữ, khoảng cách thu nhỏ)
   1040px  = cửa sổ hẹp, khung chat rơi xuống dưới cột thẻ */
var MAN_HEP = window.matchMedia('(max-width:620px)');
var CHAT_DUOI = window.matchMedia('(max-width:1040px)');
function laDienThoai(){ return MAN_HEP.matches; }
function chatODuoi(){ return CHAT_DUOI.matches; }

var MAU_AV = ['#0E7C6E','#B3541E','#5B8DEF','#8CC63F','#E36B5C','#9C6ADE','#F2A93B'];
/* ⭐ avatar thật (kho assets/avatar, luật slug Y HỆT dashboard.html/veHocSinh +
   tools/xuat-avatar.py) — chưa có ảnh thì tự rơi về chữ tắt màu như cũ. */
function avKhongDau(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
}
function avSlugLop(s){ return avKhongDau(s).replace(/[^a-z0-9]/g, '') || 'lop'; }
function avSlugTen(s){

}
function veAv(ten, i){

  /* ⭐ v1.58.0 — tin cũ còn ghi TÊN GỌI NGẮN người gửi ⇒ tra tên đầy đủ (`CA_LOP`) trước khi

  var tenDay = A.avTenDayDu(ten, typeof CA_LOP !== 'undefined' ? CA_LOP : []);

}

/* ---------- VIẾT TẮT TÊN (cùng lối app myTeam) ---------- */
function tachTu(ten){ return String(ten || '').trim().split(/\s+/).filter(Boolean); }

function dangTat(tu, mucDo){
  var cuoi = tu[tu.length - 1];
  var truoc = tu.slice(Math.max(0, tu.length - 1 - mucDo), tu.length - 1);
  return truoc.map(function(t){ return t.charAt(0) + '.'; }).join('') + cuoi;
}

function bangVietTat(dsTen){
  var duyNhat = [], da = {};
  dsTen.forEach(function(t){ if (t && !da[t]) { da[t] = 1; duyNhat.push(t); } });
  var muc = {};
  duyNhat.forEach(function(t){ muc[t] = 1; });
  for (var vong = 0; vong < 8; vong++) {
    var nhom = {};
    duyNhat.forEach(function(t){
      var tu = tachTu(t);
      var k = dangTat(tu, Math.min(muc[t], tu.length - 1));
      (nhom[k] = nhom[k] || []).push(t);
    });
    var conTrung = false;
    Object.keys(nhom).forEach(function(k){
      if (nhom[k].length < 2) return;
      nhom[k].forEach(function(t){
        var tu = tachTu(t);
        if (muc[t] < tu.length - 1) { muc[t]++; conTrung = true; }
      });
    });
    if (!conTrung) break;
  }
  var ra = {};
  duyNhat.forEach(function(t){
    var tu = tachTu(t);
    ra[t] = dangTat(tu, Math.min(muc[t], tu.length - 1));
  });
  return ra;
}

/* ---------- DỮ LIỆU THẬT (web v1.9.0) ----------
   Tới bản mẫu, toàn bộ khu này là số gõ tay. Nay lấy thật:
     · lớp + học sinh  <- data/lop.json (app myLesson xuất từ myStudent)
     · các bài của lớp <- data/bai.json (app đẩy lên mỗi lần bấm PUSH)
     · ai đã làm bài   <- kho điểm AWord (Firestore, chỉ đọc) — xem js/chung.js
   ⛔ ĐỪNG gõ lại tên lớp / danh sách em ở đây nữa. Trang này KHÔNG được chứa
   một chữ dữ liệu nào của thầy: file nằm công khai trên GitHub.

   ⭐⭐ ĐỊNH NGHĨA "XONG MỘT BÀI" (thầy siết 24/08/2026, web v1.14.0): em phải
   đạt ĐIỂM TỐI ĐA của act đó. Nộp rồi mà 99/100 vẫn KHÔNG được tính (13 em, 1
   em 99 điểm ⇒ thanh vẫn 0/13). Nếp cũ "nộp là xong" chỉ còn dùng cho act mà
   điểm không đo được số câu đúng (Gameshow, bài bật trừ điểm).
   ⛔ Luật + mốc điểm tối đa nằm TRỌN trong `A.chuanDiem()` / `A.xongAct()` bên
   js/chung.js — trang này, bai.html và dashboard.html dùng CHUNG. Sửa định
   nghĩa thì sửa ở đó, đừng vá lẻ ba nơi. */

var A = window.AWC;
var DL = { lop: [], bai: {} };
var EM = null;
/* ⭐ (02/09 đợt 4) Bảng điểm TỪNG ACT: { mã act -> danh sách em }. `donDiem()` đổ vào,
   `veDiem()` dùng để biết em nào TOP 1 mà đặt avatar lên thanh tiến trình. */
var DIEM_ACT = {};

var TOI = '';            /* tên em đang đăng nhập (đúng tên trong myStudent) */
var LOP = '';            /* tên lớp HIỆN cho em xem, kiểu myStudent: "B2-B" */
var LOP_SLUG = '';       /* thư mục avatar của lớp, dùng bởi veAv() */
var LOP_DL = '';         /* mã lớp trong lop.json / bai.json: "B2B" */
var LOP_HIEN = '';       /* mã lớp đưa cho em xem + truyền sang AWord: "B2B" */
var MA_HS = '';          /* mã đăng nhập của em */

var CA_LOP = [];         /* tên cả lớp, đúng thứ tự trong lop.json */
var SI_SO = 0;
var TAT = {};
function tenTat(t){ return TAT[t] || t; }

var BAI_MOI = null;      /* thẻ trên vạch (bài mới nhất còn hạn) */
var BAI_CU = [];         /* các thẻ dưới vạch */
var BAI_SP = null;       /* thẻ SPEAKING CHECK, nếu buổi này có */

/* Địa chỉ hai đầu bên mySpeaking — nay lấy từ config.js chứ không gõ trong trang. */
var SP_NAO = A.CFG.SP_NAO || '';
var SP_WEB = A.CFG.SP_WEB || '';
function lopMa(){ return LOP_HIEN; }   /* mã lớp bên mySpeaking = "B2B" */

/* ⭐ v18 — 2 thẻ ở MỌI cửa sổ hẹp, không riêng điện thoại: hễ khung chat đã
   phải rơi xuống dưới thì nhường chỗ cho nó, thầy khỏi cuộn tìm ô nhập. */
function soThe(){ return chatODuoi() ? 2 : 4; }

/* "9.6" -> "9/6" (thầy viết ngày kiểu chấm trong tên bài, học sinh quen gạch chéo) */
function ngayGach(s){
  var m = /^(\d{1,2})\.(\d{1,2})$/.exec(String(s || '').trim());
  return m ? (m[1] + '/' + m[2]) : String(s || '');
}
function ngayCuaMoc(ms){
  if (ms == null) return '';
  var d = new Date(ms);
  return d.getDate() + '/' + (d.getMonth() + 1);
}

/* Một bài trong bai.json -> một THẺ trên trang này. `xong`/`thieu` để trống,
   `donDiem()` đổ vào sau khi đọc xong kho điểm. */
function theTuBai(b){
  var acts = A.actCuaBai(b);
  var moc = A.mocHan(b);
  var laSp = /SP\s*CHECK/i.test(b.dang || '');
  return {
    id: b.id,
    dang: b.dang || '',
    loai: laSp ? 'spcheck' : '',
    trang: A.trangCuaBai(b),
    ten: A.tenBai(b),
    ma: A.maLesson(b),
    giao: ngayGach(b.ngay),
    han: A.chuHan(b),                 /* chữ trên ô hạn */
    hanNgan: ngayCuaMoc(moc),         /* thẻ cũ chỉ hiện ngày */
    hanMoc: moc,                      /* mốc thật cho đồng hồ đếm ngược */
    /* ⭐ v1.35.0 — thầy TẠM KHOÁ ở dashboard: thẻ hiện, không mở được, đồng hồ
       dừng. `conHan` là luật chung (khoá = luôn còn hạn), xem js/chung.js. */
    khoa: A.trangThaiThe(b) === 'khoa',
    /* ⭐ v1.56.0 (thầy chốt 03/09/2026) — THẺ ĐÃ ĐỔI HẠN RIÊNG = COI NHƯ THẺ MỚI.
       Thầy sửa hạn ở dashboard là để lớp làm tiếp/làm lại, nên trang học sinh phải
       chạy lại đồng hồ đếm ngược chứ không được đứng ở "COMPLETE" của vòng trước.
       Xem `tinhHinhGio()` + `veTheMoi()`. Áp cho MỌI dạng bài, không riêng SP CHECK. */
    suaHan: A.daSuaHan(b),
    conHan: A.conHan(b),
    /* (Đợt 3 Firebase — PHẦN C′) thẻ SP CHECK: app đẩy MỘT khối giả loai:'spcheck'
       (không phải act AWord). Thanh tiến trình vẫn cần đúng 1 dòng để
       `capNhatTheSpeaking()` đổ số "đã nộp" vào `bai[0].xong`; số `xong` app đẩy
       sẵn hiện NGAY, kho Firestore đổ số thật đè lên sau (nếp "hiện trước, đổ sau"). */
    bai: laSp
      ? [{ ten: 'SPEAKING CHECK', ma: '',
           xong: (b.khoi && b.khoi[0] && +b.khoi[0].xong) || 0 }]
      : acts.map(function(k){ return { ten:k.ten, ma:k.ma, xong:0 }; }),
    tay: b.tay || '',
    thieu: []
  };
}

/* Đọc điểm của MỌI act trong các thẻ rồi đổ vào `bai[].xong` + `thieu[]`.
   (v1.47.0 — bỏ phần dựng bảng hạng cho pop-up, xem `xepCaLop()`.)
   ⭐ v1.14.0 — đọc kèm CHUẨN ĐỦ ĐIỂM của từng act (`A.chuanDiem`). Nó tốn thêm
   một lượt đọc Firestore cho mỗi act ở LẦN ĐẦU của mỗi máy, sau đó nằm hẳn
   trong localStorage (tuỳ chọn bài giao là bản chụp đóng băng, không đổi). */
function donDiem(cacThe){
  var mangMa = [];
  cacThe.forEach(function(t){
    (t.bai || []).forEach(function(x){ if (x.ma && mangMa.indexOf(x.ma) < 0) mangMa.push(x.ma); });
  });
  if (!mangMa.length) return Promise.resolve();

  return Promise.all(mangMa.map(function(ma){
    return Promise.all([
      A.diemCuaAct(ma)['catch'](function(){ return []; }),
      A.chuanDiem(ma)
    ]).then(function(r){ return { ma:ma, ds:r[0], chuan:r[1] }; });
  })).then(function(kq){
    var theoMa = {}, chuanMaAct = {};
    kq.forEach(function(r){ theoMa[r.ma] = r.ds; chuanMaAct[r.ma] = r.chuan; });
    /* ⭐ (02/09 đợt 4) Giữ bảng điểm từng act ra NGOÀI để `veDiem()` biết em nào TOP 1 mà đặt
       avatar lên thanh. Trước đây `theoMa` sống và chết trong đúng hàm này. */
    DIEM_ACT = theoMa;

    cacThe.forEach(function(t){
      var thieu = {};
      (t.bai || []).forEach(function(x){
        /* (Đợt 3) dòng giả của thẻ SP CHECK không có mã act — điểm/thiếu của nó
           do capNhatTheSpeaking() lo, đếm ở đây là bêu nhầm cả lớp "chưa xong". */
        if (!x.ma) return;
        var ds = theoMa[x.ma] || [];
        var chuan = chuanMaAct[x.ma];
        var dem = 0;
        CA_LOP.forEach(function(ten){
          if (A.xongAct(ds, ten, chuan)) dem++;
          else thieu[ten] = (thieu[ten] || 0) + 1;
        });
        x.xong = dem;
      });
      t.thieu = Object.keys(thieu).map(function(ten){
        return { ten:ten, so:thieu[ten] };
      });
    });
  });
}

/* ⛔ v1.47.0 — ĐÃ GỠ `dungHangLop()` · `HANG_LOP` · `chuLuc()` (hạng trung bình
   qua các act + mốc nộp sớm nhất). Chúng chỉ phục vụ phép xếp hạng của pop-up
   xem nhanh, mà thầy đã chốt 02/09 bỏ hẳn xếp hạng ở pop-up đó — xem chú thích
   dài ở `xepCaLop()`. Cần xếp hạng thật thì đó là việc của leaderboard trong
   trang bài tập (`bai.html`), nơi mỗi bảng chỉ đo ĐÚNG MỘT act. */

var IC_GIO = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
var IC_TAY = '<svg viewBox="0 0 24 24"><path d="M12 3.5 21 19H3z"/><path d="M12 9.5v4M12 16.4v.1"/></svg>';

function bacMau(pt){
  if (pt >= 100) return 'm-la';
  if (pt >= 90)  return 'm-duong';
  if (pt >= 80)  return 'm-vang';
  if (pt >  70)  return 'm-cam';
  return 'm-do';
}

function tinhHinhThe(b, hetGio){
  var ds = b.bai || [];
  if (!ds.length) {
    return hetGio ? { lop:'tt-la', du:true } : { lop:'', du:false };
  }
  var du = ds.every(function(x){ return x.xong >= SI_SO; });
  return { lop: du ? 'tt-la' : 'tt-do', du:du };
}

/* batDo: bài chưa đủ hiện ĐỎ (3 tiếng cuối, và mọi thẻ đã qua hạn).
   hienThieu: mở cột "chưa xong bài" bên phải (chỉ 3 tiếng cuối). */
function veDiem(b, batDo, hienThieu){
  var thanh = (b.bai || []).map(function(x){
    var pt = Math.min(100, Math.round(x.xong / SI_SO * 100));
    var m = (batDo && pt < 100) ? 'm-do' : bacMau(pt);
    return '<span class="td-dong">' +
      /* ⭐ v1.14.0 — nhãn RÚT GỌN: "WORD PRACTICE 1" -> "WORDS 1" (A.tenO).
         ⭐ v1.15.0 — cờ `true` rút gọn thêm "PRONUNCIATION" -> "PRONUNC" (CHỈ
         trang này; trang bài tập giữ chữ đầy đủ). Bề ngang cột + phép giãn chữ
         cho ba nhãn bằng nhau do `canhNhanO()` lo, xem chú thích ở `.td-dong`. */
      '<span class="td-ten" title="' + A.chuAnToan(x.ten) + '">' + A.chuAnToan(A.tenO(x.ten, true)) + '</span>' +
      '<span class="td-bar"><i class="' + m + '" style="width:' + pt + '%"></i>' +
        avMocHtml(DIEM_ACT[x.ma], LOP || LOP_DL) + '</span>' +
      '<span class="td-so ' + m + '">' + x.xong + '/' + SI_SO + '</span>' +
      '<span class="td-tich">' + (pt >= 100 ? '✓' : '') + '</span>' +
    '</span>';
  }).join('');

  if (b.tay) {
    thanh += '<span class="td-tay">' + IC_TAY + '<span>CHÚ Ý ' + b.tay + '</span></span>';
  }

  var soBai = (b.bai || []).length;
  /* Không có bài AWord nào → đánh dấu để dòng CHÚ Ý nằm giữa vùng điểm.
     n1/n2 → CSS kéo cụm thanh cao bằng khi có 3 bài. */
  var lopSo = soBai ? (' n' + soBai) : ' chi-tay';

  var dsThieu = hienThieu ? (b.thieu || []) : [];
  if (!dsThieu.length) return '<span class="the-diem' + lopSo + '">' + thanh + '</span>';

  /* Dựng ĐỦ tên (thiếu nhiều bài đứng trước); `vuaCotThieu()` chạy ngay sau
     khi vẽ xong sẽ cắt bớt cho vừa chỗ và tự thêm dòng "+N bạn nữa". */
  var sap = dsThieu.slice().sort(function(a, b2){ return b2.so - a.so; });
  var o = sap.map(function(e){
    return '<span class="ten">' + tenTat(e.ten) + '</span>' +
           '<span class="so">' + e.so + '</span>';
  }).join('');

  return '<span class="the-diem co-thieu' + lopSo + '">' +
      '<span class="khoi-thanh">' + thanh + '</span>' +
      '<span class="khoi-thieu" data-tong="' + sap.length + '">' +
        '<span class="tieu">CHƯA XONG BÀI</span>' +
        '<span class="ds-thieu">' + o + '</span>' +
      '</span>' +
    '</span>';
}

/* ⭐ 27/08 — VÙNG ĐIỂM RIÊNG CHO THẺ SP CHECK (mô hình 2): thay veDiem() một

/* ⭐ 02/09/2026 — AVATAR TỪNG EM ĐẶT TRÊN THANH ĐỘI.
   ⛔ KHÔNG tính chỗ đứng ở đây được: nó phụ thuộc BỀ NGANG THẬT của thanh và ĐƯỜNG KÍNH thật
   của avatar — hai thứ chỉ biết sau khi trình duyệt vẽ xong. Ở đây chỉ gắn `data-so` (điểm)
   và `data-luc` (mốc nộp); `xepAvatarThanh()` chạy sau mới đặt `left`.
   ⛔ Bản sao của hàm này còn ở `dashboard.html` và `sp-chitiet.html` — sửa là sửa cả ba. */
function avThanhHtml(d, lopGoc){
  if (!(d.hs || []).length) return '';
  /* ⭐ v1.58.0 — buổi speaking còn ghi TÊN GỌI NGẮN ("QUÂN") trong khi file ảnh tĩnh và kho
     đặt theo tên HIỆN TẠI của lop.json ("TRUNG QUÂN") ⇒ tra tên đầy đủ (`CA_LOP`) TRƯỚC khi
     dựng URL, để lớp nền có ảnh ngay cả khi kho im lặng. Tooltip vẫn hiện tên buổi ghi. */
  return (d.hs || []).slice()
    .sort(function(a, b){ return (a.so - b.so) || ((b.luc || 0) - (a.luc || 0)); })
    .map(function(h){
      var tenDay = A.avTenDayDu(h.ten, CA_LOP);
      /* `data-av-em` / `data-av-lop` (v1.55.0) — dấu để `A.deAvatarKho()` tìm lại ô này
         mà đè ảnh mới nhất từ kho. ⛔ Đặt trên Ô, KHÔNG trên thẻ <img>: `onerror` ngay
         dòng dưới GỠ HẲN <img> khi thiếu ảnh, đánh dấu lên đó là mất manh mối của đúng
         những em đang cần cứu nhất. */
      return '<span class="av-thanh" data-so="' + h.so + '" data-luc="' + (h.luc || 0) + '"' +
        ' data-av-em="' + A.chuAnToan(tenDay) + '" data-av-lop="' + A.chuAnToan(lopGoc) + '" title="' +
        A.chuAnToan(h.ten) + ' · ' + h.so + ' lỗi bắt được">' +
        '<img class="av-anh" src="' + A.chuAnToan(A.avUrl(lopGoc, tenDay)) + '" alt="" onerror="this.remove()">' +
        A.chuAnToan(avChuTat(h.ten)) + '</span>';
    }).join('');
}
