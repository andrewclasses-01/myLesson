<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý · Andrew Classes Network</title>
<link rel="icon" href="assets/avatar-tron.jpg">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="css/nw.css?v=19">
<link rel="stylesheet" href="../css/chat-ui.css?v=18">
</head>
<body>
<main class="ql-main">
  <aside class="ql-cot" id="qlCot"></aside>
  <section class="ql-noi" id="khu"></section>
</main>
<script src="config.js?v=13"></script>
<script src="../js/thay-vao.js?v=2"></script>   <!-- 29/09: đăng nhập thay em — PHẢI trước loi.js -->
<script src="../js/chat-ui.js?v=19"></script>   <!-- ⭐ web v1.199.0 emoji/sticker/cảm xúc dùng chung -->
<script src="js/loi.js?v=19"></script>
<script src="js/thanh.js?v=16"></script>
<script src="../js/ic-ql.js?v=1"></script>   <!-- v1.203.1 icon màu cột trái, chung với dashboard -->
<script src="js/bai.js?v=14"></script>
<script src="js/chat.js?v=16"></script>
<script src="../js/o-ngay.js?v=1"></script>
<script src="js/khampha.js?v=13"></script>
<script>
/* TRANG QUẢN LÝ CỦA THẦY — v0.9.0 (mẫu v28 thầy "ok build" 22/09/2026)
   Cột trái 2 nhóm: BÀI TẬP (nhúng dashboard myLesson — CFG.LINK_DASHBOARD) · NETWORK (nhóm chat · bài đăng ·
   nổi bật · sự kiện & khám phá · báo cáo · bài đã ẩn · từ cấm · tài khoản · lớp). Thêm mục sau này = thêm dòng MUC_QL.
   Chỉ thầy vào được (NW.toi.laThay); học sinh bị đẩy về bảng tin. Bàn thử vai thầy: ?thu=thay (localhost).
   Kho đụng tới: nwChats (tạo/sửa/xoá nhóm — luật v0.6.0 chỉ thầy) · nwPosts (an/noiBat/noiBatLuc, xoá) ·
   nwKhamPha (qua NW.KhamPha.popMuc) · nwBaoCao · nwCauHinh/tuCam · nwUsers.khoa. Không cần đổi luật. */
(function () {
  'use strict';
  var $ = NW.$, $$ = NW.$$, IC = NW.IC, an = NW.chuAnToan, CFG = NW.CFG;
  var D = 86400e3, H = 3600e3, t0 = Date.now();

  var IC_QL = {
    suKien: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8 14h3M13 14h3M8 17.5h3"/></svg>',
    tuCam: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
    lop: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 10.8 12 6l9 4.8-9 4.8z"/><path d="M6.5 12.6v4.4c0 1.2 2.5 2.5 5.5 2.5s5.5-1.3 5.5-2.5v-4.4"/><path d="M21 10.8V16"/></svg>'
  };
  var LOAI = NW.KhamPha.TEN_LOAI;
  var MAU_LOAI = { thongBao: '#E0B411', troChoi: '#0E7C6E', giaiDau: '#E0575B', khoaHoc: '#3E7BFA', chuongTrinh: '#F2A93B' };

  NW.dungThanh({ tab: 'quanLy' }).then(async function (ph) {
    if (!NW.toi.laThay) { location.replace(NW.duong('bangtin.html')); return; }   // học sinh không vào được trang này
    var toi = NW.toi, thu = !!ph.banThu;
    var f = thu ? null : await NW.fb();
    var MAU = thu ? duLieuMau() : null;
    var khu = $('#khu'), cot = $('#qlCot');

    // ---------- kho: mỗi hàm một nguồn (bàn thử = dữ liệu mẫu) ----------
    var NHOM = null, BAO_CAO = null;
    function docSnap(snap) { var ds = []; snap.forEach(function (d) { ds.push(Object.assign({ id: d.id }, d.data())); }); return ds; }
    async function layDsLop() { return thu ? MAU.dsLop : await NW.Chat.dsLop(); }
    async function layHs(lop) {
      if (thu) return MAU.hs.filter(function (h) { return !lop || h.lop === lop; });
      if (!lop) { var dsLop = await layDsLop(), tat = []; for (var i = 0; i < dsLop.length; i++) tat = tat.concat(await layHs(dsLop[i].ma)); return tat; }
      return (await NW.nguoiTheoLop(lop, 2 * 60 * 1000)).filter(function (h) { return h.vaiTro !== 'gv'; });
    }
    async function layNhom(epMoi) {
      if (NHOM && !epMoi) return NHOM;
      if (thu) return (NHOM = MAU.nhom);
      var snap = await f.fs.getDocs(f.fs.query(f.fs.collection(f.db, 'nwChats'), f.fs.where('loai', '==', 'nhom'), f.fs.limit(100)));
      NHOM = docSnap(snap).sort(function (a, b) { return (b.capNhat || 0) - (a.capNhat || 0); }); return NHOM;
    }
    async function layBai(loai) {   // 'moi' | 'daAn' | 'noiBat'
      if (thu) return MAU.bai.filter(function (b) { return loai === 'daAn' ? b.an : loai === 'noiBat' ? b.noiBat : true; }).sort(function (a, b) { return loai === 'noiBat' ? (b.noiBatLuc || 0) - (a.noiBatLuc || 0) : b.luc - a.luc; });
      var c = f.fs.collection(f.db, 'nwPosts'), q;
      if (loai === 'daAn') q = f.fs.query(c, f.fs.where('an', '==', true), f.fs.orderBy('luc', 'desc'), f.fs.limit(100));
      else if (loai === 'noiBat') q = f.fs.query(c, f.fs.where('noiBat', '==', true), f.fs.orderBy('noiBatLuc', 'desc'), f.fs.limit(20));
      else q = f.fs.query(c, f.fs.orderBy('luc', 'desc'), f.fs.limit(100));
      return docSnap(await f.fs.getDocs(q));
    }
    async function layMuc() {
      if (thu) return MAU.muc;
      return docSnap(await f.fs.getDocs(f.fs.query(f.fs.collection(f.db, 'nwKhamPha'), f.fs.orderBy('thuTu'), f.fs.limit(300))));
    }
    async function layBaoCao(epMoi) {
      if (BAO_CAO && !epMoi) return BAO_CAO;
      if (thu) return (BAO_CAO = MAU.baoCao);
      BAO_CAO = docSnap(await f.fs.getDocs(f.fs.query(f.fs.collection(f.db, 'nwBaoCao'), f.fs.orderBy('luc', 'desc'), f.fs.limit(60)))); return BAO_CAO;
    }
    // ghi kho: bàn thử thì chỉ báo; thật thì chạy + báo lỗi kho cho dễ hiểu
    async function ghi(viec, chuOk) {
      if (thu) { NW.toast('Bàn thử: chỉ đổi trên máy, không ghi thật.'); return true; }
      try { await viec(); if (chuOk) NW.toast(chuOk); return true; }
      catch (e) { NW.toast(NW.chuLoiKho(e), true); return false; }
    }
    function docBai(id) { return f.fs.doc(f.db, 'nwPosts', id); }

    // ---------- cột trái ----------
    var MUC_QL = [
      { nhom: 'BÀI TẬP' },
      { ma: 'baiTap', chu: 'Trang bài tập', ic: IC.baiTap, icm: 'baiTap' },
      { nhom: 'NETWORK' },
      { ma: 'nhom', chu: 'Nhóm chat', ic: IC.nhom, icm: 'nhom' },
      { ma: 'baiDang', chu: 'Bài đăng', ic: IC.baiDang, icm: 'baiDang' },
      { ma: 'noiBat', chu: 'Nổi bật', ic: IC.sao, icm: 'noiBat' },
      { ma: 'suKien', chu: 'Sự kiện & Khám phá', ic: IC_QL.suKien, icm: 'suKien' },
      { ma: 'baoCao', chu: 'Báo cáo', ic: IC.baoCao, icm: 'baoCao', dem: function () { return (BAO_CAO || []).filter(function (b) { return b.trangThai === 'moi'; }).length; } },
      { ma: 'daAn', chu: 'Bài đã ẩn', ic: IC.an, icm: 'daAn' },
      { ma: 'tuCam', chu: 'Từ cấm', ic: IC_QL.tuCam, icm: 'tuCam' },
      { ma: 'taiKhoan', chu: 'Tài khoản', ic: IC.caNhan, icm: 'taiKhoan' },
      { ma: 'lop', chu: 'Lớp', ic: IC_QL.lop, icm: 'lop' }
    ];
    var VE = {};
    var mucHien = NW.thamSo('muc'); if (!VE_CO(mucHien)) mucHien = 'baiTap';
    function VE_CO(m) { return MUC_QL.some(function (x) { return x.ma === m; }); }
    function veCot() {
      cot.innerHTML = MUC_QL.map(function (m) {
        if (m.nhom) return '<div class="ql-nhom">' + an(m.nhom) + '</div>';
        var d = m.dem ? m.dem() : 0;
        return '<button class="ql-muc' + (m.ma === mucHien ? ' chon' : '') + '" data-muc="' + m.ma + '">' + (m.icm && window.AC_ICQL ? '<span class="ic-m">' + window.AC_ICQL[m.icm]() + '</span>' : m.ic) + '<span>' + an(m.chu) + '</span>' + (d ? '<b class="ql-dem">' + d + '</b>' : '') + '</button>';
      }).join('');
      $$('.ql-muc', cot).forEach(function (b) { b.onclick = function () { mo(b.getAttribute('data-muc')); }; });
    }
    var dangMo = 0;
    async function mo(ma) {
      mucHien = ma; veCot();
      history.replaceState(null, '', location.pathname + (thu ? '?thu=thay&' : '?') + 'muc=' + ma);
      khu.className = 'ql-noi'; khu.innerHTML = '<div class="xoay"></div>';
      var luot = ++dangMo;
      try { await VE[ma](function () { return luot === dangMo; }); }
      catch (e) { if (luot === dangMo) khu.innerHTML = '<div class="trong">' + an(NW.chuLoiKho(e)) + '</div>'; }
      window.scrollTo(0, 0);
    }
    function dau(tieu, phu, nutHtml) { return '<div class="ql-dau"><div><h2>' + an(tieu) + '</h2>' + (phu ? '<div class="phu">' + phu + '</div>' : '') + '</div>' + (nutHtml || '') + '</div>'; }
    var TEN_LOP = {};
    function tagLop(ma) { return ma ? '<span class="ql-tag">' + an(TEN_LOP[ma] || ma) + '</span>' : ''; }
    function nutMenu(id) { return '<button class="ql-3cham" data-menu="' + an(id) + '" aria-label="Menu">' + IC.baCham + '</button>'; }
    function oTim(placeholder, id) { return '<div class="tim-o ql-tim">' + IC.timKiem + '<input type="search" id="' + id + '" placeholder="' + an(placeholder) + '"></div>'; }
    function chips(ds, chon, id) { return '<div class="chip-lop ql-chips" id="' + id + '">' + ds.map(function (c) { return '<button class="chip' + (c.ma === chon ? ' chon' : '') + '" data-ma="' + an(c.ma) + '">' + an(c.ten) + '</button>'; }).join('') + '</div>'; }
    function batChips(id, cb) { $$('#' + id + ' .chip').forEach(function (c) { c.onclick = function () { $$('#' + id + ' .chip').forEach(function (x) { x.classList.toggle('chon', x === c); }); cb(c.getAttribute('data-ma')); }; }); }
    function chipLop(dsLop, chon, id, tenTatCa) { return chips([{ ma: '', ten: tenTatCa || 'Tất cả' }].concat(dsLop.map(function (l) { return { ma: l.ma, ten: l.ten || l.ma }; })), chon, id); }

    // ---------- 1. BÀI TẬP: nhúng dashboard myLesson ----------
    VE.baiTap = async function () {
      khu.className = 'ql-noi tran';
      khu.innerHTML = (thu ? '<div class="ql-goi">' + IC.thongTin + '<span>Bàn thử: khung dưới nhúng <b>' + an(CFG.LINK_DASHBOARD) + '</b> — khác nhà với máy thử nên phải gõ mã quản lý riêng. Lên mạng thật (cùng tên miền) sẽ dùng chung phiên đăng nhập của thầy.</span></div>' : '') +
        '<iframe class="ql-khung" src="' + an(CFG.LINK_DASHBOARD) + '" title="Trang bài tập" allow="clipboard-write"></iframe>';
    };

    // ---------- 2. NHÓM CHAT ----------
    VE.nhom = async function (conHien) {
      var dsLop = await layDsLop(); dsLop.forEach(function (l) { TEN_LOP[l.ma] = l.ten || l.ma; });
      await layNhom(true); if (!conHien()) return;
      var lopCoNhom = {}; NHOM.forEach(function (n) { if (n.lop) lopCoNhom[n.lop] = true; });
      var thieu = dsLop.filter(function (l) { return !lopCoNhom[l.ma]; });
      khu.innerHTML = dau('Nhóm chat', NHOM.length + ' nhóm · học sinh không tự tạo nhóm, chỉ thầy tạo', '<button class="btn primary" id="nhTao">' + IC.them + ' Tạo nhóm</button>') +
        (thieu.length ? '<div class="ql-goi">' + IC.thongTin + '<span>Lớp chưa có nhóm chat: ' + thieu.map(function (l) { return '<b>' + an(l.ten || l.ma) + '</b>'; }).join(', ') + '.</span>' +
          thieu.map(function (l) { return '<button class="btn soft nho" data-tao-lop="' + an(l.ma) + '">Tạo nhóm ' + an(l.ten || l.ma) + '</button>'; }).join('') + '</div>' : '') +
        '<div class="ql-luoi" id="nhDs"></div>';
      function tvCua(n) { return (n.thanhVien || []).filter(function (u) { return u !== toi.uid; }).map(function (u) { return Object.assign({ uid: u }, (n.tv || {})[u] || { ten: '?' }); }); }
      function ve() {
        $('#nhDs').innerHTML = NHOM.length ? NHOM.map(function (n) {
          var tv = tvCua(n), tc = n.tinCuoi || {};
          return '<div class="card ql-nhom-the" data-id="' + an(n.id) + '">' +
            '<div class="av lon">' + (n.anh ? '<img src="' + an(n.anh) + '" alt="">' : IC.nhom) + '</div>' +
            '<div class="than"><div class="ten">' + an(n.ten || 'Nhóm') + (n.lop ? ' ' + tagLop(n.lop) : ' <span class="ql-tag xam">tự chọn</span>') + '</div>' +
            '<div class="phu">' + (tv.length + 1) + ' thành viên (kể cả thầy)' + (tc.luc ? ' · ' + NW.chuGio(tc.luc) : ' · chưa có tin') + '</div>' +
            '<div class="tin">' + (tc.luc ? '<b>' + an(tc.uid === toi.uid ? 'Thầy' : (tc.ten || '')) + ':</b> ' + an(tc.chu || (tc.hinh ? '📷 Ảnh' : '')) : '<i>Chưa có tin nhắn nào</i>') + '</div>' +
            '<div class="mat">' + tv.slice(0, 6).map(function (h) { return NW.avHtml(h, 'nho'); }).join('') + (tv.length > 6 ? '<span class="them">+' + (tv.length - 6) + '</span>' : '') + '</div></div>' +
            nutMenu(n.id) + '</div>';
        }).join('') : '<div class="trong">' + IC.nhom + 'Chưa có nhóm nào. Bấm "Tạo nhóm" hoặc tạo nhanh cho từng lớp ở trên.</div>';
        $$('[data-menu]', khu).forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation(); var n = NHOM.filter(function (x) { return x.id === b.getAttribute('data-menu'); })[0];
            NW.menuNho(b, [
              { ic: IC.tinNhan, chu: 'Mở đoạn chat', onclick: function () { location.href = 'tinnhan.html?phong=' + encodeURIComponent(n.id) + (thu ? '&thu=thay' : ''); } },
              { ic: IC.nhom, chu: 'Thành viên (' + ((n.thanhVien || []).length) + ')', onclick: function () { thanhVien(n); } },
              { ic: IC.sua, chu: 'Đổi tên / ảnh nhóm', onclick: function () { doiTen(n); } },
              { ic: IC.xoa, chu: 'Xoá nhóm', nguy: true, onclick: async function () {
                if (!(await NW.hoi('Xoá nhóm?', 'Xoá "' + (n.ten || 'Nhóm') + '" — học sinh không thấy nhóm nữa, không lấy lại được.', { ok: 'Xoá', nguy: true }))) return;
                if (await ghi(function () { return f.fs.deleteDoc(f.fs.doc(f.db, 'nwChats', n.id)); }, 'Đã xoá nhóm.')) { NHOM = NHOM.filter(function (x) { return x !== n; }); VE.nhom(conHien); }
              } }
            ]);
          };
        });
      }
      function thanhVien(n) {
        var tv = tvCua(n);
        var p = NW.popMo({ tieuDe: 'Thành viên · ' + (n.ten || 'Nhóm'), html: '<div class="chon-nguoi">' +
          '<label>' + NW.avHtml(toi, 'nho') + '<span class="ten">' + an(toi.ten) + '</span><span class="lop">THẦY</span></label>' +
          tv.map(function (h) { return '<label>' + NW.avHtml(h, 'nho') + '<span class="ten">' + an(h.ten) + '</span><span class="lop">' + an(h.lop || '') + '</span><button class="btn soft nho" data-bo="' + an(h.uid) + '">Bớt</button></label>'; }).join('') + '</div>',
          chan: '<button class="btn soft" data-dong>Đóng</button><button class="btn primary" id="tvThem">' + IC.them + ' Thêm em</button>' });
        $$('[data-bo]', p).forEach(function (b) {
          b.onclick = async function () {
            var uid = b.getAttribute('data-bo');
            var ok = await ghi(function () { var patch = { thanhVien: f.fs.arrayRemove(uid), capNhat: Date.now() }; patch['tv.' + uid] = f.fs.deleteField(); return f.fs.updateDoc(f.fs.doc(f.db, 'nwChats', n.id), patch); }, 'Đã bớt khỏi nhóm.');
            if (!ok) return; n.thanhVien = (n.thanhVien || []).filter(function (u) { return u !== uid; }); if (n.tv) delete n.tv[uid];
            NW.popDong(); ve(); thanhVien(n);
          };
        });
        $('#tvThem', p).onclick = async function () {
          NW.popDong();
          var tatCa = await layHs('');
          chonHs('Thêm vào ' + (n.ten || 'nhóm'), tatCa.filter(function (h) { return (n.thanhVien || []).indexOf(h.uid) < 0; }), dsLop, async function (ds) {
            if (!ds.length) return;
            if ((n.thanhVien || []).length + ds.length > CFG.TOI_DA_THANH_VIEN_NHOM) { NW.toast('Nhóm tối đa ' + CFG.TOI_DA_THANH_VIEN_NHOM + ' người.', true); return; }
            var ok = await ghi(function () {
              var patch = { thanhVien: f.fs.arrayUnion.apply(null, ds.map(function (h) { return h.uid; })), capNhat: Date.now() };
              ds.forEach(function (h) { patch['tv.' + h.uid] = NW.tomTat(h); });
              return f.fs.updateDoc(f.fs.doc(f.db, 'nwChats', n.id), patch);
            }, 'Đã thêm ' + ds.length + ' em.');
            if (!ok) return;
            n.thanhVien = (n.thanhVien || []).concat(ds.map(function (h) { return h.uid; })); n.tv = n.tv || {}; ds.forEach(function (h) { n.tv[h.uid] = NW.tomTat(h); });
            if (!thu) ds.forEach(function (h) { NW.guiThongBao(h.uid, { loai: 'nhom', chu: n.ten || 'Nhóm', link: 'tinnhan.html?phong=' + n.id }); });
            ve();
          });
        };
      }
      function doiTen(n) {
        var anhMoi = null;
        var p = NW.popMo({ tieuDe: 'Đổi tên / ảnh nhóm', html: '<label class="lbl">Tên nhóm</label><input type="text" id="dtTen" maxlength="60" value="' + an(n.ten || '') + '">' +
          '<label class="lbl" style="margin-top:12px">Ảnh nhóm</label><div class="tb-them" style="margin-top:0"><span id="dtAnhTen">' + (n.anh ? 'Đang có ảnh — chọn để thay' : 'Chưa có ảnh') + '</span><button type="button" class="xanh" id="dtAnhNut">' + IC.anh + '</button><input type="file" id="dtAnhFile" accept="image/*" hidden></div>',
          chan: '<button class="btn soft" data-dong>Thôi</button><button class="btn primary" id="dtOk">Lưu</button>' });
        $('#dtAnhNut', p).onclick = function () { $('#dtAnhFile', p).click(); };
        $('#dtAnhFile', p).onchange = async function () {
          var f0 = this.files && this.files[0]; this.value = ''; if (!f0) return;
          try { var blob = await NW.nenAnh(f0, { canhDai: 512 }); anhMoi = { blob: blob, url: URL.createObjectURL(blob) }; $('#dtAnhTen', p).textContent = 'Đã chọn ảnh mới: ' + f0.name; }
          catch (e) { NW.toast('Không đọc được ảnh.', true); }
        };
        $('#dtOk', p).onclick = async function () {
          var ten = $('#dtTen', p).value.trim(); if (!ten) { NW.toast('Đặt tên nhóm đã.', true); return; }
          this.disabled = true;
          var ok = await ghi(async function () {
            var patch = { ten: ten, capNhat: Date.now() };
            if (anhMoi) patch.anh = await NW.taiAnh(anhMoi.blob, NW.tenAnhMoi('_nhom'));
            await f.fs.updateDoc(f.fs.doc(f.db, 'nwChats', n.id), patch); n.anh = patch.anh || n.anh;
          }, 'Đã lưu.');
          if (!ok) { this.disabled = false; return; }
          n.ten = ten; if (thu && anhMoi) n.anh = anhMoi.url; NW.popDong(); ve();
        };
      }
      function chonHs(tieuDe, ds, dsLop, xong) {
        var p = NW.popMo({ tieuDe: tieuDe, html: chipLop(dsLop, '', 'chLop') + '<div class="tim-o ql-tim" style="margin-top:10px">' + IC.timKiem + '<input type="search" id="chTim" placeholder="Tìm theo tên…"></div><div class="chon-nguoi" id="chDs"></div>',
          chan: '<span class="tiny" id="chDem" style="margin-right:auto"></span><button class="btn soft" data-dong>Thôi</button><button class="btn primary" id="chOk">Xong</button>' });
        var daChon = {}, lop = '';
        function dem() { $('#chDem', p).textContent = 'Đã chọn ' + Object.keys(daChon).filter(function (k) { return daChon[k]; }).length + ' em'; }
        function veDs() {
          var q = NW.khongDau($('#chTim', p).value);
          var loc = ds.filter(function (h) { return (!lop || (h.cacLop || [h.lop]).indexOf(lop) >= 0) && (!q || NW.khongDau(h.ten).indexOf(q) >= 0); });
