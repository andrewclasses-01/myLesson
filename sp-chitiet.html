     nó tải xong mới được chạy — đo live 03/09 (v1.54.1): fonts.css hết hạn cache làm dữ
     liệu chỉ bắt đầu ở 640ms thay vì ~320ms. -->

<!-- ⚡ SINH TỰ ĐỘNG từ js/som.js bằng `python tools/sinh-som.py --write` — ĐỪNG SỬA TAY.
     Khởi động sớm: xin lop.json · bai.json · lessonHan · lessonNghi ngay tại đây,
     chung.js nhận lại qua window.__napSom (xem js/som.js + BAN GIAO mục 0⚡). -->
<script>
(function () {
  try {
    var C = { AWORD_DB: { projectId: 'aword-70dae', apiKey: 'AIzaSyAV_yoyAQM2fKKdOsJyuAxxf4AN7MsF7XY' } }; /* dập từ config.js */
    var db = C.AWORD_DB || {};
    var t = Date.now();
    function lay(u) {
      try { return fetch(u, { cache: 'no-store' }); } catch (e) { return null; }
    }
    function conDem(khoa, giay) {
      try {
        var o = JSON.parse(sessionStorage.getItem(khoa) || 'null');
        return !!(o && (Date.now() - o.luc) < giay * 1000);
      } catch (e) { return false; }
    }
    var goc = (db.projectId && db.apiKey)
      ? 'https://firestore.googleapis.com/v1/projects/' + db.projectId + '/databases/(default)/documents/'
      : '';
    var khoa = goc ? '&key=' + encodeURIComponent(db.apiKey) : '';
    window.__napSom = {
      'data/lop.json': lay('data/lop.json?t=' + t),
      'data/bai.json': lay('data/bai.json?t=' + t),
      lessonHan:  (goc && !conDem('awc_hansua2', 60)) ? lay(goc + 'lessonHan?pageSize=300' + khoa) : null,
      lessonNghi: (goc && !conDem('awc_nghi2', 60))   ? lay(goc + 'lessonNghi?pageSize=100' + khoa) : null
    };
  } catch (e) { /* im lặng — chung.js tự lo */ }
})();
</script>
<!-- SOM:END -->

     máy chủ mà trang chắc chắn sẽ gọi (Firestore, SDK gstatic). (2) khối SOM bên dưới
     (dập thẳng từ js/som.js, KHÔNG tốn lượt tải nào) xin bốn lượt dữ liệu (lop.json ·
     bai.json · lessonHan · lessonNghi) ngay khi trình duyệt đọc tới đây, thay vì chờ
     chung.js ở cuối <body>; chung.js nhận lại qua window.__napSom. ⛔ Đừng đưa lại thành
     thẻ script src ở head: cache quá 10 phút là nó chặn vẽ trang ~300ms (đo 03/09). -->
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<!-- ============================================================
     sp-chitiet.html — TRANG CHI TIẾT MỘT BUỔI SPEAKING CHECK (28/08/2026 tối)

     Mở từ dashboard.html (bấm phần thân thẻ SP CHECK) bằng URL
     ?lop=<maLop>&bai=<idBai>. Trang CHỈ ĐỌC — không ghi gì lên
     Firestore (tongLoi/phanHoi vẫn do app mySpeaking quản lý).

     Mọi hàm đọc Firestore REST (spFsGoc/spFsGiai/spFsGiaiDoc/spBuoiFs/
     spKhopBai/soLoiSong/mauCoDinhDoi/tinhDoiSp) PORT NGUYÊN VĂN từ
     dashboard.html — xem chú thích ở khối "⭐ #2" bên đó. `spTongLoiFs`/
     `spPhanHoiFs` là hai hàm MỚI, cùng khuôn `spDoiSpFs` nhưng đọc ĐỦ
     trường (không giới hạn `select`) vì trang này cần `checkedTeam`,
     `sentence`, `detail`, `explain`, `ketLuan`... mà bản tóm tắt của thẻ
     không cần tới.
     ============================================================ -->
<style>
:root{
  --nen:#F1F5F4; --the:#FFFFFF; --vien:#E1EAE8; --vien-dam:#CFDCD9;
  --chu:#16232A; --mo:#5F7370; --nhat:#8AA09C;
  --xanh:#0E7C6E; --xanh-nhat:#E7F2F0;
  --vang:#F2A93B; --vang-nhat:#FDF3E3;
  --do:#E36B5C; --do-nhat:#FCECEA;
  --la:#2E9E6B; --la-nhat:#E8F5EE;
  --duong:#5B8DEF; --duong-nhat:#EBF1FE;
  --bong:0 1px 2px rgba(16,40,36,.05), 0 6px 18px rgba(16,40,36,.06);
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;
  --m-do:#E0575B; --m-cam:#F0821E; --m-vang:#E0B411; --m-duong:#3E7BFA; --m-la:#18A957;
  --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
  --em:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--nen); color:var(--chu); font:600 14px/1.55 var(--font); -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding:0 18px}
button{font:inherit; cursor:pointer}
a{color:inherit; text-decoration:none}

.top{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--vien)}
.top-in{display:flex; align-items:center; gap:14px; padding:12px 18px; flex-wrap:wrap}
.ve{display:flex; align-items:center; gap:6px; font:700 12.5px/1 var(--font); color:var(--mo);
  padding:8px 10px; border-radius:10px; transition:background .15s}
.ve:hover{background:var(--xanh-nhat); color:var(--xanh)}
.ve svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.2}
.tieu-de{font:800 15px/1.3 var(--font); letter-spacing:.01em}
.tieu-de .phu{display:block; font:600 11.5px/1.4 var(--font); color:var(--nhat); margin-top:1px}
.top .day{flex:1}

.nut{display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  padding:8px 14px; border-radius:11px; border:1px solid var(--vien-dam);
  background:#fff; color:var(--chu); font:700 12.5px/1 var(--font);
  transition:background .15s ease, border-color .15s ease, transform .1s ease}
.nut:hover{background:var(--xanh-nhat); border-color:var(--xanh)}
.nut:active{transform:scale(.97)}
.nut svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.nut.chinh{background:var(--xanh); border-color:var(--xanh); color:#fff}
.nut.chinh:hover{filter:brightness(1.08)}
.nut.nho{padding:5px 10px; font-size:11.5px; border-radius:9px}
.nut[disabled]{opacity:.5; pointer-events:none}
select,input[type=search]{font:600 12.5px/1 var(--font); padding:8px 11px; border-radius:10px;
  border:1px solid var(--vien-dam); background:#fff; color:var(--chu)}

.khoi{background:var(--the); border:1px solid var(--vien); border-radius:var(--r);
  box-shadow:var(--bong); margin:18px 0; overflow:hidden}
.khoi-dau{display:flex; align-items:center; gap:12px; padding:14px 18px;
  border-bottom:1px solid var(--vien); flex-wrap:wrap}
.khoi-dau h2{margin:0; font:800 13px/1.3 var(--font); letter-spacing:.09em; text-transform:uppercase}
.khoi-dau .phu{font:600 12px/1.3 var(--font); color:var(--nhat)}
.khoi-dau .day{flex:1}
.khoi-than{padding:14px 18px}
.trong{padding:26px 18px; text-align:center; color:var(--nhat); font-size:13px}

/* Thanh team — y hệt thẻ (.doi-dong/.doi-bar) nhưng to hơn cho dễ đọc */
.doi-dong{display:grid; grid-template-columns:110px minmax(60px,1fr) 60px; align-items:center;
  gap:12px; padding:7px 0}
.doi-dong + .doi-dong{border-top:1px dashed var(--vien)}
.doi-ten{font-size:12.5px; font-weight:800; color:var(--chu)}
/* ⛔ (02/09/2026) BỎ `overflow:hidden` khỏi `.doi-bar`: avatar học sinh cao hơn thanh nên
   overflow sẽ chém cụt còn một vệt. Bỏ được vì vệt màu `i` vốn TỰ bo tròn hai đầu
   (`border-radius:99px`), không cần khung cha cắt hộ. Đổi sang `position:relative` để
   avatar định vị theo chiều dài thanh. */
.doi-bar{position:relative; height:11px; border-radius:99px; background:#E7EDEB}
.doi-bar i{position:absolute; inset:0 auto 0 0; display:block; height:100%; border-radius:99px; transition:width .5s var(--em)}
/* ⭐ AVATAR TỪNG EM TRÊN THANH ĐỘI (thầy chốt 02/09).
   Đường kính KHÔNG đặt số cứng: `--av` do `coAvatarThanh()` đo chiều cao THẬT của hàng rồi
   đặt vào — xem chú thích của hàm đó. `14px` chỉ là số đỡ khi JS chưa kịp chạy. */
.av-thanh{position:absolute; top:50%; width:var(--av,14px); height:var(--av,14px);
  border-radius:999px; transform:translate(-50%,-50%); overflow:hidden; background:#CFDCD9;
  display:grid; place-items:center; font:800 calc(var(--av,14px)*.4)/1 var(--font); color:#fff;
  box-shadow:0 0 0 1.5px #fff, 0 1px 2px rgba(22,35,42,.35)}
/* ⛔ Ảnh PHẢI `position:absolute; inset:0` — đúng nếp `.msg .av img` của khung chat.
   Để `width/height:100%` trần thì <img> thành MỘT Ô GRID RIÊNG nằm trên chữ tắt, chỉ cao
   bằng nửa khung ⇒ `object-fit:cover` cắt mất mặt em, nhìn như ảnh bị phóng to (thầy chụp
   ảnh báo 02/09). Ảnh gốc VUÔNG 96×96 nên phủ đúng cả khung là không cắt tí nào. */
.av-thanh img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%}
.doi-so{font-size:13.5px; font-weight:800; text-align:right}
.doi-so.m-la{color:var(--m-la)} .doi-so.m-duong{color:var(--m-duong)}
.doi-so.m-cam{color:var(--m-cam)} .doi-so.m-do{color:var(--m-do)}
.doi-bar i.m-la{background:var(--m-la)} .doi-bar i.m-duong{background:var(--m-duong)}
.doi-bar i.m-cam{background:var(--m-cam)} .doi-bar i.m-do{background:var(--m-do)}

/* Khối CẦN THẦY QUYẾT */
.cq-o{border:1px solid var(--do-nhat); background:var(--do-nhat); border-radius:12px;
  padding:11px 14px; margin-bottom:10px}
.cq-o:last-child{margin-bottom:0}
.cq-dau{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; font-weight:800; color:var(--do)}
.cq-cau{margin-top:6px; font-size:13px; font-weight:700; font-style:italic}
.cq-chi{margin-top:2px; font-size:12.5px; color:var(--mo)}
.cq-pd{margin-top:6px; padding-top:6px; border-top:1px dashed #F0C9C3; font-size:12px}
.cq-pd b{color:var(--do)}

/* ══════════ HÀNG NÚT ĐỘI (02/09/2026 — mượn khuôn `.lop-btn` của dashboard) ══════════
   Bấm một nút = lọc CẢ khối "Cần thầy quyết" LẪN khối hai nửa bên dưới theo đội đó. */
.doi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(252px,1fr)); gap:12px}
.doi-btn{display:block; width:100%; text-align:left; background:var(--the);
  border:1px solid var(--vien); border-radius:var(--r); box-shadow:var(--bong); padding:12px 14px;
  transition:border-color .15s ease, background .15s ease, transform .1s ease}
.doi-btn:hover{border-color:var(--xanh)}
.doi-btn:active{transform:scale(.99)}
.doi-btn.chon{background:var(--xanh); border-color:var(--xanh)}
.db-ten{font:800 15px/1.3 var(--font)}
.doi-btn.chon .db-ten{color:#fff}
.db-tv{margin-top:2px; font:700 11px/1.45 var(--font); color:var(--nhat)}
.doi-btn.chon .db-tv{color:rgba(255,255,255,.82)}
/* Hàng HAI SỐ LỚN — thầy chốt 02/09: hàng RIÊNG, chia đôi bằng vạch dọc, chữ to + đậm.
   Trái = ĐÃ BẮT (xanh dương) · Phải = ĐƯỢC BẮT (cam). Nút đang chọn có nền xanh đậm nên
   hai màu này phải đổi sang bản SÁNG, không thì chữ chìm hẳn vào nền. */
.sl-hang{display:grid; grid-template-columns:1fr 1px 1fr; gap:10px; margin:9px 0 8px;
  padding:8px 0; border-top:1px solid var(--vien); border-bottom:1px solid var(--vien)}
.doi-btn.chon .sl-hang{border-color:rgba(255,255,255,.3)}
.sl-vach{background:var(--vien)}
.doi-btn.chon .sl-vach{background:rgba(255,255,255,.3)}
.sl-o{text-align:center; min-width:0}
.sl-nh{font:800 8.5px/1.3 var(--font); letter-spacing:.07em; text-transform:uppercase}
.sl-so{font:800 23px/1.15 var(--font); font-variant-numeric:tabular-nums; margin-top:1px}
.sl-o.bat .sl-nh, .sl-o.bat .sl-so{color:var(--m-duong)}
.sl-o.bi  .sl-nh, .sl-o.bi  .sl-so{color:var(--m-cam)}
.doi-btn.chon .sl-o.bat .sl-nh, .doi-btn.chon .sl-o.bat .sl-so{color:#B8D4FF}
.doi-btn.chon .sl-o.bi  .sl-nh, .doi-btn.chon .sl-o.bi  .sl-so{color:#FFD6A8}
/* Hai việc còn tồn — (thầy chốt 02/09, đợt 2) NẰM CÙNG MỘT HÀNG, cân đối hai bên, VÀO Ô KẺ
   y như hàng số lớn ở trên. Số 0 xanh lá (xong việc), khác 0 đỏ (còn việc). */
.sl-hang.viec{margin-top:0; border-top:0}
.sl-hang.viec .sl-nh{color:var(--nhat)}
.doi-btn.chon .sl-hang.viec .sl-nh{color:rgba(255,255,255,.8)}
.sl-hang.viec .sl-so{font-size:17px}
.sl-hang.viec .sl-so.n0{color:var(--m-la)} .sl-hang.viec .sl-so.nx{color:var(--m-do)}
.doi-btn.chon .sl-hang.viec .sl-so.n0{color:#A6F0CB}
.doi-btn.chon .sl-hang.viec .sl-so.nx{color:#FFC4C4}

/* ══════════ KHỐI HAI NỬA (câu được bắt | câu đã bắt) ══════════
   Mỗi nửa CUỘN RIÊNG trong khung, không để cả trang dài ra như bản bảng phẳng cũ. */
/* (thầy chốt 02/09 đợt 2) Cao gần GẤP ĐÔI bản đầu (`min(64vh,680px)`). Trần vh giữ dưới 100
   để khối vẫn gọn trong một màn hình; ai muốn to hơn nữa thì bấm nút phóng to toàn màn. */
.hai-nua{display:grid; grid-template-columns:1fr 1px 1fr; height:min(104vh,1360px)}
.nua{min-width:0; display:flex; flex-direction:column; min-height:0}
.nua-vach{background:var(--vien)}
.nua-dau{flex:none; display:flex; align-items:center; gap:7px; padding:10px 14px;
  border-bottom:1px solid var(--vien)}
.nua-dau h3{margin:0; font:800 10.5px/1.3 var(--font); letter-spacing:.07em; text-transform:uppercase}
/* Tổng số nằm NGAY CẠNH tên (thầy chốt: "LỖI ĐƯỢC BẮT • 77 CÂU"), không đẩy sang mép phải nữa
   — mép phải nay để dành cho nút phóng to. */
.nua-dau .so{font:800 10.5px/1.3 var(--font); letter-spacing:.05em}
.nua-dau .day{flex:1}
.nua.bi .nua-dau h3, .nua.bi .nua-dau .so{color:var(--m-cam)}
.nua.bat .nua-dau h3, .nua.bat .nua-dau .so{color:var(--m-duong)}
.nua-than{flex:1; min-height:0; overflow-y:auto; padding:10px 14px}

/* ══════════ NÚT PHÓNG TO TOÀN MÀN (thầy chốt 02/09 đợt 2) ══════════
   Ba chỗ: khối "Cần thầy quyết" + hai nửa. Bấm là khối đó chiếm trọn màn hình để thầy tập
   trung soi; bấm lại (hoặc phím Esc) thì thu về. Icon đổi mũi tên ra ↔ mũi tên vào. */
.zoom-nut{flex:none; width:30px; height:30px; border-radius:9px; border:1px solid var(--vien-dam);
  background:#fff; color:var(--mo); display:grid; place-items:center; transition:background .15s, color .15s}
.zoom-nut:hover{background:var(--xanh-nhat); color:var(--xanh); border-color:var(--xanh)}
.zoom-nut svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round}
/* Khối đang phóng to — dùng chung cho .khoi (Cần thầy quyết) lẫn .nua (một nửa) */
.phong{position:fixed !important; inset:0; z-index:80; margin:0 !important; border-radius:0 !important;
  background:var(--the); box-shadow:none; display:flex !important; flex-direction:column}
.phong .khoi-dau, .phong .nua-dau{flex:none}
.phong .khoi-than, .phong .nua-than{flex:1; min-height:0; max-height:none; overflow-y:auto}
body.khoa-cuon{overflow:hidden}
/* Hai nút tab — chỉ hiện ở màn hẹp (xem @media cuối file) */
.nua-tab{display:none; gap:8px; padding:12px 14px 0}
.nua-tab button{flex:1; padding:9px 10px; border-radius:11px; border:2px solid var(--vien-dam);
  background:#fff; font:800 11px/1.2 var(--font); letter-spacing:.05em; color:var(--nhat)}
.nua-tab button.chon.bi{border-color:var(--m-cam); background:var(--m-cam); color:#fff}
.nua-tab button.chon.bat{border-color:var(--m-duong); background:var(--m-duong); color:#fff}

/* Một câu trong hai nửa — viền nói lên trạng thái, ĐỒNG BỘ với màn học sinh:
   vàng dày = còn tranh chấp thật · xanh lá dày = đã ngã ngũ · xám mảnh = chưa ai đụng. */
/* Khung cuộn của khối "Cần thầy quyết" — để ở CLASS chứ không nhét style thẳng vào thẻ:
   lúc phóng to toàn màn, luật `.phong .khoi-than` phải đè được max-height này (style inline
   thì phải bịa thêm `!important`, dễ quên). Cao gần gấp đôi bản đầu (`min(46vh,420px)`). */
.cq-cuon{max-height:min(84vh,840px); overflow-y:auto}

.cau-o{border:1px solid var(--vien); border-radius:12px; padding:10px 12px; margin-bottom:9px}
.cau-o:last-child{margin-bottom:0}
.cau-o.tc{border:3px solid var(--m-vang); background:#FFFCF3}
.cau-o.ok{border:3px solid var(--m-la)}
.cau-o.go{opacity:.6}
.cau-o.go .cau-goc, .cau-o.go .cau-loi, .cau-o.go .cau-giai{text-decoration:line-through}
.cau-dau{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:5px}
.gio{font:800 11px/1 var(--mono); background:#16232A; color:#fff; border-radius:7px; padding:3px 6px}
.ai{font:700 11px/1.4 var(--font); color:var(--mo)}
.cau-goc{font-size:12.5px; font-weight:700; font-style:italic}
.cau-loi{font-size:12.5px; font-weight:700; color:var(--do); margin-top:2px}
.cau-giai{font-size:12.5px; font-weight:700; color:var(--m-la); margin-top:2px}
.cau-tt{margin-top:7px; padding-top:6px; border-top:1px dashed var(--vien);
  display:flex; flex-direction:column; gap:3px; font-size:11.5px; line-height:1.5}
.tt-nh{font-weight:800; color:var(--nhat); letter-spacing:.02em}
.tt-do{color:var(--do); font-weight:700}
.tt-la{color:var(--m-la); font-weight:700}
.tt-cam{color:#B5720C; font-weight:700}

.nhan{display:inline-block; padding:2px 8px; border-radius:99px; font:800 10px/1.6 var(--font)}
.nhan.g{background:var(--duong-nhat); color:var(--m-duong)}
.nhan.p{background:var(--la-nhat); color:var(--m-la)}
.nhan.i{background:var(--vang-nhat); color:#B5720C}
.nhan.song{background:var(--duong-nhat); color:var(--m-duong)}
.nhan.go{background:var(--la-nhat); color:var(--m-la)}
.nhan.dongy{background:var(--la-nhat); color:var(--m-la)}
.nhan.phandoi{background:var(--do-nhat); color:var(--do)}
.nhan.keep{background:var(--do-nhat); color:var(--do)}
.nhan.agree{background:var(--la-nhat); color:var(--m-la)}

.nhan.batdong{background:var(--vang-nhat); color:#B5720C; margin-left:4px}

/* (Đợt 28/08/2026 khuya) Bảng Phản biện gộp 1 dòng/câu: avatar chữ cái cho ai ĐỒNG Ý, ô riêng
   cho mỗi người PHẢN ĐỐI kèm lý do — thay bảng dài 1 dòng/phiếu cũ. */

.avt.m-la{background:var(--m-la)} .avt.m-duong{background:var(--m-duong)}
.avt.m-cam{background:var(--m-cam)} .avt.m-do{background:var(--m-do)}
.o-trong{color:var(--nhat)}

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px);
  background:#16232A; color:#fff; padding:11px 18px; border-radius:12px;

  transition:opacity .22s ease, transform .22s ease; z-index:60}

/* ══════════ MÀN HẸP: hai nửa thành HAI TAB bấm qua lại (thầy chốt 02/09) ══════════
   Mặc định mở tab "ĐƯỢC BẮT". Vạch dọc giữa hai nửa biến mất, mỗi nửa chiếm cả bề ngang. */

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(function(){
  'use strict';
  var A = window.AWC;
  function $(s){ return document.querySelector(s); }
  var qs = new URLSearchParams(location.search);
  var MA_LOP = (qs.get('lop') || '').trim();
  var ID_BAI = (qs.get('bai') || '').trim();

  var hen = null;
  function baoToast(chu){
    var t = $('#toast');
    t.textContent = chu;
    t.classList.add('hien');
    clearTimeout(hen);
    hen = setTimeout(function(){ t.classList.remove('hien'); }, 2400);
  }

  // ---------- Firestore REST — port nguyên văn từ dashboard.html (⭐ #2) ----------
  function spFsGoc(){
    var db = (A.CFG && A.CFG.AWORD_DB) || null;
    if (!db || !db.projectId) return '';
    return 'https://firestore.googleapis.com/v1/projects/' + db.projectId + '/databases/(default)/documents';
  }
  function spFsGiai(f){
    if (!f || typeof f !== 'object') return null;
    if ('stringValue' in f) return f.stringValue;
    if ('integerValue' in f) return parseInt(f.integerValue, 10);
    if ('doubleValue' in f) return f.doubleValue;
    if ('booleanValue' in f) return f.booleanValue;
    if ('arrayValue' in f) return ((f.arrayValue && f.arrayValue.values) || []).map(spFsGiai);
    if ('mapValue' in f) {
      var o = {}, fs = (f.mapValue && f.mapValue.fields) || {};
      for (var k in fs) o[k] = spFsGiai(fs[k]);
      return o;
    }
    return null;
  }
  function spFsGiaiDoc(doc){
    var o = {}, fs = (doc && doc.fields) || {};
    for (var k in fs) o[k] = spFsGiai(fs[k]);
    if (doc && doc.name) o._id = String(doc.name).split('/').pop();
    return o;
  }
  function spBuoiFs(maLop){
    var goc = spFsGoc();
    var db = (A.CFG && A.CFG.AWORD_DB) || {};
    if (!goc) return Promise.resolve(null);
    var body = { structuredQuery: {
      from: [{ collectionId: 'spBuoi' }],
      where: { compositeFilter: { op: 'AND', filters: [
        { fieldFilter: { field: { fieldPath: 'classCode' }, op: 'EQUAL',
          value: { stringValue: String(maLop || '').replace(/\s+/g, '').toUpperCase() } } },
        { fieldFilter: { field: { fieldPath: 'active' }, op: 'EQUAL', value: { booleanValue: true } } }
      ] } },
      limit: 5
    } };
    return fetch(goc + ':runQuery?key=' + db.apiKey, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function(r){ if (!r.ok) throw new Error('FS_' + r.status); return r.json(); })
      .then(function(ds){
        var doc = (Array.isArray(ds) ? ds : []).filter(function(x){ return x.document; })[0];
        if (!doc) return null;
        var b = spFsGiaiDoc(doc.document);
        return { _id: b._id, classCode: b.classCode || '', name: b.className || '',
          lesson: b.lesson || '', teams: b.teams || [], moHinh: b.moHinh === 2 ? 2 : 1 };
      });
  }
  function spKhopBai(maThe, tenBuoi){
    var a = A.khoaTen(maThe), b = A.khoaTen(tenBuoi);
    if (!a || !b) return false;
    return a === b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
  }
  // Đọc ĐỦ trường (không select) — khác spDoiSpFs bên dashboard vốn chỉ lấy 3 trường.
  function docNganCon(buoiId, tenNgan, gioiHan){
    var goc = spFsGoc();
    var db = (A.CFG && A.CFG.AWORD_DB) || {};
    var body = { structuredQuery: { from: [{ collectionId: tenNgan }], limit: gioiHan || 300 } };
    return fetch(goc + '/spBuoi/' + encodeURIComponent(buoiId) + ':runQuery?key=' + db.apiKey, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function(r){ if (!r.ok) throw new Error('FS_' + r.status); return r.json(); })
      .then(function(ds){
        return (Array.isArray(ds) ? ds : []).filter(function(x){ return x.document; })
          .map(function(x){ return spFsGiaiDoc(x.document); });
      });
  }
  function spTongLoiFs(buoiId){ return docNganCon(buoiId, 'tongLoi', 300); }
  function spPhanHoiFs(buoiId){ return docNganCon(buoiId, 'phanHoi', 3000); }

  function soLoiSong(errors){
    return (errors || []).filter(function(er){ return !er.trangThai || er.trangThai === 'song'; }).length;
  }
  var DOI_MAU_CO_DINH = [{ min:30, m:'m-la' }, { min:25, m:'m-duong' }, { min:20, m:'m-cam' }];
  function mauCoDinhDoi(tb){
    for (var i = 0; i < DOI_MAU_CO_DINH.length; i++) if (tb >= DOI_MAU_CO_DINH[i].min) return DOI_MAU_CO_DINH[i].m;
    return null;
  }
  // ⭐ 28/08 tối — thanh 200 điểm cố định + xếp đội nhiều điểm nhất lên trên
  // (đồng bộ với lop.html/dashboard.html, xem GHI CHU DU AN.md mục mới nhất).
  function tinhDoiSp(teams, docs){
    var theoTen = {}, lucTen = {};
    (docs || []).forEach(function(d){
      var ten = A.khoaTen(d.student);
      if (!ten) return;
      theoTen[ten] = (theoTen[ten] || 0) + soLoiSong(d.errors);
      // ⭐ 02/09 — mốc nộp, để phân thứ khi HAI EM TRÙNG ĐIỂM (xem `avThanhHtml`).
      // Lấy mốc SỚM NHẤT của em: một em có thể có nhiều bản ghi, và `capNhatLuc` là lần
      // sửa gần nhất chứ không phải lần nộp đầu — sớm nhất là thứ gần "nộp trước" nhất.
      var l = +d.capNhatLuc || 0;
      if (l && (!lucTen[ten] || l < lucTen[ten])) lucTen[ten] = l;
    });
    var doi = (teams || []).map(function(t){
      var hs = (t.members || []).map(function(m){
        return { ten: m, so: theoTen[A.khoaTen(m)] || 0, luc: lucTen[A.khoaTen(m)] || 0 };
      }).sort(function(a, b){ return b.so - a.so; });
      var tong = hs.reduce(function(s, e){ return s + e.so; }, 0);
      return { team: t.team, ten: 'TEAM ' + t.team, tong: tong, tb: hs.length ? tong / hs.length : 0, hs: hs };
    });
    /* ⛔ (02/09 đợt 3) Đoạn tính `maxLop` (thước chung cả lớp) ĐÃ GỠ: thầy chốt avatar phải
       nằm gọn trong PHẦN MÀU của chính đội mình, em giỏi nhất chạm mép phải vệt màu ⇒ mỗi
       đội một thước, không còn thước chung nữa. Chỗ xếp nay do `xepAvatarThanh()` tính từ
       bề ngang thật của thanh — xem chú thích ở hàm đó, kèm hệ quả phải biết. */
    var chuaCoMau = doi.filter(function(d){ return !mauCoDinhDoi(d.tb); }).sort(function(a, b){ return b.tong - a.tong; });
    var mauHang = ['m-la', 'm-duong', 'm-cam', 'm-do', 'm-do'];
    chuaCoMau.forEach(function(d, i){
      d.mau = (chuaCoMau.length < 4 && i === chuaCoMau.length - 1) ? 'm-do' : (mauHang[i] || 'm-do');
    });
    doi.forEach(function(d){ if (!d.mau) d.mau = mauCoDinhDoi(d.tb); });
    var TRAN_DOI = 200;
    doi.forEach(function(d){ d.pt = Math.min(100, Math.round(d.tong / TRAN_DOI * 100)); });
    doi.sort(function(a, b){ return b.tong - a.tong; });
    return doi;
  }

  // ---------- Nhãn/màu loại lỗi (khớp mySpeaking TYPE_STYLE) ----------
  var TYPE_MAU = { Grammar: 'g', Pronunciation: 'p', Information: 'i' };
  var TYPE_NHAN = { Grammar: 'GRAMMAR', Pronunciation: 'PRONUNCIATION', Information: 'INFORMATION' };
  function nhanLoai(t){ return '<span class="nhan ' + (TYPE_MAU[t] || '') + '">' + A.chuAnToan(TYPE_NHAN[t] || t || '?') + '</span>'; }

  // ---------- Dữ liệu ----------
  var DL = null, BAI = null, BUOI = null, DOI = [], TONGLOI = [], PHANHOI = [], CHAM = [];

  function baoLoi(chu){
    $('#khoiLoi').hidden = false;
    $('#thanTrang').hidden = true;
    $('#loiChu').textContent = chu;
  }

  function taiDuLieu(){
    if (!MA_LOP || !ID_BAI) return baoLoi('Thiếu thông tin lớp/bài trên đường dẫn.');
    Promise.all([A.napDuLieu(), spBuoiFs(MA_LOP)]).then(function(r){
      DL = r[0]; BUOI = r[1];
      /* v1.35.0 — trang này là của THẦY (mở từ dashboard) nên đi cửa quản lý:
         bài đang ẨN vẫn mở được chi tiết; bài ĐÃ XOÁ thì không. */
      var ds = A.baiCuaLop(DL, MA_LOP, 'ql');
      BAI = ds.filter(function(b){ return b.id === ID_BAI; })[0] || null;
      veDauTrang();
      if (!BUOI) return baoLoi('Lớp này chưa có buổi speaking nào đang mở.');
      if (BAI && !spKhopBai(A.maLesson(BAI), BUOI.lesson))
        return baoLoi('Buổi đang mở của lớp là "' + (BUOI.lesson || '?') + '", không khớp bài này.');
      if (BUOI.moHinh !== 2)
        return baoLoi('Buổi này theo mô hình cũ — chưa có dữ liệu câu chấm/phản biện chi tiết.');
      return Promise.all([spTongLoiFs(BUOI._id), spPhanHoiFs(BUOI._id)]).then(function(r2){
        TONGLOI = r2[0]; PHANHOI = r2[1];
        DOI = tinhDoiSp(BUOI.teams, TONGLOI);
        // Thầy chốt: mở trang là chọn sẵn ĐỘI ĐẦU TIÊN theo SỐ THỨ TỰ (TEAM 1).
        // ⛔ `DOI` đã được `tinhDoiSp` xếp theo ĐIỂM giảm dần cho thanh tổng quan, nên
        // `DOI[0]` là đội cao điểm nhất chứ KHÔNG phải TEAM 1 — phải sắp lại theo số đội.
        DOI_CHON = (DOI.slice().sort(function(a, b){ return a.team - b.team; })[0] || {}).ten || '';
        gomCham();
        $('#khoiLoi').hidden = true;
        $('#thanTrang').hidden = false;
        veTatCa();
      });
    })['catch'](function(e){ baoLoi('Không đọc được dữ liệu (' + ((e && e.message) || e) + ').'); });
  }

  function veDauTrang(){
    var tenLop = (A.lopTheoMa(DL, MA_LOP) || {}).tenGoc || MA_LOP;
    var tenBai = BAI ? A.tenBai(BAI) : (BUOI ? BUOI.lesson : ID_BAI);
    document.title = 'Chi tiết · ' + tenBai + ' · Andrew Classes';
    $('#dauTrang').innerHTML = A.chuAnToan(tenBai) +
      '<span class="phu">Lớp ' + A.chuAnToan(tenLop) +
      (BAI ? ' · ' + A.chuAnToan(A.chuHan(BAI) || 'chưa đặt hạn') : '') + '</span>';
  }

  function gomCham(){
    CHAM = [];
    TONGLOI.forEach(function(d){
      (d.errors || []).forEach(function(er){
        if (er.trangThai === 'an') return;
        CHAM.push({ chuLoi: d.student || '?', doiCham: d.myTeam || '', doiBiCham: d.checkedTeam || '', err: er });
      });
    });
  }
  // ═══ (Đợt CHÍNH CHỦ QUYẾT — 02/09/2026, thầy chốt) ═══════════════════════════════════════
  // Lỗi ghi tên bạn A mà CHÍNH BẠN A đã bấm AGREE ⇒ CHỐT là lỗi thật. Phiếu phản đối của đồng
  // đội lúc đó chỉ còn giá trị THAM KHẢO ⇒ KHÔNG xếp vào "Cần thầy quyết" nữa.
  //
  // ⛔ Bộ ba hàm này là BẢN SAO của `mySpeaking/web/js/app.js` (tenBang/chinhChuDaNhan/
  // tranhChapThat) — sửa một bên là phải sửa bên kia, không thì số của thầy lệch số học sinh
  // nhìn thấy. Tab "Kết quả" app mySpeaking CỐ Ý chưa theo luật này (thầy dựng lại tab đó sau).
  //
  // ⛔ So tên bằng trim+HOA vì kho có bản ghi tên lệch (buổi A2B đang có một dòng `who` hỏng
  // font). So thẳng bằng === là câu đó tự nhiên rơi ra khỏi mọi phép đếm mà không ai biết.
  function tenBang(a, b){
    return !!a && !!b && String(a).trim().toUpperCase() === String(b).trim().toUpperCase();
  }
  function chinhChuDaNhan(e){
    return !!e.who && PHANHOI.some(function(p){
      return p.errId === e.id && p.y === 'dongY' && tenBang(p.voter, e.who);
    });
  }
  function tranhChap(x){
    if (x.err.trangThai !== 'song') return false;
    if (chinhChuDaNhan(x.err)) return false;
    return PHANHOI.some(function(p){ return p.errId === x.err.id && p.y === 'phanDoi'; });
  }
  // Chính chủ đã nhận nhưng đồng đội vẫn cãi hộ — chỉ để ĐÁNH DẤU cho thầy biết, không phải
  // việc phải xử (bên web học sinh có nút lọc riêng "TEAM CONFLICT" cho đúng nhóm này).
  function batDongTrongDoi(x){
    return chinhChuDaNhan(x.err) && PHANHOI.some(function(p){
      return p.errId === x.err.id && p.y === 'phanDoi' && !tenBang(p.voter, x.err.who);
    });
  }

  // ⭐ 02/09/2026 — chính chủ ĐÃ CÓ Ý KIẾN chưa (dongY hay phanDoi đều tính là đã trả lời).
  // Khác `chinhChuDaNhan` ở chỗ: hàm kia chỉ hỏi "đã ĐỒNG Ý chưa".
  function chinhChuDaTraLoi(e){
    return !!e.who && PHANHOI.some(function(p){ return p.errId === e.id && tenBang(p.voter, e.who); });
  }
  // Câu này còn CHỜ NGƯỜI CHẤM trả lời Keep/Accept (đội đi bắt còn việc)
  function choNguoiChamTraLoi(x){ return tranhChap(x) && !x.err.ketLuan; }

  var DOI_CHON = '';   // 'TEAM n' đang chọn ở hàng nút đội
  var NUA_CHON = 'bi'; // màn hẹp: đang mở tab nào ('bi' | 'bat')

  function veTatCa(){
    veDoiVe();
    veNutDoi();
    veCanQuyet();
    veHaiNua();
  }

  // ═══ HÀNG NÚT ĐỘI (02/09/2026) ═══════════════════════════════════════════════════════
  // Bốn con số mỗi đội, LẤY TỪ HAI PHÍA KHÁC NHAU — đừng gộp nhầm:
  //   ĐÃ BẮT      = câu đội này đi chấm đội khác  (myTeam === đội)
  //   ĐƯỢC BẮT    = câu đội khác chấm đội này     (checkedTeam === đội)
  //   Chưa phản biện = việc của đội BỊ chấm: chính chủ chưa Agree/Disagree
  //   Chưa phản hồi  = việc của đội ĐI chấm: còn tranh chấp mà chưa Keep/Accept
  function soCuaDoi(ten){
    var bat = CHAM.filter(function(x){ return x.doiCham === ten; });
    var bi = CHAM.filter(function(x){ return x.doiBiCham === ten; });
    return {
      bat: bat.length,
      bi: bi.length,
      chuaPhanBien: bi.filter(function(x){ return !chinhChuDaTraLoi(x.err); }).length,
      chuaPhanHoi: bat.filter(choNguoiChamTraLoi).length
    };
  }
  function veNutDoi(){
    // ⭐ (thầy chốt 02/09 đợt 2) HÀNG NÚT xếp theo TÊN ĐỘI lần lượt (TEAM 1 → 2 → 3 → 4).
    // ⛔ Chỉ hàng nút này thôi — thanh TỔNG QUAN ĐỘI phía trên vẫn giữ luật cũ "đội nhiều
    // điểm nhất lên trên" (thầy chốt 28/08), nên phải chép mảng ra sắp riêng, KHÔNG sắp
    // thẳng trên `DOI` kẻo đổi luôn thứ tự thanh bên trên.
    var xep = DOI.slice().sort(function(a, b){ return a.team - b.team; });
    $('#doiNut').innerHTML = xep.map(function(d){
      var s = soCuaDoi(d.ten);
      // ⛔ Lấy tên theo ĐÚNG THỨ TỰ DANH SÁCH ĐỘI trong buổi, KHÔNG dùng `d.hs` — mảng đó đã bị
      // `tinhDoiSp` xếp lại theo số lỗi giảm dần (cho popup xếp hạng), nên thứ tự tên sẽ nhảy
      // mỗi khi có em bắt thêm lỗi. Tên đội thì phải đứng yên.
      var goc = (BUOI.teams || []).filter(function(t){ return t.team === d.team; })[0];
      var tv = ((goc && goc.members) || (d.hs || []).map(function(h){ return h.ten; })).join(' • ');
      // Hai việc còn tồn nay CÙNG MỘT HÀNG, cân đối hai bên, trong ô kẻ y như hàng số lớn
      var oViec = function(nhan, n){
        return '<div class="sl-o"><div class="sl-nh">' + nhan + '</div>' +
          '<div class="sl-so ' + (n ? 'nx' : 'n0') + '">' + n + '</div></div>';
      };
      return '<button class="doi-btn' + (d.ten === DOI_CHON ? ' chon' : '') +
          '" data-doi="' + A.chuAnToan(d.ten) + '">' +
        '<div class="db-ten">' + A.chuAnToan(d.ten) + '</div>' +
        '<div class="db-tv">' + A.chuAnToan(tv || 'chưa có thành viên') + '</div>' +
        '<div class="sl-hang">' +
          '<div class="sl-o bat"><div class="sl-nh">Số lỗi đã bắt</div><div class="sl-so">' + s.bat + '</div></div>' +
          '<div class="sl-vach"></div>' +
          '<div class="sl-o bi"><div class="sl-nh">Số lỗi được bắt</div><div class="sl-so">' + s.bi + '</div></div>' +
        '</div>' +
        '<div class="sl-hang viec">' +
          oViec('Chưa phản biện', s.chuaPhanBien) +
          '<div class="sl-vach"></div>' +
          oViec('Chưa phản hồi', s.chuaPhanHoi) +
        '</div>' +
      '</button>';
    }).join('') || '<div class="trong">Buổi chưa chia đội nào.</div>';
  }
  function chonDoi(ten){
    if (!ten || ten === DOI_CHON) return;
    DOI_CHON = ten;
    veNutDoi();
    veCanQuyet();
    veHaiNua();
  }

  // ⭐ 02/09/2026 — AVATAR TỪNG EM ĐẶT TRÊN THANH ĐỘI.
  // ⛔ KHÔNG tính chỗ đứng ở đây được: nó phụ thuộc BỀ NGANG THẬT của thanh và ĐƯỜNG KÍNH
  // thật của avatar — hai thứ chỉ biết sau khi trình duyệt vẽ xong. Ở đây chỉ gắn `data-so`
  // (điểm) và `data-luc` (mốc nộp); `xepAvatarThanh()` chạy sau mới đặt `left`.
  function avThanhHtml(d){
    if (!(d.hs || []).length) return '';
    var lopGoc = (A.lopTheoMa(DL, MA_LOP) || {}).tenGoc || MA_LOP;
    return (d.hs || []).slice()
      .sort(function(a, b){ return (a.so - b.so) || ((b.luc || 0) - (a.luc || 0)); })
      .map(function(h){
        return '<span class="av-thanh" data-so="' + h.so + '" data-luc="' + (h.luc || 0) + '" title="' +
          A.chuAnToan(h.ten) + ' · ' + h.so + ' lỗi bắt được">' +
          '<img src="' + A.chuAnToan(A.avUrl(lopGoc, h.ten)) + '" alt="" onerror="this.remove()">' +
          A.chuAnToan(avtChu(h.ten)) + '</span>';
      }).join('');
  }

  // ⭐⭐ (02/09 đợt 3 — thầy chốt) XẾP CHỖ AVATAR TRÊN THANH. Ba luật:
  //   1. Avatar CHỈ nằm trong PHẦN MÀU (tổng đội), tuyệt đối không lấn sang vùng trống.
  //   2. Em cao điểm nhất đứng SÁT MÉP PHẢI của phần màu; em thấp điểm nhất đứng đúng
  //      điểm của mình; các em giữa chia đều theo điểm giữa hai mốc đó.
  //   3. KHÔNG BAO GIỜ ĐÈ NHAU — gần nhất chỉ được CHẠM CẠNH, kể cả khi trùng điểm.
  //
  // ⛔⛔ Luật 1+2 là THƯỚC RIÊNG TỪNG ĐỘI (mốc phải = tổng đội, mỗi đội một khác). Nó ĐÈ
  // LÊN luật "ai điểm cao đứng cao xuyên đội" của bản trước — thầy đã biết và vẫn chọn
  // (02/09). ⇒ ĐỪNG so vị trí avatar giữa HAI ĐỘI khác nhau; muốn so điểm cá nhân thì đọc
  // số trong tooltip. Xem GHI CHU DU AN.md mục 02/09 đợt 3.
  //
  // ⛔ Chạy SAU `coAvatarThanh` (cần biết đường kính) và sau khi thanh đã có bề ngang thật.
  var TRAN_DOI_AV = 200;   // thanh đầy ở 200 lỗi — cùng mốc với `tinhDoiSp`
  function xepAvatarThanh(goc){
    var bars = (goc || document).querySelectorAll('.doi-bar');
    Array.prototype.forEach.call(bars, function(bar){
      var av = bar.querySelectorAll('.av-thanh');
      if (!av.length) return;
      var rong = bar.getBoundingClientRect().width;
      if (!rong) return;
      var vet = bar.querySelector('i');
      var ptVet = vet ? (parseFloat(vet.style.width) || 0) : 100;
      var cuoiVet = rong * ptVet / 100;
      // ⛔ Gỡ cỡ riêng của lần chạy trước RỒI mới đo, không thì mỗi lần chạy lại lấy đúng
      // cái cỡ đã thu nhỏ làm chuẩn và thu nhỏ tiếp — vài lần là avatar teo mất.
      bar.style.removeProperty('--av');
      var dHang = av[0].getBoundingClientRect().width || 14;
      // ⭐ (02/09 đợt 3) Vệt màu quá ngắn thì THU NHỎ avatar CỦA RIÊNG THANH NÀY, chứ không
      // cho đè nhau cũng không cho tràn ra vùng trống (hai điều thầy cấm). n avatar chạm
      // cạnh nhau chiếm đúng n × đường kính ⇒ đường kính tối đa = ĐỘ DÀI VỆT MÀU ÷ SỐ EM.
      // Thẻ bài vệt chỉ dài 39-58px mà 4 em ⇒ mỗi em chưa tới 15px, đành chịu bé.
      var d = Math.max(8, Math.min(dHang, cuoiVet / av.length));
      if (dHang - d > 0.5) bar.style.setProperty('--av', (Math.round(d * 10) / 10) + 'px');
      var r = d / 2;
      // Tâm avatar phải cách mép ít nhất BÁN KÍNH thì cả vòng tròn mới nằm gọn trong vệt màu
      var lo = r, hi = Math.max(lo, cuoiVet - r);
      var ds = Array.prototype.slice.call(av).map(function(e){
        return { e: e, so: +e.dataset.so || 0, luc: +e.dataset.luc || 0 };
      });
      // Điểm thấp về bên trái. TRÙNG ĐIỂM: em nộp SỚM hơn đứng về phía điểm cao
      // (thầy chốt "ưu tiên nộp sớm, người sau muốn vượt phải hơn điểm").
      ds.sort(function(a, b){ return (a.so - b.so) || (b.luc - a.luc); });
      var minS = ds[0].so, maxS = ds[ds.length - 1].so;
      var pMin = Math.min(hi, Math.max(lo, rong * (minS / TRAN_DOI_AV)));
      ds.forEach(function(x){
        x.p = (maxS === minS) ? hi : pMin + (x.so - minS) / (maxS - minS) * (hi - pMin);
      });
      // Giãn ra cho không em nào đè em nào: tâm cách tâm ít nhất ĐÚNG MỘT ĐƯỜNG KÍNH.
      var buoc = d;
      if (ds.length > 1 && (ds.length - 1) * buoc >= hi - lo) {
        // Vệt màu quá ngắn, không đủ chỗ xếp hàng ⇒ rải đều cả dải (chạm nhau là cùng)
        ds.forEach(function(x, i){ x.p = lo + i * (hi - lo) / (ds.length - 1); });
      } else {
        for (var i = 1; i < ds.length; i++) {
          if (ds[i].p < ds[i - 1].p + buoc) ds[i].p = ds[i - 1].p + buoc;
        }
        // Đẩy phải xong có thể lòi ra khỏi vệt màu ⇒ ghim em cuối vào mép rồi đẩy ngược lại
        if (ds[ds.length - 1].p > hi) {
          ds[ds.length - 1].p = hi;
          for (var j = ds.length - 2; j >= 0; j--) {
            if (ds[j].p > ds[j + 1].p - buoc) ds[j].p = ds[j + 1].p - buoc;
          }
        }
        if (ds[0].p < lo) {
          var bu = lo - ds[0].p;
          ds.forEach(function(x){ x.p = Math.min(hi, x.p + bu); });
        }
      }
      ds.forEach(function(x){ x.e.style.left = (Math.round(x.p * 10) / 10) + 'px'; });
    });
  }

  // ⭐ (02/09 đợt 2 — thầy chốt) AVATAR TO HẾT CỠ mà hai hàng liền nhau vẫn không chạm nhau.
  // ⛔ PHẢI ĐO, đừng đặt số cứng — hàng co giãn theo chiều cao khối/thẻ (thẻ 2 đội hàng cao
  // gấp đôi thẻ 4 đội), số cứng là chỗ thừa chỗ thiếu.
  //
  // ⛔ Trần KHÔNG PHẢI chiều cao hàng mà là **khoảng cách TÂM–TÂM hai hàng liền nhau**: giữa
  // hai hàng còn cái khe của `gap` (thẻ bài `.diem-rows{gap:5px}`), avatar thò vào khe đó vẫn
  // chẳng chạm ai. Lấy nhầm chiều cao hàng là bỏ phí 5px — bản đầu 02/09 đã phí đúng chỗ này.
  // Chặn thứ hai: avatar không được thò khỏi KHỐI CHA (`.diem-rows` và `.the-diem` đều có
  // `overflow:hidden`) ⇒ đường kính ≤ 2× khoảng cách từ tâm hàng tới mép khối.
  // Mọi hàng trong cùng một khối lấy CHUNG một cỡ, không thì to nhỏ so le rất xấu.
  //
  // ⛔ Bản sao ở `dashboard.html` và `lop.html` — sửa là sửa cả ba.
  function coAvatarThanh(goc){
    // ⭐ (02/09 đợt 4) Đo CẢ hàng bài thường `.td-dong` — thanh đó nay cũng có avatar
    // (bạn top 1 của act). Hai loại hàng không bao giờ nằm chung một thẻ nên gộp được.
    var ds = (goc || document).querySelectorAll('.doi-dong, .td-dong');
    if (!ds.length) return;
    var nhom = [];
    Array.prototype.forEach.call(ds, function(h){
      var o = nhom.filter(function(x){ return x.cha === h.parentElement; })[0];
      if (!o) { o = { cha: h.parentElement, hang: [] }; nhom.push(o); }
      o.hang.push(h);
    });
    nhom.forEach(function(o){
      var ob = o.cha.getBoundingClientRect();
      var tam = o.hang.map(function(h){
        var b = h.getBoundingClientRect();
        return { giua: b.top + b.height / 2, cao: b.height };
      });
      if (!tam.length || !tam[0].cao) return;
      var co = 999;
      tam.forEach(function(x, i){
        if (i > 0) co = Math.min(co, tam[i].giua - tam[i - 1].giua);
        if (i < tam.length - 1) co = Math.min(co, tam[i + 1].giua - tam[i].giua);
        co = Math.min(co, (x.giua - ob.top) * 2, (ob.bottom - x.giua) * 2);
      });
      var av = Math.max(10, Math.min(40, Math.round(co - 2)));
      o.hang.forEach(function(h){ h.style.setProperty('--av', av + 'px'); });
    });
  }

  function veDoiVe(){
    $('#doiPhu').textContent = 'thanh đầy ở 200 lỗi bắt được · avatar đặt theo điểm riêng của từng em';
    $('#doiVe').innerHTML = DOI.map(function(d){
      return '<div class="doi-dong">' +
        '<span class="doi-ten">' + A.chuAnToan(d.ten) + '</span>' +
        '<span class="doi-bar"><i class="' + d.mau + '" style="width:' + d.pt + '%"></i>' +
          avThanhHtml(d) + '</span>' +
        '<span class="doi-so ' + d.mau + '">' + d.tong + '</span>' +
      '</div>';
    }).join('') || '<div class="trong">Buổi chưa chia đội nào.</div>';
    henVeLaiAvatar($('#doiVe'));
  }

  // ⛔⛔ ĐO NGAY SAU KHI VẼ LÀ CHƯA CHẮC ĐÚNG. Lúc đó font Montserrat có thể chưa tải xong,
  // nên chiều cao hàng và bề ngang thanh vẫn là số của font dự phòng. Đo thật 02/09: avatar
  // tính ra **15,6px** trong khi cỡ đúng là **33px**, và em cao điểm nhất thò ra ngoài vệt
  // màu 9px — nhìn thì tưởng sai công thức, thật ra chỉ là đo quá sớm.
  // ⇒ Đo lại ở BA mốc: ngay lập tức · nhịp vẽ kế tiếp · lúc trình duyệt báo font đã xong.
  // ⛔ Đừng đổi sang ResizeObserver: chính việc đặt `--av` làm kích thước đổi ⇒ tự gọi lại
  // mình vô tận, phải bịa thêm chốt so sánh. Ba mốc cố định vừa rẻ vừa không vòng lặp.
  function veLaiAvatar(goc){ coAvatarThanh(goc); xepAvatarThanh(goc); }
  function henVeLaiAvatar(goc){
    veLaiAvatar(goc);
    requestAnimationFrame(function(){ veLaiAvatar(goc); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function(){ veLaiAvatar(goc); });
    }
  }

  // ⭐ 02/09/2026 (thầy chốt) — LỌC THEO ĐỘI ĐANG CHỌN. Một câu tranh chấp dính tới HAI đội
  // (đội chấm + đội bị chấm) nên tính là "liên quan" nếu đội đang chọn nằm ở BẤT KỲ phía nào,
  // không thì bấm đội nào cũng thiếu mất một nửa số câu của chính đội đó.
  function veCanQuyet(){
    var ds = CHAM.filter(tranhChap).filter(function(x){
      return !DOI_CHON || x.doiCham === DOI_CHON || x.doiBiCham === DOI_CHON;
    });
    var khoi = $('#khoiCanQuyet');
    if (!ds.length) { khoi.hidden = true; return; }
    khoi.hidden = false;
    $('#cqPhu').textContent = ds.length + ' câu còn tranh chấp · lọc theo ' + DOI_CHON;
    $('#cqVe').innerHTML = ds.map(function(x){
      var e = x.err;
      var phieu = PHANHOI.filter(function(p){ return p.errId === e.id && p.y === 'phanDoi'; });
      return '<div class="cq-o">' +
        '<div class="cq-dau">' + nhanLoai(e.type) +
          '<span>Chấm bởi ' + A.chuAnToan(x.chuLoi) + ' (' + A.chuAnToan(x.doiCham) + ')</span>' +
          (e.ketLuan === 'keep' ? '<span class="nhan keep">ĐÃ GIỮ, CHỜ THẦY</span>' : '<span class="nhan phandoi">CHỜ ' + A.chuAnToan(x.doiBiCham) + ' PHẢN HỒI</span>') +
        '</div>' +
        (e.sentence ? '<div class="cq-cau">“' + A.chuAnToan(e.sentence) + '”</div>' : '') +
        '<div class="cq-chi">' + A.chuAnToan(e.detail || '') + (e.explain ? ' — ' + A.chuAnToan(e.explain) : '') + '</div>' +
        phieu.map(function(p){
          return '<div class="cq-pd"><b>' + A.chuAnToan(p.voter) + '</b> (' + A.chuAnToan(p.voterTeam || '') + ') phản đối: ' +
            A.chuAnToan(p.lyDo || '(không ghi lý do)') + '</div>';
        }).join('') +
      '</div>';
    }).join('');
  }

  // ═══ KHỐI HAI NỬA (02/09/2026 — thay hẳn bảng "Câu chấm" + bảng "Phản biện" phẳng cũ) ═══
  // Trái = câu đội KHÁC bắt lỗi đội đang chọn · Phải = câu đội đang chọn đi bắt đội khác.
  // Cùng MỘT khuôn thẻ `cauHtml()` cho cả hai bên, chỉ đổi phần "ai với ai" ở dòng đầu —
  // hai bên vốn là cùng một bản ghi lỗi, chỉ khác chỗ đứng nhìn.
  function veHaiNua(){
    var bi = CHAM.filter(function(x){ return x.doiBiCham === DOI_CHON; });
    var bat = CHAM.filter(function(x){ return x.doiCham === DOI_CHON; });
    // Xếp theo mốc giờ trong video để thầy dò theo bài nói cho dễ
    bi.sort(mocGio); bat.sort(mocGio);
    $('#hnPhu').textContent = DOI_CHON ? ('đang xem ' + DOI_CHON) : '';
    // "LỖI ĐƯỢC BẮT • 77 CÂU" — số đứng ngay cạnh tên (thầy chốt 02/09 đợt 2)
    $('#soBi').textContent = '• ' + bi.length + ' CÂU';
    $('#soBat').textContent = '• ' + bat.length + ' CÂU';
    $('#veBi').innerHTML = bi.length ? bi.map(function(x){ return cauHtml(x, 'bi'); }).join('')
      : '<div class="trong">Chưa đội nào bắt lỗi ' + A.chuAnToan(DOI_CHON) + '.</div>';
    $('#veBat').innerHTML = bat.length ? bat.map(function(x){ return cauHtml(x, 'bat'); }).join('')
      : '<div class="trong">' + A.chuAnToan(DOI_CHON) + ' chưa bắt lỗi đội nào.</div>';
  }
  function mocGio(a, b){
    return ((+a.err.min || 0) * 60 + (+a.err.sec || 0)) - ((+b.err.min || 0) * 60 + (+b.err.sec || 0));
  }
  function fmtGio(e){
    return String(e.min || 0).padStart(2, '0') + ':' + String(e.sec || 0).padStart(2, '0');
  }

  // MỘT câu, gom đủ mọi dấu vết của MỌI học sinh liên quan (thầy chốt: "thông tin đầy đủ chi
  // tiết được tổng hợp lại từ mọi dữ liệu, mọi học sinh"). Ba tầng:
  //   1. Ai — mốc giờ · loại lỗi · em bị bắt · người chấm (kèm đội, tuỳ bên đang xem)
  //   2. Nội dung — câu gốc · lỗi · giải thích
  //   3. Diễn biến — chính chủ trả lời gì · đồng đội nói gì · người chấm kết luận gì
  function cauHtml(x, ben){
    var e = x.err;
    var phieu = PHANHOI.filter(function(p){ return p.errId === e.id; });
    var cc = phieu.filter(function(p){ return tenBang(p.voter, e.who); })[0] || null;
    var khac = phieu.filter(function(p){ return !tenBang(p.voter, e.who); });
    var laTc = tranhChap(x), daGo = e.trangThai === 'go';
    var vo = daGo ? 'go' : (laTc ? 'tc' : (phieu.some(function(p){ return p.y === 'dongY'; }) ? 'ok' : ''));

    // Tầng 3 — diễn biến, mỗi dòng một việc, luôn nói rõ AI làm gì
    var dong = [];
    dong.push('<span><span class="tt-nh">Chính chủ:</span> ' + (
      !e.who ? '<span class="tt-nh">(câu không ghi tên ai)</span>'
        : !cc ? '<span class="tt-do">' + A.chuAnToan(e.who) + ' chưa phản biện</span>'
          : cc.y === 'dongY' ? '<span class="tt-la">' + A.chuAnToan(e.who) + ' đã nhận lỗi</span>'
            : '<span class="tt-cam">' + A.chuAnToan(e.who) + ' phản đối</span>: ' +
              A.chuAnToan(cc.lyDo || '(không ghi lý do)')
    ) + '</span>');
    if (khac.length) {
      dong.push('<span><span class="tt-nh">Đồng đội:</span> ' + khac.map(function(p){
        return '<b>' + A.chuAnToan(p.voter) + '</b> ' +
          (p.y === 'dongY' ? '<span class="tt-la">đồng ý</span>'
            : '<span class="tt-cam">phản đối</span>: ' + A.chuAnToan(p.lyDo || '(không ghi lý do)'));
      }).join(' · ') + '</span>');
    }
    dong.push('<span><span class="tt-nh">Người chấm:</span> ' + (
      e.ketLuan === 'agree' ? '<span class="tt-la">đã nhường lỗi (Accept Appeal)</span>'
        : e.ketLuan === 'keep' ? '<span class="tt-do">giữ lỗi (Keep Issue) — chờ thầy quyết</span>'
          : laTc ? '<span class="tt-do">chưa trả lời phản biện</span>'
            : '<span class="tt-nh">không phải trả lời (chưa ai phản đối)</span>'
    ) + '</span>');

    return '<div class="cau-o ' + vo + '">' +
      '<div class="cau-dau">' +
        '<span class="gio">' + fmtGio(e) + '</span>' + nhanLoai(e.type) +
        '<span class="ai">' + (ben === 'bi'
          ? '👤 ' + A.chuAnToan(e.who || '?') + ' · chấm bởi <b>' + A.chuAnToan(x.chuLoi) + '</b> (' + A.chuAnToan(x.doiCham) + ')'
          : '👤 ' + A.chuAnToan(e.who || '?') + ' (' + A.chuAnToan(x.doiBiCham) + ') · <b>' + A.chuAnToan(x.chuLoi) + '</b> chấm') +
        '</span>' +
        (batDongTrongDoi(x) ? '<span class="nhan batdong">ĐỘI CÃI HỘ</span>' : '') +
      '</div>' +
      (e.sentence ? '<div class="cau-goc">“' + A.chuAnToan(e.sentence) + '”</div>' : '') +
      '<div class="cau-loi">' + A.chuAnToan(e.detail || '') + '</div>' +
      (e.explain ? '<div class="cau-giai">' + A.chuAnToan(e.explain) + '</div>' : '') +
      '<div class="cau-tt">' + dong.join('') + '</div>' +
    '</div>';
  }

  // Chữ cái đại diện avatar: 2 chữ đầu của HAI TỪ CUỐI tên (tiếng Việt gọi nhau bằng từ cuối) —
  // "SONG NGỌC" -> "SN", "NGỌC" (1 từ) -> "N". Tên đầy đủ luôn có trong tooltip (title).
  var AVT_MAU = ['m-la', 'm-duong', 'm-cam', 'm-do'];
  function avtChu(ten){
    var tu = String(ten || '').trim().split(/\s+/).filter(Boolean);
    if (!tu.length) return '?';
    if (tu.length === 1) return tu[0].charAt(0).toUpperCase();
    return (tu[tu.length - 2].charAt(0) + tu[tu.length - 1].charAt(0)).toUpperCase();
  }
  function avtMau(ten){
    var h = 0, s = String(ten || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return AVT_MAU[h % AVT_MAU.length];
  }
  // ⛔ (02/09/2026) `avtHtml` / `phanBienNhom` / `veBangPb` ĐÃ GỠ cùng bảng "Phản biện" phẳng.
  // Mọi phiếu đồng ý/phản đối nay nằm ngay trong thẻ câu của khối hai nửa (`cauHtml`), gắn
  // đúng câu của nó — không còn bảng rời phải tự dò `errId` sang bảng kia nữa.
  // `avtChu`/`avtMau` ở trên GIỮ LẠI: vẫn dùng được nếu sau này muốn hiện avatar trong thẻ câu.

  // ---------- Xuất Excel (SheetJS — CÙNG BẢN mySpeaking/web đang dùng) ----------
  function xuatExcel(){
    if (typeof XLSX === 'undefined') { baoToast('Chưa nạp được thư viện xuất file, thử tải lại trang.'); return; }
    var shCham = CHAM.map(function(x){
      return {
        'Đội chấm': x.doiCham, 'Người chấm': x.chuLoi, 'Đội bị chấm': x.doiBiCham,
        'Loại lỗi': x.err.type || '', 'Câu gốc': x.err.sentence || '',
        'Chi tiết lỗi': x.err.detail || '', 'Giải thích': x.err.explain || '',
        'Trạng thái': x.err.trangThai === 'go' ? 'Đã gỡ' : (tranhChap(x) ? 'Tranh chấp' : 'Còn hiệu lực'),
        'Kết luận': x.err.ketLuan || ''
      };
    });
    var shPb = PHANHOI.map(function(p){
      var x = CHAM.filter(function(c){ return c.err.id === p.errId; })[0];
      return {
        'Người phản hồi': p.voter, 'Đội': p.voterTeam || '',
        'Ý kiến': p.y === 'dongY' ? 'Đồng ý' : 'Phản đối', 'Lý do': p.lyDo || '',
        'Câu liên quan': x ? (x.err.sentence || x.err.detail || '') : '',
        'Kết luận cuối': x && x.err.ketLuan ? x.err.ketLuan : ''
      };
    });
    var shDoi = DOI.map(function(d){
      return { 'Đội': d.ten, 'Tổng lỗi bắt được': d.tong, 'TB lỗi/người': Math.round(d.tb * 10) / 10 };
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shCham), 'CAU CHAM');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shPb), 'PHAN BIEN');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(shDoi), 'TONG HOP DOI');
    var tenBai = (BAI ? A.tenBai(BAI) : (BUOI ? BUOI.lesson : 'sp-check')).replace(/[^\w\-]+/g, '_');
    XLSX.writeFile(wb, 'SP_CHECK_' + MA_LOP + '_' + tenBai + '.xlsx');
  }

  // ═══ NÚT PHÓNG TO TOÀN MÀN (thầy chốt 02/09 đợt 2) ══════════════════════════════════════
  // Ba khối dùng CHUNG một cơ chế: gắn class `.phong` (CSS lo phần position:fixed) + khoá cuộn
  // trang nền. Bấm lại nút đó, hoặc phím Esc, thì thu về. Mỗi lúc chỉ phóng to MỘT khối.
  var IC_TO = '<svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/>' +
    '<path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';
  var IC_NHO = '<svg viewBox="0 0 24 24"><path d="M15 9h6"/><path d="M15 9V3"/>' +
    '<path d="M9 15H3"/><path d="M9 15v6"/><path d="M21 3l-6 6"/><path d="M3 21l6-6"/></svg>';
  var DANG_PHONG = '';
  function datIconPhong(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-phong]'), function(n){
      var to = n.dataset.phong === DANG_PHONG;
      n.innerHTML = to ? IC_NHO : IC_TO;
      n.title = to ? 'Thu về như cũ' : 'Phóng to toàn màn hình';
    });
  }
  function doiPhong(id){
    var el = document.getElementById(id);
    if (!el) return;
    // Đang phóng khối khác thì thu khối đó lại trước — hai khối cùng fixed inset:0 là chồng nhau
    if (DANG_PHONG && DANG_PHONG !== id) {
      var cu = document.getElementById(DANG_PHONG);
      if (cu) cu.classList.remove('phong');
    }
    var bat = DANG_PHONG !== id;
    el.classList.toggle('phong', bat);
    DANG_PHONG = bat ? id : '';
    document.body.classList.toggle('khoa-cuon', bat);
    datIconPhong();
  }
  document.addEventListener('click', function(ev){
    var n = ev.target.closest('[data-phong]');
    if (n) doiPhong(n.dataset.phong);
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && DANG_PHONG) doiPhong(DANG_PHONG);
  });
  // Đổi khổ màn hình là hàng đổi chiều cao VÀ thanh đổi bề ngang ⇒ đo lại cỡ rồi xếp lại
  // chỗ avatar (chờ 150ms cho trình duyệt vẽ xong). ⛔ Phải theo đúng thứ tự: cỡ trước, chỗ
  // sau — `xepAvatarThanh` cần biết đường kính mới tính được khoảng cách không đè nhau.
  var henCo = null;
  window.addEventListener('resize', function(){
    clearTimeout(henCo);
    henCo = setTimeout(function(){ coAvatarThanh(); xepAvatarThanh(); }, 150);
  });
  datIconPhong();

  $('#veDashboard').href = 'dashboard.html?lop=' + encodeURIComponent(MA_LOP);
  $('#btnXuat').onclick = xuatExcel;

  // Bấm một nút đội → lọc lại cả trang. Bắt trên khối cha (nút vẽ lại sau mỗi lần chọn nên
  // gắn tay bắt vào từng nút là mất ngay ở lần vẽ thứ hai).
  $('#doiNut').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-doi]');
    if (b) chonDoi(b.dataset.doi);
  });
  // Màn hẹp: hai nút tab đổi nửa đang hiện (màn rộng CSS cho cả hai nửa hiện, tab bị ẩn)
  $('#nuaTab').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-nua]');
    if (!b) return;
    NUA_CHON = b.dataset.nua;
    $('#nuaBi').classList.toggle('hien', NUA_CHON === 'bi');
    $('#nuaBat').classList.toggle('hien', NUA_CHON === 'bat');
    Array.prototype.forEach.call($('#nuaTab').children, function(n){
      n.classList.toggle('chon', n.dataset.nua === NUA_CHON);
    });
  });

  taiDuLieu();
})();
</script>
</body>
